# Local dependencies. PostgreSQL is Goal's only database; RustFS stands in for S3 and holds the
# factory definitions and knowledge documents (one versioned bucket, as on AWS).
# Ports bind to 127.0.0.1 only. Credentials come from .env (see .env.example) with dev-only defaults.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: goal
      POSTGRES_USER: goal
      POSTGRES_PASSWORD: ${GOAL_PG_PASSWORD:-goal-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - goal-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goal -d goal"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${GOAL_S3_ACCESS_KEY:-goal-dev-only}
      RUSTFS_SECRET_KEY: ${GOAL_S3_SECRET_KEY:-goal-dev-only-secret}
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - goal-objects:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # The development inbox (spec 3 §5.6): the auth service sends sign-in codes and invitations to
  # its SMTP port (GOAL_SMTP_URL's default) and they are read at http://127.0.0.1:8025. Never part
  # of a cloud configuration. Messages live in memory and are gone when it stops.
  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # inbox UI and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  goal-pg:
  goal-objects:

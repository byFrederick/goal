# Local development database. PostgreSQL is Goal's only datastore.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: goal
      POSTGRES_USER: goal
      POSTGRES_PASSWORD: ${GOAL_PG_PASSWORD:-goal-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - goal-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goal -d goal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  goal-pg:

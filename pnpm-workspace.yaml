packages:
  - apps/auth
  - apps/docs
  - apps/control-worker
  - apps/web
  - apps/worker
  - packages/*

# The only dependencies whose install scripts run (apps/control-worker's wrangler and its
# test plugin): each checks its platform binary from the optional dependency, or fetches that same
# package from the npm registry.
allowBuilds:
  esbuild: true
  workerd: true

# Better Auth is pinned exactly, once, for the auth service and (from 3-10) the web client, whose
# requests must match the server's (ADR 0007); auth is its CLI, which generates the schema.
catalog:
  auth: 1.7.12
  better-auth: 1.7.12

# pnpm holds back releases younger than its minimum release age. The worker pins the newest
# Claude Agent SDK on purpose; these exact versions (and the SDK's peers) are exempt. Drop an
# entry once it is older than the threshold.
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.309'
  - '@anthropic-ai/sdk@1.2.0'
  - '@modelcontextprotocol/sdk@1.32.2'

# Overrides of transitive dependencies. The security ones are listed with their assessment in
# SECURITY.md, and are dropped once their parent depends on a fixed version itself.
overrides:
  # monaco-editor 0.57.0 pins dompurify 3.4.15 (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr and
  # three low advisories); 3.4.17 fixes them all and is a patch release of the same line.
  dompurify: 3.4.17
  # httpsnippet 3.0.10 (through starlight-openapi, for the docs site) pins form-data 4.0.4
  # (GHSA-hmw2-7cc7-3qxx, high: CRLF injection in multipart field names and filenames); 4.0.6
  # fixes it and is a patch release of the same line.
  'httpsnippet>form-data': 4.0.6
  # miniflare 5.20261012.0-beta (through wrangler and @cloudflare/vitest-plugin, for the control
  # worker) pins undici 7.29.1 (GHSA-4qv8-2p9j-2685 and seven further advisories in 7.x before
  # 7.30.1, four high and four moderate in all); 7.30.1 fixes them all and is a forward release
  # of the same major line.
  'miniflare>undici': 7.30.1
  # @cloudflare/vitest-plugin 1.4.2 pins zod 4.6.5 (GHSA-mrhx-c7xc-m3w5, high: memory exhaustion
  # while validating oversized constrained collections); 4.6.6 fixes it. 4.6.7 is what the
  # workspace resolves elsewhere, so the override keeps one zod version.
  '@cloudflare/vitest-plugin>zod': 4.6.7
  # @astrojs/astro2tsx 0.1.3 resolves @emnapi/runtime 2.0.0-beta.2 against @emnapi/core 1.11.3,
  # a pair that crashes on load ("this.bridge.setLastError is not a function" in astro check).
  # 0.1.4 pairs core and runtime on 1.11.3 directly, with no peer left to unify.
  '@astrojs/language-server>@astrojs/astro2tsx': 0.1.4

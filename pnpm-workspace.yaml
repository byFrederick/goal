packages:
  - apps/auth
  - apps/docs
  - apps/control-worker
  - apps/web
  - apps/worker
  - packages/*

# The only dependencies whose install scripts run (apps/control-worker's wrangler and its
# test plugin): each checks its platform binary from the optional dependency, or fetches that same
# package from the npm registry.
allowBuilds:
  esbuild: true
  workerd: true

# Better Auth is pinned exactly, once, for the auth service and (from 3-10) the web client, whose
# requests must match the server's (ADR 0007); auth is its CLI, which generates the schema.
catalog:
  auth: 1.7.12
  better-auth: 1.7.12

# pnpm holds back releases younger than its minimum release age. The worker pins the newest
# Claude Agent SDK on purpose; these exact versions (and the SDK's peers) are exempt. Drop an
# entry once it is older than the threshold.
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.309'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.309'
  - '@anthropic-ai/sdk@1.2.0'
  - '@modelcontextprotocol/sdk@1.32.2'

# Security overrides of transitive dependencies (SECURITY.md lists each with its assessment).
# Drop an entry once the parent depends on a fixed version itself.
overrides:
  # monaco-editor 0.57.0 pins dompurify 3.4.15 (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr and
  # three low advisories); 3.4.17 fixes them all and is a patch release of the same line.
  dompurify: 3.4.17
  # httpsnippet 3.0.10 (starlight-openapi's snippet generator) pins form-data 4.0.4
  # (GHSA-hmw2-7cc7-3qxx, high: CRLF injection via unescaped multipart field names and
  # filenames); 4.0.6 fixes it and is a patch release of the same line.
  form-data: 4.0.6
  # miniflare 5.20261012.0-beta (wrangler 4.151.0's and vitest-plugin 1.4.2's test runtime)
  # pins undici 7.29.1 (four high and four moderate advisories: cross-origin redirect cache
  # poisoning, TLS certificate validation bypass, TLS 1.2 renegotiation DoS, content-encoding
  # DoS, EventSource parser DoS, SRI bypass, WebSocket PONG buffering DoS, decompress
  # interceptor DoS); 7.30.1 fixes them all and is a patch release of the 7.x line. Scoped to
  # miniflare's own undici, so nothing else's undici moves.
  miniflare@5.20261012.0-beta>undici: 7.30.1
  # @cloudflare/vitest-plugin 1.4.2 pins zod 4.6.5 (GHSA-mrhx-c7xc-m3w5, high: memory
  # exhaustion while validating oversized constrained collections); 4.6.6 fixes it and is a
  # patch release of the same line. Scoped to vitest-plugin's own zod, so apps/worker's and
  # better-auth's zod stay.
  '@cloudflare/vitest-plugin>zod': 4.6.6

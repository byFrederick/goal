apiVersion: goal/v1
kind: ConnectionKind
metadata:
  name: anthropic
  title: Anthropic API key
  description: An Anthropic API key that gives Claude Code its model.
spec:
  fields:
    - {name: key, title: API key, secret: true, required: true}
  env:
    ANTHROPIC_API_KEY: "{{key}}"
  model: true
  test: {method: GET, url: "https://api.anthropic.com/v1/models", headers: {x-api-key: "{{key}}", anthropic-version: "2023-06-01"}, expect: 200}

apiVersion: goal/v1
kind: Template
metadata:
  name: claude-subscription
  title: Claude subscription
  description: "A Claude subscription's token for Claude Code in the box, for one person's own runs only: a shared install uses an API key."
spec:
  secrets:
    - {slot: token, title: OAuth token, description: "The output of claude setup-token.", suggest: claude-token}
  env:
    CLAUDE_CODE_OAUTH_TOKEN: "{{token}}"

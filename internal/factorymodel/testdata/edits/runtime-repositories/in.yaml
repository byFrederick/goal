spec:
  runtime:
    model: claude-sonnet-5-5
    # Code the runs may open.
    repositories:
      - name: shop
        url: https://github.com/acme/shop
        access: write
        default: true
  agents:
    - name: engineer
      prompt: ./agents/engineer.md

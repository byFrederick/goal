# The contract between goald and its clients: the goal CLI (Go client in internal/api/gen) and
# the web UI (TypeScript client in packages/api-client). Change it first, then regenerate both
# (`task api:gen`); the generated code is committed.
#
# No authentication yet (phase 2.2 has no identity): goald binds its API to 127.0.0.1 and every
# request acts as the one local user. Every route but /v1/health and /v1/orgs belongs to an
# organization and lives under /v1/orgs/{org}; an unknown or deleted organization is 404.
# Requests that change something from a browser must be same-origin (cross-origin protection).
openapi: 3.0.3
info:
  title: Goal API
  version: 0.3.0
  description: >-
    Organizations, their factories, boards and flow metrics, work items, their history, human
    decisions, a realtime stream of an organization's events, and the factory editor's metadata
    and skills catalog.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: orgs
    description: Organizations, the tenant boundary of every factory, item and event
  - name: shell
    description: >-
      What the app's chrome reads about an organization: attention badges, factory overviews and
      the inbox of what waits for a person. Phase 2.2 has no identity, so "waiting on you" is
      every decision waiting on a person.
  - name: work
    description: >-
      Work on a factory's line: an item's agent runs and, later in phase 2.2, flow metrics, the
      andon and the human controls of items
  - name: builder
    description: >-
      The factory editor's metadata (the install's models, which later phases are wired, the
      skill limits) and the skills catalog, skills.sh skills kept in the bucket at a pinned
      commit so a draft can vendor them
  - name: definitions
    description: >-
      Factory definitions: creating factories, the one shared draft per factory (Visual
      sections, single files and the whole tree, each write under an If-Match precondition),
      validation, publishing, versions, compare, restore and the template catalog
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness of goald
      responses:
        "200":
          description: goald is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/orgs:
    get:
      operationId: listOrgs
      tags: [orgs]
      summary: Every organization on the install, by name
      responses:
        "200":
          description: The organizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create an organization
      description: >-
        The slug is lowercase letters, digits and hyphens (3 to 40), unique across the install and
        not a reserved word (new, settings, api, v1, o, me, orgs, auth, invite, admin, default).
        The mark defaults to the name's initials. A taken or reserved slug, or a malformed field,
        is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewOrg" }
      responses:
        "201":
          description: The organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrg
      tags: [orgs]
      summary: One organization
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteOrg
      tags: [orgs]
      summary: Delete an organization
      description: >-
        The organization disappears at once (every route under it answers 404, as for an unknown
        one) and is purged, with every row it owns and its objects in the bucket, after the
        install's retention (GOAL_ORG_RETENTION, default 7 days). `confirm` must be the
        organization's name exactly; otherwise 409 (code confirmation-mismatch) and nothing
        changes. Audited as org.deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgDeletion" }
      responses:
        "202":
          description: Deleted; the purge is scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDeleted" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/settings:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgSettings
      tags: [orgs]
      summary: The organization's settings, slot caps included
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettings" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateOrgSettings
      tags: [orgs]
      summary: Change the organization's settings
      description: >-
        Every field is optional and changes only what it names, in one transaction audited as
        one org.updated entry (none when nothing changes). A new slug resolves at once and the
        old one is 404. A taken slug is 409 with code slug-taken; a reserved or malformed slug,
        name or mark, or a slot cap outside 1 to 1000, is 409. A factory that is not the
        organization's is 404. Per-factory caps may add up to more than the organization's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSettingsPatch" }
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/audit:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listAudit
      tags: [orgs]
      summary: The organization's audit log, newest first
      parameters:
        - name: before
          in: query
          description: The cursor of the next page (next_before); entries with a smaller id
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: action
          in: query
          description: Only entries of this action, as in org.updated
          schema: { type: string }
        - name: target_kind
          in: query
          schema: { type: string }
        - name: target_id
          in: query
          schema: { type: string }
        - name: factory
          in: query
          description: Only entries about this factory (its metadata.id or metadata.name)
          schema: { type: string }
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/attention:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgAttention
      tags: [shell]
      summary: What each factory of the organization needs from people now, for the rail's badges
      description: >-
        One cheap read, meant to be refetched on every stream event: per factory, the items
        waiting for a person, the blocked items and the open andon pull, ordered by factory name.
        Factories with nothing pending are listed with zeros.
      responses:
        "200":
          description: The organization's attention counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgAttention" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/overview:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getFactoryOverview
      tags: [shell]
      summary: Every factory of the organization summarized for the Factories home, ordered by name
      parameters:
        - name: window
          in: query
          description: >-
            The last N UTC calendar days, today included, written Nd (1d to 90d), as for metrics.
            The previous window, which deltas compare against, has the same length and ends where
            this one starts.
          schema: { type: string, pattern: "^[1-9][0-9]?d$", default: 7d }
      responses:
        "200":
          description: The factories' overviews and the organization's totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryOverviewList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/inbox:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getInbox
      tags: [shell]
      summary: What waits for a person across the organization's factories
      description: >-
        The organization's inbox: one entry per thing a person may act on. Phase 2.2 has no
        identity, so every entry is everyone's. Kind decision is an item waiting for a human
        decision at a human station; later phases add other kinds, and clients render kinds they
        do not know as a generic row. When more entries exist than limit, the most recent ones are
        kept and truncated is true. Entries are ordered by kind, then oldest first.
      parameters:
        - name: factory
          in: query
          description: Only this factory's entries (its metadata.id or metadata.name); unknown is 404
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 20 }
      responses:
        "200":
          description: The inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listFactories
      tags: [definitions]
      summary: The organization's factories, published or not
      description: >-
        Every factory of the organization by name, with its current version, its open draft and
        whether it is paused. stations and work_types are those of the version goald runs (empty
        for a factory never published).
      responses:
        "200":
          description: Factories ordered by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createFactory
      tags: [definitions]
      summary: Create a factory with its first draft
      description: >-
        Starts blank (the catalog's blank template, or a skeleton naming no station or agent), from
        a catalog template, as a clone of another factory's version (same organization; items, runs
        and history are not copied) or from imported files. factory.yaml's metadata.id becomes a
        new id (kept only with keep_id), and metadata.name and title the request's, edited in place
        so comments survive. The factory runs nothing until its draft is published. Errors: 409
        name-taken, factory-exists (an import keeping a taken id); 404 template-not-found,
        factory-not-found (the clone's source); 422 import-invalid (no factory.yaml that parses),
        bad-path; 413 too-large; 400 invalid-request (no name).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewFactoryRequest" }
      responses:
        "201":
          description: The factory, with its first draft
          headers:
            Location:
              description: The factory's address (getFactory)
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getFactory
      tags: [definitions]
      summary: One factory, published or not
      responses:
        "200":
          description: The factory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteFactory
      tags: [definitions]
      summary: Delete a factory that was never published, with its draft (the wizard's Cancel)
      description: 409 factory-published once a version was published.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/pause:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: pauseFactory
      tags: [definitions]
      summary: Stop the factory taking work; runs in progress finish
      responses:
        "200":
          description: The factory, paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/resume:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: resumeFactory
      tags: [definitions]
      summary: Start a paused factory again
      responses:
        "200":
          description: The factory, running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getDraft
      tags: [definitions]
      summary: The factory's open draft, its changes and problems
      description: 404 no-draft when none is open.
      responses:
        "200":
          description: The draft
          headers:
            ETag:
              description: The draft's revision, quoted ("42"), the If-Match of discardDraft
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: openDraft
      tags: [definitions]
      summary: Open the factory's draft, or return the open one
      description: >-
        Opens a draft on base (a published version: a number or current; current when absent).
        An open draft is returned as it is (200), unless base names another version: then 409
        draft-exists, or with replace the open draft is archived and a new one opened (201).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenDraftRequest" }
      responses:
        "201":
          description: A new draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "200":
          description: The draft that was open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: discardDraft
      tags: [definitions]
      summary: Discard (archive) the open draft; the version that runs is unchanged
      description: >-
        If-Match is the draft's revision ("42"): without it 428 precondition-required, when the
        draft moved since 412 draft-conflict.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Discarded }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/model:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getDraftModel
      tags: [definitions]
      summary: The draft's factory model for the Visual editor
      description: >-
        The model, each section's concurrency token, the fields the draft changed against its base
        (Edited · Undo) and where each model pointer is in factory.yaml. 409 yaml-invalid (with
        parse_error) while factory.yaml does not parse: Visual is read-only until it is fixed in
        YAML mode.
      responses:
        "200":
          description: The draft's model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftModel" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/model/{section}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/SectionRef"
    put:
      operationId: saveDraftSection
      tags: [definitions]
      summary: Save one section of the model (a Visual save)
      description: >-
        Applies the section's new value to factory.yaml, keeping everything the section does not
        own (comments and key order included), and writes files and deletes remove_files in the
        same revision (an added agent's prompt). If-Match is the section's etag ("<etag>"): without
        it 428 precondition-required; when the section changed meanwhile 412 draft-conflict with
        the section's current value and etag. Writers of other sections or files never conflict.
        409 yaml-invalid while factory.yaml does not parse; 422 model-invalid for a value of the
        wrong shape; 404 no-draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionSave" }
      responses:
        "200":
          description: The draft after the save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/model/{section}/revert:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/SectionRef"
    post:
      operationId: revertDraftSection
      tags: [definitions]
      summary: Put back the base's value at edited fields of a section (Undo)
      description: >-
        pointers are keys of DraftModel.edited in the section; one no longer edited is ignored.
        If-Match is the section's etag, as for a save (428, 412).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevertRequest" }
      responses:
        "200":
          description: The draft after the revert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/files:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listDraftFiles
      tags: [definitions]
      summary: The draft's files by path
      responses:
        "200":
          description: The files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/files/{path}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/FilePath"
    get:
      operationId: getDraftFile
      tags: [definitions]
      summary: One file of the draft, as stored
      description: 404 file-not-found. The ETag is the file's sha256, the If-Match of putDraftFile and deleteDraftFile.
      responses:
        "200":
          description: The file's content
          headers:
            ETag:
              description: The file's sha256, quoted
              required: true
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putDraftFile
      tags: [definitions]
      summary: Write one file of the draft exactly as sent (YAML mode)
      description: >-
        If-Match is the sha256 the editor read ("<sha256>"); If-None-Match * creates a file that
        must not exist yet. Exactly one of them: neither is 428 precondition-required, both 400. A
        stale hash, or If-None-Match on a file that exists, is 412 draft-conflict with the file's
        current sha256 (absent when it is gone). 422 bad-path; 413 too-large (over 1 MiB).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The draft after the save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDraftFile
      tags: [definitions]
      summary: Delete one file of the draft
      description: If-Match is the file's sha256 (428 without it, 412 when stale); 404 file-not-found.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The draft after the delete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/tree:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    put:
      operationId: replaceDraftTree
      tags: [definitions]
      summary: Make files the draft's whole tree (goal factory push)
      description: >-
        With expected_revision, a draft at another revision is 412 draft-conflict; without it the
        latest draft is replaced. 422 bad-path; 413 too-large (over 1,000 files or 16 MiB).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftTree" }
      responses:
        "200":
          description: The draft after the save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/validate:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: validateDraft
      tags: [definitions]
      summary: Validate the draft at its revision, as publish will
      description: >-
        overlay is unsaved YAML-mode text written over the draft's files; station_moves are the
        moves the publish will carry, so the items they map are not reported.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateDraftRequest" }
      responses:
        "200":
          description: The validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validation" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/publish:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: publishDraft
      tags: [definitions]
      summary: Publish the open draft as the factory's next version
      description: >-
        One transaction: the draft becomes version N+1, the factory runs it, and the open items of
        stations it removes move by station_moves. Runs in progress finish on the version they
        started on; every later step uses the new one. Errors: 412 draft-conflict (the draft is no
        longer at revision); 409 draft-base-moved (the current version is not
        expected_current_version_id), definition-invalid (with problems), items-at-removed-station
        (with items), name-taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listVersions
      tags: [definitions]
      summary: One page of the factory's published versions, newest first
      parameters:
        - name: before
          in: query
          description: The next_before of the previous page; versions numbered below it
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Versions, highest number first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/VersionSelector"
    get:
      operationId: getVersion
      tags: [definitions]
      summary: One version with its files
      description: 404 version-not-found (source too, which is a starting tree and no version).
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions/{version}/model:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/VersionSelector"
    get:
      operationId: getVersionModel
      tags: [definitions]
      summary: The factory model of a version, for a read-only Visual view
      description: 409 yaml-invalid (with parse_error) when its factory.yaml does not parse.
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionModel" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions/{version}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/VersionSelector"
      - $ref: "#/components/parameters/FilePath"
    get:
      operationId: getVersionFile
      tags: [definitions]
      summary: One file of a version
      description: >-
        A published version's files never change: they are served with Cache-Control private,
        max-age=31536000, immutable (no-cache for a draft's). 404 file-not-found.
      responses:
        "200":
          description: The file's content
          headers:
            ETag:
              description: The file's sha256, quoted
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions/{version}/restore:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/VersionSelector"
    post:
      operationId: restoreVersion
      tags: [definitions]
      summary: Run an older published version again (rollback)
      description: >-
        Moves the factory's current pointer to the version; numbers are not reused and an open
        draft stays open. 409 draft-base-moved (the current version is not
        expected_current_version_id), items-at-removed-station, name-taken; 404 version-not-found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "200":
          description: The factory, running the restored version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/compare:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: compareVersions
      tags: [definitions]
      summary: The semantic difference between two versions
      description: >-
        from and to are version selectors (a number, current, draft, base or source); by default
        the draft against its base, or its starting tree when it has none. Line-level hunks are
        computed by the client from the two files.
      parameters:
        - name: from
          in: query
          schema: { type: string, default: base }
        - name: to
          in: query
          schema: { type: string, default: draft }
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/templates:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listTemplates
      tags: [definitions]
      summary: The template catalog, the latest version of each template by name
      responses:
        "200":
          description: The templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/templates/{name}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: name
        in: path
        required: true
        description: The template's name
        schema: { type: string }
    get:
      operationId: getTemplate
      tags: [definitions]
      summary: One version of a template with a preview of its model
      description: 404 template-not-found.
      parameters:
        - name: version
          in: query
          description: The template's version; the latest when absent
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/definitions/validate:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: validateDefinition
      tags: [definitions]
      summary: Validate files that belong to no factory yet (Import YAML preview, CLI validate)
      description: 413 too-large; 422 bad-path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefinitionFiles" }
      responses:
        "200":
          description: The validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validation" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/definitions/format:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: formatDefinition
      tags: [definitions]
      summary: Format a factory.yaml the way Visual saves write changed lines (Format)
      description: 422 yaml-invalid (with parse_error) when it does not parse.
      requestBody:
        required: true
        content:
          text/yaml:
            schema: { type: string }
      responses:
        "200":
          description: The formatted factory.yaml
          content:
            text/yaml:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/items:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listItems
      summary: One page of a factory's items, newest first
      parameters:
        - name: state
          in: query
          description: Only items in this state
          schema: { $ref: "#/components/schemas/ItemState" }
        - name: station
          in: query
          description: Only items at this station
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: after
          in: query
          description: The next_after of the previous page; items listed after it (numbered below it)
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Items, highest number first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: submitItem
      summary: Submit a work item to a factory's first station
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewItem" }
      responses:
        "201":
          description: The item, waiting at the first station
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/board:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getBoard
      summary: The factory's board, station by station in line order
      description: >-
        Every open item (up to 500, newest first) at its station, and the 20 newest done items at
        the done station. waiting and in_progress count every item, beyond the cards shown. The
        constraint is the agent station with the most work per slot right now,
        (waiting + in_progress) / min(agents, wip), or null when no agent station has any work;
        later phases replace this heuristic with constraint detection over time.
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/metrics:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getMetrics
      summary: The factory's flow over the last days
      parameters:
        - name: window
          in: query
          description: >-
            The last N UTC calendar days, today included, written Nd (1d to 90d). Items count
            when they reached done in the window; spend counts agent runs started in it.
          schema: { type: string, pattern: "^[1-9][0-9]?d$", default: 7d }
      responses:
        "200":
          description: Flow metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/stream:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: streamEvents
      summary: The organization's events as they happen (Server-Sent Events)
      description: >-
        A text/event-stream of one organization's events only. Each committed item event arrives
        as `event: item` with `id:` the event id and `data:` a StreamEvent. Other event names
        (definition, factory, and later credential, approval, connection) carry their own data
        object; clients ignore the names they do not know. `event: definition` (data a
        DefinitionEvent, no id) follows every committed change of a factory's definition: a
        factory created or deleted, its current version moved (publish, restore, pause, resume),
        its draft opened, saved, discarded or published. `event: resync` (data `{}`) means
        goald may have missed events (it reconnected to the database): re-read what you show. A
        comment line (`: heartbeat`) arrives every 15 seconds. There is no replay: Last-Event-ID
        is ignored, so a client that reconnects re-reads what it shows. goald ends the stream of
        a client that falls too far behind.
      parameters:
        - name: factory
          in: query
          description: Only this factory's events (its metadata.id or metadata.name)
          schema: { type: string }
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                description: The data of each event, by its name (item, definition)
                oneOf:
                  - $ref: "#/components/schemas/StreamEvent"
                  - $ref: "#/components/schemas/DefinitionEvent"
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    get:
      operationId: getItem
      summary: One work item
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/events:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    get:
      operationId: listItemEvents
      summary: One page of an item's history, oldest first
      parameters:
        - name: after
          in: query
          description: Return events with an id greater than this (0 for the start)
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Events in append order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/runs:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    get:
      operationId: listItemRuns
      tags: [work]
      summary: An item's agent runs, oldest first (at most 200)
      responses:
        "200":
          description: The item's runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/notes:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: noteItem
      tags: [work]
      summary: Leave a note for the agents working an item
      description: >-
        The note is recorded as the item's event (kind note) and carried by the brief of the item's
        next run, at whatever station, under "Notes from people". A note on a done or cancelled item
        is refused with 409 item-closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewNote" }
      responses:
        "202":
          description: The note is recorded; delivery says when an agent reads it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteReceipt" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/runs/{run}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: run
        in: path
        required: true
        description: The run's id
        schema: { type: string }
    get:
      operationId: getRun
      tags: [work]
      summary: One agent run (404 for a run of another organization)
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/approve:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: approveItem
      summary: Approve an item waiting for a human; it moves to the next station
      responses:
        "200":
          description: The item after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/reject:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: rejectItem
      summary: Reject an item waiting for a human; it goes back for rework with the reason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rejection" }
      responses:
        "200":
          description: The item after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/retry:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: retryItem
      summary: Send a blocked item back to its station's queue (409 if it is not blocked)
      responses:
        "200":
          description: The item, queued at its station again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/merge:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: mergeItem
      summary: Merge the item's pull request, then approve it
      description: >-
        Only for an item waiting at a human station with action merge. goald merges the pull
        request named by the pull_request field of the item's latest station output, on the
        factory's runtime.repository, with the repository's token. It never forces: a pull
        request that is closed, has conflicts or failing required checks, or whose head moves
        meanwhile is refused with 409 and nothing changes. After the merge it deletes the pull
        request's head branch (only when it lives on the same repository) and approves the item.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergeRequest" }
      responses:
        "200":
          description: The item after the merge and the approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/builder/meta:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getBuilderMeta
      tags: [builder]
      summary: What the factory editor needs to know about the install
      description: >-
        The models agents may run on (from goald's GOAL_MODELS; exactly one is the default, the
        model a factory runs when it names none), which later phases are wired (their controls
        stay hidden or read-only until then) and the limits of one skill folder.
      responses:
        "200":
          description: The editor's metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuilderMeta" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/builder/skills:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: searchSkills
      tags: [builder]
      summary: One page of the skills catalog
      description: >-
        Skills the operator synced from skills.sh (goal catalog skills sync), each at the commit
        it is pinned at. q matches the key, the skill's name or its description, ignoring case;
        results are most installed first, then by key. The catalog is the install's, the same for
        every organization; it is empty until the operator syncs it. A limit outside 1 to 50 is
        400; a bucket that cannot be read is 503 catalog-unavailable.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: after
          in: query
          description: The next_after of the previous page
          schema: { type: string, maxLength: 320 }
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/builder/skills/{owner}/{repo}/{skill}/files:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - { name: owner, in: path, required: true, schema: { $ref: "#/components/schemas/SkillName" } }
      - { name: repo, in: path, required: true, schema: { $ref: "#/components/schemas/SkillName" } }
      - { name: skill, in: path, required: true, schema: { $ref: "#/components/schemas/SkillName" } }
    get:
      operationId: getSkillFiles
      tags: [builder]
      summary: A catalog skill's files at its pinned commit, to vendor into a draft
      description: >-
        The folder as the sync stored it, checked against the catalog's index (limits, paths and
        hash) before it is served. Paths are relative to the skill's folder; SKILL.md is at its
        root. A draft adds them under skills/<skill>/ with skills[].origin set to
        skills.sh:<owner>/<repo>@<skill>#<commit>. The content is third-party: show it as plain
        text. An unknown skill is 404 skill-not-found; a bucket that cannot be read, or a folder
        that does not match the index, 503 catalog-unavailable.
      responses:
        "200":
          description: The skill and its files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillFiles" }
        default: { $ref: "#/components/responses/Problem" }
components:
  parameters:
    OrgRef:
      name: org
      in: path
      required: true
      description: The organization's slug or id
      schema: { type: string }
    FactoryRef:
      name: factory
      in: path
      required: true
      description: The factory's metadata.id or metadata.name
      schema: { type: string }
    ItemRef:
      name: item
      in: path
      required: true
      description: >-
        The item's id (a UUID) or <factory>#<number>, as in goal#2 (the factory by
        metadata.name or metadata.id; percent-encode the # as %23)
      schema: { type: string }
    SectionRef:
      name: section
      in: path
      required: true
      description: A section of the factory model, a tab of the Visual editor
      schema: { $ref: "#/components/schemas/Section" }
    FilePath:
      name: path
      in: path
      required: true
      description: >-
        A file's path relative to the factory's root, as in agents/engineer.md; percent-encode
        its slashes as %2F so it is one path segment
      schema: { type: string }
    VersionSelector:
      name: version
      in: path
      required: true
      description: >-
        A version: its number (12), current (the one that runs), draft (the open draft), base
        (the published version the draft started from) or source (the draft's starting tree)
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      description: The entity tag the write is based on, quoted ("<etag>"); writes without it are 428
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: "* to create a file that must not exist yet"
      schema: { type: string }
  responses:
    Problem:
      description: An error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          pattern: "^[a-z]+(-[a-z]+)*$"
          description: >-
            A stable, kebab-case name of the error for clients to branch on (org-not-found,
            forbidden, slug-taken, confirmation-mismatch, draft-conflict, ...)
        problems:
          type: array
          description: definition-invalid only, every problem of the definition (errors block the publish)
          items: { $ref: "#/components/schemas/DefinitionProblem" }
        parse_error: { $ref: "#/components/schemas/ParseError" }
        section:
          allOf: [{ $ref: "#/components/schemas/Section" }]
          description: draft-conflict on a section save only, the section that changed
        value:
          description: draft-conflict on a section save only, the section's value now (Keep theirs / Overwrite)
        etag:
          type: string
          description: draft-conflict on a section save only, the section's etag now (resend with it to overwrite)
        path:
          type: string
          description: draft-conflict on a file write only, the file
        sha256:
          type: string
          description: draft-conflict on a file write only, the file's sha256 now; absent when the file is gone
        items: { $ref: "#/components/schemas/ItemsAtRemovedStations" }
    OrgList:
      type: object
      required: [orgs]
      properties:
        orgs:
          type: array
          items: { $ref: "#/components/schemas/OrgSummary" }
    OrgSummary:
      type: object
      description: An organization as the organization list shows it
      required: [id, slug, name, mark, factory_count]
      properties:
        id: { type: string }
        slug: { type: string, description: "The organization's address in URLs, as in /v1/orgs/acme" }
        name: { type: string }
        mark: { type: string, description: The one or two characters the organization rail shows }
        factory_count: { type: integer }
    Org:
      type: object
      required: [id, slug, name, mark, factory_count, created_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        mark: { type: string }
        factory_count: { type: integer }
        created_at: { type: string, format: date-time }
    NewOrg:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$" }
        mark: { type: string, minLength: 1, maxLength: 2, description: Defaults to the name's initials }
    OrgDeletion:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, description: "The organization's name, typed to confirm" }
    OrgDeleted:
      type: object
      required: [purge_after]
      properties:
        purge_after: { type: string, format: date-time, description: When the purge job may remove everything }
    OrgSettings:
      type: object
      required: [name, slug, mark, slots]
      properties:
        name: { type: string }
        slug: { type: string }
        mark: { type: string }
        slots: { $ref: "#/components/schemas/OrgSlots" }
    OrgSlots:
      type: object
      description: >-
        Slot caps: how many agents may run at once across the organization's factories (max) and
        in each factory. null is no cap.
      required: [max, factories]
      properties:
        max: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        factories:
          type: array
          description: Every factory of the organization, by name
          items: { $ref: "#/components/schemas/FactorySlots" }
    FactorySlots:
      type: object
      required: [factory_id, name, max]
      properties:
        factory_id: { type: string }
        name: { type: string }
        max: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
    OrgSettingsPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$" }
        mark: { type: string, minLength: 1, maxLength: 2 }
        slots: { $ref: "#/components/schemas/OrgSlotsPatch" }
    OrgSlotsPatch:
      type: object
      description: >-
        When present, max sets the organization's cap (null clears it) and each listed factory's
        max sets its cap (null clears it); factories left out keep theirs.
      required: [max]
      properties:
        max: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        factories:
          type: array
          items: { $ref: "#/components/schemas/FactorySlotsPatch" }
    FactorySlotsPatch:
      type: object
      required: [factory_id, max]
      properties:
        factory_id: { type: string, description: "The factory's metadata.id or metadata.name" }
        max: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
    AuditPage:
      type: object
      required: [entries, next_before]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_before:
          type: integer
          format: int64
          nullable: true
          description: The before of the next page; null on the last page
    AuditEntry:
      type: object
      required: [id, at, actor, action, target, data]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        action: { type: string, description: "<noun>.<past_verb>, as in org.updated" }
        target: { $ref: "#/components/schemas/AuditTarget" }
        factory_id: { type: string, description: Set when the entry concerns one factory }
        data:
          type: object
          additionalProperties: true
          description: >-
            What changed; for org.updated each changed field's {from, to}, slot caps as max_slots
            and factory_slots (by factory id), a missing cap as null
    AuditTarget:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, description: What the entry is about, as in org or factory }
        id: { type: string }
    Actor:
      type: object
      description: Who did something; in phase 2.2 every person is the local user
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [user, agent, system] }
        id: { type: string, description: '"local" for the local user, an agent''s name or a job''s name' }
        name: { type: string }
    FactoryList:
      type: object
      required: [factories]
      properties:
        factories:
          type: array
          items: { $ref: "#/components/schemas/Factory" }
    Factory:
      type: object
      required: [id, org_id, name, stations, work_types, current, draft, paused, created_at]
      properties:
        id: { type: string }
        org_id: { type: string, description: The organization that owns the factory }
        name: { type: string }
        title: { type: string }
        description: { type: string }
        work_types:
          type: array
          description: The work types of the version goald runs; empty before the first publish
          items: { type: string }
        stations:
          type: array
          description: The stations of the version goald runs; empty before the first publish
          items: { $ref: "#/components/schemas/Station" }
        current:
          description: The version that runs ("v8"); null before the first publish
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VersionRef" }]
        draft:
          description: The open draft ("v8 + draft"); null when none is open
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DraftRef" }]
        paused: { type: boolean, description: A paused factory takes no work; runs in progress finish }
        created_at: { type: string, format: date-time }
    Station:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/StationKind" }
        action: { $ref: "#/components/schemas/StationAction" }
        description: { type: string, description: "What happens at the station, from the definition (shown on the item's path)" }
    StationKind:
      type: string
      enum: [queue, agent, human, done]
    StationAction:
      type: string
      description: What goald does when a human acts at this human station (merge → POST /v1/orgs/{org}/items/{item}/merge)
      enum: [merge]
    ItemState:
      type: string
      enum: [queued, ready, in_progress, waiting_human, blocked, done, cancelled]
    ClassOfService:
      type: string
      enum: [standard, expedite]
    NewItem:
      type: object
      required: [title, type]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        type: { type: string, minLength: 1, description: "One of the factory's work types" }
        lane: { type: string }
        priority: { type: integer, default: 0 }
    Rejection:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, description: What the agent must change }
    MergeRequest:
      type: object
      properties:
        method: { type: string, enum: [squash], default: squash }
    Item:
      type: object
      required: [id, ref, factory_id, number, type, title, body, station, state, class_of_service, priority, rework_count, cost_usd, outputs, created_at, updated_at]
      properties:
        id: { type: string }
        ref: { type: string, description: "<factory name>#<number>, as in goal#2" }
        factory_id: { type: string }
        number: { type: integer, format: int64 }
        parent_id: { type: string }
        type: { type: string }
        lane: { type: string }
        title: { type: string }
        body: { type: string }
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        class_of_service: { $ref: "#/components/schemas/ClassOfService" }
        priority: { type: integer }
        rework_count: { type: integer }
        cost_usd: { type: number, format: double }
        outputs:
          type: object
          description: Each station's output, by station id
          additionalProperties: {}
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        done_at: { type: string, format: date-time }
        flow:
          $ref: "#/components/schemas/ItemFlow"
    ItemFlow:
      type: object
      description: How the item flows, on GET of one item only
      required: [spans, target_seconds, rework_target, budget, current_run]
      properties:
        spans:
          type: array
          description: The item's spans in the order it entered them; an open item's last span is open
          items: { $ref: "#/components/schemas/ItemSpan" }
        target_seconds:
          type: integer
          format: int64
          nullable: true
          description: The lead time the item is measured against (the expedite target for expedite items, the line's lead-time target otherwise), or null without one
        rework_target:
          type: string
          nullable: true
          description: The station a send-back from the item's station goes to, or null when there is none (done, cancelled, nothing upstream)
        budget: { $ref: "#/components/schemas/ItemBudget" }
        current_run:
          description: The agent run in progress, or null
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CurrentRun"
    ItemSpan:
      type: object
      description: A stretch of time the item spent at one station in one state and rework round
      required: [station, state, rework_round, rework_by, entered_at, left_at]
      properties:
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        rework_round: { type: integer, description: The item's rework count during the span }
        rework_by:
          type: string
          nullable: true
          description: The station that sent the item back for this round; null in round 0
        entered_at: { type: string, format: date-time }
        left_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the item is still in this span
    ItemBudget:
      type: object
      description: The limits of one task at the item's station (its agent's own, else the factory's runtime budget)
      required: [per_item_usd, max_turns_per_task]
      properties:
        per_item_usd: { type: number, format: double, nullable: true }
        max_turns_per_task: { type: integer, nullable: true }
    CurrentRun:
      type: object
      required: [id, agent, slot, model, turn, started_at, output_contract, checks]
      properties:
        id: { type: string }
        agent: { type: string }
        slot: { type: integer, description: "The agent copy working the item, 1-based (investigator-2)" }
        model: { type: string }
        turn: { type: integer, description: Turns the run has reported so far }
        started_at: { type: string, format: date-time }
        output_contract:
          type: string
          nullable: true
          description: The contract the station's output must satisfy, or null
        checks:
          type: array
          description: "What the output is checked for on submit: schema, evidence links, command lines"
          items: { type: string }
    ItemCard:
      type: object
      description: An item as boards and lists show it
      required: [id, ref, number, title, type, station, state, class_of_service, rework_count, cost_usd, created_at, updated_at, age_seconds, agent, pr_url]
      properties:
        id: { type: string }
        ref: { type: string, description: "<factory name>#<number>, as in goal#2" }
        number: { type: integer, format: int64 }
        title: { type: string }
        type: { type: string }
        lane: { type: string }
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        class_of_service: { $ref: "#/components/schemas/ClassOfService" }
        rework_count: { type: integer }
        cost_usd: { type: number, format: double }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        age_seconds:
          type: integer
          format: int64
          description: Seconds since the item was created; for a done item, from created to done
        agent:
          type: string
          nullable: true
          description: The agent working the item now (in progress), else null
        pr_url:
          type: string
          nullable: true
          description: The pull request the item's latest station output names, else null
    ItemPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemCard" }
        next_after:
          type: integer
          format: int64
          nullable: true
          description: Pass as `after` for the next page; null on the last page
    Board:
      type: object
      required: [factory, stations, constraint]
      properties:
        factory:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            title: { type: string }
        stations:
          type: array
          items: { $ref: "#/components/schemas/BoardStation" }
        constraint:
          type: string
          nullable: true
          description: The id of the agent station with the most work per slot now, or null
    BoardStation:
      type: object
      required: [id, kind, agents, wip_limit, waiting, in_progress, items]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/StationKind" }
        action: { $ref: "#/components/schemas/StationAction" }
        agents:
          type: array
          description: The agents that work here (one, or one per routed lane)
          items: { type: string }
        wip_limit:
          type: integer
          nullable: true
          description: The station's wip setting, or null when it has none
        waiting: { type: integer, description: Items queued or ready here }
        in_progress: { type: integer, description: Items being worked here }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemCard" }
    Metrics:
      type: object
      required: [window, throughput, lead_time_hours, wip, rework_rate, spend_usd, items_done]
      properties:
        window: { type: string, description: "The window asked for, as in 7d" }
        throughput:
          type: array
          description: Items done per UTC day, one entry for every day of the window, oldest first
          items:
            type: object
            required: [day, done]
            properties:
              day: { type: string, format: date }
              done: { type: integer }
        lead_time_hours:
          type: object
          nullable: true
          description: Percentiles of created → done of the items done in the window; null when none were
          required: [p50, p85]
          properties:
            p50: { type: number, format: double }
            p85: { type: number, format: double }
        wip: { type: integer, description: "Items in the line now, neither done nor cancelled" }
        rework_rate:
          type: number
          format: double
          description: Share of the items done in the window that were sent back at least once (0 when none were done)
        spend_usd: { type: number, format: double, description: Cost of the agent runs started in the window }
        items_done: { type: integer }
    StreamEvent:
      type: object
      description: "The data of one `event: item` on /v1/orgs/{org}/stream"
      required: [org_id, item_id, ref, factory_id, kind, state, at]
      properties:
        org_id: { type: string }
        item_id: { type: string }
        ref: { type: string, description: "<factory name>#<number>, as in goal#2" }
        factory_id: { type: string }
        kind: { type: string, description: "The event kind (created, moved, approved, tool_call, ...)" }
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        at: { type: string, format: date-time }
    EventPage:
      type: object
      required: [events, next_after]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_after:
          type: integer
          format: int64
          description: Pass as `after` to get the events that follow this page
    Event:
      type: object
      required: [id, item_id, at, kind, actor, data]
      properties:
        id: { type: integer, format: int64 }
        item_id: { type: string }
        run_id: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string }
        station: { type: string }
        actor: { type: string }
        data:
          type: object
          additionalProperties: {}
    NewNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the agent should know, 1 to 2000 characters (surrounding space is trimmed)
    NoteReceipt:
      type: object
      required: [event_id, delivery]
      properties:
        event_id: { type: integer, format: int64, description: The note's event in the item's history }
        delivery:
          type: string
          enum: [live, next_run]
          description: next_run, the next run's brief carries it (live, to a running agent, comes later)
    RunList:
      type: object
      required: [runs, truncated]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }
        truncated:
          type: boolean
          description: True when the item has more runs than the list holds (the oldest 200 are listed)
    RunStatus:
      type: string
      enum: [running, succeeded, failed, cancelled]
    Run:
      type: object
      description: >-
        One agent run: one container working one item at one station. Its full transcript is not
        kept (phase 2.2); the item's events carry the trace.
      required: [id, item_id, station, agent, model, status, turns, input_tokens, output_tokens, cost_usd, error, started_at, ended_at, definition_version_id, definition_version]
      properties:
        id: { type: string }
        item_id: { type: string }
        station: { type: string }
        agent: { type: string }
        model: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        turns: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost_usd: { type: number, format: double }
        error:
          type: string
          nullable: true
          description: Why a failed or cancelled run ended, else null
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true, description: Null while the run is running }
        definition_version_id:
          type: string
          nullable: true
          description: The definition version the run started and finished on; null for runs from before versions
        definition_version:
          type: integer
          nullable: true
          description: That version's number ("ran on v9"); null when the run has no version
    AndonPull:
      type: object
      description: An open stop of a factory's line
      required: [reason, pulled_by, pulled_at]
      properties:
        reason: { type: string }
        pulled_by: { type: string, description: 'Who pulled the cord, as an actor ref: "system:engine" or "user:local"' }
        pulled_at: { type: string, format: date-time }
    OrgAttention:
      type: object
      required: [waiting_on_you, factories]
      properties:
        waiting_on_you:
          type: integer
          description: Every decision waiting on a person across the organization (the sum of factories[].waiting_on_you)
        factories:
          type: array
          items: { $ref: "#/components/schemas/FactoryAttention" }
    FactoryAttention:
      type: object
      required: [factory_id, waiting_on_you, blocked_items, andon, connections_blocked]
      properties:
        factory_id: { type: string }
        waiting_on_you: { type: integer, description: Items waiting for a human decision (every decision; phase 2.2 has no identity) }
        blocked_items: { type: integer }
        andon:
          description: The open andon pull, or null while the line runs
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AndonPull"
        connections_blocked: { type: integer, description: Connections that stop work; always 0 until connections exist }
    FactoryOverviewList:
      type: object
      required: [window, since, until, waiting_on_you, spend_usd, budget_usd, factories]
      properties:
        window: { type: string, description: "The window asked for, as in 7d" }
        since: { type: string, format: date, description: The window's first UTC day }
        until: { type: string, format: date, description: The window's last UTC day (today) }
        waiting_on_you: { type: integer, description: "The sum of factories[].waiting.on_you" }
        spend_usd: { type: number, format: double, description: "The sum of factories[].spend_usd" }
        budget_usd:
          type: number
          format: double
          nullable: true
          description: The sum of the factories' budget_usd, or null when none has a budget
        factories:
          type: array
          items: { $ref: "#/components/schemas/FactoryOverview" }
    FactoryOverview:
      type: object
      required: [factory, health, andon, throughput, constraint, waiting, spend_usd, budget_usd]
      properties:
        factory: { $ref: "#/components/schemas/Factory" }
        health: { $ref: "#/components/schemas/FactoryHealth" }
        andon:
          description: The open andon pull, or null while the line runs
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AndonPull"
        throughput: { $ref: "#/components/schemas/Throughput" }
        constraint:
          description: The agent station with the most work per slot now, or null when no agent station has any work
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConstraintSummary"
        waiting: { $ref: "#/components/schemas/WaitingSummary" }
        spend_usd: { type: number, format: double, description: Cost of the agent runs started in the window }
        budget_usd:
          type: number
          format: double
          nullable: true
          description: The factory's runtime.budget.weeklyUsd scaled to the window (× days / 7), or null without one
    FactoryHealth:
      type: string
      description: running; stopped while an andon pull is open; draft when the factory has no published version yet
      enum: [running, stopped, draft]
    Throughput:
      type: object
      required: [per_day, previous_per_day, days]
      properties:
        per_day: { type: number, format: double, description: Items done in the window per day }
        previous_per_day: { type: number, format: double, description: The same over the previous window }
        days:
          type: array
          description: Items done per UTC day, one entry for every day of the window, oldest first
          items:
            type: object
            required: [day, done]
            properties:
              day: { type: string, format: date }
              done: { type: integer }
    ConstraintSummary:
      type: object
      required: [station, busy]
      properties:
        station: { type: string }
        busy:
          type: number
          format: double
          nullable: true
          description: Share of the window the station was busy (0 to 1); null until it is measured over time
    WaitingSummary:
      type: object
      required: [on_you, items_by_type, tool_approvals]
      properties:
        on_you: { type: integer, description: "Every decision waiting on a person, plus tool approvals once connections exist" }
        items_by_type:
          type: array
          description: The items waiting for a decision by work type, by type
          items:
            type: object
            required: [type, count]
            properties:
              type: { type: string }
              count: { type: integer }
        tool_approvals:
          type: array
          description: Tool calls waiting for approval by connection; always empty until connections exist
          items:
            type: object
            required: [connection, count]
            properties:
              connection: { type: string }
              count: { type: integer }
    Inbox:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          description: Ordered by kind, then oldest first
          items: { $ref: "#/components/schemas/InboxEntry" }
        truncated: { type: boolean, description: More entries exist than limit; the most recent were kept }
    InboxEntryKind:
      type: string
      description: What waits; later phases add kinds, which clients that do not know them show as a generic row
      enum: [decision]
    InboxEntry:
      type: object
      required: [id, kind, factory, since, item, station, action]
      properties:
        id: { type: string, description: '"<kind>:<id of what waits>", as in decision:<item id>' }
        kind: { $ref: "#/components/schemas/InboxEntryKind" }
        factory:
          type: object
          required: [id, name, title]
          properties:
            id: { type: string }
            name: { type: string }
            title: { type: string, nullable: true }
        since: { type: string, format: date-time, description: Since when it waits (the item's last change) }
        item:
          description: The item it is about, or null for an entry that is about no item
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ItemCard"
        station: { type: string, nullable: true, description: The station where it waits }
        action:
          description: merge for a decision at a merge station (POST /v1/orgs/{org}/items/{item}/merge), else null
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StationAction"
    BuilderMeta:
      type: object
      required: [models, capabilities, limits]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/BuilderModel" }
        capabilities: { $ref: "#/components/schemas/BuilderCapabilities" }
        limits: { $ref: "#/components/schemas/BuilderLimits" }
    BuilderModel:
      type: object
      required: [id, label, default]
      properties:
        id: { type: string, description: "The model id, as runtime.model and agents[].model take it" }
        label: { type: string }
        default: { type: boolean, description: The model a factory runs when it names none }
    BuilderCapabilities:
      type: object
      description: Which later phases are wired; the editor hides or shows their controls read-only until then
      required: [credentials, connectors, tool_approvals]
      properties:
        credentials: { type: boolean, description: "Phase 3.1: credential selects and factory credentials" }
        connectors: { type: boolean, description: "Phase 3.2: the connector catalog and connector panel" }
        tool_approvals: { type: boolean, description: '"Ask me" on built-in tools is enforced' }
    BuilderLimits:
      type: object
      required: [skill_bytes, skill_files]
      properties:
        skill_bytes: { type: integer, description: The most bytes one skill folder holds }
        skill_files: { type: integer, description: The most files one skill folder holds }
    SkillName:
      type: string
      pattern: "^[A-Za-z0-9_.-]{1,100}$"
      description: An owner, repository or skill name of skills.sh (never . or ..)
    SkillListing:
      type: object
      description: One skill of the catalog, at the commit it is pinned at
      required: [key, owner, repo, skill, commit, description, installs, files, bytes]
      properties:
        key: { type: string, description: "<owner>/<repo>/<skill>" }
        owner: { type: string }
        repo: { type: string }
        skill: { type: string }
        commit: { type: string, pattern: "^[0-9a-f]{40}$" }
        description: { type: string, description: "From SKILL.md's front matter; plain text" }
        installs: { type: integer, format: int64, description: skills.sh installs when the operator last synced it }
        files: { type: integer }
        bytes: { type: integer, format: int64 }
    SkillPage:
      type: object
      required: [skills, next_after]
      properties:
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillListing" }
        next_after:
          type: string
          nullable: true
          description: Pass as `after` for the next page; null on the last one
    SkillFiles:
      type: object
      required: [skill, files]
      properties:
        skill: { $ref: "#/components/schemas/SkillListing" }
        files: { $ref: "#/components/schemas/FileMap" }
    FileMap:
      type: object
      description: Files by slash-separated relative path
      additionalProperties: { $ref: "#/components/schemas/FileContent" }
    FileContent:
      description: A file's content, as text when it is UTF-8 without NUL bytes, else in base64
      oneOf:
        - { $ref: "#/components/schemas/TextFile" }
        - { $ref: "#/components/schemas/Base64File" }
    TextFile:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }
    Base64File:
      type: object
      required: [base64]
      additionalProperties: false
      properties:
        base64: { type: string, format: byte }
    # Definitions (B §8): factories' drafts, versions, validation and templates.
    VersionRef:
      type: object
      description: A published version as listings name it
      required: [id, number, published_at, published_by]
      properties:
        id: { type: string }
        number: { type: integer }
        published_at: { type: string, format: date-time }
        published_by: { $ref: "#/components/schemas/Actor" }
    DraftRef:
      type: object
      description: An open draft as listings name it
      required: [id, revision, updated_at, updated_by]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/Actor" }
    NewFactoryRequest:
      type: object
      required: [start]
      properties:
        name:
          type: string
          description: Required except for an import, where factory.yaml's metadata.name is used when it is absent
        title: { type: string }
        start: { $ref: "#/components/schemas/FactoryStart" }
    FactoryStart:
      description: Where the new factory's first draft comes from
      oneOf:
        - $ref: "#/components/schemas/BlankStart"
        - $ref: "#/components/schemas/TemplateStart"
        - $ref: "#/components/schemas/CloneStart"
        - $ref: "#/components/schemas/ImportStart"
      discriminator:
        propertyName: kind
        mapping:
          blank: "#/components/schemas/BlankStart"
          template: "#/components/schemas/TemplateStart"
          clone: "#/components/schemas/CloneStart"
          import: "#/components/schemas/ImportStart"
    BlankStart:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [blank] }
    TemplateStart:
      type: object
      required: [kind, template]
      properties:
        kind: { type: string, enum: [template] }
        template: { type: string, description: The template's name }
        version: { type: integer, minimum: 1, description: The template's version; the latest when absent }
    CloneStart:
      type: object
      required: [kind, factory]
      properties:
        kind: { type: string, enum: [clone] }
        factory: { type: string, description: The factory to copy (its id or name), of the same organization }
        version:
          type: string
          description: The version to copy (a number or current); the current one when absent, the draft of a factory never published
    ImportStart:
      type: object
      required: [kind, files]
      properties:
        kind: { type: string, enum: [import] }
        files: { $ref: "#/components/schemas/FileMap" }
        keep_id:
          type: boolean
          description: Keep factory.yaml's metadata.id (goal factory push of a factory the organization lacks)
    FileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/FileInfo" }
    FileInfo:
      type: object
      required: [path, sha256, size]
      properties:
        path: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64, description: Bytes }
    DefinitionFiles:
      type: object
      required: [files]
      properties:
        files: { $ref: "#/components/schemas/FileMap" }
    Section:
      type: string
      enum: [basics, line, agents, connections, review]
    LineRange:
      type: array
      description: The first and last line of factory.yaml, 1-based; [0, 0] when it is not in the file
      minItems: 2
      maxItems: 2
      items: { type: integer }
    Ranges:
      type: object
      description: Where each model pointer (/line/stations/3) is in factory.yaml
      additionalProperties: { $ref: "#/components/schemas/LineRange" }
    SectionSummary:
      type: object
      description: One section tab's badge ("1 change, 1 problem") and the lines of factory.yaml it spans
      required: [section, changes, problems, lines]
      properties:
        section: { $ref: "#/components/schemas/Section" }
        changes: { type: integer }
        problems: { type: integer }
        lines: { $ref: "#/components/schemas/LineRange" }
    VersionState:
      type: string
      enum: [draft, published, archived]
    VersionSource:
      type: object
      description: Where a version started ("Source - Template Cost review v2")
      required: [kind]
      properties:
        kind: { type: string, enum: [blank, template, clone, import, cli, legacy, edit] }
        template: { type: string, description: The template and its version, as in cost-review@2 }
        factory: { type: string, description: The factory a clone copied }
        version: { type: string, description: The version a clone copied, or the base of an edit }
    Draft:
      type: object
      required: [id, revision, next_number, created_at, created_by, updated_at, updated_by, base, current, source, change_count, problem_count, sections]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64, description: Counts the draft's saves from 1 }
        next_number: { type: integer, description: The number publishing gives it ("Draft of v9") }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/Actor" }
        updated_at: { type: string, format: date-time, description: The last save ("Autosaved 14:32") }
        updated_by: { $ref: "#/components/schemas/Actor" }
        base:
          description: The published version it started from ("based on v8"); null for a first draft
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VersionRef" }]
        current:
          description: The version that runs now, which differs from base after a restore; null before the first publish
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VersionRef" }]
        source: { $ref: "#/components/schemas/VersionSource" }
        change_count: { type: integer, description: Changes from the base, or the starting tree }
        problem_count: { type: integer }
        sections:
          type: array
          items: { $ref: "#/components/schemas/SectionSummary" }
    OpenDraftRequest:
      type: object
      properties:
        base: { type: string, description: A published version (a number or current); current when absent }
        replace: { type: boolean, description: Archive the open draft first (goal factory push --replace-draft) }
    SectionETags:
      type: object
      description: Each section's concurrency token, the If-Match of its save
      required: [basics, line, agents, connections, review]
      properties:
        basics: { type: string }
        line: { type: string }
        agents: { type: string }
        connections: { type: string }
        review: { type: string }
    DraftModel:
      type: object
      required: [revision, model, etags, edited, ranges]
      properties:
        revision: { type: integer, format: int64 }
        model: { $ref: "#/components/schemas/FactoryModel" }
        etags: { $ref: "#/components/schemas/SectionETags" }
        edited:
          type: object
          description: >-
            The model pointers the draft changed against its base (or starting tree), each with the
            value there, null where it had none: the fields' Edited · Undo
          additionalProperties: {}
        ranges: { $ref: "#/components/schemas/Ranges" }
    VersionModel:
      type: object
      required: [model, ranges]
      properties:
        model: { $ref: "#/components/schemas/FactoryModel" }
        ranges: { $ref: "#/components/schemas/Ranges" }
    SectionSave:
      type: object
      required: [value]
      properties:
        value:
          description: The section's new value, the shape of FactoryModel's property of the section
          x-go-type: json.RawMessage
        files: { $ref: "#/components/schemas/FileMap" }
        remove_files:
          type: array
          description: Files to delete in the same revision, except a prompt another agent still uses
          items: { type: string }
    RevertRequest:
      type: object
      required: [pointers]
      properties:
        pointers:
          type: array
          items: { type: string }
    SaveResult:
      type: object
      description: The draft after a save
      required: [revision, updated_at, change_count, problem_count, sections]
      properties:
        revision: { type: integer, format: int64 }
        etag: { type: string, description: A section save's new etag }
        sha256: { type: string, description: A file save's new sha256 }
        updated_at: { type: string, format: date-time }
        change_count: { type: integer }
        problem_count: { type: integer }
        sections:
          type: array
          items: { $ref: "#/components/schemas/SectionSummary" }
    DraftTree:
      type: object
      required: [files]
      properties:
        files: { $ref: "#/components/schemas/FileMap" }
        expected_revision: { type: integer, format: int64, description: Refuse (412) when the draft is at another revision }
    StationMoves:
      type: object
      description: Where the open items of each station the new version removes go, by station id
      additionalProperties: { type: string }
    ValidateDraftRequest:
      type: object
      properties:
        overlay: { $ref: "#/components/schemas/FileMap" }
        station_moves: { $ref: "#/components/schemas/StationMoves" }
    PublishRequest:
      type: object
      required: [revision, expected_current_version_id]
      properties:
        revision: { type: integer, format: int64, description: The draft revision the editor validated }
        expected_current_version_id:
          type: string
          nullable: true
          description: The version the editor saw running; null for a first publish
        message: { type: string, maxLength: 200, description: The publish note }
        station_moves: { $ref: "#/components/schemas/StationMoves" }
        start:
          type: boolean
          default: true
          description: First publish only; false creates the factory paused (Start the line right away)
    RestoreRequest:
      type: object
      required: [expected_current_version_id]
      properties:
        expected_current_version_id: { type: string, description: The version the caller saw running }
        station_moves: { $ref: "#/components/schemas/StationMoves" }
    DefinitionCounts:
      type: object
      required: [stations, agents, skills, connections, contracts, changes]
      properties:
        stations: { type: integer }
        agents: { type: integer }
        skills: { type: integer }
        connections: { type: integer }
        contracts: { type: integer }
        changes: { type: integer, description: Changes from the base or starting tree; 0 when there is none to compare with }
    CheckResult:
      type: object
      description: >-
        One line of Review & publish's checks; checks that did not run (after a schema failure,
        or of phases not wired yet) are absent, never passed
      required: [id, section, status, summary]
      properties:
        id: { type: string, description: yaml, schema, line, references, images, secrets, availability, name, items, credentials, ... }
        section: { type: string }
        status: { type: string, enum: [passed, failed, warning] }
        summary: { type: string }
    Validation:
      type: object
      required: [ok, revision, counts, checks, problems]
      properties:
        ok: { type: boolean, description: No problem is an error, so the definition can be published }
        revision: { type: integer, format: int64, description: The draft revision validated; 0 for files outside a draft }
        counts: { $ref: "#/components/schemas/DefinitionCounts" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CheckResult" }
        problems:
          type: array
          items: { $ref: "#/components/schemas/DefinitionProblem" }
    DefinitionProblem:
      type: object
      description: One validation finding, located for both views (Visual by section and pointer, YAML by file and lines)
      required: [code, severity, check, section, line, column, end_line, end_column, message, fixes]
      properties:
        code: { type: string, description: Stable and kebab-case, as in unknown-agent }
        severity: { type: string, enum: [error, warning, info], description: errors block publishing }
        check: { type: string, description: The validation step that found it }
        section: { type: string, description: basics, line, agents, connections, review or files }
        pointer: { type: string, description: An RFC 6901 pointer into the factory model (/line/stations/3/agent) }
        file: { type: string, description: The file, as in factory.yaml }
        line: { type: integer, description: 1-based; 0 when not in a file }
        column: { type: integer }
        end_line: { type: integer }
        end_column: { type: integer }
        message: { type: string }
        fixes:
          type: array
          items: { $ref: "#/components/schemas/ProblemFix" }
    ProblemFix:
      type: object
      description: >-
        A machine-applicable fix: a JSON Patch on one section of the model, or (section publish)
        on the publish request (add /station_moves/<station>)
      required: [label, section, patch]
      properties:
        label: { type: string, description: As in Set WIP to 2 }
        section: { type: string }
        patch:
          type: array
          items: { $ref: "#/components/schemas/PatchOp" }
    PatchOp:
      type: object
      description: One RFC 6902 operation, its path relative to the section's value
      required: [op, path]
      properties:
        op: { type: string, enum: [add, remove, replace] }
        path: { type: string }
        value:
          description: The value of add and replace
          x-go-type: json.RawMessage
    ParseError:
      type: object
      description: Where factory.yaml stops parsing
      required: [line, column, message]
      properties:
        line: { type: integer, description: 1-based; 0 when unknown }
        column: { type: integer }
        message: { type: string }
    ItemsAtRemovedStations:
      type: object
      description: The open items that keep a publish or restore from dropping stations
      required: [in_progress, unmapped]
      properties:
        in_progress:
          type: array
          description: Items being worked; they must finish or be stopped first
          items: { $ref: "#/components/schemas/ItemAt" }
        unmapped:
          type: array
          description: Open items no station move maps
          items: { $ref: "#/components/schemas/ItemAt" }
    ItemAt:
      type: object
      required: [id, number, station, state]
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
    Version:
      type: object
      required: [id, number, revision, state, message, source, published_at, published_by, current, counts]
      properties:
        id: { type: string }
        number: { type: integer, nullable: true, description: null for a draft }
        revision: { type: integer, format: int64 }
        state: { $ref: "#/components/schemas/VersionState" }
        message: { type: string }
        source: { $ref: "#/components/schemas/VersionSource" }
        published_at: { type: string, format: date-time, nullable: true }
        published_by:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Actor" }]
        current: { type: boolean, description: This is the version that runs }
        counts: { $ref: "#/components/schemas/DefinitionCounts" }
    VersionDetail:
      allOf:
        - $ref: "#/components/schemas/Version"
        - type: object
          required: [files]
          properties:
            files:
              type: array
              items: { $ref: "#/components/schemas/FileInfo" }
    VersionPage:
      type: object
      required: [versions, next_before]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/Version" }
        next_before:
          type: integer
          nullable: true
          description: Pass as `before` for the next page; null on the last page
    CompareSide:
      type: object
      description: One side of a comparison; id, number and state are null for a starting tree no version holds
      required: [selector, id, number, state]
      properties:
        selector: { type: string, description: The selector asked for (base, draft, 8, ...) }
        id: { type: string, nullable: true }
        number: { type: integer, nullable: true, description: null unless published }
        state:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VersionState" }]
    Comparison:
      type: object
      required: [from, to, files, changes, counts]
      properties:
        from: { $ref: "#/components/schemas/CompareSide" }
        to: { $ref: "#/components/schemas/CompareSide" }
        files:
          type: array
          items: { $ref: "#/components/schemas/FileChange" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        counts:
          type: object
          description: '"3 changes in 2 sections"'
          required: [changes, sections]
          properties:
            changes: { type: integer }
            sections: { type: integer }
    FileChange:
      type: object
      required: [path, op]
      properties:
        path: { type: string }
        op: { type: string, enum: [added, removed, modified, unchanged] }
        from_sha256: { type: string, description: Absent for an added file }
        to_sha256: { type: string, description: Absent for a removed file }
    Change:
      type: object
      description: One meaningful difference, by identity (a reordered station is one moved change)
      required: [section, op, target, summary, from_lines, to_lines]
      properties:
        section: { type: string, description: A section, or files }
        op: { type: string, enum: [added, removed, changed, moved] }
        target:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string, enum: [station, agent, connection, tool, skill, contract, field, file] }
            id: { type: string }
        field: { type: string, description: Set when exactly one field of the target changed }
        from: { description: The value before }
        to: { description: The value after }
        summary: { type: string, description: A short sentence, as in Build also runs pnpm test }
        from_lines: { $ref: "#/components/schemas/LineRange" }
        to_lines: { $ref: "#/components/schemas/LineRange" }
    TemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/TemplateSummary" }
    TemplateSummary:
      type: object
      required: [name, version, title, summary, stations, agents, connectors, changed]
      properties:
        name: { type: string }
        version: { type: integer }
        title: { type: string }
        summary: { type: string }
        stations: { type: integer }
        agents: { type: integer }
        connectors:
          type: array
          items: { type: string }
        changed: { type: string, description: 'The day the version was made, as in 2026-10-09' }
    Template:
      allOf:
        - $ref: "#/components/schemas/TemplateSummary"
        - type: object
          required: [description, model]
          properties:
            description: { type: string }
            model: { $ref: "#/components/schemas/FactoryModel" }
    FactoryModel:
      type: object
      description: >-
        The factory model the Visual editor edits: factory.yaml's sections with snake_case keys
        (the YAML's camelCase keys). It mirrors the YAML leniently: a key the YAML lacks is absent,
        and a value the schema refuses appears as it is, with a problem.
      x-go-type: json.RawMessage
      required: [basics, line, agents, connections, review]
      properties:
        basics:
          type: object
          properties:
            id: { type: string, description: metadata.id, read-only }
            name: { type: string }
            title: { type: string }
            purpose: { type: string }
            work_types:
              type: array
              items: { type: string }
            repository:
              type: object
              nullable: true
              description: "{url, token} (token an env: reference until phase 3) or {connection, repo}"
              additionalProperties: {}
        line:
          type: object
          properties:
            stations:
              type: array
              items:
                type: object
                description: >-
                  id, name, description, kind (queue, agent, human, done), agent, route (lane →
                  agent), agents, wip, buffer, output, checks (strings or {kind, run, min}), gate
                  ({on_reject, max_rework}), action
                additionalProperties: {}
            intake:
              type: array
              items:
                type: object
                additionalProperties: {}
            flow:
              type: object
              description: expedite, constraint, release, andon, targets
              additionalProperties: {}
            librarian: { type: string, nullable: true }
        agents:
          type: object
          properties:
            default_model: { type: string }
            agents:
              type: array
              items:
                type: object
                description: >-
                  name, description, prompt ({path, sha256, words}), model, max_turns,
                  per_item_usd, skills, connections, builtins ({read, edit, run: {mode, commands},
                  web, subagents}), custom_tools
                additionalProperties: {}
            skills:
              type: array
              items:
                type: object
                description: name, source, origin
                additionalProperties: {}
        connections:
          type: array
          items:
            type: object
            description: name, connector, type, credential, agents, tools, settings, legacy
            additionalProperties: {}
        review:
          type: object
          properties:
            budget:
              type: object
              description: weekly_usd, daily_usd, per_item_usd, max_turns_per_task, on_exhausted
              additionalProperties: {}
    DefinitionEvent:
      type: object
      description: "The data of one `event: definition` on /v1/orgs/{org}/stream; it carries no content"
      required: [org_id, factory_id, kind]
      properties:
        org_id: { type: string }
        factory_id: { type: string }
        kind:
          type: string
          enum: [current, draft, factory]
          description: >-
            current: the version that runs moved, or the factory was paused or resumed; draft: a
            version row changed (a draft opened, saved, discarded or published); factory: the
            factory was created or deleted
        version_id: { type: string, description: The version concerned (current - the one that runs) }
        number: { type: integer, description: The version's number once published }
        revision: { type: integer, format: int64, description: draft only, the draft's revision }
        by: { type: string, description: "draft only, who saved it, as an actor ref (user:local)" }

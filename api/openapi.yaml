# The contract between goald and its clients: the goal CLI (Go client in internal/api/gen) and
# the web UI (TypeScript client in packages/api-client). Change it first, then regenerate both
# (`task api:gen`); the generated code is committed.
#
# Authentication (phase 3): with GOAL_AUTH=session every operation but getHealth and getAuthConfig
# needs a credential, Better Auth's session cookie (goal.session_token, __Secure- prefixed over
# https) or a bearer value (a session token from goal login, or an API key goal_sk_...), and a
# missing, malformed, unknown, expired or revoked one is 401. With GOAL_AUTH=none (one developer's
# laptop, loopback only) every request acts as the one local user. Every route but the install's
# (/v1/health, /v1/auth/config, /v1/me, /v1/platform/*, /v1/orgs) belongs to an organization and lives under
# /v1/orgs/{org}; an unknown or deleted organization, and one the caller is not a member of, is
# 404. Requests that change something from a browser must be same-origin (cross-origin protection).
#
# Every operation names the permission it needs in `x-goal-scope`, one of api/permissions.yaml
# (phase 3). cmd/permgen (`task api:gen`) generates goald's table from both files and `task
# check` fails when an operation lacks a scope, names an unknown one, or the table is stale.
openapi: 3.0.3
info:
  title: Goal API
  version: 0.3.0
  description: >-
    Organizations, their factories, boards and flow metrics, work items, their history, human
    decisions, a realtime stream of an organization's events, and the factory editor's metadata
    and skills catalog.
servers:
  - url: http://127.0.0.1:8080
security:
  - session: []
  - bearer: []
tags:
  - name: orgs
    description: Organizations, the tenant boundary of every factory, item and event
  - name: shell
    description: >-
      What the app's chrome reads about an organization: attention badges, factory overviews and
      the inbox of what waits for a person, over the factories the caller sees. "Waiting on you"
      counts the decisions the caller may make (item:decide); under GOAL_AUTH=none, every one.
  - name: work
    description: >-
      Work on a factory's line: an item's agent runs and, later in phase 2.2, flow metrics, the
      andon and the human controls of items
  - name: builder
    description: >-
      The factory editor's metadata (the install's models, which later phases are wired, the
      skill limits) and the skills catalog, skills.sh skills kept in the bucket at a pinned
      commit so a draft can vendor them
  - name: identity
    description: >-
      Who is signed in and how this install signs people in (spec 3). Signing in, out and
      changing one's name go to the identity service under /api/auth/* (Better Auth's own
      contract, ADR 0007); goald answers the rest.
  - name: connections
    description: >-
      The organization's connections (spec 4): the accounts and API keys its factories' runs use,
      each of a connection kind, with credentials sealed under the platform's master key and never
      readable back. Members read names, kinds and status; owners and admins create, test, change
      and delete them, after a recent sign-in.
  - name: knowledge
    description: >-
      The organization's knowledge base (spec 4 §4.8): sources of uploaded files, of connections
      synced into it and of connections searched live, their documents, and the search agents
      run through the gateway's knowledge__search. Members and keys read and search it; owners,
      admins and keys add, sync and delete sources and documents.
  - name: definitions
    description: >-
      Factory definitions: creating factories, the one shared draft per factory (Visual
      sections, single files and the whole tree, each write under an If-Match precondition),
      validation, publishing, versions, compare, restore and the template catalog
paths:
  /v1/health:
    get:
      operationId: getHealth
      x-goal-scope: public
      security: []
      summary: Liveness of goald
      responses:
        "200":
          description: goald is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/auth/config:
    get:
      operationId: getAuthConfig
      x-goal-scope: public
      security: []
      tags: [identity]
      summary: How this install signs people in
      description: >-
        Read by the sign-in page before anyone is signed in, so it reads no credential. Under
        GOAL_AUTH=none sign-in is off: the UI shows no sign-in page and every request acts as the
        local user.
      responses:
        "200":
          description: The sign-in mode and methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /v1/auth/device/{user_code}:
    get:
      operationId: getDeviceRequest
      x-goal-scope: device:read
      tags: [identity]
      summary: A pending CLI sign-in, by the code its terminal shows
      description: >-
        What the Device-Approve page shows before a signed-in person approves `goal login`: the
        client (checked by the identity service: only the Goal CLI), when it asked and until when,
        and the address and user agent it asked from. The page sends the code the person typed,
        never one from a link. Dashes and case are ignored. An unknown, expired, approved or
        denied code is 404 device-code-not-found with one fixed body; so is every code under
        GOAL_AUTH=none, which has no CLI sign-in. Only signed-in people hold device:read, never
        API keys or personal tokens.
      parameters:
        - name: user_code
          in: path
          required: true
          description: The code as typed (ABCD-EFGH or abcdefgh)
          schema: { type: string, maxLength: 32 }
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      operationId: getMe
      x-goal-scope: authenticated
      tags: [identity]
      summary: Who the request acts for
      description: >-
        The signed-in person (name, email, platform admin, the session's times) or the API key.
        With a personal token, the person and the token (its name, organization, scopes and
        expiry), never a session or platform admin. Under GOAL_AUTH=none, the local user. Without
        a valid credential, 401 unauthenticated.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/platform/admins:
    get:
      operationId: listPlatformAdmins
      x-goal-scope: platform:read
      tags: [identity]
      summary: The install's platform admins, earliest first
      description: >-
        Platform admins create organizations and manage platform admins; inside an organization
        they have only the rights of their membership there. Platform admins only.
      responses:
        "200":
          description: The platform admins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdminList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addPlatformAdmin
      x-goal-scope: platform:manage
      tags: [identity]
      summary: Make a person a platform admin
      description: >-
        The person is the user with this email (case-insensitive), who must have signed in once
        (404 otherwise; invite them to an organization first). Adding an admin again changes
        nothing. Recorded in the security log as platform_admin.added. Needs a sign-in from the
        last 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPlatformAdmin" }
      responses:
        "201":
          description: The platform admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdmin" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/platform/admins/{user}:
    parameters:
      - $ref: "#/components/parameters/UserRef"
    delete:
      operationId: removePlatformAdmin
      x-goal-scope: platform:manage
      tags: [identity]
      summary: Stop a person being a platform admin
      description: >-
        404 when they are not one. The install keeps at least one platform admin: removing the
        last is 409 with code last-platform-admin and changes nothing (goal db recover-admin adds
        one with database access). Recorded in the security log as platform_admin.removed.
        Needs a sign-in from the last 10 minutes.
      responses:
        "204":
          description: Removed
        default: { $ref: "#/components/responses/Problem" }
  /v1/platform/auth-events:
    get:
      operationId: listAuthEvents
      x-goal-scope: platform:read
      tags: [identity]
      summary: The install's security log, newest first
      description: >-
        Sign-ins, codes sent, suppressed and failed, lockouts, device approvals, platform admin
        changes and recoveries. An email or a user code appears only as its hash (subject);
        events older than 90 days are cleaned up. Platform admins only.
      parameters:
        - name: before
          in: query
          description: The cursor of the next page (next_before); events with a smaller id
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: kind
          in: query
          description: Only events of this kind, as in sign_in.succeeded
          schema: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' }
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEventPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs:
    get:
      operationId: listOrgs
      x-goal-scope: authenticated
      tags: [orgs]
      summary: The caller's organizations, by name
      description: >-
        A person's organizations with their role in each; an API key's own organization. Under
        GOAL_AUTH=none, every organization of the install.
      responses:
        "200":
          description: The organizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createOrg
      x-goal-scope: org:create
      tags: [orgs]
      summary: Create an organization
      description: >-
        The slug is lowercase letters, digits and hyphens (3 to 40), unique across the install and
        not a reserved word (new, settings, api, v1, o, me, orgs, auth, invite, admin, default).
        The mark defaults to the name's initials. A taken or reserved slug, or a malformed field,
        is 409. Platform admins only; the caller becomes the organization's owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewOrg" }
      responses:
        "201":
          description: The organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrg
      x-goal-scope: org:read
      tags: [orgs]
      summary: One organization
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteOrg
      x-goal-scope: org:delete
      tags: [orgs]
      summary: Delete an organization
      description: >-
        The organization disappears at once (every route under it answers 404, as for an unknown
        one) and is purged, with every row it owns and its objects in the bucket, after the
        install's retention (GOAL_ORG_RETENTION, default 7 days). `confirm` must be the
        organization's name exactly; otherwise 409 (code confirmation-mismatch) and nothing
        changes. Audited as org.deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgDeletion" }
      responses:
        "202":
          description: Deleted; the purge is scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDeleted" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/settings:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgSettings
      x-goal-scope: org:read
      tags: [orgs]
      summary: The organization's settings, slot caps included
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettings" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateOrgSettings
      x-goal-scope: org:manage
      tags: [orgs]
      summary: Change the organization's settings
      description: >-
        Every field is optional and changes only what it names, in one transaction audited as
        one org.updated entry (none when nothing changes). A new slug resolves at once and the
        old one is 404. A taken slug is 409 with code slug-taken; a reserved or malformed slug,
        name or mark, or a slot cap outside 1 to 1000, is 409. A factory that is not the
        organization's is 404. Per-factory caps may add up to more than the organization's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSettingsPatch" }
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/audit:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listAudit
      x-goal-scope: audit:read
      tags: [orgs]
      summary: The organization's audit log, newest first
      parameters:
        - name: before
          in: query
          description: The cursor of the next page (next_before); entries with a smaller id
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: action
          in: query
          description: Only entries of this action, as in org.updated
          schema: { type: string }
        - name: target_kind
          in: query
          schema: { type: string }
        - name: target_id
          in: query
          schema: { type: string }
        - name: factory
          in: query
          description: Only entries about this factory (its metadata.id or metadata.name)
          schema: { type: string }
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/api-keys:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listAPIKeys
      x-goal-scope: api_key:read
      tags: [identity]
      summary: The organization's API keys
      description: >-
        Live keys and those revoked in the last 30 days, live ones first, newest first. A key is
        shown by its hint (goal_sk_ and the secret's first four characters); its secret is never
        shown again after it was created.
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAPIKey
      x-goal-scope: api_key:manage
      tags: [identity]
      summary: Create an API key
      description: >-
        An API key is the organization's service account for scripts and CI: it acts with its
        scopes, at most as its role ceiling on each factory it reaches (all of them, or the ones
        named), until it expires (1 to 90 days, default 90) or is revoked. Each scope must be a
        permission keys may carry (never people, keys, ownership, the organization's settings or
        deletion, or the platform) and held by the creator now, and a factory scope must be held by
        the ceiling; otherwise 400 scope-not-allowed. A live key's name is unique in the
        organization, case ignored (409 api-key-name-taken). The answer carries the secret, once,
        with Cache-Control no-store: goald keeps only its hash. Needs a sign-in from the last 10
        minutes. Audited as api_key.created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewApiKey" }
      responses:
        "201":
          description: The key and its secret, shown this once
          headers:
            Cache-Control:
              required: true
              description: no-store, so no cache keeps the secret
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiKey" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/api-keys/{key}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: key
        in: path
        required: true
        description: The key's id
        schema: { type: string }
    delete:
      operationId: revokeAPIKey
      x-goal-scope: api_key:manage
      tags: [identity]
      summary: Revoke an API key
      description: >-
        The key stops working on its next request, and the streams it holds end. Revoking a revoked
        key changes nothing; an unknown key is 404. Needs a sign-in from the last 10 minutes.
        Audited as api_key.revoked.
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/members:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listMembers
      x-goal-scope: member:read
      tags: [identity]
      summary: The organization's members, by name
      description: >-
        Each member with their organization role, their factory roles (on the factories the
        caller sees), when they joined and were last active, and what the caller may change about
        them. Inviting, changing an organization role and removing go to the identity service
        (/api/auth/organization/*, Better Auth's contract), whose owner rules apply; can_change_role
        and can_remove say in advance what it would refuse.
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listInvitations
      x-goal-scope: invitation:read
      tags: [identity]
      summary: The organization's pending invitations, oldest first
      description: Expired, accepted, declined and cancelled invitations are left out.
      responses:
        "200":
          description: The pending invitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/members/{user}/factory-roles/{factory}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/UserRef"
      - $ref: "#/components/parameters/FactoryRef"
    put:
      operationId: setFactoryRole
      x-goal-scope: member:manage
      tags: [identity]
      summary: Give a member a role on a factory
      description: >-
        Replaces the member's role on the factory; applies at once (their next request and their
        open streams) and is audited as factory_role.granted or factory_role.changed. 404 when the
        user is not a member or the factory not one of the organization's; 409 editor-everywhere
        for an owner or an admin, who hold every factory role by their organization role. Needs a
        sign-in from the last 10 minutes (403 reauth-required).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryRoleChange" }
      responses:
        "200":
          description: The member's role on the factory now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryRoleGrant" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeFactoryRole
      x-goal-scope: member:manage
      tags: [identity]
      summary: Take a member's role on a factory away
      description: >-
        The member no longer sees the factory (unless they are an owner or an admin). Audited as
        factory_role.removed; nothing to remove is no change. Needs a sign-in from the last 10
        minutes.
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/transfer:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: transferOwnership
      x-goal-scope: org:transfer
      tags: [identity]
      summary: Hand the organization to an admin
      description: >-
        One atomic change: the admin `to` becomes an owner and the caller an admin, audited as
        org.ownership_transferred. `confirm` must be the organization's name exactly (409
        confirmation-mismatch); `to` must be an admin (409 not-an-admin). Owners only, with a
        sign-in from the last 10 minutes. Answers the organization as the caller now sees it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: The organization, the caller now its admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/personal-tokens:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listPersonalTokens
      x-goal-scope: personal_token:read
      tags: [identity]
      summary: Your personal tokens in the organization
      description: >-
        The caller's own live tokens in the organization and those revoked in the last 30 days,
        live ones first, newest first, each by its hint (goal_pat_ and the secret's first four
        characters). Never another member's, and never a secret. Under GOAL_AUTH=none, none.
      responses:
        "200":
          description: The tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalTokenList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPersonalToken
      x-goal-scope: personal_token:manage
      tags: [identity]
      summary: Create a personal token
      description: >-
        A personal token lets the CLI or a script act as you in this organization, with no more
        than its scopes and your role at each request allow, until it expires (1 to 90 days,
        default 30) or is revoked; removing you from the organization deletes it. Each scope must be
        a permission tokens may carry and held by you now (an org permission by your role, a
        factory permission on at least one factory), else 400 scope-not-allowed. A live token's
        name is unique among yours, case ignored (409 personal-token-name-taken). Created in the
        browser only, with a sign-in from the last 10 minutes: a CLI session, an API key or a
        token gets 403 (browser-session-required for a CLI session). The answer carries the secret,
        once, with Cache-Control no-store: goald keeps only its hash. Audited as
        personal_token.created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPersonalToken" }
      responses:
        "201":
          description: The token and its secret, shown this once
          headers:
            Cache-Control:
              required: true
              description: no-store, so no cache keeps the secret
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedPersonalToken" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/personal-tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: token
        in: path
        required: true
        description: The token's id
        schema: { type: string }
    delete:
      operationId: revokePersonalToken
      x-goal-scope: personal_token:read
      tags: [identity]
      summary: Revoke one of your personal tokens
      description: >-
        The token stops working on its next request, and the streams it holds end. Only your own:
        another member's token is 404, as an unknown one. No recent sign-in needed, so a leaked
        token is revoked at once. Revoking a revoked token changes nothing. Audited as
        personal_token.revoked.
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/member-tokens:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listMemberTokens
      x-goal-scope: api_key:read
      tags: [identity]
      summary: Every member's personal tokens in the organization
      description: >-
        For owners and admins: every member's live tokens and those revoked in the last 30 days,
        with their owner, live ones first, newest first. Never a secret.
      responses:
        "200":
          description: The tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalTokenList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/member-tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: token
        in: path
        required: true
        description: The token's id
        schema: { type: string }
    delete:
      operationId: revokeMemberToken
      x-goal-scope: api_key:manage
      tags: [identity]
      summary: Revoke a member's personal token
      description: >-
        The token stops working on its next request, and the streams it holds end. Revoking a
        revoked token changes nothing; an unknown one is 404. Needs a sign-in from the last 10
        minutes. Audited as personal_token.revoked.
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/attention:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgAttention
      x-goal-scope: org:read
      tags: [shell]
      summary: What each factory of the organization needs from people now, for the rail's badges
      description: >-
        One cheap read, meant to be refetched on every stream event: per factory, the items
        waiting for a person, the blocked items and the open andon pull, ordered by factory name.
        Factories with nothing pending are listed with zeros.
      responses:
        "200":
          description: The organization's attention counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgAttention" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/overview:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getFactoryOverview
      x-goal-scope: org:read
      tags: [shell]
      summary: Every factory of the organization summarized for the Factories home, ordered by name
      parameters:
        - name: window
          in: query
          description: >-
            The last N UTC calendar days, today included, written Nd (1d to 90d), as for metrics.
            The previous window, which deltas compare against, has the same length and ends where
            this one starts.
          schema: { type: string, pattern: "^[1-9][0-9]?d$", default: 7d }
      responses:
        "200":
          description: The factories' overviews and the organization's totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryOverviewList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/metrics/touches:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgTouchMetrics
      x-goal-scope: org:read
      tags: [work]
      summary: Human touches per finished item across the factories the caller may read
      description: >-
        A touch is one action by a person on an item: its events with the same person and the same time (one transition) count once; API keys, agents and the engine never touch, and the submission (created) is not one. Planned touches are decisions the line requires (an approval or merge at a human station); every other touch is unplanned. Over a range of UTC days as for getMetrics: the items finished
        (done) in the range, the organization's total and each factory the caller may read, in
        name order. 400 for a bad range.
      parameters:
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: The organization's touch metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgTouchMetrics" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/inbox:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getInbox
      x-goal-scope: org:read
      tags: [shell]
      summary: What waits for a person across the organization's factories
      description: >-
        The organization's inbox: one entry per thing a person may act on. Phase 2.2 has no
        identity, so every entry is everyone's. decision: an item waiting for a person's decision,
        with its approval brief; andon: a factory's open andon pull, its line stopped;
        rework_warning: a gate one rejection away from its andon policy's rework rate (display
        only); blocked: a blocked item, with why; expedite: an open item in the expedite lane that
        waits on nothing else. An item has at most one entry (decision, then blocked, then
        expedite). Later phases add kinds (tool_approval, sync_failed, proposal), which clients
        that do not know them render as a generic row. When more entries exist than limit, the
        most recent ones are kept and truncated is true. Entries are ordered by kind (decision,
        andon, rework_warning, blocked, expedite), then oldest first. The default limit, 200, is
        enough for every screen to count what it groups (the Floor's Needs you card, the phone's
        Items view).
      parameters:
        - name: factory
          in: query
          description: Only this factory's entries (its metadata.id or metadata.name); unknown is 404
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: The inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listFactories
      x-goal-scope: org:read
      tags: [definitions]
      summary: The organization's factories, published or not
      description: >-
        Every factory of the organization by name, with its current version, its open draft and
        whether it is paused. stations and work_types are those of the version goald runs (empty
        for a factory never published).
      responses:
        "200":
          description: Factories ordered by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createFactory
      x-goal-scope: factory:create
      tags: [definitions]
      summary: Create a factory with its first draft
      description: >-
        Starts blank (the catalog's blank template, or a skeleton naming no station or agent), from
        a catalog template, as a clone of another factory's version (same organization; items, runs
        and history are not copied) or from imported files. factory.yaml's metadata.id becomes a
        new id (kept only with keep_id), and metadata.name and title the request's, edited in place
        so comments survive. The factory runs nothing until its draft is published. Errors: 409
        name-taken, factory-exists (an import keeping a taken id); 404 template-not-found,
        factory-not-found (the clone's source); 422 import-invalid (no factory.yaml that parses),
        bad-path; 413 too-large; 400 invalid-request (no name).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewFactoryRequest" }
      responses:
        "201":
          description: The factory, with its first draft
          headers:
            Location:
              description: The factory's address (getFactory)
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getFactory
      x-goal-scope: factory:read
      tags: [definitions]
      summary: One factory, published or not
      responses:
        "200":
          description: The factory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteFactory
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Delete a factory that was never published, with its draft (the wizard's Cancel)
      description: 409 factory-published once a version was published.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/pause:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: pauseFactory
      x-goal-scope: factory:manage
      tags: [definitions]
      summary: Stop the factory taking work; runs in progress finish
      responses:
        "200":
          description: The factory, paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/resume:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: resumeFactory
      x-goal-scope: factory:manage
      tags: [definitions]
      summary: Start a paused factory again
      responses:
        "200":
          description: The factory, running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getDraft
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The factory's open draft, its changes and problems
      description: 404 no-draft when none is open.
      responses:
        "200":
          description: The draft
          headers:
            ETag:
              description: The draft's revision, quoted ("42"), the If-Match of discardDraft
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: openDraft
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Open the factory's draft, or return the open one
      description: >-
        Opens a draft on base (a published version: a number or current; current when absent).
        An open draft is returned as it is (200), unless base names another version: then 409
        draft-exists, or with replace the open draft is archived and a new one opened (201).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenDraftRequest" }
      responses:
        "201":
          description: A new draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "200":
          description: The draft that was open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: discardDraft
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Discard (archive) the open draft; the version that runs is unchanged
      description: >-
        If-Match is the draft's revision ("42"): without it 428 precondition-required, when the
        draft moved since 412 draft-conflict.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Discarded }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/model:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getDraftModel
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The draft's factory model for the Visual editor
      description: >-
        The model, each section's concurrency token, the fields the draft changed against its base
        (Edited · Undo) and where each model pointer is in factory.yaml. 409 yaml-invalid (with
        parse_error) while factory.yaml does not parse: Visual is read-only until it is fixed in
        YAML mode.
      responses:
        "200":
          description: The draft's model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftModel" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/model/{section}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/SectionRef"
    put:
      operationId: saveDraftSection
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Save one section of the model (a Visual save)
      description: >-
        Applies the section's new value to factory.yaml, keeping everything the section does not
        own (comments and key order included), and writes files and deletes remove_files in the
        same revision (an added agent's prompt). If-Match is the section's etag ("<etag>"): without
        it 428 precondition-required; when the section changed meanwhile 412 draft-conflict with
        the section's current value and etag. Writers of other sections or files never conflict.
        409 yaml-invalid while factory.yaml does not parse; 422 model-invalid for a value of the
        wrong shape; 404 no-draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionSave" }
      responses:
        "200":
          description: The draft after the save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/model/{section}/revert:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/SectionRef"
    post:
      operationId: revertDraftSection
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Put back the base's value at edited fields of a section (Undo)
      description: >-
        pointers are keys of DraftModel.edited in the section; one no longer edited is ignored.
        If-Match is the section's etag, as for a save (428, 412).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevertRequest" }
      responses:
        "200":
          description: The draft after the revert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/files:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listDraftFiles
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The draft's files by path
      responses:
        "200":
          description: The files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/files/{path}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/FilePath"
    get:
      operationId: getDraftFile
      x-goal-scope: factory:read
      tags: [definitions]
      summary: One file of the draft, as stored
      description: 404 file-not-found. The ETag is the file's sha256, the If-Match of putDraftFile and deleteDraftFile.
      responses:
        "200":
          description: The file's content
          headers:
            ETag:
              description: The file's sha256, quoted
              required: true
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putDraftFile
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Write one file of the draft exactly as sent (YAML mode)
      description: >-
        If-Match is the sha256 the editor read ("<sha256>"); If-None-Match * creates a file that
        must not exist yet. Exactly one of them: neither is 428 precondition-required, both 400. A
        stale hash, or If-None-Match on a file that exists, is 412 draft-conflict with the file's
        current sha256 (absent when it is gone). 422 bad-path; 413 too-large (over 1 MiB).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The draft after the save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDraftFile
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Delete one file of the draft
      description: If-Match is the file's sha256 (428 without it, 412 when stale); 404 file-not-found.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The draft after the delete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/tree:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    put:
      operationId: replaceDraftTree
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Make files the draft's whole tree (goal factory push)
      description: >-
        With expected_revision, a draft at another revision is 412 draft-conflict; without it the
        latest draft is replaced. 422 bad-path; 413 too-large (over 1,000 files or 16 MiB).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftTree" }
      responses:
        "200":
          description: The draft after the save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/validate:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: validateDraft
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Validate the draft at its revision, as publish will
      description: >-
        overlay is unsaved YAML-mode text written over the draft's files; station_moves are the
        moves the publish will carry, so the items they map are not reported.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateDraftRequest" }
      responses:
        "200":
          description: The validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validation" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/publish:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: publishDraft
      x-goal-scope: definition:publish
      tags: [definitions]
      summary: Publish the open draft as the factory's next version
      description: >-
        One transaction: the draft becomes version N+1, the factory runs it, and the open items of
        stations it removes move by station_moves. Runs in progress finish on the version they
        started on; every later step uses the new one. Errors: 412 draft-conflict (the draft is no
        longer at revision); 409 draft-base-moved (the current version is not
        expected_current_version_id), definition-invalid (with problems), items-at-removed-station
        (with items), name-taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listVersions
      x-goal-scope: factory:read
      tags: [definitions]
      summary: One page of the factory's published versions, newest first
      parameters:
        - name: before
          in: query
          description: The next_before of the previous page; versions numbered below it
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Versions, highest number first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/VersionSelector"
    get:
      operationId: getVersion
      x-goal-scope: factory:read
      tags: [definitions]
      summary: One version with its files
      description: 404 version-not-found (source too, which is a starting tree and no version).
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions/{version}/model:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/VersionSelector"
    get:
      operationId: getVersionModel
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The factory model of a version, for a read-only Visual view
      description: 409 yaml-invalid (with parse_error) when its factory.yaml does not parse.
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionModel" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions/{version}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/VersionSelector"
      - $ref: "#/components/parameters/FilePath"
    get:
      operationId: getVersionFile
      x-goal-scope: factory:read
      tags: [definitions]
      summary: One file of a version
      description: >-
        A published version's files never change: they are served with Cache-Control private,
        max-age=31536000, immutable (no-cache for a draft's). 404 file-not-found.
      responses:
        "200":
          description: The file's content
          headers:
            ETag:
              description: The file's sha256, quoted
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/versions/{version}/restore:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/VersionSelector"
    post:
      operationId: restoreVersion
      x-goal-scope: definition:publish
      tags: [definitions]
      summary: Run an older published version again (rollback)
      description: >-
        Moves the factory's current pointer to the version; numbers are not reused and an open
        draft stays open. 409 draft-base-moved (the current version is not
        expected_current_version_id), items-at-removed-station, name-taken; 404 version-not-found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "200":
          description: The factory, running the restored version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/compare:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: compareVersions
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The semantic difference between two versions
      description: >-
        from and to are version selectors (a number, current, draft, base or source); by default
        the draft against its base, or its starting tree when it has none. Line-level hunks are
        computed by the client from the two files.
      parameters:
        - name: from
          in: query
          schema: { type: string, default: base }
        - name: to
          in: query
          schema: { type: string, default: draft }
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/templates:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listTemplates
      x-goal-scope: org:read
      tags: [definitions]
      summary: The template catalog, the latest version of each template by name
      responses:
        "200":
          description: The templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/templates/{name}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: name
        in: path
        required: true
        description: The template's name
        schema: { type: string }
    get:
      operationId: getTemplate
      x-goal-scope: org:read
      tags: [definitions]
      summary: One version of a template with a preview of its model
      description: 404 template-not-found.
      parameters:
        - name: version
          in: query
          description: The template's version; the latest when absent
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/definitions/validate:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: validateDefinition
      x-goal-scope: org:read
      tags: [definitions]

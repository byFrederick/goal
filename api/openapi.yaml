        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/runs:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    get:
      operationId: listItemRuns
      x-goal-scope: factory:read
      tags: [work]
      summary: An item's agent runs, oldest first (at most 200)
      responses:
        "200":
          description: The item's runs

# golangci-lint v2 for Goal's Go code: a broad set of correctness, style, security and complexity
# linters, and depguard rules that keep the hexagonal boundaries in docs/engineering/architecture.md.
# Do not weaken a rule to make code pass.

version: "2"
run:
  concurrency: 4
  # Timeout for analysis
  timeout: 5m
  # Include test files
  tests: true

issues:
  max-issues-per-linter: 0 # 0 = unlimited (we want ALL issues)
  max-same-issues: 50

linters:
  enable:
    # correctness
    - govet # built-in checker: copylocks, printf formats, struct tags, unreachable code
    - staticcheck # extensive static analysis: deprecated APIs, common mistakes, simplifications
    - unused # unused variables, functions, types
    - errcheck # unchecked error returns and type assertions
    - errorlint # correct use of errors.Is/As and %w wrapping (Go 1.13+)
    - nilerr # returning nil error when err is non-nil
    - forcetypeassert # type assertions without comma-ok check
    - copyloopvar # loop variable copy issues (Go 1.22+)
    - durationcheck # detect time.Duration * time.Duration bugs
    - reassign # package-level variable reassignment
    # style
    - gocritic # opinionated style: unnecessary conversions, range copies, redundant code
    - revive # naming conventions, exported types, stuttered package names
    - wsl_v5 # whitespace and blank line rules for readability
    - whitespace # trailing whitespace, unnecessary blank lines
    - godot # exported-symbol comments must end with a period
    - misspell # common English misspellings in identifiers and comments
    - dupword # duplicate words in comments and strings (the the, is is)
    - predeclared # shadowing Go built-ins (len, cap, error)
    - errname # error type/var naming conventions (ErrFoo, FooError)
    - asciicheck # non-ASCII identifiers (prevents homoglyph/trojan source attacks)
    # complexity
    - gocyclo # cyclomatic complexity threshold
    - nestif # deeply nested if/else chains
    - funlen # function length limits (lines and statements)
    - dupl # code duplication detection
    # performance
    - perfsprint # faster alternatives to fmt.Sprintf
    - unconvert # unnecessary type conversions
    - ineffassign # assignments to variables never read
    - goconst # repeated literals that should be constants
    # security & resources
    - gosec # security scanner: SQL injection, hardcoded credentials, weak crypto, path traversal
    - bidichk # dangerous bidirectional Unicode sequences (trojan source CVE-2021-42574)
    - bodyclose # unclosed HTTP response bodies (connection leaks)
    - noctx # HTTP requests missing context.Context
    - containedctx # context.Context stored in struct fields instead of passed as parameter
    - fatcontext # context.WithValue/WithCancel in loops (unbounded context chain, memory leak)
    - sqlclosecheck # unclosed sql.Rows and sql.Stmt
    - rowserrcheck # unchecked sql.Rows.Err() after iteration
    # logging
    - sloglint # consistent log/slog code style
    - loggercheck # key-value pair validation for structured loggers (zap, slog, logr)
    # testing
    - testifylint # testify best practices
    - thelper # test helpers missing t.Helper()
    - usetesting # use t.Setenv/t.TempDir instead of os equivalents in tests
    - paralleltest # tests and subtests missing t.Parallel()
    # modernization & meta
    - modernize # old patterns replaceable with newer Go features
    - exptostd # replace golang.org/x/exp/ functions with stdlib equivalents
    - intrange # range over integer instead of C-style loop (Go 1.22+)
    - usestdlibvars # use stdlib constants instead of hardcoded values
    - exhaustive # switch statements not covering all enum values
    - nolintlint # enforces proper //nolint directive usage
    # architecture
    - depguard # hexagonal boundaries: internal/core imports nothing outside internal/core

  disable:
    - lll # line length — handled by gofmt/gofumpt
    - prealloc # high false-positive rate; enable only after performance profiling
    - wrapcheck # forces wrapping all external errors — too noisy as a default
    - err113 # forces package-level sentinel errors — too opinionated, breaks common patterns
    - mnd # magic number detector — extremely noisy, flags obvious constants like HTTP 200
    - iface # interface pollution detector — too opinionated, not mature enough
    - nakedret # naked returns — overlaps with funlen (short functions make naked returns fine)
    - noinlineerr # bans `if err := ...; err != nil {}` — this is idiomatic Go
    - gocognit # cognitive complexity — redundant with gocyclo + nestif
    - cyclop # cyclomatic complexity — redundant with gocyclo
    - goheader # file header enforcement — project-specific policy
    - importas # import alias enforcement — requires per-project configuration
    - funcorder # function ordering — too opinionated for a default
    - godoclint # godoc validation — overlaps with godot and revive
    - varnamelen # variable name length — too opinionated, Go favors short names
    - exhaustruct # all struct fields must be set — extremely noisy, breaks zero-value idiom
    - gochecknoglobals # no global variables — too strict, many valid uses
    - gochecknoinits # no init() functions — too strict, many valid uses
    - unparam # unused function parameters — medium false-positive rate with interfaces
    - makezero # flags make([]T, n) — noisy, often wrong about intent
    - testpackage # forces _test package — valid but too opinionated as a default
    - embeddedstructfieldcheck # embedded type placement — minor style, not worth enforcing
    - iotamixing # iota in mixed const blocks — very rare issue
    - unqueryvet # SELECT * detection — too niche for a default config
    - recvcheck # receiver type consistency — overlaps with gocritic
    - mirror # bytes/strings mirror patterns — very few real hits
    - protogetter # proto field access via getters — only for protobuf users
    - spancheck # OpenTelemetry span checks — only for OTel users
    - zerologlint # zerolog usage — only for zerolog users

  exclusions:
    paths:
      # Generated files (ADR 0013, decision 4): fix their generator or source instead.
      - \.gen\.go$
      - vendor$
      - third_party$
      - testutils$
      - examples$

  settings:
    depguard:
      rules:
        core:
          # The hexagon's core (domain, ports with their fakes, engine) imports nothing outside
          # internal/core: the outside world reaches it only through the ports it declares.
          list-mode: strict
          files: ["**/internal/core/**"]
          allow:
            - $gostd
            - github.com/byFrederick/goal/internal/core
            - github.com/google/uuid
        adapters:
          files: ["**/internal/adapters/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/core/engine
              desc: adapters implement ports; they never call the engine
            - pkg: github.com/byFrederick/goal/internal/config
              desc: adapters move bytes; loading and validating factories is internal/config's job
            - pkg: github.com/byFrederick/goal/internal/api
              desc: adapters implement ports; the HTTP API calls them, never the reverse
        adapters-not-knowledge:
          # Source readers implement ports.SourceReader; the document types and the size limit are
          # the domain's. Their tests may drive a reader through knowledge.Ingestor.
          files: ["**/internal/adapters/**", "!$test"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/knowledge
              desc: adapters implement ports; internal/knowledge calls them, never the reverse
        definitions:
          files: ["**/internal/config/**", "**/internal/definitions/**", "**/internal/factorymodel/**", "**/internal/authoring/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/adapters
              desc: factory definitions reach storage only through ports.ObjectStore
            - pkg: github.com/byFrederick/goal/internal/core/engine
              desc: the engine receives domain types; definitions never call it
            - pkg: github.com/aws
              desc: AWS access belongs in internal/adapters
            - pkg: github.com/jackc/pgx
              desc: database access belongs in internal/adapters/store/postgres
        retention:
          files: ["**/internal/retention/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/adapters
              desc: the purge reaches the database and the bucket only through ports
            - pkg: github.com/byFrederick/goal/internal/core/engine
              desc: the purge is a sibling job of the engine
            - pkg: github.com/byFrederick/goal/internal/api
              desc: the purge is a background job; the HTTP API never calls it
            - pkg: github.com/aws
              desc: AWS access belongs in internal/adapters
            - pkg: github.com/jackc/pgx
              desc: database access belongs in internal/adapters/store/postgres
        authoring:
          files: ["**/internal/authoring/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/definitions
              desc: authoring writes definitions through ports.DefinitionStore; goald's read cache is a sibling
            - pkg: github.com/byFrederick/goal/internal/api
              desc: the HTTP API calls authoring through api.Definitions, never the reverse
            - pkg: github.com/byFrederick/goal/internal/gateway
              desc: the gateway is a sibling HTTP component
        gateway:
          files: ["**/internal/gateway/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/authoring
              desc: the gateway reads published versions; it never edits definitions
            - pkg: github.com/byFrederick/goal/internal/adapters
              desc: the gateway reaches secrets and events through ports and its own interfaces
            - pkg: github.com/byFrederick/goal/internal/core/engine
              desc: the gateway serves tools; it never drives the engine
            - pkg: github.com/aws
              desc: AWS access belongs in internal/adapters
            - pkg: github.com/jackc/pgx
              desc: database access belongs in internal/adapters/store/postgres
        api:
          files: ["**/internal/api/**", "!$test"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/adapters
              desc: the API reaches the store and the engine through its own interfaces; cmd/goald wires adapters
            - pkg: github.com/byFrederick/goal/internal/definitions
              desc: factory definitions arrive through api.Factories; cmd/goald wires the cache
            - pkg: github.com/byFrederick/goal/internal/factorymodel
              desc: handlers reach the factory model through authoring's aliases and api.Definitions; DTOs are generated types
            - pkg: github.com/byFrederick/goal/internal/gateway
              desc: the gateway is a sibling HTTP component, mounted by cmd/goald
            - pkg: github.com/byFrederick/goal/internal/builder
              desc: handlers reach the editor's metadata and the skills catalog through api.Builder, which cmd/goald wires with *builder.Service
            - pkg: github.com/aws
              desc: AWS access belongs in internal/adapters
            - pkg: github.com/jackc/pgx
              desc: database access belongs in internal/adapters/store/postgres
            - pkg: github.com/moby
              desc: container access belongs in internal/adapters/sandboxes/docker
            - pkg: github.com/byFrederick/goal/internal/connkind
              desc: handlers reach connection kinds through an interface declared in internal/api; cmd/goald wires connkind
            - pkg: github.com/byFrederick/goal/internal/knowledge
              desc: handlers reach uploads and search through interfaces declared in internal/api; cmd/goald wires knowledge
        connkind:
          files: ["**/internal/connkind/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/adapters
              desc: connection kinds are data; they are stored through ports.Connections
            - pkg: github.com/byFrederick/goal/internal/core/engine
              desc: the engine receives domain kinds; connkind never calls it
            - pkg: github.com/byFrederick/goal/internal/api
              desc: the HTTP API calls connkind, never the reverse
        knowledge:
          # Indexing and search reach the database, the bucket, the embedding model and the sources
          # through ports only (spec 4 §5.11).
          list-mode: strict
          files: ["**/internal/knowledge/**", "!$test"]
          allow:
            - $gostd
            - github.com/byFrederick/goal/internal/core/domain
            - github.com/byFrederick/goal/internal/core/ports
            - golang.org/x/net/html
        builder:
          files: ["**/internal/builder/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/adapters
              desc: the builder reads the bucket through ports.ObjectStore and skills.sh through ports.SkillSource
            - pkg: github.com/byFrederick/goal/internal/core/engine
              desc: the builder serves the editor; it never drives the engine
            - pkg: github.com/byFrederick/goal/internal/api
              desc: the HTTP API calls the builder through api.Builder, never the reverse
            - pkg: github.com/byFrederick/goal/internal/authoring
              desc: drafts are authoring's; the builder only serves the catalog drafts vendor from
            - pkg: github.com/byFrederick/goal/internal/factorymodel
              desc: the factory model is authoring's
            - pkg: github.com/byFrederick/goal/internal/definitions
              desc: goald's definitions cache is a sibling
            - pkg: github.com/byFrederick/goal/internal/gateway
              desc: the gateway is a sibling HTTP component
            - pkg: github.com/aws
              desc: AWS access belongs in internal/adapters
            - pkg: github.com/jackc/pgx
              desc: database access belongs in internal/adapters/store/postgres
            - pkg: github.com/docker
              desc: container access belongs in internal/adapters/sandboxes/docker
            - pkg: github.com/moby
              desc: container access belongs in internal/adapters/sandboxes/docker
        egress:
          # The proxy is its own small image: cmd/goal-egress/Dockerfile copies internal/egress only.
          list-mode: strict
          files: ["**/internal/egress/**", "**/cmd/goal-egress/**"]
          allow:
            - $gostd
            - github.com/byFrederick/goal/internal/egress
        permgen:
          files: ["**/tools/permgen/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal
              desc: the permission generator reads contracts/api/permissions.yaml and contracts/api/openapi.yaml with the standard library and yaml only (spec 3, §5.4)
        cli:
          # The goal CLI's commands are a leaf: only cmd/goal wires them.
          files: ["**/internal/**", "!**/internal/cli/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/cli
              desc: the goal CLI's commands are wired only by cmd/goal
        sqlc:
          files: ["**/internal/**", "**/cmd/**", "**/tools/**", "!**/internal/adapters/store/postgres/**"]
          deny:
            - pkg: github.com/byFrederick/goal/internal/adapters/store/postgres/db
              desc: the generated queries are private to the postgres adapter; use its Store
    dupl:
      threshold: 100 # lower => stricter (tokens)
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
    gocyclo:
      min-complexity: 13 # strict; lower => stricter
    nolintlint:
      require-explanation: true
      require-specific: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

formatters:
  # formatters are opt-in: only those listed here run. Others are left commented
  # with the reason they stay off (a `disable` block is not valid here and makes
  # `golangci-lint config verify` fail).
  enable:
    - gofumpt # superset of gofmt: applies gofmt's rules first, then its own
    - goimports # import management: adds imports that --fix introduces, drops unused ones
    # - gofmt    # redundant: gofumpt already applies gofmt's rules
    # - gci      # import grouping/ordering — gofumpt already handles standard grouping
    # - golines  # line wrapping — too opinionated, can break readability
    # - swaggo   # swaggo comment formatting — only for swaggo users
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
  exclusions:
    generated: lax
    paths:
      - \.gen\.go$
      - third_party$
      - builtin$
      - examples$

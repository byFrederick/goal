# Every check here is what the pre-push hook (.githooks/pre-push) and CI run. `task check` before
# calling a change done. `task --list` shows every task.
version: "3"

# .env is git-ignored and optional; copy .env.example. Its values reach every task's commands.
dotenv: [".env"]

vars:
  GOLANGCI: '{{.GOLANGCI | default "golangci-lint"}}'
  PG_IMAGE: postgres:18
  OAPI_CODEGEN_VERSION: v2.8.0
  # Working copy of the factory definitions: outside this repository, never committed.
  FACTORIES_DIR: '{{.GOAL_FACTORIES_DIR | default "../goal-factories"}}'
  # Fixtures that `task validate` checks; override to validate a working copy.
  FACTORIES: '{{.FACTORIES | default "internal/config/testdata/*/"}}'
  # The agent images factories name in runtime.image; built locally, never pushed from here.
  WORKER_IMAGE: '{{.WORKER_IMAGE | default "ghcr.io/byfrederick/goal-agent:0.1.0"}}'
  WORKER_DEV_IMAGE: '{{.WORKER_DEV_IMAGE | default "ghcr.io/byfrederick/goal-agent-dev:0.1.0"}}'
  # Where migrate-check gets its throwaway PostgreSQL 18: Docker, or a local cluster where there is
  # no Docker (the dev agent image, in which station checks run, ships the server).
  MIGRATE_WITH:
    sh: command -v docker >/dev/null 2>&1 && echo docker || echo local

# The storage tasks talk to the local RustFS from compose.yaml unless .env or the shell says
# otherwise. For an AWS bucket run bin/goal directly with GOAL_S3_BUCKET and AWS credentials.
env:
  GOAL_S3_BUCKET: '{{.GOAL_S3_BUCKET | default "goal-local"}}'
  GOAL_S3_ENDPOINT: '{{.GOAL_S3_ENDPOINT | default "http://127.0.0.1:9000"}}'
  GOAL_S3_ACCESS_KEY: '{{.GOAL_S3_ACCESS_KEY | default "goal-dev-only"}}'
  GOAL_S3_SECRET_KEY: '{{.GOAL_S3_SECRET_KEY | default "goal-dev-only-secret"}}'
  AWS_REGION: '{{.AWS_REGION | default "us-east-1"}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the web UI, then every binary in cmd/ into bin/ with the UI embedded in goald
    deps: [web:build]
    sources: ["**/*.go", go.mod, go.sum, schema/*.json, web/dist/**/*]
    generates: [bin/goal, bin/goald]
    cmds:
      # -tags webui embeds web/dist; without it goald serves a page saying the UI is not built.
      - go build -trimpath -tags webui -o bin/ ./cmd/...

  up:
    desc: Start PostgreSQL and RustFS, ensure the bucket and run goald in the foreground (goal up)
    deps: [build]
    cmds:
      - bin/goal up

  goald:
    desc: Run goald in the foreground against already running compose services
    deps: [build]
    cmds:
      - bin/goald

  test:
    desc: Unit tests with the race detector
    cmds:
      - go test -race ./...

  test-integration:
    desc: Integration tests against PostgreSQL 18 and RustFS from compose.yaml
    cmds:
      - docker compose up -d --wait postgres rustfs
      - go test -race -tags integration ./...
    env:
      GOAL_TEST_DATABASE_URL: postgres://goal:{{.GOAL_PG_PASSWORD | default "goal-dev-only"}}@localhost:5432/goal?sslmode=disable
      GOAL_TEST_S3_ENDPOINT: http://127.0.0.1:9000

  lint:
    desc: golangci-lint v2 with the repo's rules (.golangci.yml)
    cmds:
      - "{{.GOLANGCI}} run --build-tags integration ./..."

  fmt:
    desc: Format Go code
    cmds:
      - "{{.GOLANGCI}} fmt ./..."

  sqlc:
    desc: Regenerate internal/adapters/postgres/db from queries/ and migrations/ (sqlc from .mise.toml)
    cmds:
      - sqlc generate

  api:gen:
    desc: Regenerate both clients of api/openapi.yaml, the Go server and client (internal/api/gen) and the TypeScript types (packages/api-client)
    deps: [worker:install]
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}} -config internal/api/gen/oapi-codegen.yaml api/openapi.yaml
      - pnpm --filter @goal/api-client run --silent gen

  validate:
    desc: Validate factory definitions (the test fixtures by default; FACTORIES=<glob> for others)
    cmds:
      - go run ./cmd/goal factory validate {{.FACTORIES}}

  tf-check:
    desc: terraform fmt and validate (no AWS calls, no backend)
    dir: terraform
    cmds:
      - terraform fmt -check -recursive
      - terraform init -backend=false -input=false -lockfile=readonly >/dev/null
      - terraform validate

  migrate-check:
    desc: Apply all migrations to a throwaway PostgreSQL 18 (in Docker, or a local cluster without Docker)
    cmds:
      - task: migrate-check:{{.MIGRATE_WITH}}

  migrate-check:docker:
    internal: true
    cmds:
      - docker rm -f goal-migrate-check >/dev/null 2>&1 || true
      - docker run -d --rm --name goal-migrate-check -e POSTGRES_PASSWORD=check -e POSTGRES_DB=goal {{.PG_IMAGE}} >/dev/null
      - defer: docker stop goal-migrate-check >/dev/null
      - until docker exec goal-migrate-check pg_isready -h 127.0.0.1 -U postgres -d goal >/dev/null 2>&1; do sleep 1; done
      - |
        for f in migrations/*.sql; do
          docker exec -i goal-migrate-check psql -U postgres -d goal -v ON_ERROR_STOP=1 -q < "$f" || exit 1
          echo "applied $f"
        done

  migrate-check:local:
    internal: true
    vars:
      PGTMP:
        sh: mktemp -d
    cmds:
      - defer: pg_ctl -D "{{.PGTMP}}/data" -m immediate stop >/dev/null 2>&1; rm -rf "{{.PGTMP}}"
      - postgres --version | grep -q " 18\." || { echo "migrate-check needs PostgreSQL 18 (postgres --version)"; exit 1; }
      - initdb -D "{{.PGTMP}}/data" -U postgres --auth=trust >/dev/null
      - pg_ctl -D "{{.PGTMP}}/data" -l "{{.PGTMP}}/server.log" -o "-k {{.PGTMP}} -c listen_addresses=''" -w start >/dev/null
      - createdb -h "{{.PGTMP}}" -U postgres goal
      - |
        for f in migrations/*.sql; do
          psql -h "{{.PGTMP}}" -U postgres -d goal -v ON_ERROR_STOP=1 -q < "$f" || exit 1
          echo "applied $f"
        done

  check:
    desc: Everything the pre-push hook and CI check except migrations and integration tests
    cmds:
      - task: lint
      - task: test
      - task: worker:check
      - task: api-client:check
      - task: web:check
      - task: validate
      - task: tf-check

  worker:install:
    desc: Install the pnpm workspace's dependencies from the lockfile
    sources: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, worker/package.json, packages/*/package.json]
    cmds:
      - pnpm install --frozen-lockfile

  web:install:
    desc: Install the pnpm workspace's dependencies from the lockfile (web and worker share one)
    sources: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, web/package.json]
    cmds:
      - pnpm install --frozen-lockfile

  web:dev:
    desc: Vite dev server on :5173 proxying /v1 to goald (GOAL_API_URL, default http://127.0.0.1:8080); GOAL_API=mock uses the mock API
    deps: [web:install]
    dir: web
    cmds:
      - pnpm run dev

  web:build:
    desc: Build the web UI into web/dist (embedded into goald by task build)
    deps: [web:install]
    dir: web
    sources: [src/**/*, public/**/*, index.html, vite.config.ts, package.json, ../pnpm-lock.yaml, ../packages/api-client/src/**/*]
    generates: [dist/index.html]
    cmds:
      - pnpm run --silent build

  web:check:
    desc: Web typecheck, Biome lint and Vitest unit tests (no browser)
    deps: [web:install]
    dir: web
    cmds:
      - pnpm run --silent typecheck
      - pnpm run --silent lint
      - pnpm run --silent test

  web:e2e:
    desc: Playwright on the critical flows at 375, 768 and 1440 px with axe, against vite preview and the mock API (Chromium)
    deps: [web:install]
    dir: web
    cmds:
      - pnpm exec playwright install chromium
      - pnpm run --silent e2e

  worker:check:
    desc: Worker typecheck, Biome lint and Vitest unit tests (no image build)
    deps: [worker:install]
    dir: worker
    cmds:
      - pnpm run --silent typecheck
      - pnpm run --silent lint
      - pnpm run --silent test

  api-client:check:
    desc: TypeScript API client typecheck and Vitest unit tests, and its generated types match api/openapi.yaml
    deps: [worker:install]
    dir: packages/api-client
    cmds:
      - pnpm run --silent check:gen
      - pnpm run --silent typecheck
      - pnpm run --silent test

  worker:image:
    desc: Build the agent worker image locally (WORKER_IMAGE); never pushes
    cmds:
      - docker build -f worker/Dockerfile --target runtime -t {{.WORKER_IMAGE}} .

  worker:image-dev:
    desc: Build the dev agent image (WORKER_DEV_IMAGE) with Go, task, golangci-lint, pnpm, Terraform and PostgreSQL 18
    cmds:
      - docker build -f worker/Dockerfile --target dev -t {{.WORKER_DEV_IMAGE}} .

  hooks:install:
    desc: Use the versioned git hooks in .githooks (pre-push runs task check)
    cmds:
      - git config core.hooksPath .githooks

  storage:up:
    desc: Start the local RustFS (S3-compatible) from compose.yaml
    cmds:
      - docker compose up -d --wait rustfs

  storage:init:
    desc: Create the bucket if missing and enable versioning
    deps: [build]
    cmds:
      - bin/goal storage init

  factory:validate:
    desc: Validate every factory in the working copy (GOAL_FACTORIES_DIR)
    cmds:
      - go run ./cmd/goal factory validate {{.FACTORIES_DIR}}/*/

  factory:list:
    desc: List and validate the factories in the bucket
    deps: [build]
    cmds:
      - bin/goal factory list

  factory:push:
    desc: Validate and push factories (DIR=<folder>, default every folder in GOAL_FACTORIES_DIR)
    deps: [build]
    cmds:
      - |
        {{if .DIR}}bin/goal factory push "{{.DIR}}"{{else}}for d in {{.FACTORIES_DIR}}/*/; do bin/goal factory push "$d" || exit 1; done{{end}}

  factory:pull:
    desc: Pull a factory into a new folder (task factory:pull -- <id|name> <dir>)
    deps: [build]
    cmds:
      - bin/goal factory pull {{.CLI_ARGS}}

  clean:
    desc: Remove build output
    cmds:
      - rm -rf bin/

# Every check here is what the pre-push hook (.githooks/pre-push) and CI run. `task check` before
# calling a change done. `task --list` shows every task.
version: "3"

# .env is git-ignored and optional; copy .env.example. Its values reach every task's commands.
dotenv: [".env"]

vars:
  GOLANGCI: '{{.GOLANGCI | default "golangci-lint"}}'
  # compose.yaml's PostgreSQL: 18 with pgvector (the knowledge base, 00054).
  PG_IMAGE: pgvector/pgvector:0.8.7-pg18-trixie
  OAPI_CODEGEN_VERSION: v2.8.0
  # Working copy of the factory definitions: outside this repository, never committed.
  FACTORIES_DIR: '{{.GOAL_FACTORIES_DIR | default "../goal-factories"}}'
  # Fixtures that `task validate` checks; override to validate a working copy.
  FACTORIES: '{{.FACTORIES | default "internal/config/testdata/*/"}}'
  # The one image every run's sandbox starts from (spec 4 §4.1); built locally, never pushed from here.
  WORKER_IMAGE: '{{.WORKER_IMAGE | default "ghcr.io/byfrederick/goal-agent:0.2.0"}}'
  # The auth service's sidecar image (spec 3 §5.5); built locally, never pushed from here.
  AUTH_IMAGE: '{{.AUTH_IMAGE | default "ghcr.io/byfrederick/goal-auth:0.1.0"}}'
  # Where migrate-check gets its throwaway PostgreSQL 18: Docker, or a local cluster where there is
  # no Docker (the dev agent image, in which station checks run, ships the server).
  MIGRATE_WITH:
    sh: command -v docker >/dev/null 2>&1 && echo docker || echo local
  # What goal db init grants and creates before goald migrates (postgres.InitRoles), for migrate-check.
  MIGRATE_GRANTS: >-
    REVOKE TEMPORARY, CONNECT ON DATABASE goal FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE goal TO goal_owner; GRANT CONNECT ON DATABASE goal TO goal_app, goal_auth;
    GRANT USAGE, CREATE ON SCHEMA public TO goal_owner; GRANT USAGE ON SCHEMA public TO goal_app, goal_auth;
    CREATE EXTENSION IF NOT EXISTS vector
  # terraform/'s one workspace and its SOPS file (docs/engineering/cloudflare-operations.md).
  TF_WORKSPACE_NAME: production
  SOPS_FILE: terraform/secrets/production.sops.yaml
  SOPS_DECRYPTED: terraform/secrets/production.decrypted.yaml
  # The data directory of tf:validate, tf:test and tf:lint: inside terraform/.terraform/ (ignored)
  # but apart from the s3 backend that tf:plan saves there, so they never reach for credentials.
  TF_OFFLINE_DATA_DIR: .terraform/offline
  # The environment of every terraform command that reaches the state and the providers (run in
  # terraform/). The state token goes to the s3 backend as AWS_* only here, so no other AWS setting
  # of the shell or .env reaches it. Google gets one access token and nothing else: no application
  # default credentials, no key file, no other account. On a laptop (GITHUB_ACTIONS unset) it is
  # the goal gcloud configuration's, overwriting any GOOGLE_OAUTH_ACCESS_TOKEN of the shell; in
  # GitHub Actions (GITHUB_ACTIONS=true) it is the one the workflow's google-github-actions/auth
  # step exported, a service account's through Workload Identity Federation (terraform/ci.tf).
  TF_ONLINE: |
    set -eu
    export AWS_ACCESS_KEY_ID="$GOAL_TF_STATE_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$GOAL_TF_STATE_SECRET_KEY"
    export AWS_ENDPOINT_URL_S3="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
    unset AWS_PROFILE AWS_SESSION_TOKEN AWS_ENDPOINT_URL TF_WORKSPACE TF_DATA_DIR
    unset GOOGLE_CREDENTIALS GOOGLE_APPLICATION_CREDENTIALS GOOGLE_CLOUD_KEYFILE_JSON GCLOUD_KEYFILE_JSON
    if [ "${GITHUB_ACTIONS:-}" = true ]; then
      : "${GOOGLE_OAUTH_ACCESS_TOKEN:?is not set: run google-github-actions/auth with token_format access_token first}"
    else
      GOOGLE_OAUTH_ACCESS_TOKEN="$(CLOUDSDK_ACTIVE_CONFIG_NAME=goal gcloud auth print-access-token)"
    fi
    export GOOGLE_OAUTH_ACCESS_TOKEN
    terraform init -input=false -lockfile=readonly >/dev/null
    terraform workspace select -or-create "production" >/dev/null
    test "$(terraform workspace show)" = "production"
  # The auth service's own variables (spec 3 §5.6): task auth:dev passes it these and nothing of
  # goald's, as goal up does.
  AUTH_VARIABLES: >-
    PATH HOME GOAL_PUBLIC_URL GOAL_AUTH_GOOGLE GOAL_AUTH_EMAIL GOAL_AUTH_LISTEN GOAL_AUTH_DATABASE_URL GOAL_PG_AUTH_PASSWORD
    BETTER_AUTH_SECRET BETTER_AUTH_SECRETS GOAL_BOOTSTRAP_OWNER_EMAIL GOAL_SMTP_URL GOAL_SMTP_FROM GOAL_SMTP_PLAINTEXT
    GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET NODE_ENV NODE_OPTIONS NODE_EXTRA_CA_CERTS GOAL_AUTH_PROXY_SECRET

# The storage tasks talk to the local RustFS from compose.yaml unless .env or the shell says
# otherwise. For an AWS bucket run bin/goal directly with GOAL_S3_BUCKET and AWS credentials.
env:
  GOAL_S3_BUCKET: '{{.GOAL_S3_BUCKET | default "goal-local"}}'
  GOAL_S3_ENDPOINT: '{{.GOAL_S3_ENDPOINT | default "http://127.0.0.1:9000"}}'
  GOAL_S3_ACCESS_KEY: '{{.GOAL_S3_ACCESS_KEY | default "goal-dev-only"}}'
  GOAL_S3_SECRET_KEY: '{{.GOAL_S3_SECRET_KEY | default "goal-dev-only-secret"}}'
  AWS_REGION: '{{.AWS_REGION | default "us-east-1"}}'
  # The operator's age key for terraform/secrets/ (sops on macOS would look elsewhere by default).
  SOPS_AGE_KEY_FILE: '{{.SOPS_AGE_KEY_FILE | default (print .HOME "/.config/sops/age/keys.txt")}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the web UI, then every binary in cmd/ into bin/ with the UI embedded in goald
    deps: [web:build]
    sources: ["**/*.go", go.mod, go.sum, contracts/definitions/*.json, apps/web/dist/**/*]
    generates: [bin/goal, bin/goald]
    cmds:
      # -tags webui embeds apps/web/dist; without it goald serves a page saying the UI is not built.
      - go build -trimpath -tags webui -o bin/ ./cmd/...

  up:
    desc: Build the agent and egress proxy images, start PostgreSQL, RustFS and the egress proxy, prepare the database roles and the bucket, run goald in the foreground with, under GOAL_AUTH=session, the auth service and Mailpit (goal up)
    deps: [build, auth:build, egress:image, worker:image:build]
    cmds:
      - bin/goal up

  up:compose:
    desc: goal up with goald and the auth service as compose services too (the stack profile; images built from this checkout), detached; needs GOAL_AUTH=session (goal up --compose)
    deps: [build, worker:image:build]
    cmds:
      - bin/goal up --compose

  goald:
    desc: Run goald in the foreground against already running compose services (after goal db init), with the egress proxy toward it and the agent image built
    deps: [build, egress:image, worker:image:build]
    cmds:
      - bin/goal db init
      - docker compose up -d --wait goal-egress
      - bin/goald

  db:init:
    desc: Create the database roles goald runs as and hand the schema to goal_owner (goal db init; goal up runs it)
    deps: [build]
    cmds:
      - bin/goal db init

  test:
    desc: Unit tests with the race detector
    cmds:
      - go test -race ./...

  test-integration:
    # The tests connect as compose's superuser and switch to goal_owner and goal_app per
    # connection (internal/adapters/postgres), so they never touch the roles' passwords.
    desc: Integration tests against PostgreSQL 18, RustFS and Mailpit from compose.yaml (Go, and the auth service's Vitest)
    deps: [worker:install, mailpit:auth]
    cmds:
      # --no-recreate: the tests use the services as they run, never restarting the install's.
      - docker compose up -d --wait --no-recreate postgres rustfs mailpit
      # The test databases a killed run left behind: goal_test_* created over an hour ago, so never
      # one a run in progress still uses, and never the install's own database. An interrupted drop
      # leaves a database invalid (datconnlimit -2) and its files gone: drop it too.
      - |
        docker compose exec -T postgres psql -U goal -d postgres -v ON_ERROR_STOP=1 -qAt <<'SQL'
        SELECT format('DROP DATABASE %I WITH (FORCE)', datname) FROM pg_database
        WHERE datname LIKE 'goal\_test\_%' AND datname <> 'goal'
          AND (datconnlimit = -2
            OR (pg_stat_file('base/' || oid || '/PG_VERSION', true)).modification < now() - interval '1 hour')
        \gexec
        SQL
      - go test -race -tags integration ./...
      - pnpm --filter @goal/auth run --silent test:integration
    env:
      GOAL_TEST_DATABASE_URL: postgres://goal:{{.GOAL_PG_PASSWORD | default "goal-dev-only"}}@localhost:5432/goal?sslmode=disable
      GOAL_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      GOAL_TEST_SMTP_URL: smtp://127.0.0.1:1025
      GOAL_TEST_MAILPIT_URL: http://127.0.0.1:8025

  mailpit:auth:
    internal: true
    desc: Mailpit's password file, which compose.yaml mounts and goal up also creates (user goal, a random password, mode 0600)
    cmds:
      - |
        f="${XDG_CONFIG_HOME:-$HOME/.config}/goal/mailpit-ui-auth"
        if [ ! -s "$f" ]; then
          mkdir -p "$(dirname "$f")"
          touch "$f" && chmod 600 "$f" && printf 'goal:%s\n' "$(openssl rand -hex 24)" > "$f"
        fi

  lint:
    desc: golangci-lint v2 with the repo's rules (.golangci.yml)
    cmds:
      - "{{.GOLANGCI}} run --build-tags integration,e2e,cloudflare ./..."

  fmt:
    desc: Format Go code
    cmds:
      - "{{.GOLANGCI}} fmt ./..."

  sqlc:
    desc: Regenerate internal/adapters/postgres/db from db/queries/ and db/migrations/ (sqlc from .mise.toml)
    cmds:
      - sqlc generate -f db/sqlc.yaml

  api:gen:
    desc: Regenerate from contracts/api/openapi.yaml and contracts/api/permissions.yaml, the permission table (internal/api/permissions_gen.go), the Go server and client (internal/api/gen) and the TypeScript types (packages/api-client)
    deps: [worker:install]
    cmds:
      - go run ./cmd/permgen
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}} -config internal/api/gen/oapi-codegen.yaml contracts/api/openapi.yaml
      - pnpm --filter @goal/api-client run --silent gen

  api:permissions-check:
    desc: The generated permission table matches contracts/api/permissions.yaml and every operation's x-goal-scope (cmd/permgen -check)
    cmds:
      - go run ./cmd/permgen -check

  validate:
    desc: Validate factory definitions offline, without goald (the test fixtures by default; FACTORIES=<glob> for others)
    cmds:
      - go run ./cmd/goal validate {{.FACTORIES}}

  # terraform/: the platform's own infrastructure on Cloudflare, in the production workspace only
  # (docs/engineering/cloudflare-operations.md). tf:check runs offline; tf:plan and tf:apply need
  # credentials (tf:credentials says which): the operator's on a laptop, or a GitHub environment's
  # in a workflow (GITHUB_ACTIONS=true; Google through Workload Identity Federation, ADR 0010).
  # Neither prompts given -input=false and a saved plan:
  #   task tf:plan -- -input=false -out=tfplan && task tf:apply -- -input=false tfplan
  # On merge to main, .github/workflows/terraform-apply.yml runs exactly that (ADR 0010). Agents
  # fmt, check and plan and never run tf:apply; the owner runs it by hand only for the bootstrap
  # and break-glass cases of the runbook (AGENTS.md rule 8).
  tf:fmt:
    desc: Format terraform/ (terraform fmt -recursive)
    dir: terraform
    cmds:
      - terraform fmt -recursive

  tf:validate:
    desc: terraform validate in the production workspace, offline (no backend, no credentials)
    dir: terraform
    env:
      TF_WORKSPACE: "{{.TF_WORKSPACE_NAME}}"
      TF_DATA_DIR: "{{.TF_OFFLINE_DATA_DIR}}"
    cmds:
      - terraform init -backend=false -input=false -lockfile=readonly >/dev/null
      - terraform validate

  tf:lint:
    desc: tflint over terraform/ and its modules (the bundled terraform ruleset, terraform/.tflint.hcl)
    dir: terraform
    env:
      TF_WORKSPACE: "{{.TF_WORKSPACE_NAME}}"
      TF_DATA_DIR: "{{.TF_OFFLINE_DATA_DIR}}"
    cmds:
      - tflint --recursive --config "$PWD/.tflint.hcl"

  tf:test:
    desc: terraform test against mock providers (terraform/tests), offline
    deps: [tf:validate]
    dir: terraform
    env:
      TF_WORKSPACE: "{{.TF_WORKSPACE_NAME}}"
      TF_DATA_DIR: "{{.TF_OFFLINE_DATA_DIR}}"
    cmds:
      - terraform test

  tf:check:
    desc: Everything task check runs on terraform/ (fmt -check, validate, tflint, terraform test), offline
    dir: terraform
    cmds:
      - terraform fmt -check -recursive
      - task: tf:test
      - task: tf:lint

  tf:plan:
    desc: terraform plan of production against its R2 state, changing no infrastructure (extra flags after --)
    cmds:
      - task: tf:run
        vars: { TF_COMMAND: plan }

  tf:apply:
    desc: terraform apply of production (shows the plan and asks, or applies a saved plan; extra flags after --). Run by the apply-on-merge workflow (.github/workflows/terraform-apply.yml); agents never run it, the owner only for bootstrap and break-glass
    interactive: true
    cmds:
      - task: tf:run
        vars: { TF_COMMAND: apply }

  tf:credentials:
    internal: true
    preconditions:
      - sh: test -n "${CLOUDFLARE_API_TOKEN:-}"
        msg: "CLOUDFLARE_API_TOKEN is not set: the Cloudflare API token for terraform/ (scopes in docs/engineering/cloudflare-operations.md)"
      - sh: test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
        msg: "CLOUDFLARE_ACCOUNT_ID is not set: the account whose R2 holds the state bucket goal-terraform-state"
      - sh: test -n "${GOAL_TF_STATE_ACCESS_KEY:-}" && test -n "${GOAL_TF_STATE_SECRET_KEY:-}"
        msg: "GOAL_TF_STATE_ACCESS_KEY and GOAL_TF_STATE_SECRET_KEY are not set: the R2 API token (Object Read & Write) of the state bucket goal-terraform-state"
      - sh: test -n "${PLANETSCALE_SERVICE_TOKEN_ID:-}" && test -n "${PLANETSCALE_SERVICE_TOKEN:-}"
        msg: "PLANETSCALE_SERVICE_TOKEN_ID and PLANETSCALE_SERVICE_TOKEN are not set: the PlanetScale service token for terraform/ (access in docs/engineering/cloudflare-operations.md)"
      - sh: test -r "$SOPS_AGE_KEY_FILE"
        msg: "No age key at $SOPS_AGE_KEY_FILE (SOPS_AGE_KEY_FILE): the operator's key that decrypts terraform/secrets/"
      # Google: a laptop's goal gcloud configuration, or in GitHub Actions the token the workflow exported.
      - sh: |
          if [ "${GITHUB_ACTIONS:-}" = true ]; then
            test -n "${GOOGLE_OAUTH_ACCESS_TOKEN:-}"
          else
            CLOUDSDK_ACTIVE_CONFIG_NAME=goal gcloud auth print-access-token >/dev/null 2>&1
          fi
        msg: "No Google access token. On a laptop, gcloud's goal configuration has no signed-in account: CLOUDSDK_ACTIVE_CONFIG_NAME=goal gcloud auth login. In GitHub Actions, GOOGLE_OAUTH_ACCESS_TOKEN is not set: run google-github-actions/auth with token_format: access_token first"

  tf:run:
    internal: true
    deps: [tf:credentials]
    dir: terraform
    cmds:
      - |
        {{.TF_ONLINE}}
        terraform {{.TF_COMMAND}} {{.CLI_ARGS}}

  secrets:edit:
    desc: Edit terraform/secrets/production.sops.yaml in $EDITOR, decrypted in memory only (sops edit); then git diff it
    cmds:
      - sops edit {{.SOPS_FILE}}

  secrets:decrypt:
    desc: Decrypt the production secrets into terraform/secrets/production.decrypted.yaml (git-ignored, mode 0600) for bulk edits; secrets:encrypt puts them back and deletes it
    cmds:
      - umask 077 && sops decrypt --output {{.SOPS_DECRYPTED}} {{.SOPS_FILE}}

  secrets:encrypt:
    desc: Encrypt terraform/secrets/production.decrypted.yaml over the SOPS file (with its creation rule) and delete the decrypted copy
    preconditions:
      - sh: test -f {{.SOPS_DECRYPTED}}
        msg: "Nothing to encrypt: run task secrets:decrypt first"
    cmds:
      - |
        set -eu
        tmp="terraform/secrets/.production.sops.yaml.tmp"
        trap 'rm -f "$tmp"' EXIT
        sops encrypt --filename-override {{.SOPS_FILE}} --output "$tmp" {{.SOPS_DECRYPTED}}
        mv "$tmp" {{.SOPS_FILE}}
        rm -f {{.SOPS_DECRYPTED}}

  db:production:
    desc: "goal db <command> on the Cloudflare install's database (task db:production -- init): the administrator, goal_owner and the role passwords from the Terraform state, the master keys from the SOPS file, never printed"
    deps: [tf:credentials]
    cmds:
      - |
        cd terraform
        {{.TF_ONLINE}}
        out() { terraform output -raw "$1"; }
        GOAL_DATABASE_ADMIN_URL="$(out goal_database_admin_url)"
        GOAL_MIGRATE_DATABASE_URL="$(out goal_migrate_database_url)" # migrate, rekey, recover-admin, recover-owner
        GOAL_PG_OWNER_PASSWORD="$(out goal_pg_owner_password)"
        GOAL_PG_APP_PASSWORD="$(out goal_pg_app_password)"
        GOAL_PG_AUTH_PASSWORD="$(out goal_pg_auth_password)"
        GOAL_MASTER_KEYS="$(sops decrypt --extract '["master_key"]["GOAL_MASTER_KEYS"]' secrets/{{.TF_WORKSPACE_NAME}}.sops.yaml)" # rekey
        export GOAL_DATABASE_ADMIN_URL GOAL_MIGRATE_DATABASE_URL GOAL_PG_OWNER_PASSWORD GOAL_PG_APP_PASSWORD GOAL_PG_AUTH_PASSWORD GOAL_MASTER_KEYS
        cd ..
        go run ./cmd/goal db {{.CLI_ARGS}}

  migrate-check:
    desc: Apply all migrations to a throwaway PostgreSQL 18 with pgvector (in Docker, or a local cluster without Docker)
    cmds:
      - task: migrate-check:{{.MIGRATE_WITH}}

  migrate-check:docker:
    internal: true
    vars:
      # One container per run, named after the checkout and the shell's process id, so checks run
      # side by side (other worktrees, other clones) never reuse or stop each other's.
      CONTAINER:
        sh: echo "goal-migrate-check-$(basename "$PWD" | tr -c "A-Za-z0-9_.\n-" "-")-$$"
    cmds:
      - docker run -d --rm --label goal.migrate-check=1 --name {{.CONTAINER}} -p 127.0.0.1::5432 -e POSTGRES_PASSWORD=check -e POSTGRES_DB=goal {{.PG_IMAGE}} >/dev/null
      - defer: docker rm -f {{.CONTAINER}} >/dev/null 2>&1 || true
      - until docker exec {{.CONTAINER}} pg_isready -h 127.0.0.1 -U postgres -d goal >/dev/null 2>&1; do sleep 1; done
      # The roles first (as goal db init does), then every migration as goal_owner in one
      # transaction (--single-transaction), as goald runs them with goose.
      - docker exec -i {{.CONTAINER}} psql -U postgres -d goal -v ON_ERROR_STOP=1 -q < internal/adapters/postgres/roles.sql
      - docker exec {{.CONTAINER}} psql -U postgres -d goal -v ON_ERROR_STOP=1 -qc "{{.MIGRATE_GRANTS}}"
      - |
        for f in db/migrations/*.sql; do
          docker exec -i -e PGOPTIONS='-c role=goal_owner' {{.CONTAINER}} psql -U postgres -d goal -v ON_ERROR_STOP=1 -q --single-transaction < "$f" || exit 1
          echo "applied $f"
        done
      - |
        port=$(docker port {{.CONTAINER}} 5432/tcp | head -n 1 | sed 's/.*://')
        "{{.TASK_EXE}}" auth:schema-diff DATABASE_URL="postgres://postgres:check@127.0.0.1:${port}/goal?sslmode=disable&options=-c%20role%3Dgoal_auth"

  migrate-check:local:
    internal: true
    vars:
      PGTMP:
        sh: mktemp -d
    cmds:
      - defer: pg_ctl -D "{{.PGTMP}}/data" -m immediate stop >/dev/null 2>&1; rm -rf "{{.PGTMP}}"
      - postgres --version | grep -q " 18\." || { echo "migrate-check needs PostgreSQL 18 (postgres --version)"; exit 1; }
      - initdb -D "{{.PGTMP}}/data" -U postgres --auth=trust >/dev/null
      - pg_ctl -D "{{.PGTMP}}/data" -l "{{.PGTMP}}/server.log" -o "-k {{.PGTMP}} -c listen_addresses=''" -w start >/dev/null
      - createdb -h "{{.PGTMP}}" -U postgres goal
      - psql -h "{{.PGTMP}}" -U postgres -d goal -v ON_ERROR_STOP=1 -q < internal/adapters/postgres/roles.sql
      - psql -h "{{.PGTMP}}" -U postgres -d goal -v ON_ERROR_STOP=1 -qc "{{.MIGRATE_GRANTS}}"
      - |
        for f in db/migrations/*.sql; do
          PGOPTIONS='-c role=goal_owner' psql -h "{{.PGTMP}}" -U postgres -d goal -v ON_ERROR_STOP=1 -q --single-transaction < "$f" || exit 1
          echo "applied $f"
        done
      - '"{{.TASK_EXE}}" auth:schema-diff DATABASE_URL="postgres://postgres@localhost/goal?host={{.PGTMP}}&options=-c%20role%3Dgoal_auth"'

  layout:check:
    desc: >-
      Check that the AGENTS.md repository map, ADR 0013's layout and the paths: globs of .claude/rules still
      match the tracked files (tools/layoutcheck)
    cmds:
      - go run ./tools/layoutcheck

  check:
    desc: Everything the pre-push hook and CI check except migrations and integration tests
    cmds:
      - task: layout:check
      - task: lint
      - task: test
      - task: api:permissions-check
      - task: worker:check
      - task: auth:check
      - task: api-client:check
      - task: web:check
      - task: cloudflare:check
      - task: validate
      - task: tf:check

  check:changed:
    desc: >-
      The tasks of task check that the parts this branch changed since its merge base with BASE (default origin/main)
      need, committed, staged, unstaged or untracked (cmd/checkplan); shared or unknown files and a missing BASE run
      everything. Not a substitute for the pre-push hook
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    silent: true
    cmds:
      - |
        set -eu
        # An empty plan means nothing needs a check only when checkplan succeeded.
        plan="$(go run ./cmd/checkplan -base '{{.BASE}}')" || { echo "check:changed: checkplan failed" >&2; exit 1; }
        if [ -z "$plan" ]; then
          echo "check:changed: nothing to run" >&2
          exit 0
        fi
        for t in $plan; do
          echo "check:changed: task $t" >&2
          "{{.TASK_EXE}}" "$t"
        done

  worker:install:
    desc: Install the pnpm workspace's dependencies from the lockfile
    sources: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, apps/worker/package.json, apps/auth/package.json, deploy/cloudflare/package.json, packages/*/package.json]
    cmds:
      - pnpm install --frozen-lockfile

  web:install:
    desc: Install the pnpm workspace's dependencies from the lockfile (web and worker share one)
    sources: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, apps/web/package.json]
    cmds:
      - pnpm install --frozen-lockfile

  web:dev:
    desc: Vite dev server on :5173 proxying /v1 to goald (GOAL_API_URL, default http://127.0.0.1:8080); GOAL_API=mock uses the mock API
    deps: [web:install]
    dir: apps/web
    cmds:
      - pnpm run dev

  web:build:
    desc: Build the web UI into apps/web/dist (embedded into goald by task build)
    deps: [web:install]
    dir: apps/web
    sources: [src/**/*, public/**/*, index.html, vite.config.ts, package.json, ../../pnpm-lock.yaml, ../../packages/api-client/src/**/*]
    generates: [dist/index.html]
    cmds:
      - pnpm run --silent build

  web:check:
    desc: Web typecheck, Biome lint, Vitest unit tests (no browser) and pnpm audit of its production dependencies (SECURITY.md)
    deps: [web:install]
    dir: apps/web
    cmds:
      - pnpm run --silent typecheck
      - pnpm run --silent lint
      - pnpm run --silent test
      - pnpm audit --prod --filter @goal/web

  web:e2e:
    desc: Playwright on the critical flows at 375, 768 and 1440 px with axe, against vite preview and the mock API (Chromium)
    deps: [web:install]
    dir: apps/web
    cmds:
      - pnpm exec playwright install chromium
      - pnpm run --silent e2e

  e2e:auth:
    desc: >-
      GOAL_AUTH=session end to end (spec 3 §13): a throwaway goald on 127.0.0.1:18089 with its own
      database and bucket, the auth service on 127.0.0.1:18091 and compose's Mailpit; the bootstrap
      owner signs in with the code Mailpit received, then WEB=1 also runs task web:e2e-auth's
      Playwright flow against it. Never touches the install's goald, database or bucket; needs
      goal db init (the roles) and Docker. Not part of task check
    deps: [build, auth:build, mailpit:auth]
    cmds:
      - go test -tags e2e -count=1 -run E2E -v ./cmd/goald
    env:
      GOAL_TEST_DATABASE_URL: postgres://goal:{{.GOAL_PG_PASSWORD | default "goal-dev-only"}}@localhost:5432/goal?sslmode=disable
      GOAL_E2E_WEB: '{{.WEB | default ""}}'

  web:e2e-auth:
    desc: >-
      Playwright sign-in against a real goald under GOAL_AUTH=session, its identity service and
      Mailpit (start them first; GOAL_E2E_AUTH_URL, GOAL_MAILPIT_URL, GOAL_MAILPIT_AUTH (user:password), GOAL_BOOTSTRAP_OWNER_EMAIL).
      Not part of task check: it needs the running stack
    deps: [web:install]
    dir: apps/web
    cmds:
      - pnpm exec playwright install chromium
      - pnpm exec playwright test --config playwright.auth.config.ts

  worker:check:
    desc: Worker typecheck, Biome lint and Vitest unit tests (no image build)
    deps: [worker:install]
    dir: apps/worker
    cmds:
      - pnpm run --silent typecheck
      - pnpm run --silent lint
      - pnpm run --silent test

  cloudflare:check:
    desc: The control Worker's typecheck, Biome lint and Vitest in the Workers runtime, its containers stand-ins (deploy/cloudflare)
    deps: [worker:install]
    dir: deploy/cloudflare
    cmds:
      - pnpm run --silent typecheck
      - pnpm run --silent lint
      # The deploy's image list and generated config (scripts/images.mjs), without Docker.
      - node --test 'scripts/*.test.mjs'
      # Locally only: no Cloudflare credentials from .env reach the Workers runtime.
      - env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID pnpm run --silent test

  cloudflare:sandboxtest:
    desc: >-
      sandboxtest on the cloudflare adapter against the control Worker's sandbox API in wrangler dev, its boxes local
      Docker containers (PORT, default 18787); locally only, nothing deployed. Not part of task check: it needs Docker
    deps: [worker:install]
    cmds:
      - sh deploy/cloudflare/sandboxtest.sh

  cloudflare:topology:
    desc: >-
      The control Worker in wrangler dev with stand-ins for goald and the auth service: public requests, auth.internal,
      sandbox.internal and gateway.internal, each container's settings (PORT, default 18788); locally only. Not part of
      task check: it needs Docker
    deps: [worker:install]
    cmds:
      - sh deploy/cloudflare/topology.sh

  deploy:production:
    desc: >-
      Deploy production as .github/workflows/deploy.yml does: deploy:worker, then deploy:health. CLOUDFLARE_API_TOKEN is
      the deploy token (docs/engineering/cloudflare-operations.md, Deploys). The owner, or CI from main
    cmds:
      - task: deploy:worker
      - task: deploy:health

  deploy:worker:
    desc: >-
      Production deploy from deploy/cloudflare (scripts/deploy.sh): builds the goald, auth and goal-agent images with
      docker buildx for linux/amd64 (reproducible: SOURCE_DATE_EPOCH from each image's inputs), pushes them to
      Cloudflare's registry and runs wrangler deploy with a generated config pinning their digests
      (wrangler.deploy.jsonc, git-ignored); passes GOAL_BOOTSTRAP_OWNER_EMAIL as a --var when it is set; retries once,
      only when wrangler timed out preparing the container image on Cloudflare's network. GOAL_IMAGE_CACHE=registry or
      gha adds a layer cache (CI); none, the default, locally
    deps: [worker:install]
    dir: deploy/cloudflare
    preconditions:
      - sh: test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
        msg: "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set: the deploy token and the account (docs/engineering/cloudflare-operations.md, Deploys)"
      - sh: docker buildx version >/dev/null 2>&1 && docker info >/dev/null 2>&1
        msg: "Docker with buildx is not running: the deploy builds the container images with it"
    cmds:
      - sh scripts/deploy.sh

  deploy:health:
    desc: >-
      Poll GET /v1/health on the public host until it answers {"status":"ok"}; fails after DEPLOY_HEALTH_TIMEOUT seconds
      (default 300: a cold goald takes about 47 s). DEPLOY_HEALTH_URL overrides the URL
    vars:
      URL: '{{.DEPLOY_HEALTH_URL | default "https://goal.byfrederick.work/v1/health"}}'
      TIMEOUT: '{{.DEPLOY_HEALTH_TIMEOUT | default "300"}}'
    silent: true
    cmds:
      - |
        set -eu
        deadline=$(( $(date +%s) + {{.TIMEOUT}} ))
        while :; do
          status=$(curl -fsS --max-time 20 '{{.URL}}' 2>/dev/null | jq -r '.status' 2>/dev/null || true)
          if [ "$status" = ok ]; then
            echo "deploy:health: {{.URL}} is healthy"
            exit 0
          fi
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "deploy:health: {{.URL}} did not answer {\"status\":\"ok\"} within {{.TIMEOUT}} s" >&2
            exit 1
          fi
          sleep 10
        done

  auth:check:
    desc: Auth service typecheck, Biome lint, Vitest unit tests (no database) and pnpm audit of its production dependencies
    deps: [worker:install]
    dir: apps/auth
    cmds:
      - pnpm run --silent typecheck
      - pnpm run --silent lint
      - pnpm run --silent test
      - pnpm audit --prod --filter @goal/auth

  auth:build:
    desc: Build the auth service into apps/auth/dist (Better Auth on Hono; from 3-9 goal up runs node apps/auth/dist/server.js under GOAL_AUTH=session)
    deps: [worker:install]
    dir: apps/auth
    sources: [src/**/*.ts, package.json, tsconfig.json, tsconfig.build.json, ../../pnpm-lock.yaml]
    generates: [dist/server.js]
    cmds:
      - pnpm run --silent build

  auth:dev:
    desc: Run the auth service from apps/auth/src, rebuilt and restarted on change, with only its own variables from .env, mailing to Mailpit (needs goal db init, goal db migrate and BETTER_AUTH_SECRET)
    deps: [auth:build, mailpit:auth]
    dir: apps/auth
    cmds:
      - docker compose up -d --wait mailpit
      - |
        pnpm exec tsc -p tsconfig.build.json --watch --preserveWatchOutput >/dev/null &
        trap 'kill $! 2>/dev/null' EXIT
        set --
        for v in {{.AUTH_VARIABLES}}; do
          eval "x=\${$v+set}"
          if [ "$x" = set ]; then eval "set -- \"\$@\" \"$v=\${$v}\""; fi
        done
        env -i "$@" node --watch dist/server.js

  auth:schema-check:
    desc: Better Auth's schema drift check, part of migrate-check - auth generate against a scratch database at the goose head must find nothing to change
    cmds:
      - task: migrate-check

  auth:schema-diff:
    desc: Compare Better Auth's schema with the database at DATABASE_URL (a scratch one at the goose head; migrate-check passes it)
    requires:
      vars: [DATABASE_URL]
    deps: [worker:install]
    dir: apps/auth
    vars:
      OUT:
        sh: mktemp -d
    cmds:
      - defer: rm -rf "{{.OUT}}"
      # The pinned CLI writes a migration only when the database differs from apps/auth/src/auth.ts;
      # `auth migrate` is never run.
      - GOAL_AUTH_DATABASE_URL='{{.DATABASE_URL}}' BETTER_AUTH_TELEMETRY=0 pnpm exec auth generate --config src/generate.ts --output "{{.OUT}}/drift.sql" --yes >/dev/null
      - |
        if [ -s "{{.OUT}}/drift.sql" ]; then
          echo "auth:schema-check: Better Auth's schema differs from db/migrations/; add a goose migration (spec 3 §6.2) for:" >&2
          cat "{{.OUT}}/drift.sql" >&2
          echo >&2
          exit 1
        fi
        echo "auth:schema-check: Better Auth's schema matches db/migrations/"

  api-client:check:
    desc: TypeScript API client typecheck and Vitest unit tests, and its generated types match contracts/api/openapi.yaml
    deps: [worker:install]
    dir: packages/api-client
    cmds:
      - pnpm run --silent check:gen
      - pnpm run --silent typecheck
      - pnpm run --silent test

  worker:image:
    desc: Build the goal-agent image locally (WORKER_IMAGE), then smoke it; never pushes
    cmds:
      - docker build -f apps/worker/Dockerfile --target runtime -t {{.WORKER_IMAGE}} .
      - task: worker:smoke

  # Every task that starts goald runs this first: runs start from the image of this checkout's
  # worker, never an older one that drops what the run bundle gained since. A second or so when
  # nothing in the image changed (Docker's layer cache).
  worker:image:build:
    desc: Build the goal-agent image locally (WORKER_IMAGE) without output or the smoke, as task up does; never pushes
    cmds:
      - docker build -q -f apps/worker/Dockerfile --target runtime -t {{.WORKER_IMAGE}} . >/dev/null

  worker:smoke:
    desc: Smoke the goal-agent image (WORKER_IMAGE) - its toolchains run as the sandbox's user, and goal-agent answers
    cmds:
      - >-
        docker run --rm -v "$PWD/.mise.toml:/workspace/.mise.toml:ro" {{.WORKER_IMAGE}} sh -ec 'test "$(id -u)" = 1000; touch /workspace/.w /goal/.w;
        git --version; gh --version | head -1; mise --version; go version; node --version; python --version;
        gcc --version | head -1; postgres --version; initdb -D /tmp/pg >/dev/null 2>&1; echo "initdb: ok";
        cd /workspace; mise install -q npm:pnpm; p=$(mise which pnpm); v=$(python3 -c "import os, sys; os.execv(sys.argv[1], sys.argv[1:])" "$p" --version);
        echo "pnpm from this repository mise.toml, exec without a shell as task does: $v"; cd /;
        ! goal-agent prepare 2>/tmp/err; grep -q "GOAL_GATEWAY_URL is not set" /tmp/err; echo "goal-agent: ok"'

  egress:image:
    desc: Build the egress proxy's image locally (compose.yaml's goal-egress, cmd/goal-egress), the way out of every agent container; never pushes
    cmds:
      - docker compose build -q goal-egress

  goald:image:
    desc: Build goald's image with the web UI embedded locally (compose.yaml's goald, cmd/goald/Dockerfile); never pushes
    cmds:
      - docker compose build goald

  auth:image:
    desc: Build the auth service's sidecar image locally (AUTH_IMAGE); never pushes
    cmds:
      - docker build -f apps/auth/Dockerfile --target runtime -t {{.AUTH_IMAGE}} .

  hooks:install:
    desc: Use the versioned git hooks in .githooks (pre-push runs task check)
    cmds:
      - git config core.hooksPath .githooks

  storage:up:
    desc: Start the local RustFS (S3-compatible) from compose.yaml
    cmds:
      - docker compose up -d --wait rustfs

  storage:init:
    desc: Create the bucket if missing (it needs no versioning)
    deps: [build]
    cmds:
      - bin/goal storage init

  connection:import-env:
    desc: Turn .env's GOAL_GITHUB_TOKEN and CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) into the organization's connections github and claude, once (task connection:import-env -- --org <slug>)
    deps: [build]
    cmds:
      - bin/goal connection import-env {{.CLI_ARGS}}

  factory:validate:
    desc: Validate every factory in the working copy (GOAL_FACTORIES_DIR) through goald
    cmds:
      - go run ./cmd/goal factory validate {{.FACTORIES_DIR}}/*/

  factory:list:
    desc: List the organization's factories in goald and validate their current versions
    deps: [build]
    cmds:
      - bin/goal factory list --validate

  factory:push:
    desc: Push factories into their drafts in goald (DIR=<folder>, default every folder in GOAL_FACTORIES_DIR; task factory:push -- --publish to publish too)
    deps: [build]
    cmds:
      - |
        {{if .DIR}}bin/goal factory push "{{.DIR}}" {{.CLI_ARGS}}{{else}}for d in {{.FACTORIES_DIR}}/*/; do bin/goal factory push "$d" {{.CLI_ARGS}} || exit 1; done{{end}}

  factory:pull:
    desc: Pull a factory from goald into a new folder (task factory:pull -- <id|name> <dir> [--version N|current|draft])
    deps: [build]
    cmds:
      - bin/goal factory pull {{.CLI_ARGS}}

  clean:
    desc: Remove build output
    cmds:
      - rm -rf bin/

# A small registry for envcheck's tests. Kept sorted by name.
variables:
  - name: AUTH_SECRET
    readers: [auth]
    class: secret
    required: true
    meaning: "The auth service's signing secret."
  - name: AUTH_URL
    readers: [auth]
    class: public
    required: false
    meaning: "Where the auth service is reached."
  - name: CF_INDIRECT
    readers: [control-worker]
    class: config
    required: false
    meaning: "A setting the control Worker passes on by a computed key."
    indirect: deploy/cloudflare/src/env.ts
  - name: CF_LOG
    readers: [control-worker]
    class: config
    required: false
    meaning: "The control Worker's log level."
  - name: CF_SECRET
    readers: [control-worker]
    class: secret
    required: true
    meaning: "A Secrets Store binding."
  - name: GOAL_DOCKER_GID
    readers: [compose]
    class: config
    required: false
    meaning: "The docker group's id, for compose."
  - name: GOAL_FACTORIES_DIR
    readers: [taskfile]
    class: config
    required: false
    meaning: "Where the Taskfile finds factories."
  - name: GOAL_LISTEN
    readers: [goald]
    class: config
    required: false
    meaning: "The address goald listens on."
  - name: GOAL_LOOKUP
    readers: [goald]
    class: config
    required: false
    meaning: "A setting read with os.LookupEnv."
  - name: GOAL_MODE
    readers: [goald]
    class: config
    required: false
    meaning: "A setting read through the or closure."
  - name: GOAL_OS
    readers: [goald]
    class: config
    required: false
    meaning: "A setting read with os.Getenv."
  - name: GOAL_SHARED
    readers: [goald]
    class: config
    required: false
    meaning: "A setting an internal package reads."
  - name: GOAL_TOKEN
    readers: [goald]
    class: secret
    required: false
    meaning: "A platform secret named by an env: reference."
  - name: WORKER_DIR
    readers: [worker]
    class: config
    required: false
    meaning: "The worker's directory."
  - name: WORKER_TOKEN
    readers: [worker]
    class: secret
    required: true
    meaning: "The worker's run token."

# sqlc compiles db/queries against db/migrations into internal/adapters/store/postgres/db (`task sqlc`).
# Paths resolve relative to this file.
# The generated code is committed; never edit it by hand. Only the row types queries use are
# generated, so Better Auth's tables in schema auth (read through definer functions) stay out of Go.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: ../internal/adapters/store/postgres/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_batch_file_name: batch.gen.go
        output_copyfrom_file_name: copyfrom.gen.go
        output_files_suffix: .gen
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64

# The generated docs: docs/engineering/change-map.md and docs/adr/README.md (tools/gendocs).
# A branch adds or edits only the entry files and never runs docs:gen: the docs-gen workflow
# (.github/workflows/docs-gen.yml) runs it on main after the merge and commits the two files.
# Included by the root Taskfile.yml with flatten: true and dir set to the repository root, so these
# tasks keep their full names, run from the root and see the root's dotenv, env and vars. Run them
# from the root: `task <name>`.
version: "3"

tasks:
  docs:gen:
    desc: >-
      Regenerate docs/engineering/change-map.md from docs/engineering/change-map/ (its _page.md and one entry file per
      row) and docs/adr/README.md from the ADRs (tools/gendocs). The docs-gen workflow runs it on main; never in a branch
    cmds:
      - go run ./tools/gendocs

  docs:check:
    desc: >-
      Every change-map entry and ADR renders (tools/gendocs -check); it writes nothing and passes when the two generated
      files are stale or missing
    cmds:
      - go run ./tools/gendocs -check

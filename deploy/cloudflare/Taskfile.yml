# The control Worker's checks (its code in apps/control-worker) and the production deploy (deploy/cloudflare:
# wrangler.jsonc and the deploy scripts).
# Included by the root Taskfile.yml with flatten: true and dir set to the repository root, so these
# tasks keep their full names, run from the root (a task's dir: is relative to it) and see the
# root's dotenv, env and vars. Run them from the root: `task <name>`.
version: "3"

tasks:
  cloudflare:check:
    desc: The control Worker's typecheck, Biome lint and Vitest in the Workers runtime, its containers stand-ins (apps/control-worker), and the deploy scripts (deploy/cloudflare/scripts)
    deps: [worker:install]
    dir: apps/control-worker
    cmds:
      - pnpm run --silent typecheck
      - pnpm run --silent lint
      # The deploy scripts, outside this package's Biome config: linted with the shared one.
      - pnpm exec biome check --config-path ../../packages/config/biome.json ../../deploy/cloudflare/scripts
      # The deploy's image list and generated config (scripts/images.mjs), without Docker.
      - node --test '../../deploy/cloudflare/scripts/*.test.mjs'
      # Locally only: no Cloudflare credentials from .env reach the Workers runtime.
      - env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID pnpm run --silent test

  cloudflare:sandboxtest:
    desc: >-
      sandboxtest on the cloudflare adapter against the control Worker's sandbox API in wrangler dev, its boxes local
      Docker containers (PORT, default 18787); locally only, nothing deployed. Not part of task check: it needs Docker
    deps: [worker:install]
    cmds:
      - sh deploy/cloudflare/sandboxtest.sh

  cloudflare:topology:
    desc: >-
      The control Worker in wrangler dev with stand-ins for goald and the auth service: public requests, auth.internal,
      sandbox.internal and gateway.internal, each container's settings (PORT, default 18788); locally only. Not part of
      task check: it needs Docker
    deps: [worker:install]
    cmds:
      - sh deploy/cloudflare/topology.sh

  deploy:production:
    desc: >-
      Deploy production as .github/workflows/deploy.yml does: deploy:worker, then deploy:health. CLOUDFLARE_API_TOKEN is
      the deploy token (docs/engineering/cloudflare-operations.md, Deploys). The owner, or CI from main
    cmds:
      - task: deploy:worker
      - task: deploy:health

  deploy:worker:
    desc: >-
      Production deploy from deploy/cloudflare (scripts/deploy.sh): builds the goald, auth and goal-agent images with
      docker buildx for linux/amd64 (reproducible: SOURCE_DATE_EPOCH from each image's inputs), pushes them to
      Cloudflare's registry and runs wrangler deploy with a generated config pinning their digests
      (wrangler.deploy.jsonc, git-ignored); passes GOAL_BOOTSTRAP_OWNER_EMAIL as a --var when it is set; retries once,
      only when wrangler timed out preparing the container image on Cloudflare's network. GOAL_IMAGE_CACHE=registry or
      gha adds a layer cache (CI); none, the default, locally
    deps: [worker:install]
    dir: deploy/cloudflare
    preconditions:
      - sh: test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
        msg: "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set: the deploy token and the account (docs/engineering/cloudflare-operations.md, Deploys)"
      - sh: docker buildx version >/dev/null 2>&1 && docker info >/dev/null 2>&1
        msg: "Docker with buildx is not running: the deploy builds the container images with it"
    cmds:
      - sh scripts/deploy.sh

  deploy:health:
    desc: >-
      Poll GET /v1/health on the public host until it answers {"status":"ok"}; fails after DEPLOY_HEALTH_TIMEOUT seconds
      (default 300: a cold goald takes about 47 s). DEPLOY_HEALTH_URL overrides the URL
    vars:
      URL: '{{.DEPLOY_HEALTH_URL | default "https://goal.byfrederick.work/v1/health"}}'
      TIMEOUT: '{{.DEPLOY_HEALTH_TIMEOUT | default "300"}}'
    silent: true
    cmds:
      - |
        set -eu
        deadline=$(( $(date +%s) + {{.TIMEOUT}} ))
        while :; do
          status=$(curl -fsS --max-time 20 '{{.URL}}' 2>/dev/null | jq -r '.status' 2>/dev/null || true)
          if [ "$status" = ok ]; then
            echo "deploy:health: {{.URL}} is healthy"
            exit 0
          fi
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "deploy:health: {{.URL}} did not answer {\"status\":\"ok\"} within {{.TIMEOUT}} s" >&2
            exit 1
          fi
          sleep 10
        done

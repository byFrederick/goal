# Starter template (ADR 0042): tickets get drafted answers a person approves.
apiVersion: goal/v1
kind: Factory
metadata:
  id: 00000000-0000-0000-0000-000000000000
  name: support-replies
  title: Support replies
starter:
  item:
    title: How do I reset my password?
    type: ticket
    body: >-
      A customer writes from jo@example.com: "I forgot my password and the reset email never
      arrives. How do I get back into my account?"
spec:
  runtime: {}
  agents:
    - name: triager
      description: Sorts tickets by topic and urgency.
      prompt: ./agents/triager.md
    - name: drafter
      description: Drafts the answer.
      prompt: ./agents/drafter.md
    - name: sender
      description: Sends the approved reply.
      prompt: ./agents/sender.md
  board:
    workTypes: [ticket]
    triggers:
      - name: daily-open-tickets
        enabled: false
        on: schedule
        cron: "0 7 * * 1-5"
        create:
          type: ticket
          station: inbox
          title: Answer the tickets still open from yesterday
    stations:
      - { id: inbox, name: Inbox, kind: queue }
      - { id: triage, name: Triage, kind: agent, agent: triager, wip: 4 }
      - { id: draft, name: Draft, kind: agent, agent: drafter, wip: 2 }
      - { id: approve, name: Approve, kind: human }
      - { id: send, name: Send, kind: agent, agent: sender, wip: 1 }
      - { id: done, name: Done, kind: done }

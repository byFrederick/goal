# gitleaks configuration: the default rules, plus the false positives a scan of the whole history
# finds (docs/engineering/public-readiness.md). Every allowlist names the files and the exact
# fabricated values, so a real secret in the same file is still reported.
# Run: gitleaks git --redact --log-opts=--all --config .gitleaks.toml .

[extend]
useDefault = true

[[allowlists]]
description = "Terraform unit tests: a made-up administrator password of the mocked PlanetScale role"
condition = "AND"
paths = ['''^terraform/tests/[^/]+\.tftest\.hcl$''']
regexes = ['''^"?test-admin"?$''']

[[allowlists]]
description = "Go tests: fabricated keys, tokens and bucket keys that only exist in the test"
condition = "AND"
paths = ['''_test\.go$''']
regexes = [
  '''^(cloud-secret|leased-key)-for-tests-[0-9]+$''',
  '''^glpat-test-token-never-sho(wn)?$''',
  '''^orgs/acme/(knowledge|blobs)/0123$''',
  '''^same-0123456789abcdef0123456789ab$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJhdWQiOiJnb2FsLWdhdGV3YXkifQ\.c2ln$''',
  '''^0b6f1c9e-5d0a-4c39-9a51-6f1f3f0e2a20$''',
]

[[allowlists]]
description = "Vendored skills (skills.sh, skills-lock.json): illustrative values in their examples and do-not-do snippets"
condition = "AND"
paths = ['''^\.claude/skills/''']
regexes = [
  '''^vaswani2017-(arxiv-v1|neurips)$''',
  '''^wJalrXUtnFEMI/K7MDENG$''',
  '''^abc123-xyz789-secret-key$''',
  '''^test-verification-abc123$''',
]

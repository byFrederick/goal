# The one source of Goal's permissions. tools/permgen (task api:gen) generates
# internal/api/permissions.gen.go and apps/auth/src/access.gen.ts; task check fails on drift.
# Every operation of contracts/api/openapi.yaml names one of these in x-goal-scope.
version: 1
org_roles: [owner, admin, member]
factory_roles: [viewer, approver, editor]   # a ladder: each includes the one before
permissions:
  # level: install | org | factory. An install permission is held by every signed-in user,
  # by platform admins only with platform_admin, by keys only with keys. org_roles: who holds
  # it (owners and admins hold every factory permission). factory_role: the lowest factory
  # role holding it. keys: API keys may carry it. fresh: needs a session signed in within 10
  # minutes. better_auth: the Better Auth access-control statements it maps to. pat: personal
  # tokens may carry it (absent: false); tools/permgen refuses it on a fresh, platform_admin or
  # install permission other than authenticated. "High impact" ones are never in a preset of the
  # New token dialog, which warns about them.
  - {name: public,             level: install}                       # no credential needed
  - {name: authenticated,      level: install, keys: true, pat: true} # any valid principal
  - {name: device:read,        level: install}                       # signed-in users, not keys
  - {name: org:create,         level: install}                       # signed-in users, not keys (ADR 0032)
  - {name: platform:read,      level: install, platform_admin: true}
  - {name: platform:manage,    level: install, platform_admin: true, fresh: true}
  - {name: org:read,           level: org, org_roles: [owner, admin, member], keys: true, pat: true}
  - {name: org:manage,         level: org, org_roles: [owner, admin]}
  # Better Auth's own organization update and delete paths are off (spec 3 §8.6): goald renames
  # and deletes organizations. Only owners hold their statements, as Better Auth's owner does.
  - {name: org:delete,         level: org, org_roles: [owner], fresh: true,
     better_auth: {organization: [update, delete]}}
  - {name: org:transfer,       level: org, org_roles: [owner], fresh: true}
  - {name: audit:read,         level: org, org_roles: [owner, admin], keys: true}
  - {name: member:read,        level: org, org_roles: [owner, admin, member]}
  - {name: invitation:read,    level: org, org_roles: [owner, admin]}
  - {name: member:manage,      level: org, org_roles: [owner, admin], fresh: true,
     better_auth: {member: [create, update, delete], invitation: [create, cancel]}}
  - {name: api_key:read,       level: org, org_roles: [owner, admin]}
  - {name: api_key:manage,     level: org, org_roles: [owner, admin], fresh: true}
  # A member's own personal tokens (3-12b): listing and revoking them (read: revoking never waits
  # for a fresh sign-in), creating one (manage: a fresh sign-in, in the browser only).
  - {name: personal_token:read,   level: org, org_roles: [owner, admin, member]}
  - {name: personal_token:manage, level: org, org_roles: [owner, admin, member], fresh: true}
  # The organization's connections (spec 4 §8.1): members read names, kinds and status, never a
  # value; owners and admins change and test them after a recent sign-in, never with a key.
  - {name: connection:read,    level: org, org_roles: [owner, admin, member], keys: true, pat: true}
  - {name: connection:manage,  level: org, org_roles: [owner, admin], fresh: true}
  # The organization's credentials (ADR 0017 decision 10): members, keys and tokens read names and
  # metadata, never a value; owners and admins create, change, replace, delete and import them
  # after a recent sign-in, never with a key.
  - {name: credential:read,    level: org, org_roles: [owner, admin, member], keys: true, pat: true}
  - {name: credential:manage,  level: org, org_roles: [owner, admin], fresh: true}
  # Browsing what a code host connection reaches (its owners and repositories) uses its
  # credential from goald, which connection:read never does; members, keys and tokens may.
  - {name: connection:browse,  level: org, org_roles: [owner, admin, member], keys: true, pat: true}
  # The organization's knowledge base (spec 4 §8.1): members, keys and tokens search and read it;
  # owners, admins and keys add, sync and delete sources and documents.
  - {name: knowledge:read,     level: org, org_roles: [owner, admin, member], keys: true, pat: true}
  - {name: knowledge:manage,   level: org, org_roles: [owner, admin], keys: true}
  - {name: factory:create,     level: org, org_roles: [owner, admin], keys: true, pat: true}   # high impact
  - {name: factory:archive,    level: org, org_roles: [owner, admin], keys: true, pat: true}   # high impact
  - {name: factory:delete,     level: org, org_roles: [owner, admin], keys: true, pat: true}   # high impact
  - {name: factory:read,       level: factory, factory_role: viewer,   keys: true, pat: true}
  - {name: item:create,        level: factory, factory_role: approver, keys: true, pat: true}
  - {name: item:decide,        level: factory, factory_role: approver, keys: true, pat: true}
  - {name: item:operate,       level: factory, factory_role: approver, keys: true, pat: true}
  - {name: andon:manage,       level: factory, factory_role: approver, keys: true, pat: true}
  - {name: definition:edit,    level: factory, factory_role: editor,   keys: true, pat: true}  # high impact
  - {name: definition:publish, level: factory, factory_role: editor,   keys: true, pat: true}  # high impact
  - {name: factory:manage,     level: factory, factory_role: editor,   keys: true}

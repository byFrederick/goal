        that passes these checks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewDraftRequest" }
      responses:
        "201":
          description: The queued request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/requests/{draft_request}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/DraftRequestRef"
    get:
      operationId: getDraftRequest
      x-goal-scope: factory:read
      tags: [definitions]
      summary: One draft request, with its result once it ended

  /v1/orgs/{org}/factories/{factory}/evals:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listEvals
      x-goal-scope: factory:read
      tags: [evals]
      summary: The eval cases of the current version, with their last tries and a summary
      description: >-
        Each case of the current version's evals/cases/, by name, with what checks it, its last 3
        finished tries (newest first) and what it cost in the latest run that ran it. The summary
        counts the cases whose last tries all passed and the share of those tries that passed,
        and names the latest run of the current version's content. A factory never published has
        no cases and no version. 503 evals-unavailable while this goald does not run evals.
      responses:
        "200":
          description: The cases and their summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/evals/runs:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: startEvalRun
      x-goal-scope: definition:edit
      tags: [evals]
      summary: Start an eval run of every case, or of one, on the current version or the draft
      description: >-
        Queues a run (trigger manual) with one try per case and try, priced as estimateEvalRun
        prices it, and answers at once; goald's eval loop works the tries. 400 invalid-request for
        a case name that is not a slug, eval-case-unknown for a case the content does not have and
        for content without cases; 404 version-not-found for a factory never published (on
        current), no-draft for one without a draft (on draft); 503 evals-unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalRunRequest" }
      responses:
        "202":
          description: The queued run and its estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRunStarted" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/evals/estimate:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: estimateEvalRun
      x-goal-scope: factory:read
      tags: [evals]
      summary: What an eval run would cost, about, without starting it
      description: >-
        Each try at the mean cost of its case's last finished tries or, for a case with none, at
        the median cost of its agent's newest finished runs; a case with neither is unpriced. The
        same refusals as startEvalRun.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalRunRequest" }
      responses:
        "200":
          description: The estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalEstimate" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/evals/runs/{eval_run}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/EvalRunRef"
    get:
      operationId: getEvalRun
      x-goal-scope: factory:read
      tags: [evals]
      summary: One eval run with its results by case and try
      description: 404 eval-run-not-found for a run that is not the factory's; 503 evals-unavailable.
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRun" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/evals/runs/{eval_run}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/EvalRunRef"
    post:
      operationId: cancelEvalRun
      x-goal-scope: definition:edit
      tags: [evals]
      summary: Cancel an eval run
      description: >-
        No further try of it starts and a try that is running stops at its next poll. 404
        eval-run-not-found; 409 eval-run-finished for a run that is done, failed or cancelled; 503
        evals-unavailable.
      responses:
        "200":
          description: The cancelled run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRun" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/evals/cases:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: addEvalCase
      x-goal-scope: definition:publish
      tags: [evals]
      summary: Add an eval case from a past run and publish it
      description: >-
        Writes evals/cases/{name}.yaml from the past agent run: its agent, and its item's title,
        body, type and lane as the input, checked by the agent's contract or by judge, with tries
        tries (default 1). The file goes into a new draft of the current version, which publishes
        as the next version through the same checks and eval gate as publishDraft (ADR 0025
        decision 5). 400 invalid-request for a name that is not a slug; 404 run-not-found for a
        run that is not the factory's; 409 eval-case-exists when the current version has the case,
        draft-open when the factory already has a draft (the draft this call opened is
        discarded), and the publish's own conflicts. When the eval gate refuses (evals-pending,
        evals-failing) the draft stays open, so it publishes once its run passes. 503
        evals-unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalCaseFromRun" }
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/items:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"

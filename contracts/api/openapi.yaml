        changes nothing and answers it. Audited as factory.restored.
      responses:
        "200":
          description: The factory, restored and paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/purge:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: purgeFactory
      x-goal-scope: factory:delete
      tags: [definitions]
      summary: Delete an archived, idle factory for good
      description: >-
        Deletes an archived factory none of whose items holds a lease, together with its items,
        runs, events and definition versions; its audit history stays. 409 factory-not-archived
        ("Archive the factory first") for a factory that is not archived, 409 factory-busy ("N
        items are being worked", N the items holding a lease) while runs still work its items.
        Audited as factory.deleted.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getDraft
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The factory's open draft, its changes and problems
      description: 404 no-draft when none is open.
      responses:
        "200":
          description: The draft
          headers:
            ETag:
              description: The draft's revision, quoted ("42"), the If-Match of discardDraft
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: openDraft
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Open the factory's draft, or return the open one
      description: >-
        Opens a draft on base (a published version: a number or current; current when absent).
        An open draft is returned as it is (200), unless base names another version: then 409
        draft-exists, or with replace the open draft is archived and a new one opened (201).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenDraftRequest" }
      responses:
        "201":
          description: A new draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "200":
          description: The draft that was open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: discardDraft
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Discard (archive) the open draft; the version that runs is unchanged
      description: >-
        If-Match is the draft's revision ("42"): without it 428 precondition-required, when the
        draft moved since 412 draft-conflict.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Discarded }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/model:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getDraftModel
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The draft's factory model for the Visual editor
      description: >-
        The model, each section's concurrency token, the fields the draft changed against its base
        (Edited · Undo) and where each model pointer is in factory.yaml. 409 yaml-invalid (with
        parse_error) while factory.yaml does not parse: Visual is read-only until it is fixed in
        YAML mode.
      responses:
        "200":
          description: The draft's model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftModel" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/knowledge-preview:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getDraftKnowledgePreview
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The Knowledge prompt section one agent gets from the draft
      description: >-
        "What agents see" in the editor: the section goald builds for a run of agent, from the same
        code as a run's. It lists the draft's sources that apply to the agent (with station and
        lane and work_type, as a run's appliesTo is matched), each with its entry's readWhen or its
        snapshot's, its file count and top folders, names those with no snapshot as not synced yet,
        and gives memory.yaml's facts. It reads each source's current snapshot, while a run reads
        the snapshot its claim pinned, so a run started earlier may see another. 404 agent-not-found
        for an agent the draft does not declare, 409 yaml-invalid while factory.yaml does not parse
        or satisfy the schema, 404 no-draft.
      parameters:
        - name: agent
          in: query
          required: true
          description: The agent's name, as the draft declares it
          schema: { type: string }
        - name: station
          in: query
          description: The station of the run, for sources whose appliesTo names stations
          schema: { type: string }
        - name: lane
          in: query
          description: The lane of the run, for sources whose appliesTo names lanes
          schema: { type: string }
        - name: work_type
          in: query
          description: The work type of the run, for sources whose appliesTo names work types
          schema: { type: string }
      responses:
        "200":
          description: The agent's Knowledge section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgePreview" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/model/{section}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/SectionRef"
    put:
      operationId: saveDraftSection
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Save one section of the model (a Visual save)
      description: >-
        Applies the section's new value to factory.yaml, keeping everything the section does not
        own (comments and key order included), and writes files and deletes remove_files in the
        same revision (an added agent's prompt). If-Match is the section's etag ("<etag>"): without
        it 428 precondition-required; when the section changed meanwhile 412 draft-conflict with
        the section's current value and etag. Writers of other sections or files never conflict.
        409 yaml-invalid while factory.yaml does not parse; 422 model-invalid for a value of the
        wrong shape; 404 no-draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionSave" }
      responses:
        "200":
          description: The draft after the save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/model/{section}/revert:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/SectionRef"
    post:
      operationId: revertDraftSection
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Put back the base's value at edited fields of a section (Undo)
      description: >-
        pointers are keys of DraftModel.edited in the section; one no longer edited is ignored.
        If-Match is the section's etag, as for a save (428, 412).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevertRequest" }
      responses:
        "200":
          description: The draft after the revert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/files:

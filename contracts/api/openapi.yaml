  /v1/orgs/{org}/factories/{factory}/unarchive:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: restoreFactory
      x-goal-scope: factory:archive
      tags: [definitions]
      summary: Restore an archived factory, still paused
      description: >-
        Undoes archiveFactory: the factory is listed again and stays paused (resumeFactory starts

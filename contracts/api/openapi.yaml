      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/webhooks/{endpoint}/rotate:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/WebhookEndpointRef"
    post:
      operationId: rotateWebhookSecret
      x-goal-scope: webhook:manage
      tags: [webhooks]
      summary: Replace an endpoint's signing secret
      description: >-
        A new signing secret, answered here once and never again; the old one stops opening at
        once, so the sender's requests are refused until it has the new one. 404
        webhook-not-found; 503 webhooks-unavailable while goald has no master key. Needs a sign-in
        from the last 10 minutes.
      responses:
        "200":
          description: The endpoint with its new signing secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhookEndpoint" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/webhooks/{endpoint}/deliveries:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/WebhookEndpointRef"

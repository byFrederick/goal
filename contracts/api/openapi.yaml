# The contract between goald and its clients: the goal CLI (Go client in internal/api/gen) and
# the web UI (TypeScript client in packages/api-client). Change it first, then regenerate both
# (`task api:gen`); the generated code is committed.
#
# Authentication (phase 3): with GOAL_AUTH=session every operation but getHealth and getAuthConfig
# needs a credential, Better Auth's session cookie (goal.session_token, __Secure- prefixed over
# https) or a bearer value (a session token from goal login, or an API key goal_sk_...), and a
# missing, malformed, unknown, expired or revoked one is 401. With GOAL_AUTH=none (one developer's
# laptop, loopback only) every request acts as the one local user. Every route but the install's
# (/v1/health, /v1/auth/config, /v1/me, /v1/platform/*, /v1/orgs) belongs to an organization and lives under
# /v1/orgs/{org}; an unknown or deleted organization, and one the caller is not a member of, is
# 404. Requests that change something from a browser must be same-origin (cross-origin protection).
#
# Every operation names the permission it needs in `x-goal-scope`, one of contracts/api/permissions.yaml
# (phase 3). tools/permgen (`task api:gen`) generates goald's table from both files and `task
# check` fails when an operation lacks a scope, names an unknown one, or the table is stale.
openapi: 3.0.3
info:
  title: Goal API
  version: 0.3.0
  description: >-
    Organizations, their factories, boards and flow metrics, work items, their history, human
    decisions, a realtime stream of an organization's events, and the factory editor's metadata
    and skills catalog.
servers:
  - url: http://127.0.0.1:8080
security:
  - session: []
  - bearer: []
tags:
  - name: orgs
    description: Organizations, the tenant boundary of every factory, item and event
  - name: shell
    description: >-
      What the app's chrome reads about an organization: attention badges, factory overviews and
      the inbox of what waits for a person, over the factories the caller sees. "Waiting on you"
      counts the decisions the caller may make (item:decide); under GOAL_AUTH=none, every one.
  - name: work
    description: >-
      Work on a factory's line: an item's agent runs and, later in phase 2.2, flow metrics, the
      andon and the human controls of items
  - name: builder
    description: >-
      The factory editor's metadata (the install's models, which later phases are wired, the
      skill limits) and the skills catalog, skills.sh skills kept in the bucket at a pinned
      commit so a draft can vendor them
  - name: identity
    description: >-
      Who is signed in and how this install signs people in (spec 3). Signing in, out and
      changing one's name go to the identity service under /api/auth/* (Better Auth's own
      contract, ADR 0007); goald answers the rest.
  - name: connections
    description: >-
      The organization's standing rules (ADR 0031 decision 7): each lets one agent role call one
      tool without asking. Members list them; owners and admins revoke them, after a recent
      sign-in. The organization's connections and connection kinds are gone: what runs reach is
      on /access, and their credentials are secrets (ADR 0037 decision 16).
  - name: credentials
    description: >-
      The organization's credentials (ADR 0017): named secrets sealed under the platform's master
      key, never readable back, that connections refer to as {{name}} and listed agents get as env.
      Members read names and metadata; owners and admins create, change, replace, delete and
      import them, after a recent sign-in. Deprecated: the secrets API replaces these routes (ADR
      0037), and they go away when the web moves to it. They need secret:read and secret:manage.
  - name: secrets
    description: >-
      The organization's secrets (ADR 0037): the only place a value lives, sealed under the
      platform's master key and never readable back. Members, keys and personal tokens read names,
      metadata and where each secret is used (secret:read); owners and admins create, change,
      replace, delete and import them, after a recent sign-in (secret:manage).
  - name: catalog
    description: >-
      The tool templates goald ships (ADR 0037 decision 15), the catalog of Add a tool: what one
      MCP server, command-line tool or API adds to an environment file, its secret slots and its
      optional HTTP test. Any signed-in caller reads them.
  - name: access
    description: >-
      What the organization's agents reach (ADR 0037 decisions 9 and 16): tests of an
      environment's remote MCP servers and of a template, which open secrets inside goald and
      never answer a value, and the Access read model over every factory's published
      environments, their tests and their secrets.
  - name: knowledge
    description: >-
      The organization's knowledge as files (ADR 0038): sources of uploaded files, of a repository
      or of Confluence, kept in sync as snapshots, the files of their current snapshot and how
      often agents read them. Members and keys read it; owners, admins and keys add, sync and
      delete sources and uploads.
  - name: intake
    description: >-
      Where a factory's items come from (ADR 0026): the sources of its newest items and its
      triggers, the rules of the definition's board.triggers that turn events and schedules into
      items, with what they did. Reads only: a trigger is edited in the definition, through the
      draft and publish operations.
  - name: webhooks
    description: >-
      The organization's webhooks (ADR 0040 decisions 12 and 15) and, for one release, a factory's
      webhook endpoints (ADR 0026 decisions 2 and 3). An organization webhook is connected once per
      sender, such as a GitHub organization or PagerDuty, signed by an organization secret named
      by the webhook, and opened to factories, each opening optionally limited to some
      repositories. Owners and admins list and read webhooks (webhook:read) and create, change and
      delete them (webhook:manage, after a recent sign-in, never with a key or a personal token);
      only webhook:manage reads a delivery's headers and body, since an organization webhook
      carries every repository's events. Deliveries are kept 30 days.
  - name: views
    description: >-
      A factory's saved views (ADR 0020 decisions 1 and 2): named sets of the Items page's URL
      search params. A reader of the factory lists its shared views and their own personal ones,
      and manages their own; creating, renaming or deleting a shared view also needs
      factory:manage. Only a signed-in person owns a view, so API keys, personal tokens and
      GOAL_AUTH=none only list, and see the shared views; their writes answer 403
      person-required.
  - name: definitions
    description: >-
      Factory definitions: creating factories, the one shared draft per factory (Visual
      sections, single files and the whole tree, each write under an If-Match precondition),
      validation, publishing, versions, compare, restore and the template catalog
  - name: learning
    description: >-
      Jonah's reviews of sent-back runs (ADR 0034): what it observed, its proposals of definition
      changes, and deciding them. Approve publishes a new version (definition:publish), Edit
      writes the proposal into the draft and Reject records a reason (definition:edit); goald
      answers 503 jonah-unavailable while it serves no Jonah store.
  - name: spend
    description: >-
      What the organization's agent runs cost (agent_runs.cost_usd), over the factories the caller
      sees, with each factory's budget from its current version (runtime.budget). Box compute time
      is not recorded, so it is not counted.
paths:
  /v1/health:
    get:
      operationId: getHealth
      x-goal-scope: public
      security: []
      summary: Liveness of goald
      responses:
        "200":
          description: goald is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/Starting" }
  /v1/auth/config:
    get:
      operationId: getAuthConfig
      x-goal-scope: public
      security: []
      tags: [identity]
      summary: How this install signs people in
      description: >-
        Read by the sign-in page before anyone is signed in, so it reads no credential. Under
        GOAL_AUTH=none sign-in is off: the UI shows no sign-in page and every request acts as the
        local user.
      responses:
        "200":
          description: The sign-in mode and methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /v1/auth/device/{user_code}:
    get:
      operationId: getDeviceRequest
      x-goal-scope: device:read
      tags: [identity]
      summary: A pending CLI sign-in, by the code its terminal shows
      description: >-
        What the Device-Approve page shows before a signed-in person approves `goal login`: the
        client (checked by the identity service: only the Goal CLI), when it asked and until when,
        and the address and user agent it asked from. The page sends the code the person typed,
        never one from a link. Dashes and case are ignored. An unknown, expired, approved or
        denied code is 404 device-code-not-found with one fixed body; so is every code under
        GOAL_AUTH=none, which has no CLI sign-in. Only signed-in people hold device:read, never
        API keys or personal tokens.
      parameters:
        - name: user_code
          in: path
          required: true
          description: The code as typed (ABCD-EFGH or abcdefgh)
          schema: { type: string, maxLength: 32 }
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/catalog:
    get:
      operationId: getCatalog
      x-goal-scope: authenticated
      tags: [catalog]
      summary: The tool templates
      description: >-
        Every template goald ships, by name: its title, description, secret slots with suggested
        secret names, what it adds (tools, env, files and MCP servers with suggested tool modes)
        and its HTTP test, if any. Values are plain or {{slot}} references to its slots.
      responses:
        "200":
          description: The templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolTemplateList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      operationId: getMe
      x-goal-scope: authenticated
      tags: [identity]
      summary: Who the request acts for
      description: >-
        The signed-in person (name, email, platform admin, the session's times) or the API key.
        With a personal token, the person and the token (its name, organization, scopes and
        expiry), never a session or platform admin. Under GOAL_AUTH=none, the local user. Without
        a valid credential, 401 unauthenticated.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/notifications:
    get:
      operationId: getNotificationPreferences
      x-goal-scope: notifications:manage
      tags: [identity]
      summary: The caller's own notification preferences
      description: >-
        Which events the signed-in person is told about on which channel, the email notifications
        go to and the time zone of the daily digest (ADR 0023, decision 1). They hold in every
        organization the person belongs to. A person who never saved any reads the defaults. Only
        a signed-in person has them: an API key, a personal token and GOAL_AUTH=none's local user
        are 403 person-required.
      responses:
        "200":
          description: The preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putNotificationPreferences
      x-goal-scope: notifications:manage
      tags: [identity]
      summary: Replace the caller's own notification preferences
      description: >-
        Replaces every field. An email that is not a plain address (blank is the sign-in email) is
        400 invalid-notification-email; a time zone that is not an IANA name, or Local, is 400
        invalid-time-zone; the digest In Goal is 400 invalid-notification-preferences. Nothing is
        changed then. An API key, a personal token and GOAL_AUTH=none's local user are 403
        person-required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferences" }
      responses:
        "200":
          description: The preferences as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/platform/admins:
    get:
      operationId: listPlatformAdmins
      x-goal-scope: platform:read
      tags: [identity]
      summary: The install's platform admins, earliest first
      description: >-
        Platform admins manage platform admins and, like every signed-in person, create
        organizations; inside an organization they have only the rights of their membership there.
        Platform admins only.
      responses:
        "200":
          description: The platform admins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdminList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addPlatformAdmin
      x-goal-scope: platform:manage
      tags: [identity]
      summary: Make a person a platform admin
      description: >-
        The person is the user with this email (case-insensitive), who must have signed in once
        (404 otherwise; invite them to an organization first). Adding an admin again changes
        nothing. Recorded in the security log as platform_admin.added. Needs a sign-in from the
        last 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPlatformAdmin" }
      responses:
        "201":
          description: The platform admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdmin" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/platform/admins/{user}:
    parameters:
      - $ref: "#/components/parameters/UserRef"
    delete:
      operationId: removePlatformAdmin
      x-goal-scope: platform:manage
      tags: [identity]
      summary: Stop a person being a platform admin
      description: >-
        404 when they are not one. The install keeps at least one platform admin: removing the
        last is 409 with code last-platform-admin and changes nothing (goal db recover-admin adds
        one with database access). Recorded in the security log as platform_admin.removed.
        Needs a sign-in from the last 10 minutes.
      responses:
        "204":
          description: Removed
        default: { $ref: "#/components/responses/Problem" }
  /v1/platform/auth-events:
    get:
      operationId: listAuthEvents
      x-goal-scope: platform:read
      tags: [identity]
      summary: The install's security log, newest first
      description: >-
        Sign-ins, codes sent, suppressed and failed, lockouts, device approvals, platform admin
        changes and recoveries. An email or a user code appears only as its hash (subject);
        events older than 90 days are cleaned up. Platform admins only.
      parameters:
        - name: before
          in: query
          description: The cursor of the next page (next_before); events with a smaller id
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: kind
          in: query
          description: Only events of this kind, as in sign_in.succeeded
          schema: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' }
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEventPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs:
    get:
      operationId: listOrgs
      x-goal-scope: authenticated
      tags: [orgs]
      summary: The caller's organizations, by name
      description: >-
        A person's organizations with their role in each; an API key's own organization. Under
        GOAL_AUTH=none, every organization of the install.
      responses:
        "200":
          description: The organizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createOrg
      x-goal-scope: org:create
      tags: [orgs]
      summary: Create an organization
      description: >-
        The slug is lowercase letters, digits and hyphens (3 to 40), unique across the install and
        not a reserved word (new, settings, api, v1, o, me, orgs, auth, invite, admin, default).
        The mark defaults to the name's initials. A taken or reserved slug, or a malformed field,
        is 409. Any person signed in with a session (in the browser or through the CLI's device
        sign-in) may create one and becomes its owner; API keys and personal tokens may not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewOrg" }
      responses:
        "201":
          description: The organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrg
      x-goal-scope: org:read
      tags: [orgs]
      summary: One organization
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteOrg
      x-goal-scope: org:delete
      tags: [orgs]
      summary: Delete an organization
      description: >-
        The organization disappears at once (every route under it answers 404, as for an unknown
        one) and is purged, with every row it owns and its objects in the bucket, after the
        install's retention (GOAL_ORG_RETENTION, default 7 days). `confirm` must be the
        organization's name exactly; otherwise 409 (code confirmation-mismatch) and nothing
        changes. Audited as org.deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgDeletion" }
      responses:
        "202":
          description: Deleted; the purge is scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDeleted" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/settings:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgSettings
      x-goal-scope: org:read
      tags: [orgs]
      summary: The organization's settings, slot caps included
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettings" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateOrgSettings
      x-goal-scope: org:manage
      tags: [orgs]
      summary: Change the organization's settings
      description: >-
        Every field is optional and changes only what it names, in one transaction audited as
        one org.updated entry (none when nothing changes). A new slug resolves at once and the
        old one is 404. A taken slug is 409 with code slug-taken; a reserved or malformed slug,
        name or mark, or a slot cap outside 1 to 1000, is 409. A factory that is not the
        organization's is 404. Per-factory caps may add up to more than the organization's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSettingsPatch" }
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/settings/signup-domain:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    put:
      operationId: setSignupDomain
      x-goal-scope: org:signup_domain
      tags: [orgs]
      summary: Let anyone with a verified email at a domain sign up and join
      description: >-
        Sets the organization's one sign-up domain (ADR 0023, decision 7). From then on a person
        whose verified sign-in email is exactly at the domain (subdomains not included) may sign
        up without an invitation and joins as a member with join_role on every factory that
        exists then. Only an owner may set it, with a sign-in from the last 10 minutes, and only
        to the domain of their own sign-in email. Audited as org.signup_domain_set; setting what
        is already set changes nothing. A malformed domain or an unknown role is 400; a domain
        the caller's email is not at is 400 signup-domain-not-yours; a public webmail domain is
        400 signup-domain-public; a domain another live organization holds is 409
        signup-domain-taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupDomainInput" }
      responses:
        "200":
          description: The sign-up domain now set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupDomain" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: clearSignupDomain
      x-goal-scope: org:signup_domain
      tags: [orgs]
      summary: Stop sign-up by domain
      description: >-
        Clears the sign-up domain: from then on only invited people sign up. Members who joined
        by the domain stay. Audited as org.signup_domain_cleared; nothing to clear is no change.
        Needs a sign-in from the last 10 minutes.
      responses:
        "204": { description: Cleared }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/code-hosts:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getCodeHosts
      x-goal-scope: org:read
      tags: [orgs]
      summary: The code hosts the organization's repository tokens and knowledge secrets may go to
      description: >-
        The organization's code hosts (ADR 0041, decision 1): github.com and gitlab.com, built in
        and always first, then the GitHub Enterprise and self-managed GitLab hosts its owners
        added, sorted by host. Each host comes with the API base goald derives for it.
      responses:
        "200":
          description: The code hosts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeHosts" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setCodeHosts
      x-goal-scope: org:code_hosts
      tags: [orgs]
      summary: Replace the organization's added code hosts
      description: >-
        Replaces the hosts the organization added with hosts: a host not in the list is removed,
        and a host already added takes the kind sent. Only an owner may set them, with a sign-in
        from the last 10 minutes. A host is a DNS name with no scheme, port or path, reachable
        from the internet, because goald dials public addresses only (ADR 0009): an IP address,
        localhost, a single-label name or a name under .local, .internal or .localhost is 400
        code-host-invalid, as are an unknown kind, a host sent twice and more than 20 hosts.
        github.com and gitlab.com are always listed and never sent: either is 400
        code-host-built-in. Audited as org.code_hosts_set with the hosts before and after;
        sending the hosts already stored changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeHostsInput" }
      responses:
        "200":
          description: The code hosts now listed, the built-in ones first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeHosts" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/settings/notifications:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getNotificationSettings
      x-goal-scope: org:read
      tags: [orgs]
      summary: The organization's notification settings
      description: >-
        The secret whose Slack bot token sends the organization's Slack notifications (ADR 0037),
        by name; null while Slack is off. Never the token itself.
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setNotificationSettings
      x-goal-scope: org:manage
      tags: [orgs]
      summary: Choose the secret that sends the organization's Slack notifications
      description: >-
        Sets slack_secret, or turns Slack off with null. Notifications open the secret without a
        factory, so it must be open to all factories. Audited as org.notifications_updated with
        the secret's name; saving what is already saved changes nothing. A name that is no secret
        is 404 secret-not-found; a secret limited to some factories is 400 secret-not-allowed and
        nothing is saved. While the setting names a secret, deleting that secret is 409
        secret-in-use with a slack use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/settings/notifications/test:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: testNotificationSettings
      x-goal-scope: org:manage
      tags: [orgs]
      summary: Test a Slack bot token without saving it
      description: >-
        Opens the named secret inside goald without a factory (audited as secret.used), so it
        must be open to all factories, and asks Slack (auth.test) whether its token works. Without
        a body, or with slack_secret absent, it tests the saved setting. Nothing is saved. A token
        that fails is an answer, not an error: ok false with a fixed error code. No answer, error
        or problem carries the token. 404 secret-not-found; 400 secret-not-allowed for a secret
        limited to some factories; 503 secrets-unavailable while goald has no master key.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTestRequest" }
      responses:
        "200":
          description: The result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/policy:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgPolicy
      x-goal-scope: org:read
      tags: [orgs]
      summary: The organization's model and tool policy, with the install's models, box sizes and egress addresses
      description: >-
        The policy (ADR 0024) is a ceiling over every factory definition: the default policy of the
        install's models at revision 0 until someone saves one. The answer also carries read-only
        facts computed now from the published definitions the caller sees, never stored: which
        factories and agents use each model and each box size. The ETag is the policy's revision,
        quoted, the If-Match of putOrgPolicy.
      responses:
        "200":
          description: The policy and the facts
          headers:
            ETag:
              description: The policy's revision, quoted ("3"), the If-Match of putOrgPolicy
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgPolicyView" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putOrgPolicy
      x-goal-scope: org:manage
      tags: [orgs]
      summary: Replace the organization's policy
      description: >-
        If-Match is the revision the caller read ("<revision>"); without it 428
        precondition-required, a stale one 409 policy-conflict, which changes nothing. A model that
        is not one of the install's (GOAL_MODELS), a default that is not one of the allowed models,
        a tool setting the default does not take, a blank denied command or a box time limit that
        is not positive is 422 policy-invalid. An MCP tool mode cap with a mode other than allow,
        ask or off, or a pattern that is not a tool name or glob, is 400; a body without
        mcp_tool_modes keeps the stored cap. Audited as one org_policy.updated entry.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgPolicyInput" }
      responses:
        "200":
          description: The policy after the save, at its next revision
          headers:
            ETag:
              description: The policy's new revision, quoted
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgPolicyView" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/audit:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listAudit
      x-goal-scope: audit:read
      tags: [orgs]
      summary: The organization's audit log, newest first
      parameters:
        - name: before
          in: query
          description: The cursor of the next page (next_before); entries with a smaller id
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: action
          in: query
          description: Only entries of this action, as in org.updated
          schema: { type: string }
        - name: target_kind
          in: query
          schema: { type: string }
        - name: target_id
          in: query
          schema: { type: string }
        - name: factory
          in: query
          description: Only entries about this factory (its metadata.id or metadata.name)
          schema: { type: string }
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/api-keys:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listAPIKeys
      x-goal-scope: api_key:read
      tags: [identity]
      summary: The organization's API keys
      description: >-
        Live keys and those revoked in the last 30 days, live ones first, newest first. A key is
        shown by its hint (goal_sk_ and the secret's first four characters); its secret is never
        shown again after it was created.
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAPIKey
      x-goal-scope: api_key:manage
      tags: [identity]
      summary: Create an API key
      description: >-
        An API key is the organization's service account for scripts and CI: it acts with its
        scopes, at most as its role ceiling on each factory it reaches (all of them, or the ones
        named), until it expires (1 to 90 days, default 90) or is revoked. Each scope must be a
        permission keys may carry (never people, keys, ownership, the organization's settings or
        deletion, or the platform) and held by the creator now, and a factory scope must be held by
        the ceiling; otherwise 400 scope-not-allowed. A live key's name is unique in the
        organization, case ignored (409 api-key-name-taken). The answer carries the secret, once,
        with Cache-Control no-store: goald keeps only its hash. Needs a sign-in from the last 10
        minutes. Audited as api_key.created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewApiKey" }
      responses:
        "201":
          description: The key and its secret, shown this once
          headers:
            Cache-Control:
              required: true
              description: no-store, so no cache keeps the secret
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiKey" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/api-keys/{key}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: key
        in: path
        required: true
        description: The key's id
        schema: { type: string }
    delete:
      operationId: revokeAPIKey
      x-goal-scope: api_key:manage
      tags: [identity]
      summary: Revoke an API key
      description: >-
        The key stops working on its next request, and the streams it holds end. Revoking a revoked
        key changes nothing; an unknown key is 404. Needs a sign-in from the last 10 minutes.
        Audited as api_key.revoked.
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/members:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listMembers
      x-goal-scope: member:read
      tags: [identity]
      summary: The organization's members, by name
      description: >-
        Each member with their organization role, their factory roles (on the factories the
        caller sees), when they joined and were last active, and what the caller may change about
        them. Inviting, changing an organization role and removing go to the identity service
        (/api/auth/organization/*, Better Auth's contract), whose owner rules apply; can_change_role
        and can_remove say in advance what it would refuse.
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listInvitations
      x-goal-scope: invitation:read
      tags: [identity]
      summary: The organization's pending invitations, oldest first
      description: Expired, accepted, declined and cancelled invitations are left out.
      responses:
        "200":
          description: The pending invitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/members/{user}/factory-roles/{factory}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/UserRef"
      - $ref: "#/components/parameters/FactoryRef"
    put:
      operationId: setFactoryRole
      x-goal-scope: member:manage
      tags: [identity]
      summary: Give a member a role on a factory
      description: >-
        Replaces the member's role on the factory; applies at once (their next request and their
        open streams) and is audited as factory_role.granted or factory_role.changed. 404 when the
        user is not a member or the factory not one of the organization's; 409 editor-everywhere
        for an owner or an admin, who hold every factory role by their organization role. Needs a
        sign-in from the last 10 minutes (403 reauth-required).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryRoleChange" }
      responses:
        "200":
          description: The member's role on the factory now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryRoleGrant" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeFactoryRole
      x-goal-scope: member:manage
      tags: [identity]
      summary: Take a member's role on a factory away
      description: >-
        The member no longer sees the factory (unless they are an owner or an admin). Audited as
        factory_role.removed; nothing to remove is no change. Needs a sign-in from the last 10
        minutes.
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/transfer:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: transferOwnership
      x-goal-scope: org:transfer
      tags: [identity]
      summary: Hand the organization to an admin
      description: >-
        One atomic change: the admin `to` becomes an owner and the caller an admin, audited as
        org.ownership_transferred. `confirm` must be the organization's name exactly (409
        confirmation-mismatch); `to` must be an admin (409 not-an-admin). Owners only, with a
        sign-in from the last 10 minutes. Answers the organization as the caller now sees it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: The organization, the caller now its admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/personal-tokens:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listPersonalTokens
      x-goal-scope: personal_token:read
      tags: [identity]
      summary: Your personal tokens in the organization
      description: >-
        The caller's own live tokens in the organization and those revoked in the last 30 days,
        live ones first, newest first, each by its hint (goal_pat_ and the secret's first four
        characters). Never another member's, and never a secret. Under GOAL_AUTH=none, none.
      responses:
        "200":
          description: The tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalTokenList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPersonalToken
      x-goal-scope: personal_token:manage
      tags: [identity]
      summary: Create a personal token
      description: >-
        A personal token lets the CLI or a script act as you in this organization, with no more
        than its scopes and your role at each request allow, until it expires (1 to 90 days,
        default 30) or is revoked; removing you from the organization deletes it. Each scope must be
        a permission tokens may carry and held by you now (an org permission by your role, a
        factory permission on at least one factory), else 400 scope-not-allowed. A live token's
        name is unique among yours, case ignored (409 personal-token-name-taken). Created in the
        browser only, with a sign-in from the last 10 minutes: a CLI session, an API key or a
        token gets 403 (browser-session-required for a CLI session). The answer carries the secret,
        once, with Cache-Control no-store: goald keeps only its hash. Audited as
        personal_token.created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPersonalToken" }
      responses:
        "201":
          description: The token and its secret, shown this once
          headers:
            Cache-Control:
              required: true
              description: no-store, so no cache keeps the secret
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedPersonalToken" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/personal-tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: token
        in: path
        required: true
        description: The token's id
        schema: { type: string }
    delete:
      operationId: revokePersonalToken
      x-goal-scope: personal_token:read
      tags: [identity]
      summary: Revoke one of your personal tokens
      description: >-
        The token stops working on its next request, and the streams it holds end. Only your own:
        another member's token is 404, as an unknown one. No recent sign-in needed, so a leaked
        token is revoked at once. Revoking a revoked token changes nothing. Audited as
        personal_token.revoked.
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/member-tokens:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listMemberTokens
      x-goal-scope: api_key:read
      tags: [identity]
      summary: Every member's personal tokens in the organization
      description: >-
        For owners and admins: every member's live tokens and those revoked in the last 30 days,
        with their owner, live ones first, newest first. Never a secret.
      responses:
        "200":
          description: The tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalTokenList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/member-tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: token
        in: path
        required: true
        description: The token's id
        schema: { type: string }
    delete:
      operationId: revokeMemberToken
      x-goal-scope: api_key:manage
      tags: [identity]
      summary: Revoke a member's personal token
      description: >-
        The token stops working on its next request, and the streams it holds end. Revoking a
        revoked token changes nothing; an unknown one is 404. Needs a sign-in from the last 10
        minutes. Audited as personal_token.revoked.
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/attention:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgAttention
      x-goal-scope: org:read
      tags: [shell]
      summary: What each factory of the organization needs from people now, for the rail's badges
      description: >-
        One cheap read, meant to be refetched on every stream event: per factory, the items
        waiting for a person, the blocked items and the open andon pull, ordered by factory name.
        Factories with nothing pending are listed with zeros.
      responses:
        "200":
          description: The organization's attention counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgAttention" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/search:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: searchOrg
      x-goal-scope: org:read
      tags: [shell]
      summary: Find the organization's items, agents, factories and secrets, for the shell's search box
      description: >-
        One read per keystroke. Each group holds up to limit results, best first: an exact match,
        then a prefix, then the rest. Items match by title (a case-insensitive substring, taken
        literally, so % and _ are not wildcards) or by their exact number ("147" or "#147"), which
        ranks first. Only the factories the caller sees are searched. Secrets are searched only
        for a caller who holds secret:read; for anyone else the group is empty.
      parameters:
        - name: q
          in: query
          required: true
          description: What to find, 1 to 200 characters once trimmed; anything else is a 400 problem
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          description: How many results each group holds at most
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: The results, by group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSearch" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/overview:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getFactoryOverview
      x-goal-scope: org:read
      tags: [shell]
      summary: Every factory of the organization summarized for the Factories home, ordered by name
      parameters:
        - name: window
          in: query
          description: >-
            The last N UTC calendar days, today included, written Nd (1d to 90d), as for metrics.
            The previous window, which deltas compare against, has the same length and ends where
            this one starts.
          schema: { type: string, pattern: "^[1-9][0-9]?d$", default: 7d }
      responses:
        "200":
          description: The factories' overviews and the organization's totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryOverviewList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/spend:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgSpend
      x-goal-scope: org:read
      tags: [spend]
      summary: What the organization's agent runs cost, and each factory's budget, for the Spend and billing screen
      description: >-
        A run counts on the UTC day it started, with its cost so far (a running run counts). Only
        the factories the caller sees are shown and summed. When a factory the caller does not see
        spent since the start of last month or of the weekly series, complete is false and the
        figures the store does not split by factory (this_month_usd, last_month_usd, by_model,
        merged, cost_per_merged_usd, weekly, rework_usd and rework_share) are null or empty, so
        they never show what a hidden factory spent. A window outside the enum is a 400 problem.
      parameters:
        - name: window
          in: query
          description: >-
            week starts on Monday 00:00 UTC, month on the 1st 00:00 UTC, 90d at 00:00 UTC 89 days
            before today; each ends now
          schema: { $ref: "#/components/schemas/SpendWindow" }
      responses:
        "200":
          description: The organization's spend over the window and its factories' budgets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSpend" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/spend/export:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: exportSpend
      x-goal-scope: org:read
      tags: [spend]
      summary: The organization's spend over a window as CSV, one row per factory, agent and model
      description: >-
        The CSV export of getOrgSpend (ADR 0020, decision 3): the runs that started in the
        window's [since, until) in the factories the caller sees, summed by factory, agent and
        model and ordered by factory id, agent and model. The header row is factory, agent, model,
        cost_usd; factory is the factory's metadata.name and cost_usd is decimal USD. The body is
        streamed. More than 100000 rows is a 413 problem export-too-large, answered before any
        byte of the body; every error before the first row is a problem, and one after it ends
        the stream early. A window outside the enum is a 400 problem.
      parameters:
        - name: window
          in: query
          description: As for getOrgSpend
          schema: { $ref: "#/components/schemas/SpendWindow" }
      responses:
        "200":
          description: The spend rows as CSV
          headers:
            Content-Disposition:
              description: attachment; filename="spend-<yyyy-mm-dd>.csv", the UTC day of the export
              required: true
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/metrics/touches:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getOrgTouchMetrics
      x-goal-scope: org:read
      tags: [work]
      summary: Human touches per finished item across the factories the caller may read
      description: >-
        A touch is one action by a person on an item: its events with the same person and the same time (one transition) count once; API keys, agents and the engine never touch, and the submission (created) is not one. Planned touches are decisions the line requires (an approval or merge at a human station); every other touch is unplanned. Over a range of UTC days as for getMetrics: the items finished
        (done) in the range, the organization's total and each factory the caller may read, in
        name order. 400 for a bad range.
      parameters:
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: The organization's touch metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgTouchMetrics" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/inbox:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getInbox
      x-goal-scope: org:read
      tags: [shell]
      summary: What waits for a person across the organization's factories
      description: >-
        The organization's inbox: one entry per thing a person may act on. Phase 2.2 has no
        identity, so every entry is everyone's. decision: an item waiting for a person's decision,
        with its approval brief; question: an item whose agent asked a person a question (ADR
        0018), with the question, answered through POST /v1/orgs/{org}/items/{item}/answer; andon: a factory's open andon pull, its line stopped;
        budget: a factory whose weekly budget is used up, its line starting no new agent work until
        the rolling window's spend falls below the cap (resumes_at) or the cap rises, which removes
        the entry at once; rework_warning: a gate one rejection away from its andon policy's rework rate (display
        only); blocked: a blocked item, with why; expedite: an open item in the expedite lane that
        waits on nothing else. An item has at most one entry (question, then decision, then blocked,
        then expedite). Decisions and questions are listed only where the caller has item:decide. Later phases add kinds (tool_approval, sync_failed, proposal), which clients
        that do not know them render as a generic row. When more entries exist than limit, the
        most recent ones are kept and truncated is true. Entries are ordered by since, newest first,
        then by id, whatever their kind. The default limit, 200, is
        enough for every screen to count what it groups (the Floor's Needs you card, the phone's
        Items view).
      parameters:
        - name: factory
          in: query
          description: Only this factory's entries (its metadata.id or metadata.name); unknown is 404
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: The inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listFactories
      x-goal-scope: org:read
      tags: [definitions]
      summary: The organization's factories, published or not
      description: >-
        Every factory of the organization by name, with its current version, its open draft and
        whether it is paused. stations and work_types are those of the version goald runs (empty
        for a factory never published). Archived factories are left out unless archived is true,
        which lists only the archived ones.
      parameters:
        - name: archived
          in: query
          required: false
          description: true lists only the archived factories; absent or false, only the others
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Factories ordered by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createFactory
      x-goal-scope: factory:create
      tags: [definitions]
      summary: Create a factory with its first draft
      description: >-
        Starts blank (the catalog's blank template, or a skeleton naming no station or agent), from
        a catalog template, as a clone of another factory's version (same organization; items, runs
        and history are not copied) or from imported files. factory.yaml's metadata.id becomes a
        new id (kept only with keep_id), and metadata.name and title the request's, edited in place
        so comments survive. The factory runs nothing until its draft is published. Errors: 409
        name-taken, factory-exists (an import keeping a taken id); 404 template-not-found,
        factory-not-found (the clone's source); 422 import-invalid (no factory.yaml that parses),
        bad-path; 413 too-large; 400 invalid-request (no name).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewFactoryRequest" }
      responses:
        "201":
          description: The factory, with its first draft
          headers:
            Location:
              description: The factory's address (getFactory)
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getFactory
      x-goal-scope: factory:read
      tags: [definitions]
      summary: One factory, published or not
      responses:
        "200":
          description: The factory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteFactory
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Delete a factory that was never published, with its draft (the wizard's Cancel)
      description: >-
        409 factory-published once a version was published: a published factory is archived
        (archiveFactory) and then deleted for good (purgeFactory).
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/pause:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: pauseFactory

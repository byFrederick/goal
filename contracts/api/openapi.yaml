              schema: { $ref: "#/components/schemas/FileList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/files/{path}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/FilePath"
    get:
      operationId: getDraftFile
      x-goal-scope: factory:read
      tags: [definitions]
      summary: One file of the draft, as stored
      description: 404 file-not-found. The ETag is the file's sha256, the If-Match of putDraftFile and deleteDraftFile.
      responses:
        "200":
          description: The file's content
          headers:
            ETag:
              description: The file's sha256, quoted
              required: true
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putDraftFile
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Write one file of the draft exactly as sent (YAML mode)
      description: >-
        If-Match is the sha256 the editor read ("<sha256>"); If-None-Match * creates a file that
        must not exist yet. Exactly one of them: neither is 428 precondition-required, both 400. A
        stale hash, or If-None-Match on a file that exists, is 412 draft-conflict with the file's
        current sha256 (absent when it is gone). 422 bad-path; 413 too-large (over 1 MiB).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The draft after the save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDraftFile
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Delete one file of the draft
      description: If-Match is the file's sha256 (428 without it, 412 when stale); 404 file-not-found.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The draft after the delete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/tree:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    put:
      operationId: replaceDraftTree
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Make files the draft's whole tree (goal factory push)
      description: >-
        With expected_revision, a draft at another revision is 412 draft-conflict; without it the
        latest draft is replaced. 422 bad-path; 413 too-large (over 1,000 files or 16 MiB).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftTree" }
      responses:
        "200":
          description: The draft after the save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/validate:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: validateDraft
      x-goal-scope: definition:edit
      tags: [definitions]
      summary: Validate the draft at its revision, as publish will
      description: >-
        overlay is unsaved YAML-mode text written over the draft's files; station_moves are the
        moves the publish will carry, so the items they map are not reported.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateDraftRequest" }
      responses:
        "200":
          description: The validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validation" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/publish:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: publishDraft
      x-goal-scope: definition:publish
      tags: [definitions]
      summary: Publish the open draft as the factory's next version
      description: >-
        One transaction: the draft becomes version N+1, the factory runs it, and the open items of
        stations it removes move by station_moves. Runs in progress finish on the version they
        started on; every later step uses the new one. Errors: 412 draft-conflict (the draft is no
        longer at revision); 409 draft-base-moved (the current version is not
        expected_current_version_id), definition-invalid (with problems), items-at-removed-station
        (with items) and name-taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/kept-tests:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: startDraftKeptTests
      x-goal-scope: definition:publish
      tags: [learning]
      summary: Start the kept tests the open draft reaches (ADR 0039 decision 12)
      description: >-
        The publish dialog calls this when it opens. Goal finds the stations the draft reaches
        (the agent stations whose agent gets something different) and queues one try of each
        kept test there, on the current version with the draft's files. A test that has a try of
        exactly the draft's content already, from a tried proposal or an earlier publish, reuses
        it and queues nothing, so calling this again starts nothing new. Tries of a publish are
        claimed before a proposal's, and still wait while an item waits at an agent station or
        Jonah's budget is used up. A failing test warns and never blocks a publish:
        publishDraft does not read these results. A test that can't be tried (its station's
        agent needs MCP servers or secrets, the draft deletes a file, or Jonah is off) is
        answered with result error and why. 404 no-draft when no draft is open.
      responses:
        "200":
          description: The kept tests the draft reaches, with their results so far
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftKeptTests" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: getDraftKeptTests
      x-goal-scope: factory:read
      tags: [learning]
      summary: Read the open draft's kept tests and their results
      description: >-
        The same answer as startDraftKeptTests, and it starts nothing: a test not yet started has
        result null. 404 no-draft when no draft is open.
      responses:
        "200":
          description: The kept tests the draft reaches, with their results so far
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftKeptTests" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/draft/requests:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listDraftRequests
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The factory's draft requests, newest first
      description: >-
        The asked definition changes of the factory (ADR 0021), newest first, at most limit of
        them.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The draft requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftRequestList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDraftRequest

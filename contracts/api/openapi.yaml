  /v1/orgs/{org}/factories/{factory}/archive:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: archiveFactory
      x-goal-scope: factory:archive
      tags: [definitions]
      summary: Archive a paused, idle factory
      description: >-
        Retires a factory no longer used without deleting its history: it stays readable, its
        items stay where they are, and listFactories leaves it out unless archived is true. Only a
        paused factory none of whose items is being worked is archived: 409 factory-running
        ("Pause the factory first") for a running one, 409 factory-busy ("N items are being
        worked", N the items holding a lease) while runs still work its items. Idempotent:
        archiving an archived factory changes nothing and answers it. Audited as
        factory.archived.
      responses:
        "200":
          description: The factory, archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }

  /v1/orgs/{org}/factories/{factory}/compare:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: compareVersions
      x-goal-scope: factory:read
      tags: [definitions]
      summary: The semantic difference between two versions
      description: >-
        from and to are version selectors (a number, current, draft, base or source); by default
        the draft against its base, or its starting tree when it has none. Line-level hunks are
        computed by the client from the two files.
      parameters:
        - name: from
          in: query
          schema: { type: string, default: base }
        - name: to
          in: query
          schema: { type: string, default: draft }
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/templates:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listTemplates
      x-goal-scope: org:read
      tags: [definitions]
      summary: The template catalog, the latest version of each template by name
      responses:
        "200":
          description: The templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/templates/{name}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: name
        in: path
        required: true
        description: The template's name
        schema: { type: string }
    get:
      operationId: getTemplate
      x-goal-scope: org:read
      tags: [definitions]
      summary: One version of a template with a preview of its model
      description: 404 template-not-found.
      parameters:
        - name: version
          in: query
          description: The template's version; the latest when absent
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/definitions/validate:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: validateDefinition
      x-goal-scope: org:read
      tags: [definitions]
      summary: Validate files that belong to no factory yet (Import YAML preview, CLI validate)
      description: 413 too-large; 422 bad-path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefinitionFiles" }
      responses:
        "200":
          description: The validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validation" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/definitions/format:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: formatDefinition
      x-goal-scope: org:read
      tags: [definitions]
      summary: Format a factory.yaml the way Visual saves write changed lines (Format)
      description: 422 yaml-invalid (with parse_error) when it does not parse.
      requestBody:
        required: true
        content:
          text/yaml:
            schema: { type: string }
      responses:
        "200":
          description: The formatted factory.yaml
          content:
            text/yaml:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/items:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listItems
      x-goal-scope: factory:read
      summary: One page of a factory's items, newest first
      parameters:
        - name: state
          in: query
          description: Only items in this state
          schema: { $ref: "#/components/schemas/ItemState" }
        - name: station
          in: query
          description: Only items at this station
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: after
          in: query
          description: The next_after of the previous page; items listed after it (numbered below it)
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Items, highest number first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: submitItem
      x-goal-scope: item:create
      summary: Submit a work item to a factory's first station
      description: >-
        With start, the item waits at the first station until it may start (ADR 0040): its at has
        passed and its after items are done. in becomes at when the item is filed, and each open
        after item becomes a linked dependency by the caller; a done one is met and left out.
        repositories name the repositories it works on (ADR 0041 decision 4); none gives it the
        factory's default entry's. Problems: 400 for what the line does not take, a start with
        both at and in, a bad time or wait, a start more than 365 days ahead, an after item that
        is cancelled, unknown or of another factory, a repository that matches none of the
        factory's runtime.repositories entries, names an owner's entry or is on more than one of
        its hosts (each problem quotes the value given), or more than 10 repositories.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewItem" }
      responses:
        "201":
          description: The item, waiting at the first station
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/board:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getBoard
      x-goal-scope: factory:read
      summary: The factory's board, station by station in line order
      description: >-
        Every open item (up to 500, newest first) at its station, and the 20 newest done items at
        the done station. waiting and in_progress count every item, beyond the cards shown. The
        constraint is the agent station with the most work per slot right now,
        (waiting + in_progress) / min(agents, wip), or null when no agent station has any work;
        later phases replace this heuristic with constraint detection over time. Each station
        carries its statistics: the busy share and send-back share over the window, the queue's
        trend over the last 24 hours, how long the oldest waiting item has waited and, at the done
        station, the items done today (UTC).
      parameters:
        - name: window
          in: query
          description: >-
            The window of the busy and send-back shares: the last N UTC calendar days, today
            included, written Nd (1d to 90d).
          schema: { type: string, pattern: "^[1-9][0-9]?d$", default: 7d }
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/activity:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listFactoryActivity
      x-goal-scope: factory:read
      tags: [work]
      summary: The factory's latest milestone events, newest first
      description: >-
        The latest events of the factory's items, newest first (by at, then id), each with its
        item's ref, number and title. Only these kinds are listed: created, moved, gate_approved,
        gate_rejected, approved, rejected, blocked, check_failed, merged, done, assembled and
        cancelled; a run's per-turn events (tool_call, tool_result, agent_message, usage and the
        others) never are. data is the stored event data, as listItemEvents returns it. There is
        no paging past the limit. 400 for a limit outside 1 to 50, 404 for an unknown factory.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: The factory's latest milestone events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/metrics:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getMetrics
      x-goal-scope: factory:read
      tags: [work]
      summary: The factory's flow over a range of UTC days
      description: >-
        Items count when they reached done in the range; spend counts agent runs started in it;
        wip is the line now. The range is from to to, both included, at most 90 days, to not after
        today; without one it is the last 7 days. 400 for a bad range, both a
        window and a range, or a type the factory does not declare.
      parameters:
        - name: window
          in: query
          description: >-
            The last N UTC calendar days, today included, written Nd (1d to 90d); kept for the
            CLI. Not together with from or to.
          schema: { type: string, pattern: "^[1-9][0-9]?d$" }
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
        - $ref: "#/components/parameters/WorkTypeFilter"
        - name: compare
          in: query
          description: previous adds the same metrics over the range of the same length just before
          schema: { type: string, enum: [previous] }
      responses:
        "200":
          description: Flow metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/metrics/weekly:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getWeeklyThroughput
      x-goal-scope: factory:read
      tags: [work]
      summary: Items finished in each of the last weeks
      description: >-
        Seven-day buckets ending on `to` (included), oldest first. 400 for a
        `to` after today, weeks outside 1 to 26 or a type the factory does not declare.
      parameters:
        - name: to
          in: query
          description: The last UTC day of the last week; today when absent
          schema: { type: string, format: date }
        - name: weeks
          in: query
          schema: { type: integer, minimum: 1, maximum: 26, default: 12 }
        - $ref: "#/components/parameters/WorkTypeFilter"
      responses:
        "200":
          description: Throughput by week
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyThroughput" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/constraint:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getConstraintReport
      x-goal-scope: factory:read
      tags: [work]
      summary: The constraint over a range of UTC days, with the top candidates
      description: >-
        The agent stations ranked by how busy their slots were over the range (lease time over
        slots × the range, measured from the factory's first lease when that is later), with the
        time-weighted number of items waiting, the mean wait and service, and an estimate of the
        wait one more slot would save. The constraint is the configured one, else the busiest
        candidate, else the snapshot of the loads now. 400 for a bad range.
      parameters:
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: The constraint report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstraintReport" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/intake:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getIntake
      x-goal-scope: intake:read
      tags: [intake]
      summary: The factory's newest items, its origins and its triggers
      description: >-
        How many of the factory's newest `items` items (by creation) there are, with the UTC days
        the oldest and the newest of them were created, and every trigger of the current definition
        in definition order, each with the items it created on each of the last 7 UTC days and
        its problem, if it has one, and the disabled ones again as suggestions. Clients re-read it
        on `item` and `definition` stream events.
        It also answers, for the screens of ADR 0040 (decision 22): the items created in the
        `window` by origin, counted from one grouped read of the factory's items and no read of
        webhook deliveries; the items that haven't started; the open triage item and the items
        whose follow-ups will join it; and the organization's webhooks open to the factory.
        Triggers are edited through the definition's draft and publish operations. 400 for items
        outside 1 to 500 and for a window other than 7d, 30d or 90d.
      parameters:
        - name: items
          in: query
          required: false
          description: How many of the newest items `items`, `from` and `to` count (default 48)
          schema: { type: integer, minimum: 1, maximum: 500, default: 48 }
        - name: window
          in: query
          required: false
          description: The days origins count over, ending now (default 30d)
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
      responses:
        "200":
          description: The factory's intake
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intake" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/intake/triggers/{trigger}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - name: trigger
        in: path
        required: true
        description: The trigger's name in the current definition
        schema: { type: string }
    get:
      operationId: getIntakeTrigger
      x-goal-scope: intake:read
      tags: [intake]
      summary: One trigger with this week's results and its recent events
      description: >-
        The trigger as getIntake shows it, what the items it created in the weekly budget's
        window (the last 7×24 hours) came to, its 20 newest events, and for a check trigger its
        memory: the open items and closed keys its checks are given and the state they saved
        (ADR 0040 decision 19). Clients re-read it on
        `item` and `definition` stream events. 404 trigger-not-found for a name the current
        definition does not have.
      responses:
        "200":
          description: The trigger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeTriggerDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/intake/triggers/{trigger}/try:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - name: trigger
        in: path
        required: true
        description: The trigger's name in the current definition
        schema: { type: string }
    post:
      operationId: tryIntakeTrigger
      x-goal-scope: trigger:try
      tags: [intake]
      summary: Try the trigger with one of its past events, creating nothing
      description: >-
        A dry run (ADR 0028 decision 2): the trigger, as the current definition saves it,
        evaluates the event of one of its 20 newest events (getIntakeTrigger's events, by id) now,
        as intake would, and answers each step. It creates no item, records no event and changes
        no limit; it writes a trigger.tried audit entry. A firing keeps no event's fields, so a
        schedule's event is rebuilt from its instant and a delivery's from the body its webhook
        still keeps (30 days), read only from a webhook open to the factory (ADR 0040 decision
        18). 404 trigger-not-found for a name the current definition does not have; 404
        firing-not-found for an id that is not one of its 20 newest events; 422 event-not-stored
        for a missed event, or a delivery whose body is no longer kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerTryRequest" }
      responses:
        "200":
          description: What the trigger would do with the event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerTry" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/intake/triggers/{trigger}/checks:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - name: trigger
        in: path
        required: true
        description: The trigger's name in the current definition
        schema: { type: string }
    get:
      operationId: listTriggerChecks
      x-goal-scope: intake:read
      tags: [intake]
      summary: The trigger's checks, newest first, with what each filed, noted and skipped
      description: >-
        A check trigger's checks (ADR 0040 decision 19), tries among them, newest first: when each
        fired and finished, where it is, what it cost, why it failed, and for a done check what
        goald applied of its answer: the items it filed, the notes it wrote on open items and what
        it skipped, each with the reason (a closed key, the limit, a note too soon or repeated, or
        the agent's own). A try's lists are what it would have done. Clients re-read it on `item`
        and `definition` stream events. 404 trigger-not-found for a name the current definition
        does not have.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many checks to list (default 20)
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The trigger's checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerCheckList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: tryTriggerCheck
      x-goal-scope: trigger:try
      tags: [intake]
      summary: Try the trigger's check now, filing, noting and saving nothing
      description: >-
        Queues a try check (ADR 0040 decision 19): it runs as the trigger's checks do, with its
        agent, brief, spend and time limits, and spends from the factory's budget, but its finish
        keeps only what it would file, note and skip; it files no item, writes no note, keeps no
        key, saves no state and counts toward no limit. Read the result with listTriggerChecks.
        Writes a trigger.tried audit entry. 404 trigger-not-found for a name the current
        definition does not have; 409 still-checking while the trigger's check is queued or
        running; 422 no-check for a trigger without check.
      responses:
        "202":
          description: The try check, queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerCheck" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/intake/triggers/{trigger}/state:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - name: trigger
        in: path
        required: true
        description: The trigger's name in the current definition
        schema: { type: string }
    delete:
      operationId: clearTriggerState
      x-goal-scope: definition:edit
      tags: [intake]
      summary: Clear the state a check trigger saved, so its next check starts with none
      description: >-
        Clear on a check's page (ADR 0040 decision 19): deletes the state the trigger's last done
        check saved (getIntakeTrigger's memory.state), so its next check is given none. The
        trigger's keys stay: a key whose item closed is still not filed again. Clearing a trigger
        with no saved state answers 204 too. Writes a trigger.state_cleared audit entry. 404
        trigger-not-found for a name the current definition does not have; 409 still-checking
        while the trigger's check is queued or running, because it would save its state again
        when it finishes; 422 no-check for a trigger without check.
      responses:
        "204": { description: Cleared }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/metrics/lead-time:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getLeadTimeBridge
      x-goal-scope: factory:read
      tags: [work]
      summary: Why the p85 lead time is over its target, over a range of UTC days
      description: >-
        The items done in the range (as for getMetrics) split into slow (over the definition's
        lead-time target) and fast; each kind of time an item spends (waiting at a station, ci:
        held at a station waiting for CI on the item's commits, which waiting does not count,
        rework sent back by a station, waiting on a person, blocked, working) gets the share of the gap
        between the actual p85 and the target that its excess over the fast items explains. Steps
        under 3% of the gap are merged into other; the steps sum to the gap. 400 for a bad range
        or a type the factory does not declare.
      parameters:
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
        - $ref: "#/components/parameters/WorkTypeFilter"
      responses:
        "200":
          description: The lead-time bridge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadTimeBridge" }
  /v1/orgs/{org}/factories/{factory}/metrics/touches:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getTouchMetrics
      x-goal-scope: factory:read
      tags: [work]
      summary: Human touches per finished item of the line, over a range of UTC days
      description: >-
        A touch is one action by a person on an item: its events with the same person and the same time (one transition) count once; API keys, agents and the engine never touch, and the submission (created) is not one. Planned touches are decisions the line requires (an approval or merge at a human station); every other touch is unplanned. The items count when they reached done in the range (as for
        getMetrics); an item counts for the definition version of its last agent run. weekly is
        the same headline in each of the `weeks` seven-day weeks ending on `to`. 400 for a bad
        range, weeks outside 1 to 26, a type the factory does not declare or a version that is no
        number nor current; 404 for a version the factory never published.
      parameters:
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
        - $ref: "#/components/parameters/WorkTypeFilter"
        - name: weeks
          in: query
          schema: { type: integer, minimum: 1, maximum: 26, default: 12 }
        - name: version
          in: query
          description: Only the items whose last agent run ran on this version, by number (12) or current
          schema: { type: string }
      responses:
        "200":
          description: The line's touch metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TouchMetrics" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/agents/{agent}/stats:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - name: agent
        in: path
        required: true
        description: The agent's name, as the factory's definition declares it
        schema: { type: string }
    get:
      operationId: getAgentStats
      x-goal-scope: factory:read
      tags: [work]
      summary: One agent's work over a range of UTC days
      description: >-
        Tasks are the agent's leases that ended in the range with a finished outcome (advanced,
        rejected, escalated); sent back is the share of the advanced ones whose item another
        station later sent back for rework, grouped by the rejection's category or else its
        reason; runs (spend, median turns, denied tool calls) are those started in the range. The
        range is from to to, both included, at most 90 days, to not after today; without one it is
        the last 7 days. 400 for a bad range, 404 agent-not-found for an agent the factory does not
        declare.
      parameters:
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: The agent's statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStats" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/agents/{agent}/model-proposal:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - name: agent
        in: path
        required: true
        description: The agent's name, as the factory's current version declares it
        schema: { type: string }
    post:
      operationId: proposeAgentModel
      x-goal-scope: definition:edit
      tags: [learning]
      summary: Try another model for an agent, as a proposal (ADR 0039 decision 13)
      description: >-
        Estimates first: with confirm false (the default) it answers 200 with the estimate and
        stores nothing. The estimate names the agent's five newest finished items (done items
        whose first run of a claim by the agent is at a station of the current version that can
        be tried), how each went on the line, the tries (three per item), their cost (each item's
        original run's cost × 3) and what is left of Jonah's budget (learning.jonah.share of the
        line's spend over the last 7 days, less Jonah's). With confirm true it answers 201 with the
        estimate and the proposal: an ordinary proposal against the current version whose one
        edit is a replacement in factory.yaml that changes the agent's model, with three queued
        tries per item at the item's station and run on the new model, superseding the open
        proposals it overlaps. Approve, edit and reject then work on it as on any proposal. 422
        model-not-allowed for a model the organization's policy does not allow or the agent's
        model already; agent-not-triable for an agent that needs MCP servers or secrets;
        no-finished-items when the agent has no finished item to try; 409
        learning-budget-exhausted, with the estimate, when the tries cost more than what is left
        of Jonah's budget; 404 agent-not-found, version-not-found before the first publish; 503
        jonah-unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelProposalRequest" }
      responses:
        "200":
          description: The estimate; nothing is stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProposalResult" }
        "201":
          description: The estimate and the stored proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProposalResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getJonahOverview
      x-goal-scope: factory:read
      tags: [learning]
      summary: What Jonah noticed this week, its policy, its proposals waiting and its cost
      description: >-
        The policy is the current version's learning.jonah (its defaults where it sets none) with
        the roles that may approve a proposal (those holding definition:publish). waiting counts
        the proposals still proposed; month_cost_usd is what the factory's jonah runs cost since
        the first of this UTC month; observations are those made since Monday 00:00 UTC, newest
        first; last_review is the newest review, absent before the first. 503 jonah-unavailable.
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JonahOverview" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/proposals:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listProposals
      x-goal-scope: factory:read
      tags: [learning]
      summary: The factory's proposals, newest (highest number) first
      parameters:
        - name: state
          in: query
          description: Only proposals in this state
          schema: { $ref: "#/components/schemas/ProposalState" }
        - name: after
          in: query
          description: The keyset of the next page; only proposals numbered below it (next of the page before)
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: One page of proposals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/proposals/{number}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/ProposalNumber"
    get:
      operationId: getProposal
      x-goal-scope: factory:read
      tags: [learning]
      summary: One proposal with its files, its evidence and the versions it moves between
      description: >-
        Each file has its content in the version the proposal was made against (empty for a new
        file) and its new content; the client renders the diff. 404 proposal-not-found.
      responses:
        "200":
          description: The proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/proposals/{number}/approve:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/ProposalNumber"
    post:
      operationId: approveProposal
      x-goal-scope: definition:publish
      tags: [learning]
      summary: Publish the proposal as a new version, as the caller (ADR 0034 decision 7)
      description: >-
        Applies the proposal's edits again to the current version's files (ADR 0039 decision 6),
        opens a draft from the current version, writes the results and publishes it through the
        usual validation and gates. An unrelated change to an edited file since the review does
        not stop it. 409 draft-open when the factory already has an open draft (it is left
        untouched); proposal-stale when an edit no longer applies, because a replacement's old
        text no longer occurs exactly once in its file (no draft is left); proposal-decided when it is no longer proposed; the
        publish's own refusals (definition-invalid). 404 proposal-not-found.
      responses:
        "200":
          description: The decided proposal and the version it published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalDecided" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/proposals/{number}/edit:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/ProposalNumber"
    post:
      operationId: editProposal
      x-goal-scope: definition:edit
      tags: [learning]
      summary: Apply the proposal's edits to the draft, opening one if none is open (decision 8)
      description: >-
        Applies the proposal's edits again to the draft's copy of each file and sets the
        proposal applied; the caller continues in the builder. 409 draft-conflict when an edit no
        longer applies to the draft's copy, because a replacement's old text no longer occurs
        exactly once (nothing is written); proposal-decided
        when it is no longer proposed. 404 proposal-not-found.
      responses:
        "200":
          description: The decided proposal and the draft's revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalDecided" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/proposals/{number}/reject:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/ProposalNumber"
    post:
      operationId: rejectProposal
      x-goal-scope: definition:edit
      tags: [learning]
      summary: Reject the proposal with a reason, which later reviews read (decision 9)
      description: >-
        400 invalid-request for a missing or blank reason or one over 2000 characters; 409
        proposal-decided when it is no longer proposed. 404 proposal-not-found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalReject" }
      responses:
        "200":
          description: The decided proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalDecided" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/proposals/{number}/undo:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/ProposalNumber"
    post:
      operationId: undoProposal
      x-goal-scope: definition:edit
      tags: [learning]
      summary: Write Undo this change, a proposal that reverses the published proposal (ADR 0039 decision 15)
      description: >-
        Works out the replacements the proposal's publish made, from each file in the version it
        was made against and its published content, and reverses them against the current
        version, whatever has published since. A file the proposal added is left. The new
        proposal is proposed, with undoes set, and publishes only when a person approves it. 409
        proposal-not-published when the proposal was never published; undo-conflict, naming the
        file, when a reversed replacement's text no longer occurs exactly once; undo-open while
        an undo of the proposal is proposed, published or applied. 404 proposal-not-found.
      responses:
        "201":
          description: The undo proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/proposals/{number}/try:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/ProposalNumber"
    post:
      operationId: tryJonahProposal
      x-goal-scope: definition:edit
      tags: [learning]
      summary: Try again, adding tries to an open proposal (ADR 0039 decision 11)
      description: >-
        Adds one more try per item the proposal was tried on, or three per item for a model
        proposal (Try another model). Each new try reruns the same run of the item at the same
        station on the same model, and is queued like the proposal's first tries. Estimates
        first: with confirm false (the default) it answers 200 with the estimate and queues
        nothing. The estimate prices each new try at its item's original run's cost and says what
        is left of Jonah's budget (learning.jonah.share of the line's spend over the last 7 days,
        less Jonah's). With confirm true it answers 201 with the estimate and the proposal, whose
        tried lists the new attempts after the earlier ones. 409 learning-budget-exhausted, with
        try_estimate, when the tries cost more than what is left of Jonah's budget;
        proposal-decided for a proposal that is not proposed; proposal-not-tried when the proposal
        has no tries yet (Jonah queues its first ones); proposal-stale when its edits no longer
        apply. 422 proposal-not-triable for a proposal that changes no station that can be tried,
        as a memory-only or flow-only one. 404 proposal-not-found; 503 jonah-unavailable.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TryProposalRequest" }
      responses:
        "200":
          description: The estimate; nothing is queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TryProposalResult" }
        "201":
          description: The estimate and the proposal with its new tries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TryProposalResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/tests:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listKeptTests
      x-goal-scope: factory:read
      tags: [learning]
      summary: List the factory's kept tests (ADR 0039 decision 12)
      description: >-
        A kept test is a past item a person kept, at a station it passed the first time, as a
        test the item must keep passing there. A failing kept test warns at publish and never
        blocks one. Ordered by station in the current line's order (a station no longer in the
        line last), then newest first.
      responses:
        "200":
          description: The factory's kept tests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeptTestList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: keepTest
      x-goal-scope: definition:edit
      tags: [learning]
      summary: Keep a past item as a test at a station it passed the first time
      description: >-
        The item passed the station the first time when it was claimed there once, no gate
        rejected it there, and it then moved on, and its first run there finished with its
        commit recorded. Problems: 404 item-not-found for an unknown item number; 400
        invalid-request for a station that is not an agent station of the current line; 409
        not-passed-first-time when the item did not pass the station the first time; 409
        kept-test-exists when the item is kept at that station already.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeepTestRequest" }
      responses:
        "201":
          description: The kept test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeptTest" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/tests/{test}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/KeptTestRef"
    delete:
      operationId: removeKeptTest
      x-goal-scope: definition:edit
      tags: [learning]
      summary: Remove a kept test
      description: The item stays; only the test goes. 404 kept-test-not-found for an unknown test or one of another factory.
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/jonah/reviews:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: queueJonahReview
      x-goal-scope: definition:edit
      tags: [learning]
      summary: Queue a manual review of the factory at once ("Look for improvements now")
      description: >-
        The review reads what finished since the last done review's window ended (30 days back
        before the first) on the current version; goald's review loop runs it, retrying a failed
        run twice. 409 review-in-flight while a review is pending or running;
        learning-budget-exhausted while Jonah's runs over the last 7 days cost its budget or more:
        learning.jonah.share (default 5%) of what the line's other runs cost over those 7 days, so
        a line that spent nothing has none. 404 version-not-found before the first publish.
      responses:
        "202":
          description: The queued review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JonahReview" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/andon:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: getAndon
      x-goal-scope: factory:read
      tags: [work]
      summary: The factory's andon cord, its recent pulls and the tallies of its gates
      parameters:
        - name: limit
          in: query
          description: How many recent pulls to list, the most recent first
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: The andon state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AndonState" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: pullAndon
      x-goal-scope: andon:manage
      tags: [work]
      summary: Pull the andon cord, stopping the factory's line
      description: >-
        While the pull is open goald releases nothing from the line's queue stations and claims
        nothing at its agent stations; runs in progress finish and move on, items can still be
        submitted and every human decision still acts. The request's actor pulls it (the local
        user in phase 2.2). A line that is already stopped is 409 andon-pulled; a reason that is
        blank or over 500 characters is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAndonPull" }
      responses:
        "201":
          description: The open pull
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AndonPull" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/andon/clear:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: clearAndon
      x-goal-scope: andon:manage
      tags: [work]
      summary: Clear the andon cord, restarting the factory's line
      description: >-
        Clears the open pull with an optional note (at most 2000 characters). A line that is also
        paused, or over its weekly budget, stays stopped by that. A line that is not stopped is
        409 andon-not-pulled.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AndonClear" }
      responses:
        "200":
          description: The pull, cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AndonPull" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/environments/{environment}/test:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - name: environment
        in: path
        required: true
        description: The environment's name, its file environments/<name>.yaml
        schema: { type: string }
    post:
      operationId: testEnvironment
      x-goal-scope: definition:edit
      tags: [access]
      summary: Test an environment's MCP servers or a template
      description: >-
        Tests the environment of the draft (of the current version while no draft is open), or of
        the version the body names (draft, current or a number). Each MCP server, or only the one
        server names, is called with tools/list within 10 seconds, its headers' or env's {{secret}}
        references opened inside goald for the factory (audited as secret.used without a run): a
        remote one through public addresses only, following no redirect; a stdio one started in
        goald with only its env, a fixed PATH and an empty HOME. goald starts a stdio server only
        when its command is exactly one the tool catalog ships and every URL in its env is on a
        code host the organization lists; any other answers tested false with why, and nothing is
        opened. With template, the template's MCP servers and HTTP test run instead, with the secrets the body puts in its slots and its
        plain env values changed by env. Each server's result is kept per factory, environment
        and server, and read by GET /v1/orgs/{org}/access. A test that fails is an answer, not an
        error; its error is scrubbed of every value the test opened. 404 environment-not-found,
        environment-server-not-found or template-not-found; 400 environment-test-invalid for a
        template slot without a secret; 503 secrets-unavailable while goald has no master key.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentTestRequest" }
      responses:
        "200":
          description: The results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentTestResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/repositories/test:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    post:
      operationId: testFactoryRepository
      x-goal-scope: definition:edit
      tags: [access]
      summary: Test a token against a repository or an owner's repositories, for a factory
      description: >-
        Tests what the token in the named secret can do at url, one repository or an owner pattern
        ending in /* (every repository of an account, organization or GitLab group), through the
        code host's API and never git, and keeps the result for the factory (ADR 0041 decision 8).
        The url's host must be one of the organization's code hosts. The secret is opened inside
        goald for the factory (audited as secret.used), as the environment test does. For a read
        entry the summary is "Can read", or for an owner pattern how many repositories the token
        can read ("Can read 48 repositories in acme", "at least 1000" past the adapter's limit);
        when the token can also push, warning says "Goal won't push, but agents could. Use a
        read-only token." For a write entry the summary is "Can read and push", and note says the
        host reports no pull-request permission, so Goal can't check it. A check that fails is an
        answer, not an error. A host that gives no answer within 10 seconds answers tested false
        with "couldn't test". The result replaces the factory's kept one for the same url, and is
        tested again whenever the secret's value is replaced. No answer, reason or problem
        carries the token. 404 factory-not-found or secret-not-found; 400 repository-host-unknown
        for a host the organization doesn't list and repository-url-invalid for a URL that names
        no repository or owner, both before the secret is opened, and secret-not-allowed for a
        secret not open to this factory; 503 secrets-unavailable while goald has no master key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryRepositoryTestRequest" }
      responses:
        "200":
          description: The result, as kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryRepositoryTest" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/repositories/tests:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listFactoryRepositoryTests
      x-goal-scope: factory:read
      tags: [access]
      summary: List a factory's kept repository tests
      description: >-
        The latest result of each url tested for the factory, sorted by url, as testFactoryRepository
        answered it. Reading them tests nothing. 404 factory-not-found.
      responses:
        "200":
          description: The kept results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryRepositoryTestList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/webhooks:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listWebhooks
      x-goal-scope: webhook:read
      tags: [webhooks]
      summary: The organization's webhooks
      description: >-
        By name, each with its sender, the name of the secret that signs it, its openings, the
        triggers of the published definitions that use it and its deliveries of the last 7 UTC
        days. Never a secret's value.
      responses:
        "200":
          description: The webhooks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWebhook
      x-goal-scope: webhook:manage
      tags: [webhooks]
      summary: Create a webhook
      description: >-
        An enabled webhook, open to no factory. Without secret, it creates the secret
        webhook-<name> (cut to 40 characters, without a trailing hyphen), open to no factory, with
        a generated value answered here once as secret_value; with secret, it is signed by that
        existing secret, for a sender that issues its own, such as PagerDuty or Sentry. 400
        webhook-invalid for a name that is not a slug or is reserved (the sender names, schedule
        and webhook), an unknown sender, or token settings on a sender other than token; 404
        secret-not-found for a secret the organization does not have; 409 webhook-name-taken for
        a name an endpoint of the organization has, secret-name-taken when the generated secret's
        name is taken; 503 secrets-unavailable while goald has no master key. Needs a sign-in from
        the last 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewWebhook" }
      responses:
        "201":
          description: The webhook, with the generated secret's value when it made one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhook" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/webhooks/{webhook}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/WebhookRef"
    get:
      operationId: getWebhook
      x-goal-scope: webhook:read
      tags: [webhooks]
      summary: One webhook
      description: 404 webhook-not-found for a webhook the organization does not have.
      responses:
        "200":
          description: The webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchWebhook
      x-goal-scope: webhook:manage
      tags: [webhooks]
      summary: Open, close, limit, rename, enable or disable a webhook
      description: >-
        open opens the webhook to each factory, or replaces the repositories an opening is limited
        to; close closes it to each factory. 400 webhook-invalid for a name it refuses, a factory
        both opened and closed, or a repository list over 100; 404 webhook-not-found, and
        factory-not-found for a factory the organization does not have; 409 webhook-name-taken;
        409 webhook-in-use, with triggers, when a rename or a close would leave published triggers
        that name the webhook without it: publish them without it first. A trigger that names only
        its sender does not hold it. Needs a sign-in from the
        last 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookPatch" }
      responses:
        "200":
          description: The webhook as changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWebhook
      x-goal-scope: webhook:manage
      tags: [webhooks]
      summary: Delete a webhook, its openings and its deliveries
      description: >-
        Its address stops accepting requests; its secret stays. 404 webhook-not-found; 409
        webhook-in-use, with triggers, while published triggers name it; a trigger that names only
        its sender does not hold it. Needs a sign-in from the last 10 minutes.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/webhooks/{webhook}/deliveries:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/WebhookRef"
    get:
      operationId: listOrgWebhookDeliveries
      x-goal-scope: webhook:read
      tags: [webhooks]
      summary: One page of a webhook's deliveries, newest first
      description: >-
        What the webhook received in the last 30 days, each with its outcome, without its headers
        and body (getOrgWebhookDelivery). The log keeps only deliveries an enabled trigger names;
        the others, such as GitHub's ping or one that arrives before a trigger names the webhook,
        are only counted per UTC day, and unnamed_days carries those counts for the log's 30 days.
        Every page carries the same unnamed_days. 400 webhook-invalid for a cursor this route did
        not answer; 404 webhook-not-found.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: after
          in: query
          description: The next_after of the previous page; deliveries received before it
          schema: { type: string }
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/webhooks/{webhook}/deliveries/{delivery}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/WebhookRef"
      - name: delivery
        in: path
        required: true
        description: The delivery's id
        schema: { type: string }
    get:
      operationId: getOrgWebhookDelivery
      x-goal-scope: webhook:manage
      tags: [webhooks]
      summary: One delivery with its request
      description: >-
        The request as received: its headers (names lower-cased, never a signature header) and its
        body. 404 webhook-delivery-not-found. Needs a sign-in from the last 10 minutes.
      responses:
        "200":
          description: The delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/views:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
    get:
      operationId: listSavedViews
      x-goal-scope: factory:read
      tags: [views]
      summary: The factory's shared views and the caller's own
      description: >-
        The shared views first, then the caller's personal views, each by name (case ignored).
        Never another person's personal view; an API key or a personal token sees only the shared
        views.
      responses:
        "200":
          description: The views
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedViewList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSavedView
      x-goal-scope: factory:read
      tags: [views]
      summary: Save a view
      description: >-
        A personal view of the caller, or a shared view of the factory, which also needs
        factory:manage (403 forbidden without it). 403 person-required for an API key, a personal
        token or GOAL_AUTH=none: only a signed-in person owns a view. 400 invalid-view for a name of 0 or over 60
        characters, over 20 filters, over 20 values in one or a value over 200 characters; 409
        view-name-taken for a name the caller's personal views (personal) or the factory's shared
        views (shared) already use, case ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSavedView" }
      responses:
        "201":
          description: The view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/factories/{factory}/views/{view}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/FactoryRef"
      - $ref: "#/components/parameters/SavedViewRef"
    patch:
      operationId: updateSavedView
      x-goal-scope: factory:read
      tags: [views]
      summary: Rename a view and replace its filters
      description: >-
        Whether a view is shared is fixed when it is created. A shared view needs factory:manage
        (403 forbidden without it); 403 person-required for an API key, a personal token or
        GOAL_AUTH=none; 404
        view-not-found for a view the caller does not see (another person's personal view
        included); 400 invalid-view and 409 view-name-taken as createSavedView.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedViewChange" }
      responses:
        "200":
          description: The view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSavedView
      x-goal-scope: factory:read
      tags: [views]
      summary: Delete a view
      description: >-
        A shared view needs factory:manage (403 forbidden without it); 403 person-required for an
        API key, a personal token or GOAL_AUTH=none; 404 view-not-found for a view the caller does not see (another
        person's personal view included).
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/stream:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: streamEvents
      x-goal-scope: org:read
      summary: The organization's events as they happen (Server-Sent Events)
      description: >-
        A text/event-stream of one organization's events only. Each committed item event arrives
        as `event: item` with `id:` the event id and `data:` a StreamEvent. Other event names
        (definition, factory, connection, knowledge) carry their own data
        object; clients ignore the names they do not know. `event: definition` (data a
        DefinitionEvent, no id) follows every committed change of a factory's definition: a
        factory created or deleted, its current version moved (publish, restore, pause, resume),
        its draft opened, saved, discarded or published. `event: factory` (data a FactoryEvent,
        no id) follows a change of a factory's line that is not an item's: its andon cord pulled
        or cleared. `event: connection` (data a ConnectionEvent, no id) follows a connection
        created, changed, tested or deleted. `event: knowledge` (data a KnowledgeEvent, no id)
        follows a knowledge source's sync starting or ending. `event: resync` (data `{}`) means
        goald may have missed events (it reconnected to the database): re-read what you show. A
        comment line (`: heartbeat`) arrives every 15 seconds. There is no replay: Last-Event-ID
        is ignored, so a client that reconnects re-reads what it shows. goald ends the stream of
        a client that falls too far behind.
      parameters:
        - name: factory
          in: query
          description: Only this factory's events (its metadata.id or metadata.name)
          schema: { type: string }
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                description: The data of each event, by its name (item, definition, factory, connection, knowledge)
                oneOf:
                  - $ref: "#/components/schemas/StreamEvent"
                  - $ref: "#/components/schemas/DefinitionEvent"
                  - $ref: "#/components/schemas/FactoryEvent"
                  - $ref: "#/components/schemas/ConnectionEvent"
                  - $ref: "#/components/schemas/KnowledgeEvent"
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    get:
      operationId: getItem
      x-goal-scope: factory:read
      summary: One work item
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/events:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    get:
      operationId: listItemEvents
      x-goal-scope: factory:read
      summary: One page of an item's history, oldest first
      parameters:
        - name: after
          in: query
          description: Return events with an id greater than this (0 for the start)
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Events in append order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/parts:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    get:
      operationId: listItemParts
      x-goal-scope: factory:read
      summary: An assembly's parts in plan order, with their needs and waves
      description: An item that is not an assembly has no parts (done 0, total 0).
      responses:
        "200":
          description: The parts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssemblyParts" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addItemPart
      x-goal-scope: item:create
      summary: Add one part to an open assembly
      description: >-
        The part is queued at the assembly's own station, with the assembly's type, priority and
        class of service, the brief as its body and a planned edge to each part it needs. Its key is
        a slug of its title, made unique among the assembly's parts with -2, -3. Answers the
        assembly's parts, as listItemParts does. 400 part-invalid for an empty title or brief or an
        unknown need; 409 not-an-assembly for an item that is not an assembly, item-closed for a
        done or cancelled one, edge-cycle when the needs would close a cycle and item-changed when
        the assembly changed meanwhile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPartRequest" }
      responses:
        "201":
          description: The part is added; the assembly's parts, the new one last
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssemblyParts" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/runs:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    get:
      operationId: listItemRuns
      x-goal-scope: factory:read
      tags: [work]
      summary: An item's agent runs, oldest first (at most 200)
      responses:
        "200":
          description: The item's runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/teardown:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    get:
      operationId: getItemTeardown
      x-goal-scope: factory:read
      summary: Where an item's lead time, cost and human help went
      description: >-
        The after-action breakdown of one item (ADR 0019 decision 3), worked out from its spans,
        runs, events and touches on each request and stored nowhere. On an open item it is the
        breakdown so far, until now. An unknown item is 404 item-not-found.
      responses:
        "200":
          description: The item's teardown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Teardown" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/notes:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: noteItem
      x-goal-scope: item:operate
      tags: [work]
      summary: Leave a note for the agents working an item
      description: >-
        The note is recorded as the item's event (kind note) and carried by the brief of the item's
        next run, at whatever station, under "Notes from people". A note on a done or cancelled item
        is refused with 409 item-closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewNote" }
      responses:
        "202":
          description: The note is recorded; delivery says when an agent reads it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteReceipt" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/needs:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: linkItem
      x-goal-scope: item:operate
      tags: [work]
      summary: Say that an item needs another, so it is not claimed until that one is done or cancelled
      description: >-
        Adds a dependency of kind linked by the caller (ADR 0012) and records an edge_added event on
        the item; people cannot add planned or overlap edges. Problems: 404 item-not-found for
        either item when it is unknown or the caller cannot read it; 400 edge-invalid for an item
        that needs itself or an item of another factory; 409 edge-cycle when the needed item
        already needs this one, directly or through others; 409 edge-exists when the item already
        needs it; 409 item-closed for a done or cancelled item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewLink" }
      responses:
        "201":
          description: The new edge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemLink" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/needs/{need}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
      - name: need
        in: path
        required: true
        description: >-
          The needed item's id (a UUID) or <factory>#<number>, as in goal#2 (percent-encode the #
          as %23)
        schema: { type: string }
    delete:
      operationId: unlinkItem
      x-goal-scope: item:operate
      tags: [work]
      summary: Say that an item no longer needs another
      description: >-
        Removes the dependency, whatever its kind, and records an edge_removed event on the item.
        Problems: 404 item-not-found for either item when it is unknown or the caller cannot read
        it; 404 edge-not-found when the item does not need it; 409 item-closed for a done or
        cancelled item.
      responses:
        "204":
          description: The edge is removed
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/touches/{event}/reason:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
      - name: event
        in: path
        required: true
        description: The touch's event_id, as Item.touches lists it
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      operationId: setTouchReason
      x-goal-scope: item:operate
      tags: [work]
      summary: Say why a person had to act on an item
      description: >-
        Sets or changes the reason of one of the item's touches, audited as touch.labelled; it is
        no item event, so it is not a touch itself. 404 touch-not-found for an event that is not
        one of the item's touches.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TouchReasonChange" }
      responses:
        "204":
          description: The reason is set
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/runs:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listRuns
      x-goal-scope: org:read
      tags: [work]
      summary: The organization's agent runs across the factories the caller sees, newest first
      description: >-
        The runs that started in [since, until) in the factories the caller may read, or in the
        one named by factory, newest first (by start, then id), paged by next_cursor. When since
        is absent it is the start of the current UTC day; when until is absent it is the end of
        that day; since must be before until. The summary covers the same factories and window
        whatever status and q say. A wide window is a scan of every run in it: keep it short.
      parameters:
        - name: factory
          in: query
          description: Only this factory's runs (its metadata.id or metadata.name); unknown is 404
          schema: { type: string }
        - name: status
          in: query
          description: Only runs with this status
          schema: { $ref: "#/components/schemas/RunStatus" }
        - name: since
          in: query
          description: The earliest start, included; the start of the current UTC day when absent
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: The latest start, excluded; the end of the current UTC day when absent
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: >-
            Only runs whose item title, agent or model contains q (case-insensitively and
            literally: % and _ are no wildcards), or whose item has the number q names ("147",
            "#147" or "goal#147"). Trimmed; at most 200 characters.
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: The next_cursor of the previous page, opaque
          schema: { type: string }
      responses:
        "200":
          description: A page of runs and the window's summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgRunList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/runs/export:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: exportRuns
      x-goal-scope: org:read
      tags: [work]
      summary: The organization's agent runs as CSV, with the filters of listRuns
      description: >-
        The CSV export of listRuns (ADR 0020, decision 3): every run listRuns would list over its
        pages, with the same filters and the same order (newest first), one row per run and no
        paging. The header row is id, factory, item_ref, item_title, station, agent, model,
        status, started_at, ended_at, turns, cost_usd: factory is the factory's metadata.name,
        agent the agent's name in its factory, times are RFC 3339 in UTC (ended_at empty while the
        run runs) and cost_usd is decimal USD. The body is streamed. More than 100000 rows is a
        413 problem export-too-large, answered before any byte of the body; every error before the
        first row is a problem, and one after it ends the stream early.
      parameters:
        - name: factory
          in: query
          description: As for listRuns
          schema: { type: string }
        - name: status
          in: query
          description: As for listRuns
          schema: { $ref: "#/components/schemas/RunStatus" }
        - name: since
          in: query
          description: As for listRuns
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: As for listRuns
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: As for listRuns
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The runs as CSV
          headers:
            Content-Disposition:
              description: attachment; filename="runs-<yyyy-mm-dd>.csv", the UTC day of the export
              required: true
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/runs/{run}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: run
        in: path
        required: true
        description: The run's id
        schema: { type: string }
    get:
      operationId: getRun
      x-goal-scope: factory:read
      tags: [work]
      summary: One agent run (404 for a run of another organization)
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/approve:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: approveItem
      x-goal-scope: item:decide
      summary: Approve an item waiting for a human; it moves to the next station
      description: >-
        409 tool-approval-open while the item has an open tool approval (Item.tool_approval):
        the item waits for a decision on the call, decided with decideToolApproval, not on the
        item (ADR 0031 decision 9).
      responses:
        "200":
          description: The item after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/answer:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: answerItem
      x-goal-scope: item:decide
      summary: Answer the question an item's agent asked
      description: >-
        Answers the item's open question (Item.question) with one of its choices or in the
        caller's own words, as ADR 0018 decides. The engine records question_answered and puts the
        item back in its station's arrival state, rework_count unchanged; its next run's brief
        carries the question and the answer. Audited as item.answered with the answer's length and
        the choice index, never its text. 400 when the body has both answer and choice or neither,
        or the answer is not 1 to 2000 characters; 400 bad-choice for a choice outside the
        question's choices; 409 no-open-question when the item has none (none was asked, it was
        answered, or a move, pause or rejection withdrew it), item-closed for a done or cancelled
        item, item-changed when it moved meanwhile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemAnswer" }
      responses:
        "200":
          description: The item after the answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/tool-approval:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: decideToolApproval
      x-goal-scope: item:decide
      summary: Approve or deny the tool call an item's agent asked to make
      description: >-
        Decides the item's open tool approval (Item.tool_approval), as ADR 0031 decides. approve
        records tool_approval_granted and grants that one call, with exactly its input, to the
        item's next run; with always_allow it also creates the standing rule that lets the
        agent role call the tool of the connection without asking (audited as
        standing_rule.created), which also needs standing_rule:manage in the organization and so a
        sign-in from the last 10 minutes. deny records tool_approval_denied with the note, which
        the next run's brief carries. Either way the item goes back to its station's arrival
        state, rework_count unchanged. 400 for always_allow with deny, a note with approve, or a
        note that is not 1 to 2000 characters; 403 for always_allow without standing_rule:manage
        (reauth-required for a session signed in longer ago), the item unchanged; 409
        no-open-tool-approval when the item has none (none was asked, it was decided, or a move,
        pause, rejection or cancel withdrew it), always-allow-not-offered when always_allow is set
        and the approval does not offer it, item-closed for a done or cancelled item,
        item-changed when it moved meanwhile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolDecision" }
      responses:
        "200":
          description: The item after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/reject:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: rejectItem
      x-goal-scope: item:decide
      summary: Send an item back for rework with the reason
      description: >-
        An item waiting for a human, blocked or in progress goes to its station's rework target
        (Item.flow.rework_target) with rework_count + 1; in progress, its lease is taken and its run
        stopped (lease_taken). 409 cannot-send-back for a queued, ready, done or cancelled item, or a
        station with nowhere upstream to send it; item-changed when it moved meanwhile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rejection" }
      responses:
        "200":
          description: The item after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/move:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: moveItem
      x-goal-scope: item:operate
      tags: [work]
      summary: Put an item at another station of its line
      description: >-
        From any open state the item arrives at the station in that station's arrival state (an agent
        or queue station queues it, a human station waits for a decision). In progress, its lease is
        taken and its run stopped (lease_taken). Moving upstream counts as rework and needs a reason.
        400 unknown-station or reason-required; 409 item-closed (done or cancelled), same-station,
        done-station (finish work by approving or merging it) or item-changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: The item at its new station
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/lane:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: setItemLane
      x-goal-scope: item:operate
      tags: [work]
      summary: Set an open item's lane
      description: >-
        The lane picks the agent at the stations that route by lane; the item stays at its station
        and in its state, and a lane_set event (from, to) records the change. The lane is trimmed;
        when any station of the item's line routes by lane, it must be one of the lanes routed.
        400 lane-required or unknown-lane; 409 item-closed (done or cancelled), item-in-progress
        (pause or move it first: its agent was chosen by the old lane), item-is-assembly (its parts
        carry their own lanes), same-lane or item-changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetLaneRequest" }
      responses:
        "200":
          description: The item with its new lane
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/start:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    put:
      operationId: setItemStart
      x-goal-scope: item:create
      tags: [work]
      summary: Change when an item that has not started may start
      description: >-
        at or in replaces the item's start; after alone keeps it and adds the items as linked
        dependencies by the caller (one the item already needs is kept, a done one is left out).
        A start_changed event records the change. Problems: 400 for a start with both at and in, a
        bad time or wait, a start more than 365 days ahead, or an after item that is cancelled,
        unknown or of another factory; 409 item-closed (done or cancelled), item-started (it left
        the first station, or an agent took it there), edge-cycle (an after item already needs it)
        or item-changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Start" }
      responses:
        "200":
          description: The item with its new start
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: clearItemStart
      x-goal-scope: item:create
      tags: [work]
      summary: Start an item now
      description: >-
        Clears the item's start time, so the first station releases it on its next tick (within
        seconds); its after items still hold it until they are done, and the needs endpoints
        remove them. A start_changed event without start_at records it. Problems: 409
        item-closed, item-started or item-changed, as for setItemStart.
      responses:
        "200":
          description: The item without a start time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/pause:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: pauseItem
      x-goal-scope: item:operate
      tags: [work]
      summary: Stop an open item where it is until a retry resumes it
      description: >-
        The item becomes blocked at its station with a paused event; retry resumes it. In progress,
        its lease is taken and its run stopped (lease_taken). An assembly stays in state assembly
        and pauses its open parts instead, in one transaction, each with its own paused event
        (already-blocked when every open part is). 409 item-closed (done or cancelled),
        already-blocked or item-changed.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PauseRequest" }
      responses:
        "200":
          description: The paused (blocked) item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: cancelItem
      x-goal-scope: item:decide
      tags: [work]
      summary: Close an open item as cancelled, with its open parts when it is an assembly
      description: >-
        The item becomes cancelled at its station with a cancelled event. In progress, its lease is
        taken and its run stopped (lease_taken). An assembly cancels its open parts (neither done
        nor cancelled) in one transaction, each with its own cancelled event, and closes as
        cancelled even when some part is done. 409 item-closed (done or cancelled) or
        item-changed.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
      responses:
        "200":
          description: The cancelled item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/follow-ups/{followUp}/drop:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
      - $ref: "#/components/parameters/FollowUpRef"
    post:
      operationId: dropFollowUp
      x-goal-scope: item:decide
      tags: [work]
      summary: Drop a waiting follow-up of an item so it is never delivered or filed
      description: >-
        The follow-up becomes dropped, its reason naming the caller ("dropped by user:<id>"). File
        can file it again later. Problems: 404 follow-up-not-found for a follow-up that is not this
        item's; 409 follow-up-state when it is not waiting.
      responses:
        "200":
          description: The dropped follow-up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowUp" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/follow-ups/{followUp}/file:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
      - $ref: "#/components/parameters/FollowUpRef"
    post:
      operationId: fileFollowUp
      x-goal-scope: item:create
      tags: [work]
      summary: File an item from a dropped follow-up or one in a closed triage item
      description: >-
        Files an item in the source item's factory at its first station, as createItem does, with
        origin follow-up, the caller as its filer, a generation one above the source's and the
        source's untrusted flag; the follow-up becomes filed with that item. Only a dropped
        follow-up, or one whose triage item is done or cancelled, can be filed. Problems: 400 for
        what the factory does not take (a type, a lane, a start); 404 follow-up-not-found for a
        follow-up that is not this item's; 409 follow-up-state for any other follow-up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileFollowUpRequest" }
      responses:
        "201":
          description: The filed item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/retry:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: retryItem
      x-goal-scope: item:decide
      summary: Send a blocked item back to its station's queue (409 if it is not blocked)
      description: >-
        An assembly stays in state assembly and sends each of its blocked parts back to its
        station's queue instead, in one transaction, each with its own retried event; 409 when no
        part is blocked.
      responses:
        "200":
          description: The item, queued at its station again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/items/{item}/merge:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/ItemRef"
    post:
      operationId: mergeItem
      x-goal-scope: item:decide
      summary: Merge the item's pull requests, then approve it
      description: >-
        Only for an item waiting at a human station with action merge. goald merges every pull
        request (GitLab merge request) the item's outputs name: the pull_request string and the
        pull_requests array of each station's latest output, in station order, each once. Each
        goes through the factory's connection whose kind has a code host and whose git login is
        for the URL's host; a URL on a host none serves is refused with 409
        no-code-host-connection before anything is merged. It never forces: a pull request that
        is closed, has conflicts or failing required checks, or whose head moves meanwhile stops
        the merge with 409 cannot-merge naming it, and the item does not move; the ones merged
        before it stay merged and are skipped when the merge is asked again. After each merge it
        deletes the pull request's head branch (only when it lives in the repository it merged
        into), and once all are merged it approves the item with one merged event per pull
        request.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergeRequest" }
      responses:
        "200":
          description: The item after the merge and the approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/builder/meta:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getBuilderMeta
      x-goal-scope: org:read
      tags: [builder]
      summary: What the factory editor needs to know about the install
      description: >-
        The models agents may run on (from goald's GOAL_MODELS; exactly one is the default, the
        model a factory runs when it names none), which later phases are wired (their controls
        stay hidden or read-only until then) and the limits of one skill folder.
      responses:
        "200":
          description: The editor's metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuilderMeta" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/builder/skills:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: searchSkills
      x-goal-scope: org:read
      tags: [builder]
      summary: One page of the skills catalog
      description: >-
        Skills the operator synced from skills.sh (goal catalog skills sync), each at the commit
        it is pinned at. q matches the key, the skill's name or its description, ignoring case;
        results are most installed first, then by key. The catalog is the install's, the same for
        every organization; it is empty until the operator syncs it. A limit outside 1 to 50 is
        400; a bucket that cannot be read is 503 catalog-unavailable.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: after
          in: query
          description: The next_after of the previous page
          schema: { type: string, maxLength: 320 }
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/builder/skills/{owner}/{repo}/{skill}/files:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - { name: owner, in: path, required: true, schema: { $ref: "#/components/schemas/SkillName" } }
      - { name: repo, in: path, required: true, schema: { $ref: "#/components/schemas/SkillName" } }
      - { name: skill, in: path, required: true, schema: { $ref: "#/components/schemas/SkillName" } }
    get:
      operationId: getSkillFiles
      x-goal-scope: org:read
      tags: [builder]
      summary: A catalog skill's files at its pinned commit, to vendor into a draft
      description: >-
        The folder as the sync stored it, checked against the catalog's index (limits, paths and
        hash) before it is served. Paths are relative to the skill's folder; SKILL.md is at its
        root. A draft adds them under skills/<skill>/ with skills[].origin set to
        skills.sh:<owner>/<repo>@<skill>#<commit>. The content is third-party: show it as plain
        text. An unknown skill is 404 skill-not-found; a bucket that cannot be read, or a folder
        that does not match the index, 503 catalog-unavailable.
      responses:
        "200":
          description: The skill and its files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillFiles" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/standing-rules:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listStandingRules
      x-goal-scope: standing_rule:read
      tags: [connections]
      summary: The organization's standing rules
      description: >-
        The rules Always allow created (ADR 0031 decision 7), oldest first: each lets one agent
        role call one tool of one organization connection without asking, in every factory of
        the organization. The active ones, and the revoked ones too with revoked=true.
      parameters:
        - name: revoked
          in: query
          description: Also list the revoked rules
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandingRuleList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/standing-rules/{rule}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - name: rule
        in: path
        required: true
        description: The standing rule's id
        schema: { type: string }
    delete:
      operationId: revokeStandingRule
      x-goal-scope: standing_rule:manage
      tags: [connections]
      summary: Revoke a standing rule
      description: >-
        The rule's agent role asks first again from its next run. A rule is never deleted:
        revoking sets revoked_at and revoked_by, audited as standing_rule.revoked. 404 for a rule
        that does not exist, 409 standing-rule-revoked for one revoked already. Needs a sign-in
        from the last 10 minutes.
      responses:
        "200":
          description: The revoked rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandingRule" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/credentials:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listCredentials
      x-goal-scope: secret:read
      deprecated: true
      tags: [credentials]
      summary: The organization's credentials
      description: >-
        By name, each with its type, description, factory scope, agents per factory, expiry,
        rotation reminder, last use and what uses it (the connections that refer to it as {{name}}
        and the agents listed). Never a value.
      responses:
        "200":
          description: The credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCredential
      x-goal-scope: secret:manage
      deprecated: true
      tags: [credentials]
      summary: Create a credential
      description: >-
        A named credential with its value, sealed under the platform's master key and never
        returned (ADR 0017). 400 credential-invalid for a name that is not a credential name or
        whose env variable is reserved for the platform, a missing or oversized value, an unknown
        type, a reminder without an expiry, or agents of a factory outside the scope; 409
        credential-name-taken; 503 credentials-unavailable while goald has no master key. Needs a
        sign-in from the last 10 minutes. Audited as credential.created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCredential" }
      responses:
        "201":
          description: The credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/credentials/import:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: importCredentials
      x-goal-scope: secret:manage
      deprecated: true
      tags: [credentials]
      summary: Import credentials from a .env or YAML text
      description: >-
        env: KEY=value lines, each key lower-cased with _ turned into - (SENTRY_TOKEN is
        sentry-token); yaml: a top-level secrets: map of name to value (credentials:, its older
        name, is taken too). Every name is checked before anything is written: 400 credential-invalid for an unknown format, text that does
        not parse, a name that is not a credential name or whose env variable is reserved. A dry
        run answers each name as new or existing, with how many connections use it, and stores
        nothing. A real run creates each new name as an api_key with no factories, and replaces
        (on_conflict replace, audited as credential.value_replaced) or skips (on_conflict skip, the
        default) each existing one. A real run is not one transaction: should a write fail, the
        names before it stay applied. 503 credentials-unavailable while goald has no master key.
        Needs a sign-in from the last 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialImport" }
      responses:
        "200":
          description: What the import does, or did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialImportResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/credentials/{credential}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/CredentialRef"
    get:
      operationId: getCredential
      x-goal-scope: secret:read
      deprecated: true
      tags: [credentials]
      summary: One credential, never its value
      responses:
        "200":
          description: The credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchCredential
      x-goal-scope: secret:manage
      deprecated: true
      tags: [credentials]
      summary: Change a credential's metadata, or replace its value
      description: >-
        Each property present replaces its own: name renames it, scope and agents replace the
        scope and the agent list, expiry replaces the expiry and the reminder together (an empty
        expiry clears both), value replaces the value for runs that start afterwards (audited as
        credential.value_replaced); a change of the rest is audited as credential.updated. 400
        credential-invalid, 404 credential-not-found, 409 credential-name-taken, 503
        credentials-unavailable for a value while goald has no master key. Needs a sign-in from the
        last 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialPatch" }
      responses:
        "200":
          description: The credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCredential
      x-goal-scope: secret:manage
      deprecated: true
      tags: [credentials]
      summary: Delete a credential
      description: >-
        409 credential-in-use, naming the connections, while a connection refers to it as {{name}};
        404 credential-not-found. Needs a sign-in from the last 10 minutes. Audited as
        credential.deleted.
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/access:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: getAccess
      x-goal-scope: access:read
      tags: [access]
      summary: What the organization's agents reach
      description: >-
        Computed from each factory's current published version, the environment tests and the
        secrets, over the factories the caller sees that are not archived: every MCP server, and
        every env variable and file that references a secret. Each row lists the factories and
        environments that use it with their agents, the secrets it references, and a status:
        missing (a secret it references does not exist), failed (its last test failed), expired
        or expiring (a secret's expiry has passed, or is within its reminder days), untested (a
        remote MCP server never tested), tested, or ok. by groups the rows by what agents reach
        (MCP servers, env variables, files; the default), by factory or by secret; factory keeps
        one factory's. reached counts what agents reach and need_attention what is missing,
        failed, expired or expiring, whatever by is.
      parameters:
        - name: by
          in: query
          schema: { type: string, enum: [reach, factory, secret], default: reach }
        - name: factory
          in: query
          description: Only this factory's, by metadata.id or metadata.name
          schema: { type: string }
      responses:
        "200":
          description: The read model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Access" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/secrets:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listSecrets
      x-goal-scope: secret:read
      tags: [secrets]
      summary: The organization's secrets
      description: >-
        By name, each with its source, description, factory scope, expiry, reminder, last use and
        what uses it. Never a value.
      responses:
        "200":
          description: The secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSecret
      x-goal-scope: secret:manage
      tags: [secrets]
      summary: Create a secret
      description: >-
        A named secret with its value, sealed under the platform's master key and never returned
        (ADR 0037 decision 1). Without a scope it is open to no factory. 400 secret-invalid for a
        name that is not a secret name, a missing or oversized value, a description over 500
        characters, a reminder without an expiry or outside 1 to 90 days, or a scope of all
        factories and a list; 409 secret-name-taken; 503 secrets-unavailable while goald has no
        master key. Needs a sign-in from the last 10 minutes. Audited as secret.created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSecret" }
      responses:
        "201":
          description: The secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/secrets/import:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: importSecrets
      x-goal-scope: secret:manage
      tags: [secrets]
      summary: Import secrets from a .env or YAML text
      description: >-
        env: KEY=value lines, each key lower-cased with _ turned into - (SENTRY_TOKEN is
        sentry-token); yaml: a top-level secrets: map of name to value (credentials:, its older
        name, is taken too). Every name is checked before anything is written: 400 secret-invalid for an unknown format, text that does not
        parse, an empty import, or a name that is not a secret name or whose env variable is
        reserved. A dry run answers each name as new or existing, with what uses the existing one,
        and stores nothing. A real run creates each new name open to no factory, and replaces
        (on_conflict replace, audited as secret.value_replaced) or skips (on_conflict skip, the
        default) each existing one. A real run is not one transaction: should a write fail, the
        names before it stay applied. 503 secrets-unavailable while goald has no master key. Needs
        a sign-in from the last 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretImport" }
      responses:
        "200":
          description: What the import does, or did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretImportResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/secrets/{secret}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/SecretRef"
    get:
      operationId: getSecret
      x-goal-scope: secret:read
      tags: [secrets]
      summary: One secret, never its value
      description: 404 secret-not-found.
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchSecret
      x-goal-scope: secret:manage
      tags: [secrets]
      summary: Change a secret's description, scope, expiry or reminder
      description: >-
        Each property present replaces its own: scope replaces the factory scope, expiry replaces
        the expiry and the reminder together (an empty expiry clears both). The value changes only
        through PUT …/value. Audited as secret.updated. 400 secret-invalid (a patch that changes
        nothing too), 404 secret-not-found. Needs a sign-in from the last 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretPatch" }
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSecret
      x-goal-scope: secret:manage
      tags: [secrets]
      summary: Delete a secret
      description: >-
        409 secret-in-use, deleting nothing, while something uses it: the problem's uses names each
        use. 404 secret-not-found. Needs a sign-in from the last 10 minutes. Audited as
        secret.deleted.
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/secrets/{secret}/value:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/SecretRef"
    put:
      operationId: replaceSecretValue
      x-goal-scope: secret:manage
      tags: [secrets]
      summary: Replace a secret's value
      description: >-
        Runs that start afterwards get the new value; nothing else changes, and the answer holds no
        value. Audited as secret.value_replaced. 400 secret-invalid for a missing or oversized
        value, 404 secret-not-found, 503 secrets-unavailable while goald has no master key. Needs a
        sign-in from the last 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValue" }
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/knowledge/sources:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listKnowledgeSources
      x-goal-scope: knowledge:read
      tags: [knowledge]
      summary: The sources of the organization's knowledge base
      description: >-
        By name, each with its kind, connection, status, document count, last and next sync and
        the factories whose current version may search it (those the caller sees).
      parameters:
        - name: factory
          in: query
          description: Only the sources this factory's current version may search (its metadata.id or metadata.name)
          schema: { type: string }
      responses:
        "200":
          description: The sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeSourceList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createKnowledgeSource
      x-goal-scope: knowledge:manage
      tags: [knowledge]
      summary: Add a source to the knowledge base
      description: >-
        An upload source holds files people upload; a synced source reads with a secret, its
        config naming its reader and what it reads (a repository, a branch and paths; Confluence
        spaces). Due to sync at once. 400 for a broken rule (a name, a title, a kind not in the
        list, a secret on an upload source, a synced source without a secret or reader, a schedule
        under 15 minutes), 404 secret-not-found, 409 knowledge-source-name-taken. Audited as
        knowledge_source.created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewKnowledgeSource" }
      responses:
        "201":
          description: The source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeSource" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/knowledge/sources/{source}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/SourceRef"
    get:
      operationId: getKnowledgeSource
      x-goal-scope: knowledge:read
      tags: [knowledge]
      summary: One knowledge source
      description: 404 knowledge-source-not-found.
      responses:
        "200":
          description: The source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeSource" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateKnowledgeSource
      x-goal-scope: knowledge:manage
      tags: [knowledge]
      summary: Change a source's title, config or schedule
      description: >-
        config, when present, replaces the source's config. secret, when present, is a synced
        source's new secret (400 for another kind, 404 secret-not-found). The name and kind never
        change. Audited as knowledge_source.updated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeSourcePatch" }
      responses:
        "200":
          description: The source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeSource" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteKnowledgeSource
      x-goal-scope: knowledge:manage
      tags: [knowledge]
      summary: Delete a source with its snapshots and uploads
      description: >-
        Its snapshots and the uploaded files no other upload holds go with it. 409
        knowledge-source-in-use, naming them, while a factory's current version may search it.
        Audited as knowledge_source.deleted.
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/knowledge/sources/{source}/sync:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/SourceRef"
    post:
      operationId: syncKnowledgeSource
      x-goal-scope: knowledge:manage
      tags: [knowledge]
      summary: Sync a source now
      description: >-
        The source is due at once; the next free goald syncs it, and `event: knowledge` on the
        stream says when that starts and ends.
      responses:
        "202":
          description: The source is due
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/knowledge/sources/{source}/files:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/SourceRef"
    get:
      operationId: listKnowledgeFiles
      x-goal-scope: knowledge:read
      tags: [knowledge]
      summary: One page of a source's current files
      description: >-
        The files of the source's current snapshot (ADR 0038 decision 3), in path order, after the
        path after; next_after, when set, is the after of the next page. With find, only those
        whose path, or title in any case, starts with it. None before the first snapshot. 404
        knowledge-source-not-found.
      parameters:
        - name: find
          in: query
          description: Only the files whose path, or title in any case, starts with this
          schema: { type: string, maxLength: 1024 }
        - name: after
          in: query
          description: The last path of the previous page
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeFilePage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/knowledge/sources/{source}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/SourceRef"
      - $ref: "#/components/parameters/KnowledgeFilePath"
    get:
      operationId: getKnowledgeFile
      x-goal-scope: knowledge:read
      tags: [knowledge]
      summary: One file's Markdown
      description: >-
        The file as runs read it under /knowledge/<source>/, from the source's current snapshot.
        goald reads it from the snapshot's zip by range (the end record, the central directory,
        then the one entry), never the whole zip. 404 knowledge-source-not-found, 404
        knowledge-file-not-found for a path the snapshot does not hold or a source with no snapshot
        yet.
      responses:
        "200":
          description: The file's Markdown
          content:
            text/markdown:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/knowledge/sources/{source}/uploads:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
      - $ref: "#/components/parameters/SourceRef"
    post:
      operationId: uploadKnowledgeFiles
      x-goal-scope: knowledge:manage
      tags: [knowledge]
      summary: Upload files to an upload source
      description: >-
        Each part named files is one file at the path its file name gives, which may hold folders
        (runbooks/db/disk.md); a path that is not relative and clean is 400. Text, Markdown, HTML,
        JSON, YAML, PDF or an Office file (the last two are converted when goald has a conversion
        service, else left out of the snapshot and listed) of at most GOAL_UPLOAD_MAX_BYTES (25 MiB by default), the whole request at
        most that and 1 MiB more. The upload makes the source due, and its next sync writes the
        snapshot that holds them. Every file is checked before any is stored: 413
        upload-too-large, 415 unsupported-document-type, 409 not-an-upload-source. Audited as
        knowledge_document.uploaded.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "202":
          description: The files, stored until the next sync takes them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeUploadList" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteKnowledgeUpload
      x-goal-scope: knowledge:manage
      tags: [knowledge]
      summary: Delete an uploaded file
      description: >-
        The upload at path, with its stored file when no other upload holds the same content; the
        next sync, which the deletion makes due, leaves it out of the snapshot. 404
        knowledge-file-not-found, 409 not-an-upload-source. Audited as knowledge_document.deleted.
      parameters:
        - name: path
          in: query
          required: true
          description: The upload's path in the source
          schema: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/knowledge/check:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    post:
      operationId: checkKnowledgeSource
      x-goal-scope: knowledge:manage
      tags: [knowledge]
      summary: Check a source's settings before saving them
      description: >-
        The Check panel of Add a source (ADR 0038 decision 12), for settings not saved yet: whether
        goald can read the source with them (listing it as a sync would, with the secret opened in
        goald and never returned), how many files it lists and, when known, their size against the
        limits, a warning for each picked factory the source does not suit, and the line agents
        will see. Nothing is stored. 400 for settings a source may not have, 404
        factory-not-found for a picked factory the caller cannot see, 404 secret-not-found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeCheckInput" }
      responses:
        "200":
          description: The answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeCheck" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/knowledge/files:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: findKnowledgeFiles
      x-goal-scope: knowledge:read
      tags: [knowledge]
      summary: Find a file across every source
      description: >-
        The current files of every source whose path, or title in any case, starts with find, by
        source name then path, at most limit.
      parameters:
        - name: find
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The files found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeFileList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{org}/knowledge/reads:
    parameters:
      - $ref: "#/components/parameters/OrgRef"
    get:
      operationId: listKnowledgeReads
      x-goal-scope: knowledge:read
      tags: [knowledge]
      summary: How often runs read and searched the sources' files
      description: >-
        The daily rollup of runs' reads and searches under /knowledge (ADR 0038 decision 10), of one
        source or every one, over the last days days counting today (UTC): one row per source,
        path, factory and day, by day, source, path and factory. A search of a whole source counts
        at the path ".". Factories the caller may not see are left out. 404
        knowledge-source-not-found.
      parameters:
        - name: source
          in: query
          description: Only this source's reads
          schema: { type: string }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeReadList" }
        default: { $ref: "#/components/responses/Problem" }
components:
  parameters:
    SavedViewRef:
      name: view
      in: path
      required: true
      description: The saved view's id
      schema: { type: string }
    WebhookRef:
      name: webhook
      in: path
      required: true
      description: The organization webhook's name or id
      schema: { type: string }
    UserRef:
      name: user
      in: path
      required: true
      description: A person's user id
      schema: { type: string }
    OrgRef:
      name: org
      in: path
      required: true
      description: The organization's slug or id
      schema: { type: string }
    CredentialRef:
      name: credential
      in: path
      required: true
      description: The credential's name
      schema: { type: string }
    SecretRef:
      name: secret
      in: path
      required: true
      description: The secret's name
      schema: { type: string }
    SourceRef:
      name: source
      in: path
      required: true
      description: The knowledge source's name
      schema: { type: string }
    KnowledgeFilePath:
      name: path
      in: path
      required: true
      description: >-
        A file's path in its source's folder, as in db/disk.md; percent-encode its slashes as %2F so
        it is one path segment
      schema: { type: string }
    DocumentRef:
      name: document
      in: path
      required: true
      description: The knowledge document's id
      schema: { type: string }
    FactoryRef:
      name: factory
      in: path
      required: true
      description: The factory's metadata.id or metadata.name
      schema: { type: string }
    DraftRequestRef:
      name: draft_request
      in: path
      required: true
      description: The draft request's id
      schema: { type: string }
    ProposalNumber:
      name: number
      in: path
      required: true
      description: The proposal's number in its factory, from 1
      schema: { type: integer, format: int64, minimum: 1 }
    KeptTestRef:
      name: test
      in: path
      required: true
      description: The kept test's id
      schema: { type: string }
    RangeFrom:
      name: from
      in: query
      description: The first UTC day of the range; 6 days before `to` when absent
      schema: { type: string, format: date }
    RangeTo:
      name: to
      in: query
      description: The last UTC day of the range, included; today when absent
      schema: { type: string, format: date }
    WorkTypeFilter:
      name: type
      in: query
      description: Only items of this work type (one the factory declares); every type when absent
      schema: { type: string }
    ItemRef:
      name: item
      in: path
      required: true
      description: >-
        The item's id (a UUID) or <factory>#<number>, as in goal#2 (the factory by
        metadata.name or metadata.id; percent-encode the # as %23)
      schema: { type: string }
    FollowUpRef:
      name: followUp
      in: path
      required: true
      description: The follow-up's id (a UUID)
      schema: { type: string }
    SectionRef:
      name: section
      in: path
      required: true
      description: A section of the factory model, a tab of the Visual editor
      schema: { $ref: "#/components/schemas/Section" }
    FilePath:
      name: path
      in: path
      required: true
      description: >-
        A file's path relative to the factory's root, as in agents/engineer.md; percent-encode
        its slashes as %2F so it is one path segment
      schema: { type: string }
    VersionSelector:
      name: version
      in: path
      required: true
      description: >-
        A version: its number (12), current (the one that runs), draft (the open draft), base
        (the published version the draft started from) or source (the draft's starting tree)
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      description: The entity tag the write is based on, quoted ("<etag>"); writes without it are 428
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: "* to create a file that must not exist yet"
      schema: { type: string }
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: goal.session_token
      description: >-
        Better Auth's session cookie, set by signing in through /api/auth (named
        __Secure-goal.session_token when the install's public URL is https). goald reads the
        session token before the first dot and looks the session up per request.
    bearer:
      type: http
      scheme: bearer
      description: >-
        A session token from goal login (32 letters and digits), an API key (goal_sk_...) or a
        personal token (goal_pat_...)
  responses:
    Problem:
      description: >-
        An error (RFC 9457 problem details). While goald starts, every path answers 503
        goald-starting with Retry-After (the Starting response) until startup finishes.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Starting:
      description: >-
        goald is starting (code goald-starting). goald binds its listeners before it opens the
        database and loads the definitions, and until startup finishes every path, the API, the
        auth proxy, the gateway and the web app alike, answers this at once, never cached. Retry
        after the Retry-After seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          required: true
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: >-
        A conflict (RFC 9457 problem details). factory-archived: the factory is archived and
        read-only, so it takes no new items or parts, item writes or andon calls until it is
        restored (detail "This factory is archived; restore it first"); reads keep working. The
        operation's description names its other conflict codes.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          pattern: "^[a-z]+(-[a-z]+)*$"
          description: >-
            A stable, kebab-case name of the error for clients to branch on (org-not-found,
            forbidden, slug-taken, confirmation-mismatch, draft-conflict, ...). goald-starting
            (503, with Retry-After): goald is starting, and every path answers it until startup
            finishes; retry. unauthenticated
            (401): no, a malformed, unknown, expired or revoked credential; the UI signs in again.
            reauth-required (403): the change needs a sign-in from the last 10 minutes; the UI
            confirms it's you and retries once. last-platform-admin (409): the install keeps at
            least one platform admin. scope-not-allowed (400): an API key scope keys may not carry,
            or that its creator or its ceiling does not hold, or a personal token scope tokens may
            not carry or that its creator does not hold. api-key-name-taken (409): another live
            key of the organization has the name. personal-token-name-taken (409): another live
            token of yours in the organization has the name. browser-session-required (403):
            personal tokens are created in the browser only, never with a CLI session, an API key
            or a token. Members and roles (409): not-an-admin
            (ownership goes to an admin only), last-owner (an organization keeps an owner),
            editor-everywhere (owners and admins hold every factory role already). An unknown
            organization, factory, item or run and one the caller may not see answer the same
            fixed body without detail: org-not-found, factory-not-found, item-not-found,
            run-not-found; so does a CLI sign-in code that is not pending: device-code-not-found. touch-not-found (404): an event that is not one of
            the item's touches.
            Connections: connection-not-found (404, a connection the organization does not
            have), connections-unavailable (503: goald has no master key,
            so no secret can be opened).
            Credentials (ADR 0017): credential-not-found (404), credential-invalid (400),
            credential-name-taken and credential-in-use (409, naming the connections),
            credentials-unavailable (503: goald has no master key).
            Secrets (ADR 0037): secret-not-found (404), secret-invalid (400),
            secret-name-taken and secret-in-use (409; secret-in-use with uses naming each use),
            secrets-unavailable (503: goald has no master key).
            Webhooks (ADR 0040): webhook-not-found and webhook-delivery-not-found (404),
            webhook-invalid (400), webhook-name-taken and webhook-in-use (409; webhook-in-use with
            triggers naming each trigger that uses it), webhooks-unavailable (503).
            Environment tests (ADR 0037 decision 9): environment-not-found,
            environment-server-not-found and template-not-found (404), environment-test-invalid
            (400).
            Knowledge (ADR 0038): knowledge-source-not-found and knowledge-file-not-found
            (404), knowledge-source-name-taken,
            knowledge-source-in-use and not-an-upload-source (409), upload-too-large (413),
            unsupported-document-type (415).
            Jonah (ADR 0039): draft-open (409) when approving a proposal while the factory has an
            open draft. Try another model (decision 13): model-not-allowed, agent-not-triable
            and no-finished-items (422), learning-budget-exhausted (409, with model_estimate).
            Try again (decision 11): proposal-not-triable (422), proposal-not-tried (409),
            learning-budget-exhausted (409, with try_estimate).
        problems:
          type: array
          description: definition-invalid only, every problem of the definition (errors block the publish)
          items: { $ref: "#/components/schemas/DefinitionProblem" }
        parse_error: { $ref: "#/components/schemas/ParseError" }
        section:
          allOf: [{ $ref: "#/components/schemas/Section" }]
          description: draft-conflict on a section save only, the section that changed
        value:
          description: draft-conflict on a section save only, the section's value now (Keep theirs / Overwrite)
        etag:
          type: string
          description: draft-conflict on a section save only, the section's etag now (resend with it to overwrite)
        path:
          type: string
          description: draft-conflict on a file write only, the file
        sha256:
          type: string
          description: draft-conflict on a file write only, the file's sha256 now; absent when the file is gone
        items: { $ref: "#/components/schemas/ItemsAtRemovedStations" }
        model_estimate:
          allOf: [{ $ref: "#/components/schemas/ModelProposalEstimate" }]
          description: learning-budget-exhausted of a model proposal only, the estimate it refused
        try_estimate:
          allOf: [{ $ref: "#/components/schemas/TryProposalEstimate" }]
          description: learning-budget-exhausted of Try again only, the estimate it refused
        uses:
          type: array
          description: secret-in-use only, what uses the secret
          items: { $ref: "#/components/schemas/SecretUse" }
        triggers:
          type: array
          description: webhook-in-use only, the published triggers that name the webhook
          items: { $ref: "#/components/schemas/WebhookTrigger" }
    AuthMode:
      type: string
      enum: [session, none]
      description: >-
        session: people sign in and every request carries a session or an API key. none: sign-in
        is off (GOAL_AUTH=none, a loopback install), every request acts as the local user.
    SignInMethod:
      type: string
      enum: [email_code, google]
    AuthConfig:
      type: object
      required: [mode, methods]
      properties:
        mode: { $ref: "#/components/schemas/AuthMode" }
        methods:
          type: array
          description: How people sign in under session; email_code unless GOAL_AUTH_EMAIL=off, google when GOAL_AUTH_GOOGLE=on; empty under none
          items: { $ref: "#/components/schemas/SignInMethod" }
    DeviceRequest:
      type: object
      description: A pending CLI sign-in (the device authorization grant, RFC 8628), as the person who approves it sees it
      required: [client_id, client_name, expires_at, same_ip]
      properties:
        client_id: { type: string, description: "The client the identity service accepted: goal-cli" }
        client_name: { type: string, description: "Its name for people: Goal CLI" }
        requested_at:
          type: string
          format: date-time
          description: When the CLI asked; absent when the security log has no record of it
        expires_at: { type: string, format: date-time, description: "When the code stops working (10 minutes after it was asked for)" }
        ip: { type: string, description: The address the CLI asked from; absent when unknown }
        user_agent: { type: string, description: "The CLI's user agent, as in goal/1.4 (darwin); absent when unknown" }
        same_ip:
          type: boolean
          description: >-
            The CLI asked from this browser's address (for IPv6, the same /64 network); false when
            either is unknown
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
    MeKey:
      type: object
      description: The API key a request acts as
      required: [id, name, org_id]
      properties:
        id: { type: string }
        name: { type: string }
        org_id: { type: string }
    MeToken:
      type: object
      description: The personal token a request carries
      required: [id, name, org_id, scopes, expires_at]
      properties:
        id: { type: string }
        name: { type: string }
        org_id: { type: string, description: The one organization it acts in }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        expires_at: { type: string, format: date-time }
    MeSession:
      type: object
      description: The browser or CLI session the request carries
      required: [created_at, expires_at, fresh_until]
      properties:
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        fresh_until:
          type: string
          format: date-time
          description: Until when changes that need a recent sign-in pass (10 minutes after created_at)
    Me:
      type: object
      required: [kind, mode, platform_admin]
      properties:
        kind: { type: string, enum: [user, service], description: "user: a person; service: an API key" }
        mode: { $ref: "#/components/schemas/AuthMode" }
        user:
          allOf: [{ $ref: "#/components/schemas/User" }]
          description: The signed-in person; absent for a key and under mode none (the local user)
        key:
          allOf: [{ $ref: "#/components/schemas/MeKey" }]
          description: kind service only
        token:
          allOf: [{ $ref: "#/components/schemas/MeToken" }]
          description: The person's personal token, when the request carries one (kind user, no session)
        platform_admin: { type: boolean, description: Always false with a personal token }
        session:
          allOf: [{ $ref: "#/components/schemas/MeSession" }]
          description: A signed-in person's session; absent for a key, a personal token and under mode none
    NotificationPreferences:
      type: object
      description: >-
        One person's notification preferences (ADR 0023, decision 1), in every organization they
        belong to
      required: [events, email, time_zone]
      properties:
        events: { $ref: "#/components/schemas/NotificationEvents" }
        email:
          type: string
          maxLength: 320
          description: Where email notifications go; blank is the sign-in email
        time_zone:
          type: string
          maxLength: 64
          description: The IANA time zone the daily digest goes out at 08:00 in, such as Europe/Berlin
    NotificationEvents:
      type: object
      description: The channels of each event
      required: [approval, question, andon, budget, digest]
      properties:
        approval:
          allOf: [{ $ref: "#/components/schemas/NotificationChannels" }]
          description: An agent needs the person's OK for a write
        question:
          allOf: [{ $ref: "#/components/schemas/NotificationChannels" }]
          description: An agent asks the person a question
        andon:
          allOf: [{ $ref: "#/components/schemas/NotificationChannels" }]
          description: A factory pulls the andon
        budget:
          allOf: [{ $ref: "#/components/schemas/NotificationChannels" }]
          description: A budget passes 80%
        digest:
          allOf: [{ $ref: "#/components/schemas/NotificationChannels" }]
          description: The daily digest at 08:00; in_goal is always false
    NotificationChannels:
      type: object
      required: [in_goal, email, slack]
      properties:
        in_goal: { type: boolean, description: "The app's own badge and toast" }
        email: { type: boolean }
        slack: { type: boolean, description: A direct message from the organization's Slack connection }
    PlatformAdmin:
      type: object
      required: [user, added_by, added_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        added_by:
          allOf: [{ $ref: "#/components/schemas/Actor" }]
          description: >-
            Who made them one: a platform admin, system bootstrap (the first sign-in) or system
            recovery (goal db recover-admin)
        added_at: { type: string, format: date-time }
    PlatformAdminList:
      type: object
      required: [admins]
      properties:
        admins:
          type: array
          items: { $ref: "#/components/schemas/PlatformAdmin" }
    NewPlatformAdmin:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 3, maxLength: 320 }
    AuthEvent:
      type: object
      description: One event of the install's security log
      required: [id, at, kind, data]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind: { type: string, description: "<noun>.<past_verb>, as in sign_in.succeeded or recovery.used" }
        user_id: { type: string, nullable: true, description: "The person the event is about, when known" }
        subject:
          type: string
          nullable: true
          description: base64url of the SHA-256 of the lowercase email or user code the event names; never the value
        ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        data:
          type: object
          additionalProperties: true
          description: The event's details; never a code, token, key or email
    AuthEventPage:
      type: object
      required: [events, next_before]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AuthEvent" }
        next_before:
          type: integer
          format: int64
          nullable: true
          description: The before of the next page; null on the last page
    OrgRole:
      type: string
      enum: [owner, admin, member]
    ApiKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
    ApiKey:
      type: object
      description: An organization's API key, never its secret
      required: [id, name, hint, scopes, role_ceiling, factories, created_by, created_at, expires_at, last_used_at, revoked_at, revoked_by]
      properties:
        id: { type: string }
        name: { type: string, description: 'The audit log names its actions "<name> (API key)"' }
        hint: { type: string, description: "goal_sk_ and the secret's first four characters", example: goal_sk_Ab3x }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        role_ceiling: { $ref: "#/components/schemas/FactoryRole" }
        factories:
          type: array
          nullable: true
          description: The ids of the factories it may reach; null for every factory, now and later
          items: { type: string }
        created_by: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true, description: Recorded at most once a minute }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoked_by:
          allOf: [{ $ref: "#/components/schemas/Actor" }]
          nullable: true
    NewApiKey:
      type: object
      required: [name, scopes, role_ceiling]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          maxItems: 64
          description: Permissions keys may carry, held by the creator
          items: { $ref: "#/components/schemas/Permission" }
        role_ceiling: { $ref: "#/components/schemas/FactoryRole" }
        factories:
          type: array
          minItems: 1
          description: The factories it may reach (ids or names); absent for every factory, now and later
          items: { type: string }
        expires_in_days: { type: integer, minimum: 1, maximum: 90, default: 90 }
    CreatedApiKey:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        secret:
          type: string
          description: goal_sk_ and base64url of 32 random bytes. Shown this once; send it as Authorization Bearer.
    PersonalTokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/PersonalToken" }
    PersonalToken:
      type: object
      description: A member's personal token in one organization, never its secret
      required: [id, name, hint, scopes, owner, created_at, expires_at, last_used_at, revoked_at, revoked_by]
      properties:
        id: { type: string }
        name: { type: string }
        hint: { type: string, description: "goal_pat_ and the secret's first four characters", example: goal_pat_Q7mk }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        owner:
          allOf: [{ $ref: "#/components/schemas/User" }]
          description: The member it acts as
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true, description: Recorded at most once a minute }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoked_by:
          allOf: [{ $ref: "#/components/schemas/Actor" }]
          nullable: true
    NewPersonalToken:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          maxItems: 64
          description: Permissions personal tokens may carry, held by you now
          items: { $ref: "#/components/schemas/Permission" }
        expires_in_days: { type: integer, minimum: 1, maximum: 90, default: 30 }
    CreatedPersonalToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/PersonalToken" }
        secret:
          type: string
          description: goal_pat_ and base64url of 32 random bytes. Shown this once; send it as Authorization Bearer.
    OrgList:
      type: object
      required: [orgs]
      properties:
        orgs:
          type: array
          items: { $ref: "#/components/schemas/OrgSummary" }
    OrgSummary:
      type: object
      description: An organization as the organization list shows it
      required: [id, slug, name, mark, factory_count]
      properties:
        id: { type: string }
        slug: { type: string, description: "The organization's address in URLs, as in /v1/orgs/acme" }
        name: { type: string }
        mark: { type: string, description: The one or two characters the organization rail shows }
        factory_count: { type: integer }
        role:
          allOf: [{ $ref: "#/components/schemas/OrgRole" }]
          nullable: true
          description: The caller's role in the organization; absent under GOAL_AUTH=none, null for an API key
    Org:
      type: object
      required: [id, slug, name, mark, factory_count, created_at, can]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        mark: { type: string }
        factory_count: { type: integer, description: The factories the caller can see }
        created_at: { type: string, format: date-time }
        role:
          allOf: [{ $ref: "#/components/schemas/OrgRole" }]
          nullable: true
          description: The caller's role in the organization; absent under GOAL_AUTH=none and for an API key
        can:
          type: array
          description: >-
            The organization permissions the caller holds, sorted: what the UI may offer (the
            server checks every request again). A fresh-only permission held with an older session
            is listed; using it answers 403 reauth-required. Under GOAL_AUTH=none, every one.
          items: { $ref: "#/components/schemas/Permission" }
    FactoryRole:
      type: string
      description: A ladder, each including the one before
      enum: [viewer, approver, editor]
    Permission:
      type: string
      description: One permission of contracts/api/permissions.yaml, such as org:read or item:decide
      pattern: "^[a-z_]+(:[a-z_]+)?$"
    FactoryRoleGrant:
      type: object
      description: A member's role on one factory
      required: [factory_id, role]
      properties:
        factory_id: { type: string }
        role: { $ref: "#/components/schemas/FactoryRole" }
    FactoryRoleChange:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/FactoryRole" }
    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    Member:
      type: object
      required: [member_id, user, role, factory_roles, joined_at, last_active_at, you, can_change_role, can_remove]
      properties:
        member_id:
          type: string
          description: The membership's id, which the identity service's update-member-role and remove-member name
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/OrgRole" }
        factory_roles:
          type: array
          description: >-
            By factory id, on the factories the caller sees. Owners and admins have none: they
            are editors in every factory by their organization role.
          items: { $ref: "#/components/schemas/FactoryRoleGrant" }
        joined_at: { type: string, format: date-time }
        last_active_at:
          type: string
          format: date-time
          nullable: true
          description: When their newest session was last used; null when they never signed in
        you: { type: boolean, description: This member is the caller }
        can_change_role:
          type: boolean
          description: >-
            Whether the caller may change this member's organization role: they hold
            member:manage, sign-in is on, and the member is not an owner, unless the caller is an
            owner too and the organization keeps another owner.
        can_remove:
          type: boolean
          description: As can_change_role, and not the caller themself (who leaves instead)
    InvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
    Invitation:
      type: object
      description: A pending invitation
      required: [id, email, role, factory_roles, inviter, created_at, expires_at]
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        factory_roles:
          type: array
          description: Given when the invitation is accepted, to a member only
          items: { $ref: "#/components/schemas/FactoryRoleGrant" }
        inviter: { $ref: "#/components/schemas/Inviter" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    Inviter:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    TransferRequest:
      type: object
      required: [to, confirm]
      properties:
        to: { type: string, description: The user id of the admin who becomes an owner }
        confirm: { type: string, description: "The organization's name, typed to confirm" }
    NewOrg:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$" }
        mark: { type: string, minLength: 1, maxLength: 2, description: Defaults to the name's initials }
    OrgDeletion:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, description: "The organization's name, typed to confirm" }
    OrgDeleted:
      type: object
      required: [purge_after]
      properties:
        purge_after: { type: string, format: date-time, description: When the purge job may remove everything }
    OrgSettings:
      type: object
      required: [name, slug, mark, slots]
      properties:
        name: { type: string }
        slug: { type: string }
        mark: { type: string }
        slots: { $ref: "#/components/schemas/OrgSlots" }
        signup_domain:
          description: The domain whose people may sign up without an invitation; absent when none is set
          allOf: [{ $ref: "#/components/schemas/SignupDomain" }]
    SignupDomain:
      type: object
      description: >-
        Sign-up by domain (ADR 0023, decision 7): anyone whose verified email is exactly at domain
        may sign up, joining as a member with join_role on every factory that exists then
      required: [domain, join_role, set_by, set_at]
      properties:
        domain: { type: string, description: Lower case, matched exactly; subdomains are not included }
        join_role: { $ref: "#/components/schemas/FactoryRole" }
        set_by: { $ref: "#/components/schemas/Actor" }
        set_at: { type: string, format: date-time }
    SignupDomainInput:
      type: object
      required: [domain]
      properties:
        domain: { type: string, minLength: 1, maxLength: 253, description: "A domain such as example.com; case is ignored" }
        join_role:
          description: The factory role people who join get; viewer when absent
          allOf: [{ $ref: "#/components/schemas/FactoryRole" }]
    CodeHostKind:
      type: string
      enum: [github, gitlab]
      description: The API the host speaks, GitHub's or GitLab's
    CodeHost:
      type: object
      required: [host, kind, api_base, built_in]
      properties:
        host: { type: string, description: "A DNS name in lower case, such as ghe.example.com" }
        kind: { $ref: "#/components/schemas/CodeHostKind" }
        api_base:
          type: string
          description: >-
            The REST API root goald derives: for GitHub, https://api.github.com for github.com,
            https://api.<name>.ghe.com for <name>.ghe.com and https://<host>/api/v3 for any other
            host; for GitLab, https://<host>/api/v4
        built_in: { type: boolean, description: "true for github.com and gitlab.com, which every organization lists" }
    CodeHosts:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          description: The built-in hosts first, then the added ones sorted by host
          items: { $ref: "#/components/schemas/CodeHost" }
    CodeHostInput:
      type: object
      required: [host, kind]
      properties:
        host: { type: string, minLength: 1, maxLength: 253, description: "A DNS name such as ghe.example.com; case is ignored" }
        kind: { $ref: "#/components/schemas/CodeHostKind" }
    CodeHostsInput:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          maxItems: 20
          description: Every host the organization adds, without github.com and gitlab.com; empty removes them all
          items: { $ref: "#/components/schemas/CodeHostInput" }
    OrgSlots:
      type: object
      description: >-
        Slot caps: how many agents may run at once across the organization's factories (max) and
        in each factory. null is no cap.
      required: [max, factories]
      properties:
        max: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        factories:
          type: array
          description: Every factory of the organization, by name
          items: { $ref: "#/components/schemas/FactorySlots" }
    FactorySlots:
      type: object
      required: [factory_id, name, max]
      properties:
        factory_id: { type: string }
        name: { type: string }
        max: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
    OrgPolicyInput:
      type: object
      description: >-
        What an organization allows every factory definition (ADR 0024). The revision is the
        If-Match header, never a field.
      required: [allowed_models, default_model, denied_commands, tools, box_time_limit_minutes]
      properties:
        allowed_models:
          type: array
          description: The model ids agents may use, a non-empty subset of the install's models
          items: { type: string }
        default_model:
          type: string
          description: One of allowed_models, the model of an agent that names none
        denied_commands:
          type: array
          description: Claude Code Bash permission patterns no agent may run, such as Bash(terraform apply:*)
          items: { type: string }
        tools: { $ref: "#/components/schemas/ToolPolicy" }
        mcp_tool_modes:
          type: object
          description: >-
            The organization's cap on MCP tool modes (ADR 0037 decision 12): a tool name or glob
            (* and ?), 1 to 128 letters, digits, underscores, dots, dashes, * or ?, mapped to
            allow, ask or off. Where a tool's mode and the cap disagree, the stricter wins (off,
            then ask, then allow). Empty means no cap. A save that omits it keeps the stored cap;
            a mode or pattern that is not valid is 400.
          additionalProperties: { $ref: "#/components/schemas/ConnectionToolMode" }
        box_time_limit_minutes:
          type: integer
          minimum: 1
          description: How long a box may run before it is stopped
    ToolPolicy:
      type: object
      description: The tool policy defaults (ADR 0024 decision 2)
      required: [write_outside_branch, merge_pull_request, read_web, use_credentials]
      properties:
        write_outside_branch:
          type: string
          enum: ["off", ask, allowed]
          description: Comments, issues, tickets and messages outside the item's branch
        merge_pull_request:
          type: string
          enum: ["off", review_approval]
        read_web:
          type: string
          enum: ["off", ask, allowed]
          description: Search, fetch and documentation tools
        use_credentials:
          type: string
          enum: ["off", environment, attached_only]
          description: >-
            Use secrets: environment gives an agent what its environment names; off gives it no
            env, files or MCP servers. attached_only is a deprecated alias for environment: a save
            stores it as environment, and every read returns environment.
    OrgPolicyView:
      type: object
      required: [policy, revision, models, box_sizes, egress_addresses]
      properties:
        policy: { $ref: "#/components/schemas/OrgPolicyInput" }
        revision:
          type: integer
          format: int64
          description: The policy's revision, 0 until a save; the ETag
        updated_at:
          type: string
          format: date-time
          description: When the policy was last saved; absent at revision 0
        models:
          type: array
          description: The install's models (GOAL_MODELS), in its order
          items: { $ref: "#/components/schemas/PolicyModel" }
        box_sizes:
          type: array
          description: small, medium and large, as the install's sandbox backend sizes them
          items: { $ref: "#/components/schemas/PolicyBoxSize" }
        egress_addresses:
          type: array
          description: The addresses agents' traffic leaves from, as CIDRs (GOAL_EGRESS_ADDRESSES); empty when not set
          items: { type: string }
    PolicyModel:
      type: object
      required: [id, label, used_by]
      properties:
        id: { type: string }
        label: { type: string }
        used_by:
          type: array
          description: >-
            The factories whose agents use the model now, by name; empty when none does. An agent
            uses its own model, else its factory's runtime.model, else the policy's default model.
          items: { $ref: "#/components/schemas/ModelUse" }
    ModelUse:
      type: object
      required: [factory_id, name, agents]
      properties:
        factory_id: { type: string }
        name: { type: string }
        agents:
          type: array
          description: The names of the factory's agents that use the model
          items: { type: string }
    PolicyBoxSize:
      type: object
      required: [size, vcpu, memory_bytes, factories]
      properties:
        size: { type: string, enum: [small, medium, large] }
        vcpu: { type: number, format: double, description: The virtual CPUs a box of this size gets }
        memory_bytes: { type: integer, format: int64 }
        factories:
          type: array
          description: The factories whose runtime.size is this size (medium when they name none), by name
          items: { $ref: "#/components/schemas/SizeUse" }
    SizeUse:
      type: object
      required: [factory_id, name]
      properties:
        factory_id: { type: string }
        name: { type: string }
    OrgSettingsPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$" }
        mark: { type: string, minLength: 1, maxLength: 2 }
        slots: { $ref: "#/components/schemas/OrgSlotsPatch" }
    OrgSlotsPatch:
      type: object
      description: >-
        When present, max sets the organization's cap (null clears it) and each listed factory's
        max sets its cap (null clears it); factories left out keep theirs.
      required: [max]
      properties:
        max: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        factories:
          type: array
          items: { $ref: "#/components/schemas/FactorySlotsPatch" }
    FactorySlotsPatch:
      type: object
      required: [factory_id, max]
      properties:
        factory_id: { type: string, description: "The factory's metadata.id or metadata.name" }
        max: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
    AuditPage:
      type: object
      required: [entries, next_before]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_before:
          type: integer
          format: int64
          nullable: true
          description: The before of the next page; null on the last page
    AuditEntry:
      type: object
      required: [id, at, actor, action, target, data]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        action: { type: string, description: "<noun>.<past_verb>, as in org.updated" }
        target: { $ref: "#/components/schemas/AuditTarget" }
        factory_id: { type: string, description: Set when the entry concerns one factory }
        data:
          type: object
          additionalProperties: true
          description: >-
            What changed; for org.updated each changed field's {from, to}, slot caps as max_slots
            and factory_slots (by factory id), a missing cap as null
    AuditTarget:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, description: What the entry is about, as in org or factory }
        id: { type: string }
    Actor:
      type: object
      description: >-
        Who did something: a person (kind user; id "local" is the local user, named "Local user
        (before sign-in)" once sign-in is on), an API key (kind service, "<name> (API key)"), an
        agent or a job. Under sign-in a person is named as the sidebar names them (their name, or
        their email while they have none), or "A former member" once they have left the
        organization; their id stays the same
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [user, service, agent, system] }
        id: { type: string, description: '"local" for the local user, an agent''s name or a job''s name' }
        name: { type: string }
    FactoryList:
      type: object
      required: [factories]
      properties:
        factories:
          type: array
          items: { $ref: "#/components/schemas/Factory" }
    Factory:
      type: object
      required: [id, org_id, name, stations, work_types, current, draft, paused, created_at, can]
      properties:
        id: { type: string }
        org_id: { type: string, description: The organization that owns the factory }
        name: { type: string }
        title: { type: string }
        description: { type: string }
        work_types:
          type: array
          description: The work types of the version goald runs; empty before the first publish
          items: { type: string }
        stations:
          type: array
          description: The stations of the version goald runs; empty before the first publish
          items: { $ref: "#/components/schemas/Station" }
        current:
          description: The version that runs ("v8"); null before the first publish
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VersionRef" }]
        draft:
          description: The open draft ("v8 + draft"); null when none is open
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DraftRef" }]
        paused: { type: boolean, description: A paused factory takes no work; runs in progress finish }
        archived_at: { type: string, format: date-time, description: When the factory was archived; absent unless it is }
        archived_by:
          description: Who archived the factory; absent unless it is archived
          allOf: [{ $ref: "#/components/schemas/Actor" }]
        created_at: { type: string, format: date-time }
        role:
          allOf: [{ $ref: "#/components/schemas/FactoryRole" }]
          nullable: true
          description: >-
            The caller's effective role on the factory: editor for owners and admins, an API key's
            ceiling; absent under GOAL_AUTH=none
        can:
          type: array
          description: The factory permissions the caller holds, sorted (as Org.can)
          items: { $ref: "#/components/schemas/Permission" }
    Station:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/StationKind" }
        action: { $ref: "#/components/schemas/StationAction" }
        description: { type: string, description: "What happens at the station, from the definition (shown on the item's path)" }
    StationKind:
      type: string
      enum: [queue, agent, human, done]
    StationAction:
      type: string
      description: What goald does when a human acts at this human station (merge → POST /v1/orgs/{org}/items/{item}/merge)
      enum: [merge]
    ItemState:
      type: string
      description: "assembly: the item was split into parts (its children) and closes when they are; never claimed (ADR 0012)"
      enum: [queued, ready, in_progress, waiting_human, blocked, done, cancelled, assembly]
    ClassOfService:
      type: string
      enum: [standard, expedite]
    NewItem:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        type: { type: string, description: "One of the factory's work types; absent or empty, the first it declares, or none when it declares none" }
        lane: { type: string }
        priority: { type: integer, default: 0 }
        start:
          description: When the item may start; absent, as soon as it can
          allOf: [{ $ref: "#/components/schemas/Start" }]
        repositories:
          type: array
          maxItems: 10
          description: >-
            The repositories the item works on, in order, the first being its first repository
            (ADR 0041 decision 4). Each is a runtime.repositories entry's name, owner/name (or
            group/sub/name) under one of the entries' hosts, host/owner/name or an https URL, that
            an entry covers. Values naming the same repository count once. Absent or empty, the
            factory's default entry's, or none without a default entry
          items: { type: string, minLength: 1 }
    ItemRepository:
      type: object
      description: One repository of an item and how it joined it (ADR 0041 decision 4)
      required: [repo, joined]
      properties:
        repo: { type: string, description: "The repository's normalized host/owner/name in lower case, as in github.com/acme/api" }
        joined:
          type: string
          enum: [filing, default, push, output]
          description: "How it joined: named at filing, the default entry's, an agent pushed to it, or a station's output named it"
        joined_at:
          type: string
          format: date-time
          description: When it joined; absent for an older item's default entry, resolved when it is read
    Start:
      type: object
      description: >-
        When an item may start (ADR 0040): at a time, after a wait, after other items, or a time
        and items. at and in cannot both be set. The start is at most 365 days ahead.
      properties:
        at:
          type: string
          minLength: 1
          description: >-
            An RFC 3339 time, or a date and time without a zone (2026-11-05T09:00, 2026-11-05
            09:00 or 2026-11-05), read in the caller's time zone from their notification settings;
            UTC for an API key or when they saved none
        in:
          type: string
          pattern: "^[1-9][0-9]{0,4}[hdw]$"
          description: A wait from now in whole hours, days or weeks, as in 36h, 7d or 2w; it becomes at
        after:
          type: array
          maxItems: 50
          description: The items it starts after, each an id (a UUID) or <factory>#<number>, as in goal#2, of the same factory
          items: { type: string, minLength: 1 }
    FollowUp:
      type: object
      description: >-
        Work an agent noticed outside its item, kept on the item (ADR 0040): a note for an open
        item, a start for an item of its own when the work lands, or text for the factory's triage
        item
      required: [id, item_id, station, agent, text, state, created_at]
      properties:
        id: { type: string }
        item_id: { type: string, description: The source item }
        station: { type: string, description: The station whose run wrote it }
        agent: { type: string }
        text: { type: string }
        target:
          type: string
          enum: [note, start, triage]
          description: Where it goes, or went; absent for one dropped as it was read
        state:
          type: string
          enum: [waiting, delivered, filed, dropped]
        reason:
          type: string
          description: Why it was dropped, or why it went to triage instead of where it said
        filed_item_id:
          type: string
          description: The item it was filed as or onto, a triage item for target triage
        filed_item:
          type: string
          description: >-
            The <factory name>#<number> of filed_item_id, another factory's included; getItem
            only, absent when it is not filed or that item is gone
        for:
          type: string
          description: "A note's item, <factory name>#<number>, as the agent wrote it; absent for any other target"
        start:
          description: A start's item, which it files when its work lands; absent for any other target
          allOf: [{ $ref: "#/components/schemas/FollowUpStart" }]
        created_at: { type: string, format: date-time }
    FollowUpStart:
      type: object
      description: >-
        When the item a start follow-up files may start, as the agent wrote it: at a time, a
        wait after the work lands, after other items, or a mix
      required: [title]
      properties:
        title: { type: string }
        at: { type: string, description: A time, as written }
        in: { type: string, description: "A wait after the work lands, as in 7d" }
        after:
          type: array
          description: Refs of the items it waits for
          items: { type: string }
        factory: { type: string, description: The factory it is filed in, when another than the source's }
    ItemNoteFrom:
      type: object
      description: >-
        A note another item's agent, or a trigger's check, left on the item (an item_note event);
        it reaches the item's next run after its brief
      required: [id, text, agent, at]
      properties:
        id: { type: integer, format: int64, description: The item_note event's id }
        text: { type: string, description: The agent's text, to show as text, never markup }
        from_item: { type: string, description: "The source item, <factory name>#<number>; absent for a check's note" }
        from_item_id: { type: string }
        from_factory_id: { type: string, description: The source item's factory; absent for a check's note }
        station: { type: string, description: The station whose run wrote it; absent for a check's note }
        trigger: { type: string, description: The trigger whose check wrote it; absent for an item's note }
        agent: { type: string }
        at: { type: string, format: date-time }
    ItemCameFrom:
      type: object
      description: Where an item came from; follow_ups for origin follow-up, trigger for origin trigger
      properties:
        follow_ups:
          type: array
          description: >-
            The follow-ups filed as or onto the item, oldest first: its sources. Present, an
            empty list when none resolves, for origin follow-up; absent otherwise
          items: { $ref: "#/components/schemas/CameFromFollowUp" }
        trigger:
          description: The trigger that filed the item; present for origin trigger, absent otherwise
          allOf: [{ $ref: "#/components/schemas/CameFromTrigger" }]
    CameFromFollowUp:
      type: object
      description: A follow-up an item was filed from, the item and run that wrote it and the landing that filed it
      required: [id, from_item, from_item_id, agent, station, landed_item, landed_item_id]
      properties:
        id: { type: string, description: The follow-up's id }
        from_item: { type: string, description: "The source item, <factory name>#<number>, another factory's included" }
        from_item_id: { type: string }
        agent: { type: string, description: The agent whose run wrote it }
        station: { type: string, description: The station whose run wrote it }
        landed_item:
          type: string
          description: "The item whose landing filed it, <factory name>#<number>: the source, or its assembly when the source is a part"
        landed_item_id: { type: string }
    CameFromTrigger:
      type: object
      description: The trigger that filed an item
      required: [name]
      properties:
        name: { type: string, description: The trigger's name }
        kind:
          type: string
          enum: [schedule, check, webhook]
          description: >-
            check for a trigger with a check, schedule for another schedule trigger, webhook
            otherwise; absent when the trigger is not in the factory's loaded definition
        key:
          type: string
          description: >-
            The key a check filed the item under; absent for any other trigger, and when the
            check filed the key again since, which keeps only the key's last item
    FileFollowUpRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        type: { type: string, description: "One of the factory's work types; absent or empty, the first it declares, or none when it declares none" }
        lane: { type: string }
        start:
          description: When the item may start; absent, as soon as it can
          allOf: [{ $ref: "#/components/schemas/Start" }]
    ItemStart:
      type: object
      description: When an item that has not started may start
      required: [at]
      properties:
        at: { type: string, format: date-time }
    Rejection:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, description: What the agent must change }
    MoveRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, minLength: 1, description: The id of the station to move the item to }
        reason:
          type: string
          maxLength: 500
          description: Why; required when the station is upstream of the item's (the agent reads it)
    SetLaneRequest:
      type: object
      required: [lane]
      properties:
        lane: { type: string, minLength: 1, maxLength: 100, description: The lane to set, one a station of the item's line routes when any does }
    PauseRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Why the item is paused }
    CancelRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Why the item is cancelled }
    MergeRequest:
      type: object
      properties:
        method: { type: string, enum: [squash], default: squash }
    Item:
      type: object
      required: [id, ref, factory_id, number, type, title, body, station, state, class_of_service, priority, rework_count, cost_usd, outputs, created_at, updated_at]
      properties:
        id: { type: string }
        ref: { type: string, description: "<factory name>#<number>, as in goal#2" }
        factory_id: { type: string }
        number: { type: integer, format: int64 }
        parent_id: { type: string }
        part_key: { type: string, description: "The part's key in its assembly's plan; absent unless the item is a part" }
        part_paths:
          type: array
          description: The files the plan said the part changes; absent unless the item is a part
          items: { type: string }
        assembly:
          description: >-
            The assembly the item is a part of, and its place among the parts in plan order;
            getItem only, absent unless the item is a part. The parts themselves are listItemParts
          allOf: [{ $ref: "#/components/schemas/PartOf" }]
        origin:
          type: string
          enum: [person, plan, trigger, follow-up]
          description: "Where the item came from: a person filed it, a plan made it a part, a trigger or follow-ups filed it (ADR 0040)"
        start:
          description: >-
            When the item may start, absent when it may start now; it waits at the first station
            until then (ADR 0040). Its after items are its needs
          allOf: [{ $ref: "#/components/schemas/ItemStart" }]
        via: { type: string, enum: [web, cli, api], description: "How a person filed it; absent for any other origin" }
        created_by:
          description: Who filed it; absent for items filed before ADR 0040 and for the engine's filings
          allOf: [{ $ref: "#/components/schemas/Actor" }]
        untrusted:
          type: boolean
          description: >-
            Whether it, or an item it came from, was made from a webhook delivery (ADR 0040
            decision 21): a person merges its work, and its follow-ups wait for a person
        came_from:
          description: >-
            Where a follow-up's or a trigger's item came from (ADR 0040 decision 2): the
            follow-ups filed as it, or its trigger; getItem only, absent unless origin is
            follow-up or trigger
          allOf: [{ $ref: "#/components/schemas/ItemCameFrom" }]
        follow_ups:
          type: array
          description: >-
            The follow-ups its runs wrote, oldest first, each saying where it went or will go;
            getItem only
          items: { $ref: "#/components/schemas/FollowUp" }
        notes:
          type: array
          description: The notes other items' agents and triggers' checks left on it, oldest first, at most 200; getItem only
          items: { $ref: "#/components/schemas/ItemNoteFrom" }
        type: { type: string }
        lane: { type: string }
        title: { type: string }
        body: { type: string }
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        class_of_service: { $ref: "#/components/schemas/ClassOfService" }
        priority: { type: integer }
        rework_count: { type: integer }
        cost_usd: { type: number, format: double }
        outputs:
          type: object
          description: Each station's output, by station id
          additionalProperties: {}
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        done_at: { type: string, format: date-time }
        flow:
          $ref: "#/components/schemas/ItemFlow"
        touches:
          description: The item's human touches; getItem only
          allOf: [{ $ref: "#/components/schemas/ItemTouches" }]
        needs:
          type: array
          description: The items this item needs, oldest edge first; getItem only
          items: { $ref: "#/components/schemas/ItemLink" }
        dependents:
          type: array
          description: The items that need this item, oldest edge first; getItem only
          items: { $ref: "#/components/schemas/ItemLink" }
        waiting:
          description: Why the item is not claimed yet; getItem only, absent unless it is queued or ready with an open need
          allOf: [{ $ref: "#/components/schemas/ItemWaiting" }]
        question:
          description: >-
            The question the item's agent asked a person and nobody has answered yet (ADR 0018);
            getItem and answerItem only, absent or null when there is none
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ItemQuestion" }]
        tool_approval:
          description: >-
            The tool call the item's agent asked to make that waits for a person's decision (ADR
            0031); getItem and decideToolApproval only, absent or null when there is none
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ToolApproval" }]
        branch: { type: string, description: "The git branch the item's changes live on, as in goal/12-add-a-flag; goald always sets it" }
        repositories:
          type: array
          description: >-
            The repositories the item works on, in the order they joined, the first being its
            first repository (ADR 0041 decision 4); submitItem and getItem only (ItemCard has
            them too). An item filed
            before repositories shows the factory's default entry's, and an item of a factory
            without code none
          items: { $ref: "#/components/schemas/ItemRepository" }
    ToolApproval:
      type: object
      description: >-
        A run's call of an Ask-first connection tool that waits for a person, read from its
        tool_approval_requested event
      required: [id, connection, tool, input, agent, run_id, asked_at, always_allow_offered]
      properties:
        id: { type: integer, format: int64, description: The approval's id, its tool_approval_requested event's }
        connection: { type: string, description: The organization connection's name }
        tool: { type: string, description: "The tool's name as the connection's MCP server lists it, as in create_comment" }
        input:
          description: The call's input, any JSON value, as canonical JSON (keys sorted); at most 16 KiB
        agent: { type: string, description: "The calling agent's role name, as in architect; never its copy number" }
        run_id: { type: string, description: The run that asked; it ended when it asked }
        asked_at: { type: string, format: date-time }
        always_allow_offered:
          type: boolean
          description: >-
            Whether a person may approve the call with always_allow: its ask comes from the
            organization connection's mode alone
    ToolDecision:
      type: object
      description: A person's decision on an item's open tool approval
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
        always_allow:
          type: boolean
          default: false
          description: >-
            With approve only: also let the agent role call this tool of this connection without
            asking from now on (a standing rule); needs standing_rule:manage
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: With deny only, the person's reason, 1 to 2000 characters (surrounding space is trimmed)
    StandingRuleList:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/StandingRule" }
    StandingRule:
      type: object
      description: >-
        Lets one agent role call one tool without asking (ADR 0031 decision 7). A rule is keyed by
        one MCP server of one environment of one factory (ADR 0037 decision 8)
      required: [id, factory_id, environment, server, tool, agent, created_by, created_at, item_id, revoked_by, revoked_at]
      properties:
        id: { type: string }
        factory_id: { type: string, description: The factory the rule is keyed by }
        environment: { type: string, description: "The environment file's name, as in default" }
        server: { type: string, description: "The MCP server's name in the environment file (mcp.<server>)" }
        tool: { type: string }
        agent: { type: string, description: "The agent's role, its name in the definition, as in architect" }
        created_by: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
        item_id: { type: string, description: The item it was approved on }
        revoked_by:
          allOf: [{ $ref: "#/components/schemas/Actor" }]
          nullable: true
        revoked_at: { type: string, format: date-time, nullable: true }
    ItemQuestion:
      type: object
      description: An agent's open question about an item, read from its question_asked event
      required: [text, choices, asked_at, agent, run_id]
      properties:
        text: { type: string, description: The question, 1 to 500 characters }
        choices:
          type: array
          description: The quick answers the agent offered, 0 to 4; empty for a free answer only
          items: { type: string }
        asked_at: { type: string, format: date-time }
        agent: { type: string, description: "The asking agent's role name, as in frontend-engineer; never its copy number" }
        run_id: { type: string, description: The run that asked; it ended when it asked }
    ItemAnswer:
      type: object
      description: A person's answer to an item's open question; exactly one of answer and choice
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 2000
          description: The answer in the person's own words, 1 to 2000 characters (surrounding space is trimmed)
        choice:
          type: integer
          minimum: 0
          description: The index of the picked choice in Item.question.choices
    ItemWaiting:
      type: object
      description: >-
        Why a queued or ready item is not claimed yet, derived on every read and never stored from
        its open needs (those neither done nor cancelled) and its open CI waits at its station.
        Precedence: planned and linked needs (after) win, then overlap ones (files), then turn
        ones (turn), then an open CI wait (ci)
      required: [kind, items, files, needs]
      properties:
        kind:
          type: string
          enum: [after, files, turn, ci]
          x-enum-varnames: [WaitingAfter, WaitingFiles, WaitingTurn, WaitingCI]
          description: "after: it waits for the items it needs (planned or linked); files: for items whose files overlap its own (overlap); turn: for the item that holds its merge target's turn at a merge station to be done (turn); ci: for CI on its commits to finish, at a station with waitFor: ci (items, files and needs are then empty)"
        items:
          type: array
          description: "Refs (<factory name>#<number>) of the open needs of that kind, oldest edge first"
          items: { type: string }
        files:
          type: array
          description: "For kind files, the item's own paths that overlap those items' paths, in the item's order; empty for kind after"
          items: { type: string }
        needs:
          type: array
          description: The open needs of that kind, oldest edge first, the same ones as items
          items: { $ref: "#/components/schemas/ItemWaitingNeed" }
        target:
          type: string
          nullable: true
          description: "For kind turn, the integration branch whose turn the item waits for, as in goal/a7-x; null or absent when the turn is for the default branch, and for kinds after, files and ci"
        ci:
          allOf: [{ $ref: "#/components/schemas/ItemWaitingCI" }]
          nullable: true
          description: For kind ci, the commits CI runs on and their checks as goald last read them; null or absent for the other kinds
    ItemWaitingCI:
      type: object
      description: The CI an item waits for, one commit per open CI wait, by start
      required: [commits, checks, finished, total]
      properties:
        commits:
          type: array
          items: { $ref: "#/components/schemas/CICommit" }
        checks:
          type: array
          description: Every commit's checks, by commit and then in the code host's order; empty until goald's first poll reads any
          items: { $ref: "#/components/schemas/CICheck" }
        finished: { type: integer, description: How many of the checks have finished, as in 9 of 14 }
        total: { type: integer, description: How many checks there are }
        failure:
          allOf: [{ $ref: "#/components/schemas/CIFailure" }]
          nullable: true
          description: The latest CI wait of the same visit to the station that ended failed or timed_out, which sent the item back; null or absent when none did
    CICommit:
      type: object
      description: A commit CI runs on
      required: [repo, sha]
      properties:
        repo: { type: string, description: "The repository's key, as in github.com/acme/app" }
        sha: { type: string, description: The commit's sha }
        url: { type: string, nullable: true, description: "The pull request the commit is on; null or absent when the wait has none" }
    CICheck:
      type: object
      description: One check CI runs on a commit, as goald last read it from the code host
      required: [repo, name, state, failed_jobs]
      properties:
        repo: { type: string, description: The key of the repository whose commit the check runs on }
        name: { type: string, description: The check's name as the code host shows it }
        state: { type: string, enum: [pending, running, finished], description: How far the check has got }
        result: { type: string, enum: [passed, failed, neutral], nullable: true, description: What a finished check concluded; null or absent until it finishes }
        url: { type: string, nullable: true, description: The check on the code host; null or absent when the host gives none }
        failed_jobs:
          type: array
          description: At most 5 of the check's failed jobs, where the host names them
          items: { type: string }
    CIFailure:
      type: object
      description: The CI wait whose failure sent an item back
      required: [repo, sha, checks]
      properties:
        repo: { type: string, description: "The repository's key, as in github.com/acme/app" }
        sha: { type: string, description: The commit whose CI failed }
        url: { type: string, nullable: true, description: "The pull request the commit is on; null or absent when the wait has none" }
        checks:
          type: array
          description: The checks that failed, as last read; empty when it timed out with none failed
          items: { $ref: "#/components/schemas/CICheck" }
    ItemWaitingNeed:
      type: object
      description: One open need that holds a waiting item
      required: [ref, title, paths]
      properties:
        ref: { type: string, description: "The needed item's <factory name>#<number>" }
        title: { type: string, description: The needed item's title }
        paths:
          type: array
          description: "The needed item's file globs, or for an assembly its parts' planned paths (part_paths) by part number, each glob once; empty when none are known"
          items: { type: string }
    NewLink:
      type: object
      required: [needs]
      properties:
        needs:
          type: string
          minLength: 1
          description: The needed item's id (a UUID) or <factory>#<number>, as in goal#2; an item of the same factory
    ItemLink:
      type: object
      description: One end of a dependency between two items, seen from the other end
      required: [id, ref, kind, state, by, at]
      properties:
        id: { type: string, description: The other item's id }
        ref: { type: string, description: "The other item's <factory name>#<number>" }
        kind: { type: string, enum: [planned, linked, overlap, turn], description: "planned by whoever split the work, linked by a person, overlap (their files overlap), or turn (by the engine, while the other item holds their merge target's turn at a merge station)" }
        state: { $ref: "#/components/schemas/ItemState" }
        by: { type: string, description: "The edge's author, as an actor ref (<kind>:<id>, as in user:<id> or agent:<id>)" }
        at: { type: string, format: date-time, description: When the edge was added }
    AssemblyParts:
      type: object
      required: [done, total, lead_time_seconds, parts]
      properties:
        done: { type: integer, description: Parts done }
        total: { type: integer, description: All parts }
        lead_time_seconds:
          type: integer
          format: int64
          description: The assembly's lead time, created to its last part done, or to now while it is open; 0 for an item that is not an assembly
        parts:
          type: array
          description: In plan order
          items: { $ref: "#/components/schemas/AssemblyPart" }
    NewPartRequest:
      type: object
      required: [title, brief]
      properties:
        title: { type: string, maxLength: 200, description: "The part's title; its key is derived from it (surrounding space is trimmed)" }
        lane: { type: string, description: The lane of the station's agents that should work the part }
        brief: { type: string, maxLength: 10000, description: What the part must do, its body }
        needs:
          type: array
          description: The keys of the assembly's parts this one waits for
          items: { type: string }
    AssemblyPart:
      type: object
      required: [id, ref, number, index, key, title, paths, station, state, needs, waiting_on, waiting, wave, cost_usd, pr_url, agent, created_at, done_at]
      properties:
        id: { type: string }
        ref: { type: string, description: "<factory name>#<number>" }
        number: { type: integer, format: int64 }
        index: { type: integer, minimum: 1, description: "1-based position in the plan, as in part 3 of 6" }
        key: { type: string, description: The part's key in the plan }
        title: { type: string }
        paths:
          type: array
          description: The files the plan said the part changes
          items: { type: string }
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        needs:
          type: array
          description: Refs of the parts this part needs
          items: { type: string }
        waiting_on:
          type: array
          description: Refs of the needs that are neither done nor cancelled
          items: { type: string }
        waiting:
          allOf: [{ $ref: "#/components/schemas/ItemWaiting" }]
          nullable: true
          description: Why the part is not claimed yet, the same object getItem returns as Item.waiting; null when it isn't waiting
        wave: { type: integer, minimum: 0, description: "0 for no needs, otherwise 1 + the largest wave among its needs" }
        cost_usd: { type: number, format: double }
        pr_url: { type: string, nullable: true, description: The pull request its outputs name }
        agent: { type: string, nullable: true, description: The agent id working it while in progress; never a numbered copy }
        created_at: { type: string, format: date-time }
        done_at: { type: string, format: date-time, nullable: true }
    ItemTouches:
      type: object
      required: [count, planned, unplanned, list]
      properties:
        count: { type: integer }
        planned: { type: integer, description: Decisions the line requires (an approval or merge at a human station) }
        unplanned: { type: integer }
        list:
          type: array
          description: The touches in time order
          items: { $ref: "#/components/schemas/Touch" }
    Touch:
      type: object
      description: One action by a person on an item, named by its most specific event
      required: [event_id, kind, station, at, actor, planned, reason, reason_by]
      properties:
        event_id: { type: integer, format: int64, description: The naming event; its reason is set by setTouchReason }
        kind: { type: string, description: "The naming event's kind: merged, rejected, approved, moved, paused, cancelled, retried, lane_set, note, ..." }
        station: { type: string, nullable: true }
        at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        planned: { type: boolean }
        reason:
          nullable: true
          description: Why the person had to act; planned touches start as required_gate, others with none
          allOf: [{ $ref: "#/components/schemas/TouchReason" }]
        reason_by:
          type: string
          nullable: true
          description: Who set the reason (user:<id>); null for the planned default or none
    TouchReason:
      type: string
      enum: [missing_knowledge, wrong_decision, required_gate, other]
    TouchReasonChange:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/TouchReason" }
    TouchHeadline:
      type: object
      description: Human touches of the items finished in a window, in brief
      required: [finished, per_item_mean, per_item_median, touchless_rate]
      properties:
        finished: { type: integer, description: Items finished (done) in the window }
        per_item_mean: { type: number, format: double, description: Touches per finished item; 0 when none finished }
        per_item_median: { type: number, format: double }
        touchless_rate: { type: number, format: double, description: Share of the finished items no person touched }
    TouchTrend:
      type: object
      required: [current, previous]
      properties:
        current: { $ref: "#/components/schemas/TouchHeadline" }
        previous: { allOf: [{ $ref: "#/components/schemas/TouchHeadline" }], description: The window of the same length just before }
    TouchCount:
      type: object
      required: [key, touches, planned, unplanned]
      properties:
        key: { type: string, description: A station or an event kind; "" for touches with no station }
        touches: { type: integer }
        planned: { type: integer }
        unplanned: { type: integer }
    TouchReasonCount:
      type: object
      required: [reason, touches, planned, unplanned]
      properties:
        reason:
          nullable: true
          description: null for the touches no reason was set on
          allOf: [{ $ref: "#/components/schemas/TouchReason" }]
        touches: { type: integer }
        planned: { type: integer }
        unplanned: { type: integer }
    VersionTouches:
      type: object
      description: The items whose last agent run ran on one definition version
      required: [version_id, number, finished, touches, touchless_rate, per_item_mean, planned_per_item, unplanned_per_item]
      properties:
        version_id: { type: string, nullable: true, description: null for the items no agent ran }
        number: { type: integer, nullable: true }
        finished: { type: integer }
        touches: { type: integer }
        touchless_rate: { type: number, format: double }
        per_item_mean: { type: number, format: double }
        planned_per_item: { type: number, format: double }
        unplanned_per_item: { type: number, format: double }
    TouchStats:
      type: object
      required:
        - finished
        - touches
        - planned
        - unplanned
        - touchless_rate
        - per_item_mean
        - per_item_median
        - planned_per_item
        - unplanned_per_item
        - by_station
        - by_kind
        - by_reason
        - by_version
        - line_stops
      properties:
        finished: { type: integer, description: Items finished (done) in the range }
        touches: { type: integer }
        planned: { type: integer }
        unplanned: { type: integer }
        touchless_rate: { type: number, format: double, description: Share of the finished items no person touched; 0 when none finished }
        per_item_mean: { type: number, format: double }
        per_item_median: { type: number, format: double }
        planned_per_item: { type: number, format: double }
        unplanned_per_item: { type: number, format: double }
        by_station:
          type: array
          description: By the station the touch happened at, the most touches first
          items: { $ref: "#/components/schemas/TouchCount" }
        by_kind:
          type: array
          description: By the touch's kind, the most touches first
          items: { $ref: "#/components/schemas/TouchCount" }
        by_reason:
          type: array
          description: By reason, the most touches first
          items: { $ref: "#/components/schemas/TouchReasonCount" }
        by_version:
          type: array
          description: By the definition version of each item's last agent run, newest version first, items no agent ran last
          items: { $ref: "#/components/schemas/VersionTouches" }
        line_stops: { type: integer, description: "Andon pulls people made in the range: the line's, not an item's" }
    TouchWeek:
      type: object
      required: [from, to, finished, per_item_mean, touchless_rate]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        finished: { type: integer }
        per_item_mean: { type: number, format: double }
        touchless_rate: { type: number, format: double }
    TouchDay:
      type: object
      required: [day, finished, per_item_mean, touchless_rate]
      properties:
        day: { type: string, format: date, description: The UTC day }
        finished: { type: integer }
        per_item_mean: { type: number, format: double }
        touchless_rate: { type: number, format: double }
    TouchMetrics:
      type: object
      required: [from, to, type, version, stats, weekly, daily]
      properties:
        from: { type: string, format: date, description: The range's first UTC day }
        to: { type: string, format: date, description: The range's last UTC day, included }
        type: { type: string, nullable: true, description: The work type asked for; null for every type }
        version: { type: integer, nullable: true, description: The version number asked for; null for every version }
        stats: { $ref: "#/components/schemas/TouchStats" }
        weekly:
          type: array
          description: The headline in each of the weeks ending on to, oldest first
          items: { $ref: "#/components/schemas/TouchWeek" }
        daily:
          type: array
          description: The headline in each of the 7 UTC days ending on to, oldest first
          items: { $ref: "#/components/schemas/TouchDay" }
    OrgTouchMetrics:
      type: object
      required: [from, to, total, factories]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { $ref: "#/components/schemas/TouchStats" }
        factories:
          type: array
          description: Each factory the caller may read, in name order
          items: { $ref: "#/components/schemas/FactoryTouchMetrics" }
    FactoryTouchMetrics:
      type: object
      required: [factory_id, name, stats]
      properties:
        factory_id: { type: string }
        name: { type: string }
        title: { type: string }
        stats: { $ref: "#/components/schemas/TouchStats" }
    ItemFlow:
      type: object
      description: How the item flows, on GET of one item only
      required: [spans, target_seconds, rework_target, budget, current_run]
      properties:
        spans:
          type: array
          description: The item's spans in the order it entered them; an open item's last span is open
          items: { $ref: "#/components/schemas/ItemSpan" }
        target_seconds:
          type: integer
          format: int64
          nullable: true
          description: The lead time the item is measured against (the expedite target for expedite items, the line's lead-time target otherwise), or null without one
        rework_target:
          type: string
          nullable: true
          description: The station a send-back from the item's station goes to, or null when there is none (done, cancelled, nothing upstream)
        budget: { $ref: "#/components/schemas/ItemBudget" }
        current_run:
          description: The agent run in progress, or null
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CurrentRun"
    ItemSpan:
      type: object
      description: A stretch of time the item spent at one station in one state and rework round
      required: [station, state, rework_round, rework_by, entered_at, left_at]
      properties:
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        rework_round: { type: integer, description: The item's rework count during the span }
        rework_by:
          type: string
          nullable: true
          description: The station that sent the item back for this round; null in round 0
        entered_at: { type: string, format: date-time }
        left_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the item is still in this span
    ItemBudget:
      type: object
      description: The limits of one task at the item's station (its agent's own, else the factory's runtime budget)
      required: [per_item_usd, max_turns_per_task]
      properties:
        per_item_usd: { type: number, format: double, nullable: true }
        max_turns_per_task: { type: integer, nullable: true }
    Teardown:
      type: object
      description: >-
        Where one item's lead time, cost and human help went (ADR 0019 decision 3). Times are whole
        seconds and costs US dollars. target_seconds and budget_usd are left out when the item has
        none or its factory is not loaded.
      required: [open, lead_time_seconds, cost_usd, rework, touch_count, touch_wait_seconds, stations, total, runs, run_total, loops, touches]
      properties:
        open: { type: boolean, description: "The item is neither done nor cancelled: the breakdown so far, until now" }
        lead_time_seconds: { type: integer, format: int64, description: From the item's first span until its last closed, or until now while open }
        target_seconds: { type: integer, format: int64, description: The factory's lead-time target for the item's class of service }
        cost_usd: { type: number, format: double, description: What the item's runs cost }
        budget_usd: { type: number, format: double, description: The per-item budget at the item's station }
        rework: { $ref: "#/components/schemas/TeardownRework" }
        touch_count: { type: integer, description: The human touches }
        touch_wait_seconds: { type: integer, format: int64, description: The time the item waited on people, over its touches }
        stations:
          type: array
          description: The stations the item spent time at, in the order it first reached them
          items: { $ref: "#/components/schemas/TeardownStation" }
        total: { $ref: "#/components/schemas/TeardownTime" }
        runs:
          type: array
          description: The item's agent runs, oldest first
          items: { $ref: "#/components/schemas/TeardownRun" }
        run_total: { $ref: "#/components/schemas/TeardownRunTotal" }
        loops:
          type: array
          description: Why the item went back, in time order
          items: { $ref: "#/components/schemas/ReworkLoop" }
        touches:
          type: array
          description: The human touches in time order, each with how long the item waited for it
          items: { $ref: "#/components/schemas/TeardownTouch" }
    TeardownTime:
      type: object
      description: Time working (in progress) and waiting (any other state)
      required: [working_seconds, waiting_seconds, total_seconds]
      properties:
        working_seconds: { type: integer, format: int64 }
        waiting_seconds: { type: integer, format: int64 }
        total_seconds: { type: integer, format: int64 }
    TeardownStation:
      type: object
      description: The time the item spent at one station, over all its visits
      required: [station, working_seconds, waiting_seconds, total_seconds]
      properties:
        station: { type: string }
        working_seconds: { type: integer, format: int64 }
        waiting_seconds: { type: integer, format: int64 }
        total_seconds: { type: integer, format: int64 }
    TeardownRun:
      type: object
      required: [id, station, agent, model, turns, seconds, cost_usd, status, outcome]
      properties:
        id: { type: string }
        station: { type: string }
        agent: { type: string }
        model: { type: string }
        turns: { type: integer }
        seconds: { type: integer, format: int64, description: How long the run took, until now while it runs }
        cost_usd: { type: number, format: double }
        status: { $ref: "#/components/schemas/RunStatus" }
        outcome:
          type: string
          description: "How the run ended: its status, or what its output met (a failed check, a gate's send-back, the merge)"
          enum: [running, finished, check_failed, sent_back, merged, failed, cancelled]
    TeardownRunTotal:
      type: object
      required: [runs, turns, seconds, cost_usd]
      properties:
        runs: { type: integer }
        turns: { type: integer }
        seconds: { type: integer, format: int64 }
        cost_usd: { type: number, format: double }
    TeardownRework:
      type: object
      description: The rework loops, with the time inside any loop and the runs in them each counted once
      required: [loops, seconds, cost_usd]
      properties:
        loops: { type: integer }
        seconds: { type: integer, format: int64 }
        cost_usd: { type: number, format: double }
    ReworkLoop:
      type: object
      description: >-
        One time the item did work again. A send-back (gate_rejected, rejected, or an upstream
        moved) lasts until the item is back at the station that sent it, and costs the runs in that
        time; a check_failed or run_retried lasts until the next run at its station ends, and costs
        that run.
      required: [cause, station, at, seconds, cost_usd, event_id]
      properties:
        cause: { type: string, enum: [gate_rejected, rejected, moved, check_failed, run_retried] }
        station: { type: string, description: The station that sent the item back, or whose check failed or run was retried }
        to: { type: string, description: The station a send-back went to; left out for a loop at its station }
        reason: { type: string, description: "The event's reason, or a failed check's command; left out without one" }
        at: { type: string, format: date-time }
        seconds: { type: integer, format: int64 }
        cost_usd: { type: number, format: double }
        event_id: { type: integer, format: int64, description: The event that caused the loop, to show it in the trace }
    TeardownTouch:
      type: object
      required: [touch, wait_seconds]
      properties:
        touch: { $ref: "#/components/schemas/Touch" }
        wait_seconds: { type: integer, format: int64, description: From the opening of the span the touch ended (or happened in) until the touch }
    CurrentRun:
      type: object
      required: [id, agent, slot, model, turn, started_at, output_contract, checks]
      properties:
        id: { type: string }
        agent: { type: string }
        slot: { type: integer, description: "The agent copy working the item, 1-based (investigator-2)" }
        model: { type: string }
        turn: { type: integer, description: Turns the run has reported so far }
        started_at: { type: string, format: date-time }
        output_contract:
          type: string
          nullable: true
          description: The contract the station's output must satisfy, or null
        checks:
          type: array
          description: "What the output is checked for on submit: schema, evidence links, command lines"
          items: { type: string }
    ItemCard:
      type: object
      description: An item as boards and lists show it
      required: [id, ref, number, title, type, station, state, class_of_service, rework_count, cost_usd, created_at, updated_at, age_seconds, agent, pr_url, pull_requests, slot, turn, summary, in_buffer, rope_held, touch_count, repositories]
      properties:
        id: { type: string }
        ref: { type: string, description: "<factory name>#<number>, as in goal#2" }
        number: { type: integer, format: int64 }
        title: { type: string }
        type: { type: string }
        lane: { type: string }
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        class_of_service: { $ref: "#/components/schemas/ClassOfService" }
        rework_count: { type: integer }
        cost_usd: { type: number, format: double }
        origin: { type: string, enum: [person, plan, trigger, follow-up], description: As Item's origin }
        via: { type: string, enum: [web, cli, api], description: As Item's via }
        created_by:
          description: As Item's created_by
          allOf: [{ $ref: "#/components/schemas/Actor" }]
        untrusted: { type: boolean, description: As Item's untrusted }
        start:
          description: As Item's start, absent when it may start now; the inbox shows such items under Later
          allOf: [{ $ref: "#/components/schemas/ItemStart" }]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        age_seconds:
          type: integer
          format: int64
          description: Seconds since the item was created; for a done item, from created to done
        agent:
          type: string
          nullable: true
          description: The agent working the item now (in progress), else null
        pr_url:
          type: string
          nullable: true
          description: The pull request the item's latest station output names, else null
        pull_requests:
          type: array
          items: { type: string }
          description: >-
            At a merge station, every pull request a merge lands (POST
            /v1/orgs/{org}/items/{item}/merge: what each station's latest output names, in station
            order, each once), so whoever merges sees them all; empty at any other station
        slot:
          type: integer
          nullable: true
          description: >-
            While in progress at a station that runs several copies of its agent, the copy working
            it, 1-based (investigator-2); else null
        turn:
          type: integer
          nullable: true
          description: The turns its running run has reported so far, while one runs; else null
        summary:
          type: string
          nullable: true
          description: The summary field of the item's latest station output that has one, else null
        in_buffer:
          type: boolean
          description: Queued or ready at the drum (the line's configured constraint, else the constraint now)
        rope_held:
          type: boolean
          description: Held at a queue station by the drum-buffer-rope release; always false until it is enforced
        touch_count:
          type: integer
          description: The item's human touches so far
        repositories:
          type: array
          description: >-
            As Item's repositories: the repositories the item works on, in the order they joined,
            the first being its first repository (ADR 0041 decision 4). An item filed before
            repositories shows the factory's default entry's, and an item of a factory without
            code an empty array
          items: { $ref: "#/components/schemas/ItemRepository" }
        board_lane:
          type: string
          nullable: true
          description: >-
            The key of the station's lane (BoardLane.key) the item belongs to: the agent holding its
            lease while in progress, else the agent its station routes its lane to at an agent
            station, the person lane at a human station; absent or null at queue and done stations,
            or when the station has no route for the item's lane
        assembly:
          description: >-
            For a part of an assembly (an item whose parent has parts), the assembly and the
            part's place in it; absent or null for any other item
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PartOf" }]
        parts:
          description: >-
            For an assembly (an item with parts), where its parts stand; absent or null for any
            other item
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PartsSummary" }]
        activity:
          type: string
          nullable: true
          description: >-
            While its run runs, one short line (at most 80 characters) from the run's latest tool
            call, credential-shaped text replaced by ***: "Editing <path>", "Running <command>",
            "Reading <path>", "Searching <pattern>" or "Using <tool>"; absent or null when no run
            runs or it has called no tool yet
        plan_steps:
          description: >-
            While its run runs, how far it is through its latest todo list (its latest TodoWrite
            call); absent or null when no run runs, it has listed no todos or the list did not
            parse (the worker cuts long tool input)
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PlanSteps" }]
        waiting:
          description: Why the item is not claimed yet; absent or null unless it is queued or ready with an open need
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ItemWaiting" }]
    PlanSteps:
      type: object
      description: The todos a running run completed of all it listed ("2 of 5 steps")
      required: [done, total]
      properties:
        done: { type: integer, description: Todos completed }
        total: { type: integer, description: Todos listed }
    PartOf:
      type: object
      description: The assembly an item is a part of, and which part ("3 of 6")
      required: [id, ref, title, part, parts]
      properties:
        id: { type: string, description: The assembly's item id }
        ref: { type: string, description: "The assembly's <factory name>#<number>" }
        title: { type: string }
        part: { type: integer, description: "The item's place among the assembly's parts by number, 1-based" }
        parts: { type: integer, description: The assembly's parts in all }
    PartsSummary:
      type: object
      description: >-
        Where an assembly's parts stand ("4 of 6 parts merged"): every part counts in total; a
        cancelled part counts in no other field
      required: [total, merged, in_progress, waiting, stations]
      properties:
        total: { type: integer }
        merged: { type: integer, description: Parts done }
        in_progress: { type: integer, description: Parts in progress }
        waiting: { type: integer, description: "Parts in any other open state: queued, ready, waiting for a person or blocked" }
        stations:
          type: array
          items: { type: string }
          description: The distinct stations of the open parts, in part order
    ItemPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemCard" }
        next_after:
          type: integer
          format: int64
          nullable: true
          description: Pass as `after` for the next page; null on the last page
    Board:
      type: object
      required: [factory, stations, assemblies, constraint, constraint_source, line]
      properties:
        factory:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            title: { type: string }
        stations:
          type: array
          items: { $ref: "#/components/schemas/BoardStation" }
        assemblies:
          type: array
          description: >-
            The factory's open assemblies (state assembly), each with its parts summary. An open
            assembly stays at the station that planned it but is no work there: it is in no
            station's items and in none of its counts, WIP or statistics; its parts are. A done
            assembly is a card in the done station's items, like a finished item (ADR 0012).
          items: { $ref: "#/components/schemas/ItemCard" }
        constraint:
          type: string
          nullable: true
          description: >-
            The station that holds the line back (see constraint_source), or null when none does
        constraint_source: { $ref: "#/components/schemas/ConstraintSource" }
        line: { $ref: "#/components/schemas/BoardLine" }
    ConstraintSource:
      type: string
      enum: [configured, detected, snapshot]
      description: >-
        How the constraint was found: configured (the definition's flow.constraint), detected
        (the agent station busiest over the window of lease history), or snapshot (the agent
        station with the most work per slot now, while there is no lease history)
    BoardLine:
      type: object
      description: >-
        The line as a whole: its work in progress against its limits, how work is released into
        it, its expedite lane and its weekly budget. The release policy and the expedite limit are
        shown as configured; goald does not enforce them yet (it releases as push).
      required: [status, andon, wip, release, expedite, budget, touches]
      properties:
        touches:
          description: Human touches of the items finished in the board's window
          allOf: [{ $ref: "#/components/schemas/TouchHeadline" }]
        status:
          type: string
          enum: [running, stopped]
          description: >-
            stopped while an andon pull is open: the line releases and claims nothing. A running line
            may still be paused (the factory's paused) or claim nothing over its budget (budget.exhausted).
        andon:
          nullable: true
          description: The open andon pull, or null while the line runs
          allOf: [{ $ref: "#/components/schemas/AndonPull" }]
        wip: { $ref: "#/components/schemas/LineWip" }
        release: { $ref: "#/components/schemas/LineRelease" }
        expedite:
          nullable: true
          description: The expedite lane; null when the line has no expedite work types and no limit
          allOf: [{ $ref: "#/components/schemas/LineExpedite" }]
        budget:
          nullable: true
          description: The weekly budget over the last 7×24 hours; null when the factory has none
          allOf: [{ $ref: "#/components/schemas/LineBudget" }]
    LineWip:
      type: object
      description: >-
        Items in progress or waiting on a person at the stations with a wip limit, and the sum of
        those limits (null when no station has one)
      required: [in_progress, limit]
      properties:
        in_progress: { type: integer }
        limit: { type: integer, nullable: true }
    LineRelease:
      type: object
      required: [policy, enforced, drum, buffer, in_buffer]
      properties:
        policy: { type: string, enum: [push, drum-buffer-rope] }
        enforced:
          type: boolean
          description: Whether goald releases by this policy; false until drum-buffer-rope is enforced (later)
        drum:
          type: string
          nullable: true
          description: The station the line is paced by, its configured constraint or else the constraint now; null without one
        buffer:
          type: integer
          nullable: true
          description: How many items the drum keeps ready in front of it (its buffer), or null
        in_buffer: { type: integer, description: Items queued or ready at the drum }
    LineExpedite:
      type: object
      required: [limit, in_use]
      properties:
        limit:
          type: integer
          nullable: true
          description: flow.expedite.wip, shown and not enforced yet; null for no limit
        in_use: { type: integer, description: Open expedite items past the line's queue stations }
    LineBudget:
      type: object
      required: [weekly_usd, spent_usd, exhausted]
      properties:
        weekly_usd: { type: number, format: double }
        spent_usd: { type: number, format: double, description: The cost of the runs started in the window }
        exhausted: { type: boolean, description: No new agent work starts until the window moves or the cap rises }
        since:
          type: string
          format: date-time
          nullable: true
          description: >-
            Since when the budget is used up, as the engine recorded it (now when it has not yet); absent or
            null while the budget has room
        resumes_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the rolling window's spend falls below the cap, so the line starts new work on the engine's
            first tick after it; absent or null while the budget has room
    QueueTrend:
      type: string
      description: How many items wait at a station now against 24 hours earlier
      enum: [growing, steady, shrinking]
    BoardStation:
      type: object
      required: [id, kind, agents, wip_limit, waiting, in_progress, items, busy_ratio, send_back_ratio, queue_trend, oldest_waiting_seconds, done_today]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/StationKind" }
        action: { $ref: "#/components/schemas/StationAction" }
        agents:
          type: array
          description: The agents that work here (one, or one per routed lane)
          items: { type: string }
        wip_limit:
          type: integer
          nullable: true
          description: The station's wip setting, or null when it has none
        waiting: { type: integer, description: Items queued or ready here }
        in_progress: { type: integer, description: "Items being worked here: in progress, and waiting for a person's decision (a human station's work). Blocked items count in neither" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemCard" }
        busy_ratio:
          type: number
          format: double
          nullable: true
          description: >-
            Agent stations: the share of the slots' time leases held over the window (from when the
            factory's lease history begins, if later), 0 to 1; null elsewhere or without history
        send_back_ratio:
          type: number
          format: double
          nullable: true
          description: "Stations with a gate: the share of the window's verdicts that sent work back; null elsewhere or without verdicts"
        queue_trend:
          nullable: true
          description: Queue and agent stations; null elsewhere
          allOf: [{ $ref: "#/components/schemas/QueueTrend" }]
        oldest_waiting_seconds:
          type: integer
          format: int64
          nullable: true
          description: How long the item waiting longest here has waited; null when none waits
        done_today:
          type: integer
          nullable: true
          description: "The done station: items that reached done today (UTC); null elsewhere"
        lanes:
          type: array
          items: { $ref: "#/components/schemas/BoardLane" }
          description: >-
            The station's lanes, sorted by role: at an agent station one per distinct agent that
            works there (its agent, or each agent its route uses), at a human station one for the
            person; none at queue and done stations. Cards name theirs in ItemCard.board_lane
    BoardLane:
      type: object
      description: One lane of a board station, by who works it (a role, never a numbered agent copy)
      required: [key, kind, role, model, model_label, slots, busy, kept_slots, kept_busy, shared_slots, shared_busy]
      properties:
        key:
          type: string
          description: "What cards name in board_lane: the agent's name, or `person` for a person lane"
        kind: { type: string, enum: [agent, person] }
        role:
          type: string
          description: >-
            The name people read: the agent's name humanized ("infra-engineer" → "Infra engineer"),
            the station's id humanized for a person lane
        model:
          type: string
          nullable: true
          description: The model the agent runs (its own, else the runtime's); null for a person lane or when neither names one
        model_label:
          type: string
          nullable: true
          description: >-
            The model's label among goald's models (GOAL_MODELS) without a leading "Claude "
            ("Opus 5.5"), else the model id; null when model is
        slots:
          type: integer
          nullable: true
          description: >-
            How many runs the lane can have at once: the station's slots, min(agents, wip), shared by
            all its lanes; null for a person lane
        busy:
          type: integer
          description: >-
            Agent lanes: the station's live leases held by that agent; a person lane: the items
            waiting on a person there
        kept_slots:
          type: integer
          nullable: true
          description: >-
            The station's slots kept for the item lanes routed to this agent with a count (`agents:`),
            cut off at the station's slots; 0 when none has a count; null for a person lane
        kept_busy:
          type: integer
          nullable: true
          description: >-
            The live leases this agent holds in its kept slots; null for a person lane
        shared_slots:
          type: integer
          nullable: true
          description: >-
            The station's shared slots, those kept for no lane, when this agent works a lane without a
            count or is the station's one agent; else 0; null for a person lane
        shared_busy:
          type: integer
          nullable: true
          description: >-
            The live leases in the shared slots, held by any agent of the station; 0 when shared_slots
            is; null for a person lane
    Metrics:
      type: object
      required:
        - window
        - from
        - to
        - type
        - throughput
        - throughput_per_day
        - lead_time_hours
        - assembly_lead_time_hours
        - wip
        - rework_rate
        - spend_usd
        - items_done
        - previous
        - targets
        - long_waits
      properties:
        window: { type: string, description: "The range's length in days, as in 7d" }
        from: { type: string, format: date, description: The range's first UTC day }
        to: { type: string, format: date, description: The range's last UTC day, included }
        type: { type: string, nullable: true, description: The work type asked for; null for every type }
        throughput_per_day: { type: number, format: double, description: items_done divided by the range's days }
        previous:
          nullable: true
          description: With compare=previous, the same metrics over the range of the same length just before
          allOf: [{ $ref: "#/components/schemas/MetricsSummary" }]
        targets: { $ref: "#/components/schemas/Targets" }
        long_waits:
          type: object
          nullable: true
          description: >-
            The items that waited (queued or ready) over threshold_hours in front of the
            constraint and stopped waiting in the range or still wait; null when the line has no
            constraint
          required: [station, items, threshold_hours]
          properties:
            station: { type: string }
            items: { type: integer }
            threshold_hours: { type: number, format: double }
        throughput:
          type: array
          description: Items done per UTC day, one entry for every day of the window, oldest first
          items:
            type: object
            required: [day, done]
            properties:
              day: { type: string, format: date }
              done: { type: integer }
        lead_time_hours:
          type: object
          nullable: true
          description: Percentiles of created → done of the items done in the window; null when none were
          required: [p50, p85]
          properties:
            p50: { type: number, format: double }
            p85: { type: number, format: double }
        assembly_lead_time_hours:
          type: object
          nullable: true
          description: >-
            Percentiles of created → last part done of the assemblies (items split into parts)
            done in the window; null when none were. Cancelled assemblies are left out
          required: [p50, p85, assemblies]
          properties:
            p50: { type: number, format: double }
            p85: { type: number, format: double }
            assemblies: { type: integer, description: How many assemblies were done in the window }
        wip: { type: integer, description: "Items in the line now, neither done nor cancelled" }
        rework_rate:
          type: number
          format: double
          description: Share of the items done in the window that were sent back at least once (0 when none were done)
        spend_usd: { type: number, format: double, description: Cost of the agent runs started in the window }
        items_done: { type: integer }
    MetricsSummary:
      type: object
      description: The headline metrics of one range, to compare with
      required: [from, to, items_done, throughput_per_day, lead_time_hours, assembly_lead_time_hours, rework_rate]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        items_done: { type: integer }
        throughput_per_day: { type: number, format: double }
        lead_time_hours:
          type: object
          nullable: true
          description: Percentiles of created → done of the items done in the range; null when none were
          required: [p50, p85]
          properties:
            p50: { type: number, format: double }
            p85: { type: number, format: double }
        assembly_lead_time_hours:
          type: object
          nullable: true
          description: >-
            Percentiles of created → last part done of the assemblies (items split into parts)
            done in the range; null when none were. Cancelled assemblies are left out
          required: [p50, p85, assemblies]
          properties:
            p50: { type: number, format: double }
            p85: { type: number, format: double }
            assemblies: { type: integer, description: How many assemblies were done in the range }
        rework_rate: { type: number, format: double }
    Targets:
      type: object
      description: The flow targets of the factory's definition (spec.board.flow.targets); null when not set
      required: [throughput_per_day, lead_time_hours, expedite_lead_time_minutes]
      properties:
        throughput_per_day: { type: number, format: double, nullable: true }
        lead_time_hours: { type: number, format: double, nullable: true, description: The p85 lead time to stay under }
        expedite_lead_time_minutes: { type: integer, nullable: true, description: Lead time of each expedite item }
    JonahPolicy:
      type: object
      description: The current version's learning.jonah, with its defaults where it sets none
      required: [enabled, propose_after, share, budget_usd, approver_roles]
      properties:
        enabled: { type: boolean }
        propose_after:
          type: integer
          description: Items with the same cause an observation needs before it becomes a proposal
        share:
          type: number
          format: double
          description: learning.jonah.share as a fraction (5% is 0.05) of what the line spent over the last 7 days
        budget_usd:
          type: number
          format: double
          description: >-
            Jonah's budget now: share times what the line's runs other than Jonah's cost over the
            last 7 days. Each review may spend a fifth of it, and Jonah's spend never triggers
            runtime.budget.onExhausted
        model: { type: string, description: "The review run's model: learning.jonah.model, else runtime.model; absent when neither is set" }
        approver_roles:
          type: array
          description: "The roles holding definition:publish: organization roles first, then factory roles"
          items: { type: string }
    JonahObservation:
      type: object
      required: [id, summary, detail, item_refs, state, count, propose_after, created_at, updated_at]
      properties:
        id: { type: string }
        summary: { type: string }
        detail: { type: string }
        item_refs:
          type: array
          description: "The items it rests on, as <factory name>#<number>, gathered across reviews"
          items: { type: string }
        state:
          type: string
          description: >-
            proposed: a proposal addresses it; watching: its count has not reached propose_after;
            not_jonahs: its cause is not a definition problem
          enum: [watching, proposed, not_jonahs]
        count: { type: integer, description: How often the cause was seen, summed across reviews }
        propose_after: { type: integer, description: The count at which it becomes a proposal }
        proposal: { type: integer, format: int64, description: The number of the proposal it became }
        created_at: { type: string, format: date-time, description: When a review first noticed it }
        updated_at: { type: string, format: date-time, description: When a review last updated it }
    JonahReview:
      type: object
      required: [id, state, trigger, created_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, running, done, failed] }
        trigger: { type: string, enum: [manual, threshold], description: "manual when a person asked for it; threshold is goald's daily review" }
        error: { type: string, description: "Why a failed review failed, or why its last attempt failed while it waits for a retry" }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    JonahOverview:
      type: object
      required: [policy, waiting, month_cost_usd, observations]
      properties:
        policy: { $ref: "#/components/schemas/JonahPolicy" }
        waiting: { type: integer, description: Proposals still proposed }
        month_cost_usd: { type: number, format: double, description: "What the factory's jonah runs cost since the first of this UTC month" }
        observations:
          type: array
          description: The observations a review updated since Monday 00:00 UTC, the latest updated first
          items: { $ref: "#/components/schemas/JonahObservation" }
        last_review: { $ref: "#/components/schemas/JonahReview" }
    ProposalState:
      type: string
      enum: [proposed, published, applied, rejected, superseded]
    ProposalEstimate:
      type: object
      description: The metric the proposal should move at one station; before is computed from the recorded events
      required: [metric, station, before, after, cost_per_item_usd]
      properties:
        metric: { type: string, enum: [sent_back_rate, lead_time_p85] }
        station: { type: string }
        before: { type: number, format: double }
        after: { type: number, format: double }
        cost_per_item_usd: { type: number, format: double, description: The change in cost per item }
    ProposalEntry:
      type: object
      required: [number, title, state, created_at, paths, agents, evidence_count]
      properties:
        number: { type: integer, format: int64 }
        title: { type: string }
        state: { $ref: "#/components/schemas/ProposalState" }
        created_at: { type: string, format: date-time }
        paths:
          type: array
          items: { type: string }
        agents:
          type: array
          description: "The agents whose prompt it edits (agents/<name>.md), in path order"
          items: { type: string }
        estimate: { $ref: "#/components/schemas/ProposalEstimate" }
        evidence_count: { type: integer }
    ProposalPage:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items: { $ref: "#/components/schemas/ProposalEntry" }
        next: { type: integer, format: int64, description: "The after of the next page; absent on the last" }
    Replacement:
      type: object
      description: One exact edit of a file; old occurs exactly once in it
      required: [old, new]
      properties:
        old: { type: string, minLength: 1 }
        new: { type: string }
    ProposalEdit:
      type: object
      description: >-
        One file a proposal changes (ADR 0039 decision 6): replacements, applied in order to the
        file as it is when the proposal is approved or edited into the draft, or the whole content
        of a new file. base_sha256 is set only on a whole file stored before proposals were
        replacements: it replaces the file while the file still has that SHA-256.
      required: [path]
      properties:
        path: { type: string }
        replacements:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Replacement" }
        content: { type: string, description: The whole content of a new file; absent with replacements }
        base_sha256: { type: string }
    ProposalFile:
      type: object
      description: One edited file as it reads in the version the proposal was made against, before and after its edit
      required: [path, base_sha256, base_content, content]
      properties:
        path: { type: string }
        base_sha256: { type: string, description: "The SHA-256 of the file in that version; empty for a new file" }
        base_content: { type: string, description: The file in the version the proposal was made against; empty for a new file }
        content: { type: string, description: The file with the proposal's edit applied to base_content }
    ProposalEvidence:
      type: object
      required: [item_ref, item_title, quote]
      properties:
        item_ref: { type: string, description: "<factory name>#<number>, or the item's id when it is gone" }
        item_title: { type: string }
        station: { type: string }
        quote: { type: string, description: The quoted reason it was sent back }
    ModelProposalRequest:
      type: object
      required: [model]
      properties:
        model: { type: string, minLength: 1, description: The model to try, one the organization's policy allows }
        confirm:
          type: boolean
          default: false
          description: Store the proposal and queue its tries; false answers the estimate only
    TryProposalRequest:
      type: object
      properties:
        confirm:
          type: boolean
          default: false
          description: Queue the tries; false answers the estimate only
    TryProposalItem:
      type: object
      required: [item_ref, item_title, station, tries, run_cost_usd]
      properties:
        item_ref: { type: string, description: "<factory name>#<number>" }
        item_title: { type: string }
        station: { type: string, description: The station the item's tries rerun }
        tries: { type: integer, description: The tries Try again adds for the item, 1 or 3 for a model proposal }
        run_cost_usd: { type: number, format: double, description: What the run the tries rerun cost, the price of each }
    TryProposalEstimate:
      type: object
      required: [number, items, tries, estimate_usd, budget_left_usd]
      properties:
        number: { type: integer, format: int64, description: The proposal's number }
        items:
          type: array
          description: The items the proposal was tried on, in the order their first tries were queued
          items: { $ref: "#/components/schemas/TryProposalItem" }
        tries: { type: integer, description: The tries Try again adds, over every item }
        estimate_usd: { type: number, format: double, description: Each item's tries × its run's cost, summed }
        budget_left_usd: { type: number, format: double, description: What is left of Jonah's budget over the last 7 days }
    TryProposalResult:
      type: object
      required: [estimate]
      properties:
        estimate: { $ref: "#/components/schemas/TryProposalEstimate" }
        proposal:
          allOf: [{ $ref: "#/components/schemas/Proposal" }]
          description: The proposal with its new tries; absent from an estimate
    ModelProposalItem:
      type: object
      required: [item_ref, item_title, station, run_id, line_result, sent_back, cost_usd, run_cost_usd]
      properties:
        item_ref: { type: string, description: "<factory name>#<number>" }
        item_title: { type: string }
        station: { type: string, description: The station of the run the tries rerun }
        run_id: { type: string, description: The item's run the tries rerun, its newest first run of a claim by the agent }
        line_result:
          type: string
          description: How the item went on the line, as "passed first time, $0.42" or "sent back 2 times at review, $1.10"
        sent_back: { type: integer, description: How many times the item was sent back, at any station }
        cost_usd: { type: number, format: double, description: What the item cost }
        run_cost_usd: { type: number, format: double, description: What the run the tries rerun cost }
    ModelProposalEstimate:
      type: object
      required: [agent, current_model, model, items, tries, estimate_usd, budget_left_usd]
      properties:
        agent: { type: string }
        current_model: { type: string, description: The agent's model now, the runtime's when it names none }
        model: { type: string, description: The model to try }
        items:
          type: array
          description: The agent's newest finished items the tries run on, newest first, at most five
          items: { $ref: "#/components/schemas/ModelProposalItem" }
        tries: { type: integer, description: Three per item }
        estimate_usd: { type: number, format: double, description: Each item's run cost × 3, summed }
        budget_left_usd: { type: number, format: double, description: What is left of Jonah's budget over the last 7 days }
    ModelProposalResult:
      type: object
      required: [estimate]
      properties:
        estimate: { $ref: "#/components/schemas/ModelProposalEstimate" }
        proposal:
          allOf: [{ $ref: "#/components/schemas/Proposal" }]
          description: The stored proposal; absent from an estimate
    Proposal:
      allOf:
        - $ref: "#/components/schemas/ProposalEntry"
        - type: object
          required: [summary, edits, files, evidence, made_against_version, publishes_as_version]
          properties:
            summary: { type: string }
            edits:
              type: array
              description: What the proposal stores and Approve and Edit apply again, one per file in path order
              items: { $ref: "#/components/schemas/ProposalEdit" }
            files:
              type: array
              description: Each of edits applied to its file in made_against_version, in the same order
              items: { $ref: "#/components/schemas/ProposalFile" }
            evidence:
              type: array
              items: { $ref: "#/components/schemas/ProposalEvidence" }
            made_against_version: { type: integer, description: The number of the version the review read }
            publishes_as_version: { type: integer, description: The number Approve would publish it as }
            published_version: { type: integer, description: The version Approve published }
            reject_reason: { type: string }
            decided_by: { type: string, description: "The actor ref of who decided it" }
            decided_at: { type: string, format: date-time }
            undoes: { type: integer, format: int64, description: The number of the proposal this one reverses (Undo this change) }
            watch:
              description: >-
                The watch of the proposal's own number (estimate.metric at estimate.station) since
                Approve published it; absent until the first watch sweep after the publish
              allOf:
                - $ref: "#/components/schemas/Watch"
            tried:
              description: >-
                How the proposal did on past items before anyone saw it (ADR 0039 decisions 11 and
                13); absent for a proposal with no tries, as one that changes only memory or the
                flow, or reaches only stations that can't be tried
              allOf:
                - $ref: "#/components/schemas/ProposalTried"
    ProposalTried:
      type: object
      required: [state, items, cost_usd, kept_tests]
      properties:
        state:
          type: string
          description: >-
            trying: a try is queued or running; done: every try is done; budget_used: a try is
            still queued and Jonah's budget over the last 7 days is used up ("Not tried: budget
            used")
          enum: [trying, done, budget_used]
        items:
          type: array
          description: Each past item tried, in the order its tries were queued
          items: { $ref: "#/components/schemas/TriedItem" }
        cost_usd: { type: number, format: double, description: What the tries cost, summed }
        seconds:
          type: number
          format: double
          description: From the first try queued to the last one finished; absent until every try is done
        kept_tests:
          type: array
          description: >-
            The proposal's tries of the kept tests at the stations it reaches (ADR 0039 decision
            12), in the order they were queued; empty when it reaches none or was tried before kept
            tests ran on proposals
          items: { $ref: "#/components/schemas/TriedKeptTest" }
        grader:
          description: How often the grader read the items' original and final results right; absent until the grader is checked
          allOf:
            - $ref: "#/components/schemas/TriedGrader"
    TriedItem:
      type: object
      required: [item_ref, item_title, station, tries]
      properties:
        item_ref: { type: string, description: "<factory name>#<number>, or the item's id when it is gone" }
        item_title: { type: string }
        station: { type: string, description: The station the tries rerun }
        line_result:
          type: string
          description: >-
            For a model proposal, how the item went on the line, as "passed first time, $0.42";
            absent for other proposals and for an item no longer among the agent's newest
        tries:
          type: array
          description: The item's tries by attempt, one for most proposals and three for a model proposal
          items: { $ref: "#/components/schemas/TriedTry" }
    TriedTry:
      type: object
      required: [attempt, state, cost_usd]
      properties:
        attempt: { type: integer }
        state:
          type: string
          enum: [queued, running, done]
        verdict:
          type: string
          description: >-
            fixed or not_fixed: whether the try fixed what sent the item back; unknown: its grade
            can't be trusted; error: the try could not be carried out (error says why). Absent
            while the try waits to run or to be graded.
          enum: [fixed, not_fixed, unknown, error]
        reason: { type: string, description: Why the try was graded as it was, first; absent without a grade }
        error: { type: string, description: Why the try could not be carried out }
        cost_usd: { type: number, format: double }
    TriedKeptTest:
      type: object
      required: [test, station, attempt, result]
      properties:
        test: { type: integer, format: int64, description: The kept test's item number }
        station: { type: string, description: The station the test is kept at }
        attempt: { type: integer, description: The try's attempt, 1 to 3; a model proposal tries each test three times }
        result: { $ref: "#/components/schemas/KeptTestResult" }
        reason: { type: string, description: Why it passed or failed; absent while it runs }
        error: { type: string, description: Why the try could not be carried out }
    KeptTestResult:
      type: string
      description: >-
        running: its try is queued or runs; passed: the try passed the station's contract and
        checks and, at a gate, approved as the item did there; failed: it did not, or its run
        failed; error: the try could not be carried out, which is never a failure
      enum: [running, passed, failed, error]
    KeptTestLastResult:
      type: object
      description: A kept test's newest finished try, from a proposal or a publish
      required: [result, at]
      properties:
        result:
          type: string
          enum: [passed, failed, error]
        at: { type: string, format: date-time, description: When the try finished }
        run_id: { type: string, description: The try's own run; absent when it never ran }
    DraftKeptTests:
      type: object
      required: [state, tests]
      properties:
        state:
          type: string
          description: >-
            trying: a test's try is queued or running; done: every started try is done, or none
            was started; budget_used: a try is still queued and Jonah's budget over the last 7
            days is used up
          enum: [trying, done, budget_used]
        tests:
          type: array
          description: The kept tests at the stations the draft reaches, then those that can't be tried
          items: { $ref: "#/components/schemas/DraftKeptTest" }
    DraftKeptTest:
      type: object
      required: [test, result]
      properties:
        test: { $ref: "#/components/schemas/KeptTest" }
        result:
          allOf: [{ $ref: "#/components/schemas/KeptTestResult" }]
          nullable: true
          description: Null while no try of the draft's content was started
        reason: { type: string, description: Why it passed or failed }
        error: { type: string, description: Why it could not be tried or carried out }
        run_id: { type: string, description: The try's own run, once it ran }
    TriedGrader:
      type: object
      required: [original_hit_rate, final_hit_rate]
      properties:
        original_hit_rate: { type: number, format: double, description: The share of items whose original result the grader read as not fixed }
        final_hit_rate: { type: number, format: double, description: The share of items whose final accepted result the grader read as fixed }
    WatchMetric:
      type: string
      description: >-
        sent_back_rate: the share of items a person sent back at the station; cost_per_item: the
        USD of an item's runs there; lead_time_p85: the 85th percentile of an item's time there,
        in seconds. Lower is better for each.
      enum: [sent_back_rate, cost_per_item, lead_time_p85]
    WatchVerdict:
      type: string
      description: >-
        helped or worse: the 90% interval of after minus before clears the minimum effect (5
        points for a rate, 10% of before for cost and lead time); no_change: it lies inside that
        minimum; too_early: neither yet; no_clear_change: still neither after 14 days or 150 items
        after the change
      enum: [too_early, helped, worse, no_change, no_clear_change]
    WatchSide:
      type: object
      required: [items, value]
      properties:
        items: { type: integer, description: The items counted on this side }
        value: { type: number, format: double, description: The metric over them }
    WatchInterval:
      type: object
      description: A 90% interval of after minus before
      required: [low, high]
      properties:
        low: { type: number, format: double }
        high: { type: number, format: double }
    KeptTest:
      type: object
      description: A past item kept, at a station it passed the first time, as a test (ADR 0039 decision 12)
      required: [id, item, station, kept_by, kept_at, last_result]
      properties:
        id: { type: string }
        item: { $ref: "#/components/schemas/KeptTestItem" }
        station: { type: string }
        kept_by: { type: string, description: "The actor ref of who kept it" }
        kept_at: { type: string, format: date-time }
        last_result:
          allOf: [{ $ref: "#/components/schemas/KeptTestLastResult" }]
          nullable: true
          description: Its newest finished try's result; null for a test never run
    KeptTestItem:
      type: object
      required: [id, number, title]
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
        title: { type: string }
    KeptTestList:
      type: object
      required: [tests]
      properties:
        tests:
          type: array
          items: { $ref: "#/components/schemas/KeptTest" }
    KeepTestRequest:
      type: object
      required: [item, station]
      additionalProperties: false
      properties:
        item: { type: integer, format: int64, minimum: 1, description: "The item's number in the factory" }
        station: { type: string, minLength: 1, maxLength: 100 }
    Watch:
      type: object
      description: >-
        One published change watched at one station on one metric (ADR 0039 decision 14). Each
        item's outcome at the station counts for the definition version of its run there: before
        covers the versions since the last change that reached the station, after the change's
        version and those after it until the next change that reaches the station.
      required: [station, metric, before, after, interval, verdict, opened_at, closed_at]
      properties:
        station: { type: string }
        metric: { $ref: "#/components/schemas/WatchMetric" }
        proposal: { type: integer, format: int64, description: The Jonah proposal whose own number this is; absent for a person's publish }
        before: { $ref: "#/components/schemas/WatchSide" }
        after: { $ref: "#/components/schemas/WatchSide" }
        interval:
          description: null while either side has fewer than two items
          nullable: true
          allOf:
            - $ref: "#/components/schemas/WatchInterval"
        verdict: { $ref: "#/components/schemas/WatchVerdict" }
        opened_at: { type: string, format: date-time, description: When the change was published }
        closed_at: { type: string, format: date-time, nullable: true, description: When the verdict became final; null while it is watched }
    ProposalReject:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 2000 }
    ProposalDecided:
      type: object
      required: [number, state]
      properties:
        number: { type: integer, format: int64 }
        state: { $ref: "#/components/schemas/ProposalState" }
        version: { type: integer, description: The version Approve published }
        draft_revision: { type: integer, format: int64, description: The draft's revision after Edit }
    AgentStats:
      type: object
      required: [agent, from, to, model, stations, tasks_finished, sent_back, median_turns, spend_per_task_usd, task_time_p85_minutes, spend_usd, reasons, denied_tool_calls]
      properties:
        agent: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        model: { type: string, nullable: true, description: "The agent's model, else the runtime's" }
        stations:
          type: array
          description: The stations the agent works at, in line order
          items: { $ref: "#/components/schemas/AgentStation" }
        tasks_finished: { type: integer }
        sent_back: { $ref: "#/components/schemas/SentBack" }
        median_turns: { type: number, format: double, nullable: true, description: Of the runs that succeeded }
        spend_per_task_usd: { type: number, format: double, nullable: true, description: All runs' spend over the tasks finished }
        task_time_p85_minutes: { type: number, format: double, nullable: true }
        spend_usd: { type: number, format: double }
        reasons:
          type: array
          maxItems: 5
          description: Why work was sent back, most frequent first
          items: { $ref: "#/components/schemas/SendBackReason" }
        denied_tool_calls: { $ref: "#/components/schemas/DeniedToolCalls" }
    AgentStation:
      type: object
      required: [id, slots, constraint]
      properties:
        id: { type: string }
        slots: { type: integer, description: How many copies of agents run there at once }
        constraint: { type: boolean, description: The station the line's flow is paced by now }
    SentBack:
      type: object
      required: [count, ratio]
      properties:
        count: { type: integer }
        ratio: { type: number, format: double, nullable: true, description: Of the advanced tasks; null when none advanced }
    SendBackReason:
      type: object
      required: [label, count]
      properties:
        label: { type: string, description: "The rejection's category, else its reason (trimmed, lower-cased, 120 characters)" }
        count: { type: integer }
    DeniedToolCalls:
      type: object
      required: [count, tools]
      properties:
        count: { type: integer }
        tools:
          type: array
          maxItems: 3
          description: The most denied tools, as <connection>__<tool> for gateway tools
          items: { $ref: "#/components/schemas/DeniedTool" }
    DeniedTool:
      type: object
      required: [tool, count]
      properties:
        tool: { type: string }
        count: { type: integer }
    WeeklyThroughput:
      type: object
      required: [to, type, targets, weeks]
      properties:
        to: { type: string, format: date, description: The last UTC day of the last week }
        type: { type: string, nullable: true, description: The work type asked for; null for every type }
        targets: { $ref: "#/components/schemas/Targets" }
        weeks:
          type: array
          description: Seven-day buckets ending on `to`, oldest first
          items:
            type: object
            required: [from, to, done, per_day]
            properties:
              from: { type: string, format: date }
              to: { type: string, format: date, description: The week's last day, included }
              done: { type: integer }
              per_day: { type: number, format: double, description: done divided by 7 }
    Intake:
      type: object
      required: [items, from, to, triggers, suggestions]
      properties:
        items: { type: integer, description: How many of the factory's newest items there are, at most the items asked for }
        from: { type: string, format: date, nullable: true, description: The UTC day the oldest of them was created; null without items }
        to: { type: string, format: date, nullable: true, description: The UTC day the newest of them was created; null without items }
        triggers:
          type: array
          description: The current definition's board.triggers, in definition order
          items: { $ref: "#/components/schemas/IntakeTrigger" }
        suggestions:
          type: array
          description: >-
            The triggers the definition ships disabled, in definition order: what Intake and the
            onboarding Intake step offer to turn on, so no client names a station, agent or work
            type of its own. Each is also in triggers.
          items: { $ref: "#/components/schemas/TriggerSuggestion" }
        window:
          type: string
          enum: [7d, 30d, 90d]
          description: The window origins count over, the one asked for or 30d; always answered
        origins:
          description: >-
            How many of the factory's items created in the window came from each origin (ADR 0040
            decision 2), zero included; always answered. Items filed before origins were recorded
            count as person, the column's default
          allOf: [{ $ref: "#/components/schemas/IntakeOrigins" }]
        coming_up:
          type: array
          description: >-
            Up to 50 open items that haven't started (no started_at, the claim filters' rule):
            those with a start first, soonest first, then those that wait only for their open
            needs, oldest first. An assembly's parts are left out: their plan orders them, and
            the assembly's page shows each part and what it waits for. Always answered
          items: { $ref: "#/components/schemas/IntakeComingUp" }
        coming_up_total: { type: integer, description: How many items coming_up counts, beyond its 50 too, parts left out; always answered }
        triage:
          description: >-
            Follow-ups for the architect (ADR 0040 decision 9): the factory's collecting triage
            item and the items whose waiting triage follow-ups join it when they land; null when
            there is neither
          nullable: true
          allOf: [{ $ref: "#/components/schemas/IntakeTriage" }]
        webhooks:
          type: array
          description: The organization's webhooks open to the factory, by name; always answered
          items: { $ref: "#/components/schemas/IntakeWebhook" }
    IntakeOrigins:
      type: object
      required: [person, plan, trigger, follow_up]
      properties:
        person: { type: integer, description: Filed by a person, from New item, the CLI or the API }
        plan: { type: integer, description: Parts of assemblies }
        trigger: { type: integer, description: Filed by a trigger or a check }
        follow_up: { type: integer, description: Filed from follow-ups, triage items included }
    IntakeComingUp:
      type: object
      description: An item that hasn't started
      required: [id, ref, title, origin, needs, created_at]
      properties:
        id: { type: string }
        ref: { type: string, description: "<factory name>#<number>" }
        title: { type: string }
        origin: { type: string, enum: [person, plan, trigger, follow-up] }
        via: { type: string, enum: [web, cli, api], description: How a person filed it; absent otherwise }
        created_by:
          description: Who filed it; absent for items filed before ADR 0040 and for the engine's filings
          allOf: [{ $ref: "#/components/schemas/Actor" }]
        start:
          description: When it may start; absent when it waits only for its needs
          allOf: [{ $ref: "#/components/schemas/ItemStart" }]
        needs:
          type: array
          description: The refs of its open needs (neither done nor cancelled), oldest edge first
          items: { type: string }
        from_item:
          type: string
          description: The ref of the item whose follow-up filed it, another factory's included; absent otherwise
        created_at: { type: string, format: date-time }
    IntakeTriage:
      type: object
      required: [item, waiting]
      properties:
        item:
          nullable: true
          description: >-
            The collecting triage item: open, with no run yet; null when there is none, and the
            next item that lands with triage follow-ups files one
          allOf: [{ $ref: "#/components/schemas/IntakeTriageItem" }]
        waiting:
          type: array
          description: >-
            Each item of the factory with waiting triage follow-ups, oldest first, which join the
            collecting item when the item (or its assembly) lands. An untrusted item's are left
            out: they go to a paused triage item of their own
          items: { $ref: "#/components/schemas/IntakeTriageSource" }
    IntakeTriageItem:
      type: object
      description: A factory's collecting triage item
      required: [id, ref, title, station, follow_ups]
      properties:
        id: { type: string }
        ref: { type: string }
        title: { type: string }
        station: { type: string }
        follow_ups: { type: integer, description: How many follow-ups have joined it }
    IntakeTriageSource:
      type: object
      description: An item whose waiting triage follow-ups join the collecting triage item when it lands
      required: [id, ref, title, follow_ups]
      properties:
        id: { type: string }
        ref: { type: string }
        title: { type: string }
        follow_ups: { type: integer }
    IntakeWebhook:
      type: object
      description: An organization webhook open to the factory
      required: [id, name, sender, state]
      properties:
        id: { type: string }
        name: { type: string }
        sender: { $ref: "#/components/schemas/WebhookSender" }
        state:
          type: string
          enum: [receiving, no_trigger, closed]
          description: >-
            Derived from the definition, not from recent deliveries. receiving: the webhook is
            enabled and an enabled trigger of the factory's current definition names it, by its
            sender (<sender>.<event>) or by its name; no_trigger: enabled, and no enabled trigger
            names it; closed: the webhook is turned off
    TriggerSuggestion:
      type: object
      required: [name, source, "on", when, create]
      properties:
        name: { type: string }
        source: { type: string, enum: [schedule, webhook, github] }
        "on": { type: string, description: "The trigger's event key, as in the definition" }
        when: { type: string, description: "As IntakeTrigger's when: the cron and its time zone for a schedule, the event key otherwise" }
        create:
          type: object
          required: [type, station, lane, expedite, title]
          properties:
            type: { type: string }
            station: { type: string }
            lane: { type: string, nullable: true }
            expedite: { type: boolean }
            title: { type: string, description: "create.title as written, with its {{field}} placeholders; empty when the definition sets none" }
    IntakeTrigger:
      type: object
      required: [name, enabled, source, on, when, create, days, problem]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        source: { type: string, enum: [schedule, webhook, github] }
        "on": { type: string, description: "The trigger's event key, as in the definition (schedule, github.check_run.failed, webhook.<endpoint>[.<event>])" }
        when:
          type: string
          description: >-
            A plain summary of when it fires: the cron and its time zone for a schedule
            ("0 8 * * MON-FRI, Europe/Berlin"), the event key otherwise
        create:
          type: object
          required: [type, station, lane, expedite]
          properties:
            type: { type: string }
            station: { type: string }
            lane: { type: string, nullable: true }
            expedite: { type: boolean }
        days:
          type: array
          description: The items it created on each of the last 7 UTC days, oldest first, ending today
          minItems: 7
          maxItems: 7
          items: { type: integer }
        check:
          type: object
          description: The agent that checks a source each time it fires, instead of filing an item (ADR 0040 decision 19); absent without one
          required: [agent, max_usd]
          properties:
            agent: { type: string }
            max_usd: { type: number, format: double, description: The most one check may spend }
        problem:
          type: object
          nullable: true
          description: >-
            Why it may not be creating items. missing_connection: it listens on a webhook
            endpoint the factory does not have (no endpoint of its name for webhook.<name>, none
            of kind github for github.*). refused_deliveries: its endpoints refused deliveries in
            the last 7 days, counted from the endpoints' daily delivery counts.
          required: [kind, message]
          properties:
            kind: { type: string, enum: [missing_connection, refused_deliveries] }
            message: { type: string }
    IntakeTriggerDetail:
      type: object
      required: [trigger, week, events]
      properties:
        trigger: { $ref: "#/components/schemas/IntakeTrigger" }
        week:
          type: object
          description: The items it created in the weekly budget's window (the last 7×24 hours)
          required: [created, merged, spend_usd]
          properties:
            created: { type: integer }
            merged: { type: integer, description: How many of them have been merged }
            spend_usd: { type: number, format: double, description: What their agent runs cost }
        events:
          type: array
          description: Its 20 newest events, newest first
          items: { $ref: "#/components/schemas/IntakeEvent" }
        memory: { $ref: "#/components/schemas/TriggerCheckMemory" }
    IntakeEvent:
      type: object
      required: [id, title, event, at, outcome, item_number, reason, missed]
      properties:
        id: { type: string, description: The firing's id, the one tryIntakeTrigger names }
        title: { type: string, description: "The event's value of the trigger's only.dedupe field, or its event key without one" }
        event: { type: string, description: The event key it matched }
        at: { type: string, format: date-time, description: "When it fired; for missed, the gap's last instant" }
        outcome:
          type: string
          enum: [created, merged, skipped, missed, checked]
          description: >-
            created an item; merged once that item has been merged; skipped with the reason;
            missed: a schedule's instants passed by more than 5 minutes while no goald ran, and
            none was fired late; checked: it queued a check (ADR 0040 decision 19), a try among
            them, whose items and notes are its checks' (listTriggerChecks)
        item_number: { type: integer, format: int64, nullable: true, description: The item it created; null when it created none or that item is gone }
        reason: { type: string, nullable: true, description: Why it was skipped or what it missed; null otherwise }
        missed: { type: integer, description: How many schedule instants a missed event covers; 0 for any other outcome }
    TriggerCheckMemory:
      type: object
      description: >-
        What a check trigger carries from one check to the next (ADR 0040 decision 19, the
        Remembers row of its page); present only for a trigger with a check. Every key, title and
        reason comes from the check's agent or the source it read: text to show as text, never
        markup.
      required: [open, open_items, closed, closed_keys, state, checked_up_to]
      properties:
        open: { type: integer, description: How many of the items it filed are open (neither done nor cancelled) }
        open_items:
          type: array
          description: Its newest open items, at most 50, newest first
          maxItems: 50
          items: { $ref: "#/components/schemas/TriggerCheckOpenItem" }
        closed: { type: integer, description: How many of its keys' items closed in the last 7×24 hours }
        closed_keys:
          type: array
          description: The keys whose items closed in the last 7×24 hours, at most 50, newest first; the next check does not file them again
          maxItems: 50
          items: { $ref: "#/components/schemas/TriggerCheckClosedKey" }
        state:
          type: object
          nullable: true
          additionalProperties: true
          description: The JSON object its last done check saved for the next one (at most 4 KiB); null when none is saved
        checked_up_to: { type: string, format: date-time, nullable: true, description: When the check that saved the state finished; null without a saved state }
    TriggerCheckOpenItem:
      type: object
      required: [key, ref, title, state]
      properties:
        key: { type: string, description: "The source's own id it was filed for" }
        ref: { type: string, description: "The item's ref, #<number>" }
        title: { type: string }
        state: { type: string, description: The item's state }
    TriggerCheckClosedKey:
      type: object
      required: [key, ref, how, why, at]
      properties:
        key: { type: string }
        ref: { type: string, description: "The closed item's ref, #<number>" }
        how: { type: string, enum: [done, cancelled] }
        why: { type: string, description: The reason given when it closed; empty for none }
        at: { type: string, format: date-time, description: When it closed }
    TriggerCheckList:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items: { $ref: "#/components/schemas/TriggerCheck" }
    TriggerCheck:
      type: object
      description: >-
        One check of a trigger. Every key, title, text and reason comes from the check's agent or
        the source it read: text to show as text, never markup.
      required: [id, at, checked_at, state, try, cost_usd, reason, filed, noted, skipped]
      properties:
        id: { type: string, description: The check's firing id }
        at: { type: string, format: date-time, description: When it was queued }
        checked_at: { type: string, format: date-time, nullable: true, description: When it finished; null while queued or running }
        state: { type: string, enum: [queued, running, done, failed] }
        try: { type: boolean, description: A try (tryTriggerCheck), whose lists are what it would do }
        cost_usd: { type: number, format: double, description: What its run cost }
        reason: { type: string, nullable: true, description: Why it failed; null otherwise }
        filed:
          type: array
          description: The items it filed, one per key
          items: { $ref: "#/components/schemas/TriggerCheckFiled" }
        noted:
          type: array
          description: The notes it wrote on its keys' open items
          items: { $ref: "#/components/schemas/TriggerCheckNoted" }
        skipped:
          type: array
          description: >-
            What it did not file or note, with why: "closed on Nov 2: <reason>", "over the limit",
            "a note on this key within the hour", "the same note again", "no open item for this
            key", "can't file it: …", or the agent's own reason
          items: { $ref: "#/components/schemas/TriggerCheckSkip" }
    TriggerCheckFiled:
      type: object
      required: [key, title, ref, reopens]
      properties:
        key: { type: string, description: "The source's own id for it" }
        title: { type: string }
        ref: { type: string, nullable: true, description: "The item's ref, #<number>; null for a try" }
        reopens: { type: string, nullable: true, description: "For a key filed again with reopen, the ref of the closed item it links to" }
    TriggerCheckNoted:
      type: object
      required: [key, ref, text]
      properties:
        key: { type: string }
        ref: { type: string, description: "The open item's ref, #<number>" }
        text: { type: string }
    TriggerCheckSkip:
      type: object
      required: [key, reason]
      properties:
        key: { type: string }
        reason: { type: string }
    TriggerTryRequest:
      type: object
      additionalProperties: false
      required: [firing]
      properties:
        firing: { type: string, description: "The id of one of the trigger's 20 newest events: a schedule's, or a delivery's while its webhook keeps it (30 days)" }
    TriggerTry:
      type: object
      description: >-
        What the saved trigger would do with the event now. Every string shaped by the event (the
        item's title and brief, a step's reason) is text to show as text, never markup.
      required: [firing, matched, outcome, reason, steps, item, model_check]
      properties:
        firing: { type: string, description: The firing tried }
        matched: { type: boolean, description: The event reached the trigger (its when step passed) }
        outcome:
          type: string
          enum: [would_create, skipped]
          description: would_create when no step skips the event; skipped otherwise
        reason:
          type: string
          nullable: true
          description: The reason a skipped firing would record (the step, a colon and why); null for would_create
        steps:
          type: array
          description: >-
            In the order they run: when, each configured only condition (failuresInARow, dedupe,
            then a deprecated modelAgrees, which always skips), create, then each configured limit
            (perDay, pauseOnBudget). Steps after the one that skipped are not_reached.
          items: { $ref: "#/components/schemas/TriggerTryStep" }
        item:
          type: object
          nullable: true
          description: The item it would create; null when the create step was not reached
          required: [type, station, lane, expedite, title, brief]
          properties:
            type: { type: string }
            station: { type: string }
            lane: { type: string, nullable: true }
            expedite: { type: boolean }
            title: { type: string, description: create.title rendered with the event's fields }
            brief:
              type: string
              description: The item's body, create.brief rendered, then the event's fields marked as untrusted data
        model_check:
          type: object
          nullable: true
          description: Deprecated and always null; the model check is removed (ADR 0040 decision 18)
          required: [worth, reason, model, input_tokens, output_tokens, cost_usd]
          properties:
            worth: { type: boolean, description: The model answered yes }
            reason: { type: string, description: The model's one-line reason }
            model: { type: string }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cost_usd: { type: number, format: double, description: What the check cost }
    TriggerTryStep:
      type: object
      required: [step, outcome, reason]
      properties:
        step:
          type: string
          enum: [when, only.failuresInARow, only.dedupe, only.modelAgrees, create, limits.perDay, limits.pauseOnBudget]
        outcome: { type: string, enum: [passed, skipped, not_reached] }
        reason: { type: string, nullable: true, description: Why it passed or skipped; null when not reached or with nothing to say }
    LeadTimeBridge:
      type: object
      required:
        - from
        - to
        - type
        - status
        - target_hours
        - actual_p85_hours
        - gap_hours
        - items_done
        - over_target_items
        - steps
        - constraint
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        type: { type: string, nullable: true, description: The work type asked for; null for every type }
        status:
          type: string
          enum: [over_target, on_target, no_target, not_enough_data]
          description: >-
            no_target without a lead-time target in the definition; not_enough_data with fewer
            than 5 items done; then whether the actual p85 is over the target
        target_hours: { type: number, format: double, nullable: true }
        actual_p85_hours: { type: number, format: double, nullable: true, description: Null when nothing was done }
        gap_hours: { type: number, format: double, nullable: true, description: actual minus target when over it }
        items_done: { type: integer }
        over_target_items: { type: integer, description: The items done whose lead time was over the target }
        steps:
          type: array
          description: Largest first, other last; empty unless over_target. They sum to gap_hours.
          items: { $ref: "#/components/schemas/BridgeStep" }
        constraint:
          type: object
          nullable: true
          description: The line's constraint and its busy share over the range, for the insight sentence
          required: [station, busy_ratio]
          properties:
            station: { type: string }
            busy_ratio: { type: number, format: double, nullable: true, description: Null before any lease history }
    BridgeStep:
      type: object
      required: [component, station, hours, share, items]
      properties:
        component:
          type: string
          enum: [waiting, ci, rework, waiting_on_you, blocked, working, other]
          description: >-
            The kind of time. waiting is time queued or ready at the station; ci is time held at
            the station waiting for CI on the item's commits, and is not counted in waiting.
        station:
          type: string
          nullable: true
          description: Where the time went; for rework, the station that sent items back; null for waiting_on_you and other
        hours: { type: number, format: double }
        share: { type: number, format: double, description: hours over the gap, 0 to 1 }
        items: { type: integer, description: Items over the target with time in this component }
    ConstraintReport:
      type: object
      required: [from, to, coverage_since, configured, constraint, source, candidates]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        coverage_since:
          type: string
          format: date-time
          nullable: true
          description: The factory's first lease; busy shares are measured from it. Null with no lease history yet.
        configured:
          type: string
          nullable: true
          description: The definition's flow.constraint when it names a station
        constraint: { type: string, nullable: true, description: "The constraint: configured, else the first candidate, else the snapshot" }
        source: { $ref: "#/components/schemas/ConstraintSource" }
        candidates:
          type: array
          description: The busiest agent stations over the range, busiest first, at most 3; none before any lease history
          items: { $ref: "#/components/schemas/ConstraintCandidate" }
    ConstraintCandidate:
      type: object
      required: [station, slots, agents, busy_ratio, avg_waiting, mean_wait_minutes, mean_service_minutes, leases, spend_per_slot_day_usd, estimate]
      properties:
        station: { type: string }
        slots: { type: integer }
        agents: { type: array, items: { type: string } }
        busy_ratio: { type: number, format: double, description: Lease-held time over slots × the measured range, 0 to 1 }
        avg_waiting: { type: number, format: double, description: Items waiting in front of it on average (time-weighted) }
        mean_wait_minutes: { type: number, format: double, nullable: true, description: Mean wait of an item that waited there; null when none did }
        mean_service_minutes: { type: number, format: double, nullable: true, description: Mean lease; null without leases }
        leases: { type: integer }
        spend_per_slot_day_usd:
          type: number
          format: double
          nullable: true
          description: >-
            An estimate of what one more agent at the station costs a day: its agent runs' spend
            over the measured range divided by its slots and by the range in days; null when the
            range is empty or no run cost was recorded there
        estimate:
          type: object
          nullable: true
          description: >-
            How much mean wait one more slot would save (an M/M/c approximation, capped at the
            observed wait); null when busy ≥ 99%, with under 20 leases or no waiting
          required: [extra_slot_saves_hours]
          properties:
            extra_slot_saves_hours: { type: number, format: double }
    StreamEvent:
      type: object
      description: "The data of one `event: item` on /v1/orgs/{org}/stream"
      required: [org_id, item_id, ref, factory_id, kind, state, at]
      properties:
        org_id: { type: string }
        item_id: { type: string }
        ref: { type: string, description: "<factory name>#<number>, as in goal#2" }
        factory_id: { type: string }
        kind: { type: string, description: "The event kind (created, moved, approved, tool_call, ...)" }
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        at: { type: string, format: date-time }
    Activity:
      type: object
      required: [events]
      properties:
        events:
          type: array
          description: Newest first
          items: { $ref: "#/components/schemas/ActivityEvent" }
    ActivityEvent:
      type: object
      description: An Event with its item's ref, number and title
      required: [id, item_id, at, kind, actor, data, ref, number, title]
      properties:
        id: { type: integer, format: int64 }
        item_id: { type: string }
        run_id: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string }
        station: { type: string }
        actor: { type: string }
        data:
          type: object
          additionalProperties: {}
        ref: { type: string, description: "<factory name>#<number>, as in goal#2" }
        number: { type: integer, format: int64 }
        title: { type: string }
    EventPage:
      type: object
      required: [events, next_after]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_after:
          type: integer
          format: int64
          description: Pass as `after` to get the events that follow this page
    Event:
      type: object
      required: [id, item_id, at, kind, actor, data]
      properties:
        id: { type: integer, format: int64 }
        item_id: { type: string }
        run_id: { type: string }
        at: { type: string, format: date-time }
        kind:
          type: string
          description: >-
            What happened, as in submitted, moved, note or lease_taken. blocked: the item stopped
            at its station until a person retries it (data reason, the technical detail as
            written then; code, a stable code to branch on, only when the block has one:
            model_key_missing when the line is on environment files and secrets but names no
            runtime.modelKey). question_asked: the
            item's agent asked a person (data question, choices, agent as the role name, run_id);
            the run ends and the item waits at its station. question_answered: a person answered
            (data answer, the picked choice's text or their words; choice_index only when a
            choice was picked; actor); the item goes back to its station's queue.
            tool_approval_requested: the item's agent asked to make a call of an Ask-first
            connection tool (data connection, tool, input, agent as the role name, run_id,
            always_allow_offered); the run ends and the item waits at its station.
            tool_approval_granted: a person approved it (data approval_id, always_allow; actor);
            tool_approval_denied: a person denied it (data approval_id, note when given; actor);
            either way the item goes back to its station's queue. item_note: a note another
            item's agent left as a follow-up for this item, delivered by the engine (actor
            engine; data text, follow_up_id, from_item as <factory>#<number>, from_item_id,
            from_factory_id, station and agent); the item's next run reads it after its brief
        station: { type: string }
        actor: { type: string }
        data:
          type: object
          additionalProperties: {}
    NewNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the agent should know, 1 to 2000 characters (surrounding space is trimmed)
    NoteReceipt:
      type: object
      required: [event_id, delivery]
      properties:
        event_id: { type: integer, format: int64, description: The note's event in the item's history }
        delivery:
          type: string
          enum: [live, next_run]
          x-enum-varnames: [NoteReceiptDeliveryLive, NoteReceiptDeliveryNextRun]
          description: next_run, the next run's brief carries it (live, to a running agent, comes later)
    RunList:
      type: object
      required: [runs, truncated]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }
        truncated:
          type: boolean
          description: True when the item has more runs than the list holds (the oldest 200 are listed)
    RunStatus:
      type: string
      enum: [running, succeeded, failed, cancelled]
    Run:
      type: object
      description: >-
        One agent run: one container working one item at one station. Its full transcript is not
        kept (phase 2.2); the item's events carry the trace.
      required: [id, item_id, station, agent, model, status, turns, input_tokens, output_tokens, cost_usd, error, started_at, ended_at, definition_version_id, definition_version, cpu_seconds, peak_memory_bytes, box_size, build_cache]
      properties:
        id: { type: string }
        item_id: { type: string }
        station: { type: string }
        agent: { type: string }
        model: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        turns: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost_usd: { type: number, format: double }
        error:
          type: string
          nullable: true
          description: Why a failed or cancelled run ended, else null
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true, description: Null while the run is running }
        definition_version_id:
          type: string
          nullable: true
          description: The definition version the run started and finished on; null for runs from before versions
        definition_version:
          type: integer
          nullable: true
          description: That version's number ("ran on v9"); null when the run has no version
        cpu_seconds:
          type: number
          format: double
          nullable: true
          description: >-
            The CPU time the run's box used, in seconds; null while the run is running, when the
            box could not read it or for a run from before it was recorded
        peak_memory_bytes:
          type: integer
          format: int64
          nullable: true
          description: The most memory the run's box used at once; null when cpu_seconds would be
        peak_memory_source:
          allOf: [{ $ref: "#/components/schemas/MemorySource" }]
          nullable: true
          description: >-
            How peak_memory_bytes was measured; absent or null when peak_memory_bytes is null or for
            a run from before the source was recorded
        box_size:
          allOf: [{ $ref: "#/components/schemas/SandboxSize" }]
          nullable: true
          description: The box size the run ran in; null for a run from before box sizes were recorded
        build_cache:
          allOf: [{ $ref: "#/components/schemas/BuildCache" }]
          nullable: true
          description: >-
            What happened to the run's build cache (Go's module and build caches and the pnpm
            store) while its box prepared; null when the run had no Go or pnpm repository, or for a
            run from before it was recorded
    BuildCache:
      type: string
      description: >-
        What happened to a run's build cache: hit restored a matching cache; miss found none, and
        the box saved one; off is a factory that turned the cache off; error is a restore that
        failed, so the run went on cold
      enum: [hit, miss, off, error]
    MemorySource:
      type: string
      description: >-
        How a run's peak memory was measured: cgroup is the box's own cgroup, machine the whole
        machine's used memory, read when the box's cgroup has no memory figures
      enum: [cgroup, machine]
    SandboxSize:
      type: string
      description: How much CPU and memory a run's box gets (a factory's runtime.size)
      enum: [small, medium, large]
    OrgRunList:
      type: object
      required: [runs, next_cursor, summary]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/OrgRun" }
        next_cursor:
          type: string
          nullable: true
          description: Pass as cursor for the next page; null on the last page
        summary: { $ref: "#/components/schemas/RunSummary" }
    OrgRun:
      description: A run with the factory and the item it worked
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [factory, item]
          properties:
            factory: { $ref: "#/components/schemas/FactoryHit" }
            item: { $ref: "#/components/schemas/RunItem" }
    RunItem:
      type: object
      required: [id, ref, title]
      properties:
        id: { type: string }
        ref: { type: string, description: '<factory>#<number>, as in goal#147' }
        title: { type: string }
    RunSummary:
      type: object
      description: The runs of a window's factories, whatever their status
      required: [total, running, failed, finished, spend_usd, spend_by_factory]
      properties:
        total: { type: integer }
        running: { type: integer }
        failed: { type: integer }
        finished: { type: integer, description: Succeeded and cancelled runs }
        spend_usd: { type: number, format: double }
        spend_by_factory:
          type: array
          description: The factories that ran anything in the window, the highest spend first, then by name
          items: { $ref: "#/components/schemas/FactorySpend" }
    FactorySpend:
      type: object
      required: [id, name, spend_usd]
      properties:
        id: { type: string, description: The factory's metadata.id }
        name: { type: string }
        spend_usd: { type: number, format: double }
    AndonPull:
      type: object
      description: >-
        One stop of a factory's line, open (cleared_at null) until someone clears it. While a pull
        is open the line releases and claims nothing.
      required: [id, kind, station, reason, pulled_by, pulled_at, cleared_by, cleared_at, note, data]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/AndonKind" }
        station:
          type: string
          nullable: true
          description: The gate whose rework rate pulled a rework pull; null for a manual one
        reason: { type: string }
        pulled_by: { type: string, description: 'Who pulled the cord, as an actor ref: "system:engine" or "user:local"' }
        pulled_at: { type: string, format: date-time }
        cleared_by: { type: string, nullable: true, description: Who cleared it, as an actor ref; null while open }
        cleared_at: { type: string, format: date-time, nullable: true, description: Null while the pull is open }
        note: { type: string, nullable: true, description: What the clearer wrote, if anything }
        data:
          type: object
          description: The pull's details (a rework pull's rejected, window and top_reason); empty for a manual one
          additionalProperties: {}
    AndonKind:
      type: string
      description: manual, a person's pull; rework, the engine's pull on a gate's rework rate (later; never in phase 2.2)
      enum: [manual, rework]
    NewAndonPull:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the line must stop, 1 to 500 characters (surrounding space is trimmed)
    AndonClear:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          description: What was done about it, at most 2000 characters
    AndonState:
      type: object
      required: [open, recent, policy, gates]
      properties:
        open:
          description: The open pull, or null while the line runs
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AndonPull"
        recent:
          type: array
          description: The latest pulls, open and cleared, the most recent first (up to limit)
          items: { $ref: "#/components/schemas/AndonPull" }
        policy:
          type: object
          nullable: true
          description: The line's board.flow.andon, or null without one (an automatic pull is later work)
          required: [rework_rate, window]
          properties:
            rework_rate: { type: number, format: double, description: Share of verdicts that reject, 0 to 1 }
            window: { type: integer, description: How many of a gate's last verdicts count }
        gates:
          type: array
          description: >-
            Each gate station in line order, tallying its last window verdicts (10 without a
            policy) since the last clear
          items: { $ref: "#/components/schemas/GateTally" }
    GateTally:
      type: object
      required: [station, verdicts, rejected, top_reason, warning]
      properties:
        station: { type: string }
        verdicts: { type: integer }
        rejected: { type: integer }
        top_reason:
          type: string
          nullable: true
          description: The most frequent category, or else normalized reason, of the rejections; null when none
        warning:
          type: boolean
          description: One more rejection would reach the policy's rework rate (always false without a policy)
    FactoryEvent:
      type: object
      description: "The data of one `event: factory` on /v1/orgs/{org}/stream; it carries no content"
      required: [org_id, factory_id, kind, at]
      properties:
        org_id: { type: string }
        factory_id: { type: string }
        kind:
          type: string
          description: andon_pulled or andon_cleared; later phases add kinds, which clients ignore or treat as a change of the line
        andon_id: { type: integer, format: int64, description: The andon pull concerned }
        at: { type: string, format: date-time }
    OrgAttention:
      type: object
      required: [waiting_on_you, factories]
      properties:
        waiting_on_you:
          type: integer
          description: What waits on the caller across the organization (the sum of factories[].waiting_on_you)
        factories:
          type: array
          items: { $ref: "#/components/schemas/FactoryAttention" }
    FactoryAttention:
      type: object
      required: [factory_id, waiting_on_you, blocked_items, andon, connections_blocked]
      properties:
        factory_id: { type: string }
        waiting_on_you: { type: integer, description: "The factory's waiting decisions where the caller has item:decide (none elsewhere), plus one when the factory's weekly budget is used up" }
        blocked_items: { type: integer }
        andon:
          description: The open andon pull, or null while the line runs
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AndonPull"
        connections_blocked: { type: integer, description: Connections that stop work; always 0 until connections exist }
    OrgSearch:
      type: object
      description: What a search found in the organization, by group, each best first
      required: [items, agents, factories, secrets]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchItem" }
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentHit" }
        factories:
          type: array
          items: { $ref: "#/components/schemas/FactoryHit" }
        secrets:
          type: array
          description: Empty unless the caller holds secret:read
          items: { $ref: "#/components/schemas/SecretHit" }
    SearchItem:
      type: object
      required: [id, number, factory_id, factory_name, title, state, station]
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
        factory_id: { type: string, description: The factory's metadata.id }
        factory_name: { type: string }
        title: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        station: { type: string, description: The id of the station the item is at }
    AgentHit:
      type: object
      description: An agent of a factory's current definition; never one of its copies
      required: [name, stations, factory_id, factory_name]
      properties:
        name: { type: string }
        stations:
          type: array
          description: The ids of the stations the agent works at, in line order
          items: { type: string }
        factory_id: { type: string, description: The factory's metadata.id }
        factory_name: { type: string }
    FactoryHit:
      type: object
      required: [id, name, title]
      properties:
        id: { type: string, description: The factory's metadata.id }
        name: { type: string }
        title: { type: string, description: The factory's title, or its name when it has none }
    ConnectionHit:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string }
    SecretHit:
      type: object
      description: A secret whose name matched, never its value
      required: [name, scope, expires_at]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        scope: { $ref: "#/components/schemas/SecretScope" }
        expires_at: { type: string, format: date-time, nullable: true, description: When the value expires }
    SpendWindow:
      type: string
      enum: [week, month, 90d]
      default: week
    OrgSpend:
      type: object
      required:
        - window
        - since
        - until
        - complete
        - total_usd
        - this_month_usd
        - last_month_usd
        - days
        - by_agent
        - by_model
        - merged
        - cost_per_merged_usd
        - weekly
        - rework_usd
        - rework_share
        - budgets
        - usage
      properties:
        window: { $ref: "#/components/schemas/SpendWindow" }
        since: { type: string, format: date-time, description: "The window's start, 00:00 UTC" }
        until: { type: string, format: date-time, description: "The window's end, the time measured (now)" }
        complete:
          type: boolean
          description: >-
            False when a factory the caller does not see spent: the figures the store does not
            split by factory are then null or empty
        total_usd: { type: number, format: double, description: "The window's spend, the sum of days[].usd" }
        this_month_usd: { type: number, format: double, nullable: true, description: This UTC month so far; null when not complete }
        last_month_usd: { type: number, format: double, nullable: true, description: The UTC month before; null when not complete }
        days:
          type: array
          description: Every UTC day of the window, oldest first
          items: { $ref: "#/components/schemas/SpendDay" }
        by_agent:
          type: array
          description: The window's spend by agent of a factory, most first
          items: { $ref: "#/components/schemas/AgentSpend" }
        by_model:
          type: array
          description: The window's spend by model, most first; empty when not complete
          items: { $ref: "#/components/schemas/ModelSpend" }
        merged: { type: integer, nullable: true, description: The items that reached done in the window and are still done; null when not complete }
        cost_per_merged_usd:
          type: number
          format: double
          nullable: true
          description: total_usd over merged, 0 when none merged; null when not complete
        weekly:
          type: array
          description: The cost per merged item of the last 8 UTC weeks (from Monday), this week last; empty when not complete
          items: { $ref: "#/components/schemas/WeekCost" }
        rework_usd:
          type: number
          format: double
          nullable: true
          description: >-
            The window's spend on runs that started after their item was sent back (a rework round
            of 1 or more); null when not complete
        rework_share: { type: number, format: double, nullable: true, description: "rework_usd over total_usd, 0 when nothing was spent; null when not complete" }
        budgets:
          type: array
          description: One per factory goald runs that the caller sees and that is not archived, by name
          items: { $ref: "#/components/schemas/SpendBudget" }
        usage: { $ref: "#/components/schemas/SpendUsage" }
    SpendDay:
      type: object
      required: [day, usd, by_factory]
      properties:
        day: { type: string, format: date }
        usd: { type: number, format: double }
        by_factory:
          type: array
          description: The factories that spent that day, by id
          items: { $ref: "#/components/schemas/DayFactorySpend" }
    DayFactorySpend:
      type: object
      required: [factory_id, usd]
      properties:
        factory_id: { type: string }
        usd: { type: number, format: double }
    AgentSpend:
      type: object
      required: [factory_id, agent, usd]
      properties:
        factory_id: { type: string }
        agent: { type: string, description: The agent's name in its factory }
        usd: { type: number, format: double }
    SpendUsage:
      type: object
      description: >-
        The CPU time and peak memory of the window's runs (a run counts by when it started), over
        the runs that reported either, for the factories the caller sees. Each row groups the runs
        of a factory's agent or station in boxes of one size; a group none of whose runs reported
        a value is left out. Rows are sorted by cpu_seconds_p90, largest first, those without one
        last.
      required: [by_agent, by_station]
      properties:
        by_agent:
          type: array
          items: { $ref: "#/components/schemas/AgentUsage" }
        by_station:
          type: array
          items: { $ref: "#/components/schemas/StationUsage" }
    AgentUsage:
      type: object
      required: [factory_id, agent, box_size, runs, cpu_seconds_p50, cpu_seconds_p90, peak_memory_bytes_p50, peak_memory_bytes_p90]
      properties:
        factory_id: { type: string }
        agent: { type: string, description: The agent's name in its factory }
        box_size:
          allOf: [{ $ref: "#/components/schemas/SandboxSize" }]
          nullable: true
          description: The runs' box size; null for runs from before box sizes were recorded
        runs: { type: integer, description: The runs that reported a CPU time or a peak memory }
        cpu_seconds_p50:
          type: number
          format: double
          nullable: true
          description: >-
            The median CPU seconds of the runs that reported one, interpolated between the closest
            runs (percentile_cont); null when none did
        cpu_seconds_p90: { type: number, format: double, nullable: true, description: The 90th percentile, as cpu_seconds_p50 }
        peak_memory_bytes_p50:
          type: integer
          format: int64
          nullable: true
          description: The median peak memory of the runs that reported one, rounded to a byte; null when none did
        peak_memory_bytes_p90: { type: integer, format: int64, nullable: true, description: The 90th percentile, as peak_memory_bytes_p50 }
    StationUsage:
      description: AgentUsage by station
      type: object
      required: [factory_id, station, box_size, runs, cpu_seconds_p50, cpu_seconds_p90, peak_memory_bytes_p50, peak_memory_bytes_p90]
      properties:
        factory_id: { type: string }
        station: { type: string, description: The station's id in its factory }
        box_size:
          allOf: [{ $ref: "#/components/schemas/SandboxSize" }]
          nullable: true
          description: The runs' box size; null for runs from before box sizes were recorded
        runs: { type: integer, description: The runs that reported a CPU time or a peak memory }
        cpu_seconds_p50: { type: number, format: double, nullable: true, description: As AgentUsage's }
        cpu_seconds_p90: { type: number, format: double, nullable: true, description: As AgentUsage's }
        peak_memory_bytes_p50: { type: integer, format: int64, nullable: true, description: As AgentUsage's }
        peak_memory_bytes_p90: { type: integer, format: int64, nullable: true, description: As AgentUsage's }
    ModelSpend:
      type: object
      required: [model, usd]
      properties:
        model: { type: string }
        usd: { type: number, format: double }
    WeekCost:
      type: object
      required: [week_start, spend_usd, merged, cost_per_merged_usd]
      properties:
        week_start: { type: string, format: date, description: The week's Monday }
        spend_usd: { type: number, format: double }
        merged: { type: integer }
        cost_per_merged_usd: { type: number, format: double, description: 0 when none merged }
    SpendBudget:
      type: object
      required: [factory, daily_usd, weekly_usd, today_usd, week_usd, state, reason, model_connections]
      properties:
        factory: { $ref: "#/components/schemas/FactoryHit" }
        daily_usd:
          type: number
          format: double
          nullable: true
          description: runtime.budget.dailyUsd, shown and not enforced; null when unset
        weekly_usd:
          type: number
          format: double
          nullable: true
          description: runtime.budget.weeklyUsd, the cap the engine enforces; null when unset
        today_usd: { type: number, format: double, description: The cost of the factory's runs started this UTC day }
        week_usd:
          type: number
          format: double
          description: >-
            The cost of the factory's runs started in the last 7×24 hours, rolling: the window the
            engine enforces weekly_usd over, not the UTC week since Monday
        state: { $ref: "#/components/schemas/SpendBudgetState" }
        reason:
          type: string
          nullable: true
          description: The open andon pull's reason when stopped, the spend against the cap when over_budget, else null
        model_connections:
          type: array
          description: >-
            What gives the factory's runs their model, for "Who pays for models": the
            organization's secret runtime.modelKey names, by name with kind "secret" and never
            its value (ADR 0037 decision 7); empty when it names none the organization has
          items: { $ref: "#/components/schemas/ConnectionHit" }
    SpendBudgetState:
      type: string
      description: >-
        stopped while an andon pull is open, over_budget while week_usd is at or over weekly_usd
        (no new agent work starts), else running
      enum: [running, stopped, over_budget]
    FactoryOverviewList:
      type: object
      required: [window, since, until, waiting_on_you, spend_usd, budget_usd, factories]
      properties:
        window: { type: string, description: "The window asked for, as in 7d" }
        since: { type: string, format: date, description: The window's first UTC day }
        until: { type: string, format: date, description: The window's last UTC day (today) }
        waiting_on_you: { type: integer, description: "The sum of factories[].waiting.on_you" }
        spend_usd: { type: number, format: double, description: "The sum of factories[].spend_usd" }
        budget_usd:
          type: number
          format: double
          nullable: true
          description: The sum of the factories' budget_usd, or null when none has a budget
        factories:
          type: array
          items: { $ref: "#/components/schemas/FactoryOverview" }
    FactoryOverview:
      type: object
      required: [factory, health, andon, throughput, constraint, waiting, spend_usd, budget_usd, touches]
      properties:
        touches:
          description: Human touches of the items finished in the window against the window before
          allOf: [{ $ref: "#/components/schemas/TouchTrend" }]
        factory: { $ref: "#/components/schemas/Factory" }
        health: { $ref: "#/components/schemas/FactoryHealth" }
        andon:
          description: The open andon pull, or null while the line runs
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AndonPull"
        throughput: { $ref: "#/components/schemas/Throughput" }
        constraint:
          description: The agent station with the most work per slot now, or null when no agent station has any work
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConstraintSummary"
        waiting: { $ref: "#/components/schemas/WaitingSummary" }
        spend_usd:
          type: number
          format: double
          description: The cost of every agent run of the factory started in the window, Jonah's and other runs without an item included, as Spend's budget rows count it; a running run counts with its cost so far
        budget_usd:
          type: number
          format: double
          nullable: true
          description: The factory's runtime.budget.weeklyUsd scaled to the window (× days / 7), or null without one
    FactoryHealth:
      type: string
      description: running; stopped while an andon pull is open; draft when the factory has no published version yet
      enum: [running, stopped, draft]
    Throughput:
      type: object
      required: [per_day, previous_per_day, days]
      properties:
        per_day: { type: number, format: double, description: Items done in the window per day }
        previous_per_day: { type: number, format: double, description: The same over the previous window }
        days:
          type: array
          description: Items done per UTC day, one entry for every day of the window, oldest first
          items:
            type: object
            required: [day, done]
            properties:
              day: { type: string, format: date }
              done: { type: integer }
    ConstraintSummary:
      type: object
      required: [station, busy]
      properties:
        station: { type: string }
        busy:
          type: number
          format: double
          nullable: true
          description: Share of the window the station was busy (0 to 1); null until it is measured over time
    WaitingSummary:
      type: object
      required: [on_you, items_by_type, tool_approvals]
      properties:
        on_you: { type: integer, description: "Every decision waiting on a person, plus tool approvals once connections exist" }
        items_by_type:
          type: array
          description: The items waiting for a decision by work type, by type
          items:
            type: object
            required: [type, count]
            properties:
              type: { type: string }
              count: { type: integer }
        tool_approvals:
          type: array
          description: Tool calls waiting for approval by connection; always empty until connections exist
          items:
            type: object
            required: [connection, count]
            properties:
              connection: { type: string }
              count: { type: integer }
    Inbox:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          description: Ordered by since, newest first, then by id
          items: { $ref: "#/components/schemas/InboxEntry" }
        truncated: { type: boolean, description: More entries exist than limit; the most recent were kept }
    InboxEntryKind:
      type: string
      description: >-
        What waits; later phases add kinds, which clients that do not know them show as a generic
        row. tool_approval: a tool call an item's agent asked to make, waiting for Approve or Deny.
        conversion: a factory Goal could not move from connections to secrets and environment files
        (ADR 0037 decision 19), which keeps its version until a person fixes what the entry names and
        publishes. knowledge_source: a knowledge source whose last three syncs failed (ADR 0038
        decision 3), once for each factory that lists it. watch_worse: a Jonah proposal whose own number got
        worse since it was published (ADR 0039 decision 15), until an undo of it is written; it offers Undo
        this change (POST …/jonah/proposals/{number}/undo). check_failing: a trigger whose last three
        checks failed (ADR 0040 decision 19), tries left out, until one is done. check_limit: a trigger
        whose check skipped something over its limit today (UTC), once a day. budget: a factory whose
        weekly budget is used up, measured against its current version's cap, until the window's spend
        falls below the cap or the cap rises
      enum: [decision, question, tool_approval, andon, budget, rework_warning, blocked, expedite, conversion, knowledge_source, watch_worse, check_failing, check_limit]
    InboxEntry:
      type: object
      required: [id, kind, factory, since, item, station, action, approval, blocked, andon, rework]
      properties:
        id:
          type: string
          description: >-
            "<kind>:<id of what waits>": decision:, question:, tool_approval:, blocked: and expedite:<item id>,
            andon:<pull id>, budget:<factory id>, rework_warning:<factory id>:<gate station>, conversion:<factory id>,
            watch_worse:<proposal id>, check_failing:<factory id>:<trigger>, check_limit:<factory id>:<trigger>:<UTC day>
        kind: { $ref: "#/components/schemas/InboxEntryKind" }
        factory:
          type: object
          required: [id, name, title]
          properties:
            id: { type: string }
            name: { type: string }
            title: { type: string, nullable: true }
        since:
          type: string
          format: date-time
          description: >-
            Since when it waits: the item's last change (decision, question, tool_approval, blocked), its creation
            (expedite), the pull (andon), since when the budget is used up (budget), now (rework_warning), the conversion's attempt (conversion), the
            watch's last update (watch_worse)
        item:
          description: The item it is about, or null for an entry that is about no item
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ItemCard"
        station: { type: string, nullable: true, description: The station where it waits }
        action:
          description: merge for a decision at a merge station (POST /v1/orgs/{org}/items/{item}/merge), else null
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StationAction"
        approval:
          description: A decision's brief, for deciding without opening the item; null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ApprovalBrief"
        blocked:
          description: Why a blocked item is blocked; null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InboxBlocked"
        question:
          description: A question entry's open question; absent or null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ItemQuestion"
        tool_approval:
          description: A tool_approval entry's open tool approval; absent or null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ToolApproval"
        andon:
          description: The open pull of an andon entry; null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AndonPull"
        rework:
          description: The gate tally of a rework warning; null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReworkWarning"
        conversion:
          description: Why Goal could not convert the factory; absent or null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InboxConversion"
        knowledge_source:
          description: Why the knowledge source does not sync; absent or null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InboxKnowledgeSource"
        watch:
          description: The watch of a watch_worse entry, with its proposal's number; absent or null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Watch"
        trigger_check:
          description: The trigger of a check_failing or check_limit entry; absent or null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InboxTriggerCheck"
        budget:
          description: The used-up weekly budget of a budget entry; absent or null for other kinds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InboxBudget"
    InboxBudget:
      type: object
      description: A factory's used-up weekly budget, in the rolling 7×24-hour window that ends now.
      required: [spent_usd, weekly_usd, since, resumes_at]
      properties:
        spent_usd: { type: number, format: double, description: The cost of the runs started in the window }
        weekly_usd: { type: number, format: double, description: The cap, from the factory's current version }
        since:
          type: string
          format: date-time
          description: Since when the budget is used up, as the engine recorded it (now when it has not yet)
        resumes_at:
          type: string
          format: date-time
          description: When the window's spend falls below the cap; the line resumes on the engine's first tick after it
    InboxTriggerCheck:
      type: object
      description: A check trigger whose checks need a person (ADR 0040 decision 19), on its factory's Trigger page.
      required: [trigger, reason]
      properties:
        trigger: { type: string, description: The trigger's name }
        reason:
          type: string
          description: >-
            For check_failing, why its newest check failed; for check_limit, "over the limit"
    InboxKnowledgeSource:
      type: object
      description: A knowledge source whose last syncs failed, shown under each factory that lists it.
      required: [source, error, failed_syncs]
      properties:
        source: { type: string, description: The source's name }
        error: { type: string, description: What the last sync said }
        failed_syncs: { type: integer, description: How many syncs failed in a row }
    InboxConversion:
      type: object
      description: >-
        A factory Goal could not move from connections to secrets and environment files. It runs
        on its version, on connections, until a version on secrets is published.
      required: [reason, problems]
      properties:
        reason:
          type: string
          description: Every problem in one sentence each, for a row that shows one line
        problems:
          type: array
          description: >-
            What to fix, one entry each, such as "connection aws-prod uses the aws kind, which Goal no
            longer converts: remove it from the factory"
          items: { type: string }
    ApprovalBrief:
      type: object
      description: >-
        From the output of the latest station that has one: its summary field, up to four of its
        other short top-level fields (strings of at most 120 characters, numbers, booleans; by
        key; never summary, pull_request, lane, decision, reason or category), the pull request the
        outputs name, and what the item has cost
      required: [summary, facts, pull_request, spend_usd]
      properties:
        summary: { type: string, nullable: true }
        facts:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string, description: The output's field, as the contract names it }
              value: { type: string, description: The value as text (true and false read yes and no) }
        pull_request: { type: string, nullable: true }
        spend_usd: { type: number, format: double }
    InboxBlocked:
      type: object
      required: [reason, code, paused]
      properties:
        reason:
          type: string
          nullable: true
          description: The reason of the item's latest blocked or paused event, as written then; null without one
        code:
          type: string
          nullable: true
          description: >-
            The code of the item's latest blocked event (model_key_missing: the line names no
            runtime.modelKey); null without one
        paused: { type: boolean, description: A person paused it (goal retry resumes it) }
    ReworkWarning:
      type: object
      required: [station, rejected, verdicts, window, threshold, top_reason]
      properties:
        station: { type: string, description: The gate station }
        rejected: { type: integer, description: Rejections among its last verdicts since the last andon clear }
        verdicts: { type: integer, description: Verdicts counted (at most window) }
        window: { type: integer, description: The andon policy's window }
        threshold: { type: number, format: double, description: The andon policy's rework rate, 0 to 1 }
        top_reason: { type: string, nullable: true, description: The most frequent category or reason of the rejections }
    BuilderMeta:
      type: object
      required: [models, capabilities, limits]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/BuilderModel" }
        capabilities: { $ref: "#/components/schemas/BuilderCapabilities" }
        limits: { $ref: "#/components/schemas/BuilderLimits" }
    BuilderModel:
      type: object
      required: [id, label, default]
      properties:
        id: { type: string, description: "The model id, as runtime.model and agents[].model take it" }
        label: { type: string }
        default: { type: boolean, description: The model a factory runs when it names none }
    BuilderCapabilities:
      type: object
      description: What this install enforces; the editor shows the controls for what it does not read-only
      required: [tool_approvals]
      properties:
        tool_approvals: { type: boolean, description: '"Ask me" on built-in tools is enforced' }
    BuilderLimits:
      type: object
      required: [skill_bytes, skill_files]
      properties:
        skill_bytes: { type: integer, description: The most bytes one skill folder holds }
        skill_files: { type: integer, description: The most files one skill folder holds }
    SkillName:
      type: string
      pattern: "^[A-Za-z0-9_.-]{1,100}$"
      description: An owner, repository or skill name of skills.sh (never . or ..)
    SkillListing:
      type: object
      description: One skill of the catalog, at the commit it is pinned at
      required: [key, owner, repo, skill, commit, description, installs, files, bytes]
      properties:
        key: { type: string, description: "<owner>/<repo>/<skill>" }
        owner: { type: string }
        repo: { type: string }
        skill: { type: string }
        commit: { type: string, pattern: "^[0-9a-f]{40}$" }
        description: { type: string, description: "From SKILL.md's front matter; plain text" }
        installs: { type: integer, format: int64, description: skills.sh installs when the operator last synced it }
        files: { type: integer }
        bytes: { type: integer, format: int64 }
    SkillPage:
      type: object
      required: [skills, next_after]
      properties:
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillListing" }
        next_after:
          type: string
          nullable: true
          description: Pass as `after` for the next page; null on the last one
    SkillFiles:
      type: object
      required: [skill, files]
      properties:
        skill: { $ref: "#/components/schemas/SkillListing" }
        files: { $ref: "#/components/schemas/FileMap" }
    FileMap:
      type: object
      description: Files by slash-separated relative path
      additionalProperties: { $ref: "#/components/schemas/FileContent" }
    FileContent:
      description: A file's content, as text when it is UTF-8 without NUL bytes, else in base64
      oneOf:
        - { $ref: "#/components/schemas/TextFile" }
        - { $ref: "#/components/schemas/Base64File" }
    TextFile:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }
    Base64File:
      type: object
      required: [base64]
      additionalProperties: false
      properties:
        base64: { type: string, format: byte }
    # Definitions (B §8): factories' drafts, versions, validation and templates.
    VersionRef:
      type: object
      description: A published version as listings name it
      required: [id, number, published_at, published_by]
      properties:
        id: { type: string }
        number: { type: integer }
        published_at: { type: string, format: date-time }
        published_by: { $ref: "#/components/schemas/Actor" }
    DraftRef:
      type: object
      description: An open draft as listings name it
      required: [id, revision, updated_at, updated_by]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/Actor" }
    NewFactoryRequest:
      type: object
      required: [start]
      properties:
        name:
          type: string
          description: Required except for an import, where factory.yaml's metadata.name is used when it is absent
        title: { type: string }
        start: { $ref: "#/components/schemas/FactoryStart" }
    FactoryStart:
      description: Where the new factory's first draft comes from
      oneOf:
        - $ref: "#/components/schemas/BlankStart"
        - $ref: "#/components/schemas/TemplateStart"
        - $ref: "#/components/schemas/CloneStart"
        - $ref: "#/components/schemas/ImportStart"
      discriminator:
        propertyName: kind
        mapping:
          blank: "#/components/schemas/BlankStart"
          template: "#/components/schemas/TemplateStart"
          clone: "#/components/schemas/CloneStart"
          import: "#/components/schemas/ImportStart"
    BlankStart:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [blank] }
    TemplateStart:
      type: object
      required: [kind, template]
      properties:
        kind: { type: string, enum: [template] }
        template: { type: string, description: The template's name }
        version: { type: integer, minimum: 1, description: The template's version; the latest when absent }
    CloneStart:
      type: object
      required: [kind, factory]
      properties:
        kind: { type: string, enum: [clone] }
        factory: { type: string, description: The factory to copy (its id or name), of the same organization }
        version:
          type: string
          description: The version to copy (a number or current); the current one when absent, the draft of a factory never published
    ImportStart:
      type: object
      required: [kind, files]
      properties:
        kind: { type: string, enum: [import] }
        files: { $ref: "#/components/schemas/FileMap" }
        keep_id:
          type: boolean
          description: Keep factory.yaml's metadata.id (goal factory push of a factory the organization lacks)
    FileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/FileInfo" }
    FileInfo:
      type: object
      required: [path, sha256, size]
      properties:
        path: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64, description: Bytes }
    DefinitionFiles:
      type: object
      required: [files]
      properties:
        files: { $ref: "#/components/schemas/FileMap" }
    Section:
      type: string
      enum: [basics, line, agents, connections, review]
    LineRange:
      type: array
      description: The first and last line of factory.yaml, 1-based; [0, 0] when it is not in the file
      minItems: 2
      maxItems: 2
      items: { type: integer }
    Ranges:
      type: object
      description: Where each model pointer (/line/stations/3) is in factory.yaml
      additionalProperties: { $ref: "#/components/schemas/LineRange" }
    SectionSummary:
      type: object
      description: One section tab's badge ("1 change, 1 problem") and the lines of factory.yaml it spans
      required: [section, changes, problems, lines]
      properties:
        section: { $ref: "#/components/schemas/Section" }
        changes: { type: integer }
        problems: { type: integer }
        lines: { $ref: "#/components/schemas/LineRange" }
    VersionState:
      type: string
      enum: [draft, published, archived]
    VersionSource:
      type: object
      description: Where a version started ("Source - Template Cost review v2")
      required: [kind]
      properties:
        kind: { type: string, enum: [blank, template, clone, import, cli, legacy, edit] }
        template: { type: string, description: The template and its version, as in cost-review@2 }
        factory: { type: string, description: The factory a clone copied }
        version: { type: string, description: The version a clone copied, or the base of an edit }
    Draft:
      type: object
      required: [id, revision, next_number, created_at, created_by, updated_at, updated_by, base, current, source, change_count, problem_count, sections]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64, description: Counts the draft's saves from 1 }
        next_number: { type: integer, description: The number publishing gives it ("Draft of v9") }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/Actor" }
        updated_at: { type: string, format: date-time, description: The last save ("Autosaved 14:32") }
        updated_by: { $ref: "#/components/schemas/Actor" }
        base:
          description: The published version it started from ("based on v8"); null for a first draft
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VersionRef" }]
        current:
          description: The version that runs now, which differs from base after a restore; null before the first publish
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VersionRef" }]
        source: { $ref: "#/components/schemas/VersionSource" }
        change_count: { type: integer, description: Changes from the base, or the starting tree }
        problem_count: { type: integer }
        sections:
          type: array
          items: { $ref: "#/components/schemas/SectionSummary" }
    OpenDraftRequest:
      type: object
      properties:
        base: { type: string, description: A published version (a number or current); current when absent }
        replace: { type: boolean, description: Archive the open draft first (goal factory push --replace-draft) }
    SectionETags:
      type: object
      description: Each section's concurrency token, the If-Match of its save
      required: [basics, line, agents, connections, review]
      properties:
        basics: { type: string }
        line: { type: string }
        agents: { type: string }
        connections: { type: string }
        review: { type: string }
    NewDraftRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "What to change, 1 to 2000 characters once trimmed" }
        agent: { type: string, description: The agent of the definition the request is about (Ask Jonah for a fix) }
    DraftRequest:
      type: object
      description: >-
        An asked change to a factory's definition (ADR 0021): queued until a goald claims it,
        running in a box, then done or failed with what it changed in the draft
      required: [id, text, agent, status, summary, changed_paths, cost_usd, turns, error, requester, created_at]
      properties:
        id: { type: string }
        text: { type: string }
        agent: { type: string, description: 'The agent the request is about, "" for the Ask bar' }
        status: { type: string, enum: [queued, running, done, failed] }
        summary: { type: string, description: 'What the agent changed, or why the request failed; "" until it ends' }
        changed_paths:
          type: array
          description: The definition paths the request wrote or deleted in the draft
          items: { type: string }
        cost_usd: { type: number, format: double }
        turns: { type: integer }
        error: { type: string, description: 'What went wrong when the request failed, "" otherwise' }
        requester: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    DraftRequestList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/DraftRequest" }
    KnowledgeSourceEntry:
      type: object
      description: One knowledge.sources entry written as a mapping (ADR 0038 decision 5)
      required: [name]
      properties:
        name: { type: string, description: The knowledge source's name, its folder under /knowledge }
        appliesTo:
          type: object
          description: The runs that read the source, matched as a rule's scope; every run when absent
          properties:
            agents: { type: array, items: { type: string } }
            stations: { type: array, items: { type: string } }
            lanes: { type: array, items: { type: string } }
            workTypes: { type: array, items: { type: string } }
        readWhen: { type: string, description: "When to read it, in this factory's words; the snapshot's own line when absent" }
    KnowledgePreview:
      type: object
      required: [section]
      properties:
        section:
          type: string
          description: >-
            The Knowledge prompt section the agent's runs get from the draft, as Markdown; "" when
            there is nothing to say or the agent may not read files
    DraftModel:
      type: object
      required: [revision, model, etags, edited, ranges]
      properties:
        revision: { type: integer, format: int64 }
        model: { $ref: "#/components/schemas/FactoryModel" }
        etags: { $ref: "#/components/schemas/SectionETags" }
        edited:
          type: object
          description: >-
            The model pointers the draft changed against its base (or starting tree), each with the
            value there, null where it had none: the fields' Edited · Undo
          additionalProperties: {}
        ranges: { $ref: "#/components/schemas/Ranges" }
    VersionModel:
      type: object
      required: [model, ranges]
      properties:
        model: { $ref: "#/components/schemas/FactoryModel" }
        ranges: { $ref: "#/components/schemas/Ranges" }
    SectionSave:
      type: object
      required: [value]
      properties:
        value:
          description: The section's new value, the shape of FactoryModel's property of the section
          x-go-type: json.RawMessage
        files: { $ref: "#/components/schemas/FileMap" }
        remove_files:
          type: array
          description: Files to delete in the same revision, except a prompt another agent still uses
          items: { type: string }
    RevertRequest:
      type: object
      required: [pointers]
      properties:
        pointers:
          type: array
          items: { type: string }
    SaveResult:
      type: object
      description: The draft after a save
      required: [revision, updated_at, change_count, problem_count, sections]
      properties:
        revision: { type: integer, format: int64 }
        etag: { type: string, description: A section save's new etag }
        sha256: { type: string, description: A file save's new sha256 }
        updated_at: { type: string, format: date-time }
        change_count: { type: integer }
        problem_count: { type: integer }
        sections:
          type: array
          items: { $ref: "#/components/schemas/SectionSummary" }
    DraftTree:
      type: object
      required: [files]
      properties:
        files: { $ref: "#/components/schemas/FileMap" }
        expected_revision: { type: integer, format: int64, description: Refuse (412) when the draft is at another revision }
    StationMoves:
      type: object
      description: Where the open items of each station the new version removes go, by station id
      additionalProperties: { type: string }
    ValidateDraftRequest:
      type: object
      properties:
        overlay: { $ref: "#/components/schemas/FileMap" }
        station_moves: { $ref: "#/components/schemas/StationMoves" }
    PublishRequest:
      type: object
      required: [revision, expected_current_version_id]
      properties:
        revision: { type: integer, format: int64, description: The draft revision the editor validated }
        expected_current_version_id:
          type: string
          nullable: true
          description: The version the editor saw running; null for a first publish
        message: { type: string, maxLength: 200, description: The publish note }
        station_moves: { $ref: "#/components/schemas/StationMoves" }
        start:
          type: boolean
          default: true
          description: First publish only; false creates the factory paused (Start the line right away)
    RestoreRequest:
      type: object
      required: [expected_current_version_id]
      properties:
        expected_current_version_id: { type: string, description: The version the caller saw running }
        station_moves: { $ref: "#/components/schemas/StationMoves" }
    DefinitionCounts:
      type: object
      required: [stations, agents, skills, connections, contracts, changes]
      properties:
        stations: { type: integer }
        agents: { type: integer }
        skills: { type: integer }
        connections: { type: integer }
        contracts: { type: integer }
        changes: { type: integer, description: Changes from the base or starting tree; 0 when there is none to compare with }
    CheckResult:
      type: object
      description: >-
        One line of Review & publish's checks; checks that did not run (after a schema failure,
        or of phases not wired yet) are absent, never passed
      required: [id, section, status, summary]
      properties:
        id: { type: string, description: "yaml, schema, line, references, tools, removed, images, secrets, availability, name, items, connections, ..." }
        section: { type: string }
        status: { type: string, enum: [passed, failed, warning] }
        summary: { type: string }
    Validation:
      type: object
      required: [ok, revision, counts, checks, problems]
      properties:
        ok: { type: boolean, description: No problem is an error, so the definition can be published }
        revision: { type: integer, format: int64, description: The draft revision validated; 0 for files outside a draft }
        counts: { $ref: "#/components/schemas/DefinitionCounts" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CheckResult" }
        problems:
          type: array
          items: { $ref: "#/components/schemas/DefinitionProblem" }
    DefinitionProblem:
      type: object
      description: One validation finding, located for both views (Visual by section and pointer, YAML by file and lines)
      required: [code, severity, check, section, line, column, end_line, end_column, message, fixes]
      properties:
        code: { type: string, description: Stable and kebab-case, as in unknown-agent }
        severity: { type: string, enum: [error, warning, info], description: errors block publishing }
        check: { type: string, description: The validation step that found it }
        section: { type: string, description: basics, line, agents, connections, review or files }
        pointer: { type: string, description: An RFC 6901 pointer into the factory model (/line/stations/3/agent) }
        file: { type: string, description: The file, as in factory.yaml }
        line: { type: integer, description: 1-based; 0 when not in a file }
        column: { type: integer }
        end_line: { type: integer }
        end_column: { type: integer }
        message: { type: string }
        fixes:
          type: array
          items: { $ref: "#/components/schemas/ProblemFix" }
    ProblemFix:
      type: object
      description: >-
        A machine-applicable fix: a JSON Patch on one section of the model, or (section publish)
        on the publish request (add /station_moves/<station>)
      required: [label, section, patch]
      properties:
        label: { type: string, description: As in Set WIP to 2 }
        section: { type: string }
        patch:
          type: array
          items: { $ref: "#/components/schemas/PatchOp" }
    PatchOp:
      type: object
      description: One RFC 6902 operation, its path relative to the section's value
      required: [op, path]
      properties:
        op: { type: string, enum: [add, remove, replace] }
        path: { type: string }
        value:
          description: The value of add and replace
          x-go-type: json.RawMessage
    ParseError:
      type: object
      description: Where factory.yaml stops parsing
      required: [line, column, message]
      properties:
        line: { type: integer, description: 1-based; 0 when unknown }
        column: { type: integer }
        message: { type: string }
    ItemsAtRemovedStations:
      type: object
      description: The open items that keep a publish or restore from dropping stations
      required: [in_progress, unmapped]
      properties:
        in_progress:
          type: array
          description: Items being worked; they must finish or be stopped first
          items: { $ref: "#/components/schemas/ItemAt" }
        unmapped:
          type: array
          description: Open items no station move maps
          items: { $ref: "#/components/schemas/ItemAt" }
    ItemAt:
      type: object
      required: [id, number, station, state]
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
        station: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
    Version:
      type: object
      required: [id, number, revision, state, message, source, published_at, published_by, current, counts]
      properties:
        id: { type: string }
        number: { type: integer, nullable: true, description: null for a draft }
        revision: { type: integer, format: int64 }
        state: { $ref: "#/components/schemas/VersionState" }
        message: { type: string }
        source: { $ref: "#/components/schemas/VersionSource" }
        published_at: { type: string, format: date-time, nullable: true }
        published_by:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Actor" }]
        current: { type: boolean, description: This is the version that runs }
        counts: { $ref: "#/components/schemas/DefinitionCounts" }
        watches:
          type: array
          description: >-
            The watches of this version's change, by station and metric: a Jonah proposal's own
            number, or the send-back rate and cost per item at each station it reaches; empty for a
            change not watched yet and absent for a draft
          items: { $ref: "#/components/schemas/Watch" }
    VersionDetail:
      allOf:
        - $ref: "#/components/schemas/Version"
        - type: object
          required: [files]
          properties:
            files:
              type: array
              items: { $ref: "#/components/schemas/FileInfo" }
    VersionPage:
      type: object
      required: [versions, next_before]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/Version" }
        next_before:
          type: integer
          nullable: true
          description: Pass as `before` for the next page; null on the last page
    CompareSide:
      type: object
      description: One side of a comparison; id, number and state are null for a starting tree no version holds
      required: [selector, id, number, state]
      properties:
        selector: { type: string, description: The selector asked for (base, draft, 8, ...) }
        id: { type: string, nullable: true }
        number: { type: integer, nullable: true, description: null unless published }
        state:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VersionState" }]
    Comparison:
      type: object
      required: [from, to, files, changes, counts]
      properties:
        from: { $ref: "#/components/schemas/CompareSide" }
        to: { $ref: "#/components/schemas/CompareSide" }
        files:
          type: array
          items: { $ref: "#/components/schemas/FileChange" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        counts:
          type: object
          description: '"3 changes in 2 sections"'
          required: [changes, sections]
          properties:
            changes: { type: integer }
            sections: { type: integer }
    FileChange:
      type: object
      required: [path, op]
      properties:
        path: { type: string }
        op: { type: string, enum: [added, removed, modified, unchanged] }
        from_sha256: { type: string, description: Absent for an added file }
        to_sha256: { type: string, description: Absent for a removed file }
    Change:
      type: object
      description: One meaningful difference, by identity (a reordered station is one moved change)
      required: [section, op, target, summary, from_lines, to_lines]
      properties:
        section: { type: string, description: A section, or files }
        op: { type: string, enum: [added, removed, changed, moved] }
        target:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string, enum: [station, agent, connection, tool, skill, contract, field, file] }
            id: { type: string }
        field: { type: string, description: Set when exactly one field of the target changed }
        from: { description: The value before }
        to: { description: The value after }
        summary: { type: string, description: A short sentence, as in Build also runs pnpm test }
        from_lines: { $ref: "#/components/schemas/LineRange" }
        to_lines: { $ref: "#/components/schemas/LineRange" }
    TemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/TemplateSummary" }
    TemplateSummary:
      type: object
      required: [name, version, title, summary, stations, agents, connectors, changed, code]
      properties:
        name: { type: string }
        version: { type: integer }
        title: { type: string }
        summary: { type: string }
        stations: { type: integer }
        agents: { type: integer }
        connectors:
          type: array
          items: { type: string }
        changed: { type: string, description: 'The day the version was made, as in 2026-10-09' }
        code: { $ref: "#/components/schemas/TemplateCode" }
    TemplateCode:
      type: string
      enum: [none, read, write]
      description: The code access a template needs; write when its line has a station that merges.
    Template:
      allOf:
        - $ref: "#/components/schemas/TemplateSummary"
        - type: object
          required: [description, model]
          properties:
            description: { type: string }
            model: { $ref: "#/components/schemas/FactoryModel" }
    FactoryModel:
      type: object
      description: >-
        The factory model the Visual editor edits: factory.yaml's sections with snake_case keys
        (the YAML's camelCase keys). It mirrors the YAML leniently: a key the YAML lacks is absent,
        and a value the schema refuses appears as it is, with a problem.
      x-go-type: json.RawMessage
      required: [basics, line, agents, connections, review]
      properties:
        basics:
          type: object
          properties:
            id: { type: string, description: metadata.id, read-only }
            name: { type: string }
            title: { type: string }
            purpose: { type: string }
            work_types:
              type: array
              items: { type: string }
            model_connection: { type: string, description: "runtime.modelConnection: the organization connection that gives every run its model" }
            size: { type: string, enum: [small, medium, large], description: "runtime.size: each run's box; medium when absent" }
            tools:
              type: array
              description: runtime.tools, mise tool specs every run installs
              items: { type: string }
            repository:
              type: object
              nullable: true
              description: "{url, connection} (connection absent for a public repository); token, removed in phase 4, while a version still has it"
              additionalProperties: {}
            knowledge_sources:
              type: array
              description: >-
                knowledge.sources, the organization's knowledge sources the factory's runs read, in
                the definition's order: a name, or an entry with its own appliesTo and readWhen,
                each kept as factory.yaml writes it
              items:
                oneOf:
                  - { type: string }
                  - { $ref: "#/components/schemas/KnowledgeSourceEntry" }
            runner: { type: string, description: "Removed in phase 4 (field-removed); present while factory.yaml has it, so its quick fix can remove it" }
            image: { type: string, description: Removed in phase 4 (field-removed), as runner }
            auth: { type: string, description: Removed in phase 4 (field-removed), as runner }
            secrets: { type: object, additionalProperties: {}, description: Removed in phase 4 (field-removed), as runner }
            knowledge_base: { type: object, additionalProperties: {}, description: Removed in phase 4 (field-removed), as runner }
        line:
          type: object
          properties:
            stations:
              type: array
              items:
                type: object
                description: >-
                  id, name, description, kind (queue, agent, human, done), agent, route (lane →
                  agent or {agent, agents}: an entry with agents n keeps n of the station's slots
                  for its lane, which uses no others; entries without a count share the rest),
                  agents, wip, buffer, output, checks (strings or {kind, run, min}), gate
                  ({on_reject, max_rework}), action
                additionalProperties: {}
            intake:
              type: array
              items:
                type: object
                additionalProperties: {}
            flow:
              type: object
              description: expedite, constraint, release, andon, targets
              additionalProperties: {}
            librarian:
              type: string
              nullable: true
              deprecated: true
              description: >-
                Ignored: learning.librarian is retired (ADR 0039, warning field-ignored). goald
                always answers null and ignores a value written here
        agents:
          type: object
          properties:
            default_model: { type: string }
            agents:
              type: array
              items:
                type: object
                description: >-
                  name, description, prompt ({path, sha256, words}), model, max_turns,
                  per_item_usd, skills, connections, builtins ({read, edit, run: {mode, commands},
                  web, subagents}), custom_tools
                additionalProperties: {}
            skills:
              type: array
              items:
                type: object
                description: name, source, origin
                additionalProperties: {}
            rules:
              type: array
              items:
                type: object
                description: name, source (./rules/<name>.md)
                additionalProperties: {}
        connections:
          type: array
          items:
            type: object
            description: >-
              An organization connection the factory uses, {name} (written as the name in
              factory.yaml); or, removed in phase 4 (connection-inline-removed) while a version
              still has one, an inline connection: name, connector, type, credential, agents,
              tools, settings, legacy
            additionalProperties: {}
        review:
          type: object
          properties:
            budget:
              type: object
              description: weekly_usd, daily_usd, per_item_usd, max_turns_per_task, on_exhausted
              additionalProperties: {}
        starter:
          type: object
          description: >-
            factory.yaml's starter section (ADR 0032), absent when the YAML has none. It is not a
            Visual section and has no ETag: onboarding submits starter.item once, through submitItem,
            to a factory with no items, and YAML mode edits it.
          required: [item]
          properties:
            item:
              type: object
              required: [title]
              properties:
                title: { type: string }
                type: { type: string, description: "One of board.workTypes; when absent, submitItem gives the first" }
                body: { type: string, description: "The item's brief, in markdown" }
    DefinitionEvent:
      type: object
      description: "The data of one `event: definition` on /v1/orgs/{org}/stream; it carries no content"
      required: [org_id, factory_id, kind]
      properties:
        org_id: { type: string }
        factory_id: { type: string }
        kind:
          type: string
          enum: [current, draft, factory]
          description: >-
            current: the version that runs moved, or the factory was paused or resumed; draft: a
            version row changed (a draft opened, saved, discarded or published); factory: the
            factory was created or deleted
        version_id: { type: string, description: The version concerned (current - the one that runs) }
        number: { type: integer, description: The version's number once published }
        revision: { type: integer, format: int64, description: draft only, the draft's revision }
        by: { type: string, description: "draft only, who saved it, as an actor ref (user:local)" }
    ConnectionName:
      type: string
      description: 3 to 40 lowercase letters, digits and inner dashes, starting with a letter
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
    ConnectionKind:
      type: object
      description: A template for connections (spec 4 §4.2), the platform's or the organization's
      required: [name, title, platform, fields, modes, model, testable, env]
      properties:
        name: { $ref: "#/components/schemas/ConnectionName" }
        title: { type: string }
        description: { type: string }
        platform: { type: boolean, description: Shipped with goald; otherwise the organization's own }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ConnectionKindField" }
        modes:
          type: array
          description: "How runs use it: env (variables for API calls and CLIs), mcp (an MCP server, remote or stdio), cli (a tool installed in the box), git (git over https)"
          items: { type: string, enum: [env, mcp, cli, git] }
        model: { type: boolean, description: "It gives agents their model; only such a kind may be a factory's model connection" }
        code_host: { type: string, description: "The code host adapter that reads and merges its pull requests (github, gitlab)" }
        mint: { type: string, description: "The adapter that mints per-run credentials from it (aws-sts)" }
        sync: { type: string, description: "The knowledge source reader that syncs through it (gitdocs, confluence)" }
        testable: { type: boolean, description: It has a test request }
        env:
          type: array
          description: The env names a run gets, as the kind writes them ({{field}} where a field names one)
          items: { type: string }
        docs: { type: string, description: What agents are told about using it }
    ConnectionKindField:
      type: object
      required: [name, title, secret, required]
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        secret: { type: boolean, description: "Write-only, sealed; an input of type password" }
        required: { type: boolean }
        default: { type: string, description: The value of a field left empty }
    Connection:
      type: object
      description: An organization's connection (spec 4 §4.3), never a secret value
      required: [id, name, kind, description, fields, secrets_set, status, used_by, last_used_at, last_test, tools, waiting_approvals, created_by, created_at, updated_by, updated_at]
      properties:
        id: { type: string }
        name: { $ref: "#/components/schemas/ConnectionName" }
        kind: { type: string }
        description: { type: string }
        fields:
          type: object
          description: The non-secret values set (a kind's defaults are not copied in)
          additionalProperties: { type: string }
        secrets_set:
          type: array
          description: The secret fields that are set, sorted; their values are never shown
          items: { type: string }
        status:
          type: string
          enum: [ok, failing, untested, missing-secret]
          description: >-
            missing-secret: a required secret field is not set (its kind gained one); else the
            last test's outcome, untested before any
        used_by: { $ref: "#/components/schemas/ConnectionUsers" }
        last_used_at: { type: string, format: date-time, nullable: true, description: When a run last got it }
        last_test:
          allOf: [{ $ref: "#/components/schemas/ConnectionTestResult" }]
          nullable: true
        env:
          type: array
          description: getConnection only, the env names a run gets from it
          items: { type: string }
        docs: { type: string, description: "getConnection only, its kind's docs for agents" }
        tools:
          type: array
          description: >-
            Its tools and their modes (ADR 0031 decisions 1 and 2), sorted by name: one entry for
            each tool the last test listed and each tool with a mode set, a tool without a mode
            being allow; empty for a connection never tested and without modes
          items: { $ref: "#/components/schemas/ConnectionTool" }
        waiting_approvals:
          type: integer
          minimum: 0
          description: >-
            The open tool approvals on this connection in the organization, by its current name;
            the connections list's "Writes waiting for your OK" is their sum
        created_by: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/Actor" }
        updated_at: { type: string, format: date-time }
    ConnectionToolMode:
      type: string
      description: >-
        What a run may do with one tool of the connection (ADR 0031 decision 1): allow runs the
        call, ask pauses it for a person, off refuses it
      enum: [allow, ask, off]
    ConnectionTool:
      type: object
      required: [name, mode]
      properties:
        name:
          type: string
          description: >-
            The tool's name as the MCP server lists it, without the connection prefix: 1 to 128
            letters, digits, underscores, dots or dashes
        mode: { $ref: "#/components/schemas/ConnectionToolMode" }
    ConnectionUsers:
      type: object
      description: What uses a connection, so it cannot be deleted or renamed meanwhile
      required: [factories, knowledge_sources]
      properties:
        factories:
          type: array
          description: The factories whose current version names it (those the caller sees)
          items: { $ref: "#/components/schemas/ConnectionFactory" }
        knowledge_sources:
          type: array
          description: The knowledge sources that read it, by name
          items: { type: string }
    ConnectionFactory:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    CredentialName:
      type: string
      description: >-
        3 to 40 lowercase letters, digits and inner dashes, starting with a letter; an agent gets
        it as the env variable of the name upper-cased with each - turned into _, which must not be
        one reserved for the platform
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
    CredentialType:
      type: string
      description: A label of what the credential is; every type reaches a run as one env value
      enum: [api_key, oauth_token, ssh_key, cloud_role, app_key]
    CredentialScope:
      type: object
      description: The factories whose runs may open it; neither all nor any listed reaches no run
      required: [all_factories, factories]
      properties:
        all_factories: { type: boolean, description: Every factory, ones created later included }
        factories:
          type: array
          description: The factories' metadata.id, when not all_factories
          items: { type: string }
    CredentialAgents:
      type: object
      description: Per factory id, the agents that get it in their run's box as env
      additionalProperties:
        type: array
        items: { type: string }
    WebhookSender:
      type: string
      enum: [github, gitlab, standard, pagerduty, sentry, token]
      description: >-
        How a webhook is signed and names its events (ADR 0040 decision 12). github:
        X-Hub-Signature-256; gitlab: X-Gitlab-Token; standard: Standard Webhooks'
        webhook-signature; pagerduty: X-PagerDuty-Signature; sentry: Sentry-Hook-Signature; token:
        a shared value in one header, for a sender that can do nothing else.
    WebhookTokenSettings:
      type: object
      description: The token sender's settings
      properties:
        header: { type: string, description: "The header that carries the value; Authorization (as Bearer <value>) when empty", maxLength: 100 }
        event_path: { type: string, description: "The body's dot path of the event name, such as event.type; empty for none", maxLength: 200 }
        id_path: { type: string, description: "The body's dot path of a delivery id; empty for none", maxLength: 200 }
    WebhookOpening:
      type: object
      description: The webhook is open to a factory
      required: [factory]
      properties:
        factory: { type: string, description: "The factory's metadata.id" }
        repositories:
          type: array
          nullable: true
          maxItems: 100
          description: "The repositories (owner/name) whose deliveries reach the factory; null or absent: every one"
          items: { type: string }
    WebhookTrigger:
      type: object
      description: A trigger of a factory's published definition that uses the webhook
      required: [factory, factory_name, trigger]
      properties:
        factory: { type: string, description: "The factory's metadata.id" }
        factory_name: { type: string }
        trigger: { type: string }
    NewWebhook:
      type: object
      required: [name, sender]
      properties:
        name:
          type: string
          description: "A slug of 3 to 40 characters, unique in the organization, and none of github, gitlab, standard, pagerduty, sentry, token, schedule and webhook"
        sender: { $ref: "#/components/schemas/WebhookSender" }
        secret:
          type: string
          description: "The name of an existing secret that signs it; absent: goald creates webhook-<name> with a generated value"
        token: { $ref: "#/components/schemas/WebhookTokenSettings" }
    WebhookPatch:
      type: object
      properties:
        name: { type: string, description: A new name, under NewWebhook's rules }
        enabled: { type: boolean, description: "false: its address answers 404 until enabled again" }
        open:
          type: array
          description: Factories to open it to, or whose opening's repositories to replace
          items: { $ref: "#/components/schemas/WebhookOpening" }
        close:
          type: array
          description: The metadata.id of factories to close it to
          items: { type: string }
    WebhookList:
      type: object
      required: [webhooks]
      properties:
        webhooks:
          type: array
          items: { $ref: "#/components/schemas/Webhook" }
    Webhook:
      type: object
      description: One of the organization's webhooks, never a secret's value
      required: [id, name, sender, address, secret, enabled, token, openings, triggers, created_at, days, pinged_at, setup_events, setup_all_events]
      properties:
        id: { type: string }
        name: { type: string }
        sender: { $ref: "#/components/schemas/WebhookSender" }
        address: { type: string, description: "The path senders post to, /hooks/{id}, on goald's public origin" }
        secret: { type: string, description: The name of the organization secret that signs it }
        enabled: { type: boolean }
        token:
          description: The token sender's settings; null for another sender
          allOf: [{ $ref: "#/components/schemas/WebhookTokenSettings" }]
          nullable: true
        openings:
          type: array
          description: The factories it is open to, by factory id
          items: { $ref: "#/components/schemas/WebhookOpening" }
        triggers:
          type: array
          description: >-
            The triggers of the published definitions of the factories it is open to that name it
            (on webhook.<name>, <name> or either followed by .<event>), enabled or not, and the
            enabled ones that name its sender with an event (<sender>.<event>), by factory name
            then trigger. Archived factories' triggers are left out.
          items: { $ref: "#/components/schemas/WebhookTrigger" }
        created_at: { type: string, format: date-time }
        days:
          type: array
          description: The last 7 UTC days, oldest first, today last, each zero-filled
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/WebhookDeliveryDay" }
        pinged_at:
          type: string
          format: date-time
          nullable: true
          description: When the receiver last accepted GitHub's ping to it; null when it never did
        setup_events:
          type: array
          description: >-
            The events to choose in the sender's settings: the sorted, distinct events of the
            enabled triggers of the published definitions of the factories it is open to that
            name it (<name>.<event>, webhook.<name>.<event>) or its sender (<sender>.<event>).
            Archived factories are left out.
          items: { type: string }
        setup_all_events:
          type: boolean
          description: "true when such a trigger names it with no event, so the sender should send every event"
    CreatedWebhook:
      description: A new webhook, with the value of the secret goald generated for it, never readable again
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret_value]
          properties:
            secret_value:
              type: string
              nullable: true
              description: >-
                The generated secret's value, to paste into the sender: 64 lower-case hex
                characters, or for sender standard whsec_ and the base64 of 32 bytes. null when
                the webhook uses an existing secret.
    WebhookDeliveryDay:
      type: object
      required: [day, delivered, refused]
      properties:
        day: { type: string, format: date, description: The UTC day }
        delivered:
          type: integer
          description: Deliveries accepted, with or without an item created, including those no enabled trigger names
        refused: { type: integer }
    WebhookDeliveryOutcome:
      type: string
      enum: [refused, accepted, created]
      description: "refused, with its reason; accepted, with no trigger matched; created, an item"
    WebhookDelivery:
      type: object
      required: [id, received_at, outcome, reason, item, event, receipt, duplicates, evaluations]
      properties:
        id: { type: string }
        received_at: { type: string, format: date-time }
        outcome: { $ref: "#/components/schemas/WebhookDeliveryOutcome" }
        reason: { type: string, description: "Why it was refused, such as signature did not match; empty otherwise" }
        item:
          description: The item it created; null for another outcome or once that item is gone
          allOf: [{ $ref: "#/components/schemas/WebhookDeliveryItem" }]
          nullable: true
        event: { type: string, description: "The sender's event, such as check_run; empty when it names none or it was refused" }
        receipt:
          type: string
          enum: [accepted, duplicate, refused]
          nullable: true
          description: >-
            What the receiver made of it: accepted; duplicate, a delivery id it already had (the
            first row counts the later ones in duplicates); refused, with its reason. null for a
            delivery recorded before the receiver.
        duplicates: { type: integer, description: How many later deliveries had its delivery id and created nothing }
        evaluations:
          type: array
          description: >-
            Its evaluation by each factory that names it, by factory name then factory id. A
            factory's own routes list only that factory's.
          items: { $ref: "#/components/schemas/WebhookDeliveryEvaluation" }
    WebhookDeliveryEvaluation:
      type: object
      required: [factory, factory_name, state, outcome, reason, item]
      properties:
        factory: { type: string, description: "The factory's metadata.id" }
        factory_name: { type: string, description: "The factory's name; its metadata.id once the factory is gone" }
        state:
          type: string
          enum: [pending, done, failed]
          description: "pending, waiting to be evaluated or tried again; done, with its outcome; failed after five attempts"
        outcome:
          type: string
          enum: [created, skipped, failed]
          nullable: true
          description: "created, an item; skipped, with the reason; failed, with the error; null while pending"
        reason: { type: string, description: "Why it was skipped or failed, or the last attempt's error while pending; empty otherwise" }
        item:
          description: The item it created; null for another outcome or once that item is gone
          allOf: [{ $ref: "#/components/schemas/WebhookEvaluationItem" }]
          nullable: true
    WebhookEvaluationItem:
      type: object
      required: [id, number, ref]
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
        ref: { type: string, description: "<factory name>#<number>, such as sre#88" }
    WebhookDeliveryItem:
      type: object
      required: [id, number]
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
    WebhookDeliveryPage:
      type: object
      required: [deliveries, next_after, unnamed_days]
      properties:
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        unnamed_days:
          type: array
          description: >-
            The webhook's daily counts of accepted deliveries no enabled trigger names, which the
            log does not keep, from the UTC day 30 days ago through today, oldest first; a day
            without one has no entry
          items: { $ref: "#/components/schemas/WebhookUnnamedDay" }
        next_after:
          type: string
          nullable: true
          description: Pass as `after` for the next page; null on the last page
    WebhookUnnamedDay:
      type: object
      required: [day, count]
      properties:
        day: { type: string, format: date, description: The UTC day }
        count: { type: integer, description: Accepted deliveries no enabled trigger named that day }
    WebhookDeliveryRequest:
      allOf:
        - $ref: "#/components/schemas/WebhookDelivery"
        - type: object
          required: [headers, body, body_encoding]
          properties:
            headers:
              type: object
              description: The request's headers, names lower-cased, without X-Goal-Signature, X-Hub-Signature-256 or X-Hub-Signature
              additionalProperties: { type: string }
            body: { type: string, description: The body as received, in body_encoding }
            body_encoding:
              type: string
              enum: [text, base64]
              x-enum-varnames: [BodyText, BodyBase64]
              description: "text: the body is valid UTF-8 and given as is; base64: it is not, and is given in standard base64"
    CredentialList:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items: { $ref: "#/components/schemas/Credential" }
    Credential:
      type: object
      description: An organization's credential (ADR 0017), never its value
      required: [id, name, type, description, scope, agents, expires_at, remind_days, last_used_at, used_by, created_by, created_at, updated_by, updated_at]
      properties:
        id: { type: string }
        name: { $ref: "#/components/schemas/CredentialName" }
        type: { $ref: "#/components/schemas/CredentialType" }
        description: { type: string }
        scope: { $ref: "#/components/schemas/CredentialScope" }
        agents: { $ref: "#/components/schemas/CredentialAgents" }
        expires_at: { type: string, format: date-time, nullable: true, description: When the value expires }
        remind_days: { type: integer, description: "Days before expires_at a rotation reminder is due; 0: none" }
        last_used_at: { type: string, format: date-time, nullable: true, description: When a run last opened it }
        used_by: { $ref: "#/components/schemas/CredentialUsers" }
        created_by: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/Actor" }
        updated_at: { type: string, format: date-time }
    CredentialUsers:
      type: object
      description: What uses a credential
      required: [connections, agents]
      properties:
        connections:
          type: array
          description: The connections that refer to it as {{name}}, sorted; it cannot be deleted meanwhile
          items: { type: string }
        agents:
          type: array
          description: The agents it lists, by factory id then agent
          items: { $ref: "#/components/schemas/CredentialAgent" }
    CredentialAgent:
      type: object
      required: [factory_id, agent]
      properties:
        factory_id: { type: string }
        agent: { type: string }
    NewCredential:
      type: object
      required: [name, type, value]
      properties:
        name: { $ref: "#/components/schemas/CredentialName" }
        type: { $ref: "#/components/schemas/CredentialType" }
        description: { type: string, maxLength: 500 }
        scope: { $ref: "#/components/schemas/CredentialScope" }
        agents: { $ref: "#/components/schemas/CredentialAgents" }
        expires_at: { type: string, format: date-time }
        remind_days: { type: integer, minimum: 0 }
        value:
          type: string
          writeOnly: true
          maxLength: 65536
          description: The secret; sealed and never answered
    CredentialPatch:
      type: object
      properties:
        name: { $ref: "#/components/schemas/CredentialName" }
        type: { $ref: "#/components/schemas/CredentialType" }
        description: { type: string, maxLength: 500 }
        scope: { $ref: "#/components/schemas/CredentialScope" }
        agents: { $ref: "#/components/schemas/CredentialAgents" }
        expiry: { $ref: "#/components/schemas/CredentialExpiry" }
        value:
          type: string
          writeOnly: true
          maxLength: 65536
          description: A new secret, replacing the value; never answered
    CredentialExpiry:
      type: object
      description: An expiry and its rotation reminder; without expires_at, neither
      properties:
        expires_at: { type: string, format: date-time }
        remind_days: { type: integer, minimum: 0 }
    CredentialImport:
      type: object
      required: [format, text]
      properties:
        format: { type: string, enum: [env, yaml] }
        text:
          type: string
          writeOnly: true
          description: The .env or YAML text; its values are sealed and never answered
        on_conflict:
          type: string
          enum: [replace, skip]
          description: What a real run does with a name that exists; skip when absent
        dry_run: { type: boolean, description: Answer what the import would do and store nothing }
    CredentialImportResult:
      type: object
      required: [dry_run, credentials]
      properties:
        dry_run: { type: boolean }
        credentials:
          type: array
          description: Each name of the import, in its order
          items: { $ref: "#/components/schemas/CredentialImportOutcome" }
    CredentialImportOutcome:
      type: object
      required: [name, exists, connections]
      properties:
        name: { type: string }
        exists: { type: boolean, description: A credential had the name before the import }
        connections: { type: integer, description: How many connections use the existing one }
        outcome:
          type: string
          enum: [created, replaced, skipped]
          description: A real run only, what it did
    SecretName:
      type: string
      description: >-
        3 to 40 lowercase letters, digits and inner dashes, starting with a letter, unique in the
        organization
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
    SecretSource:
      type: string
      description: "Where the value comes from. value: pasted or imported, and the run gets it as it is"
      enum: [value]
      x-enum-varnames: [SecretSourceValue]
    SecretScope:
      type: object
      description: The factories whose runs may open it; neither all nor any listed reaches no run
      required: [all_factories, factories]
      properties:
        all_factories: { type: boolean, description: Every factory, ones created later included }
        factories:
          type: array
          description: The factories' metadata.id, when not all_factories
          items: { type: string }
    SecretUse:
      type: object
      description: One thing that uses a secret; while one does, it cannot be deleted
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [definition, knowledge_source, webhook, slack, connection]
          x-enum-varnames: [SecretUseDefinition, SecretUseKnowledgeSource, SecretUseWebhook, SecretUseSlack, SecretUseConnection]
          description: >-
            What uses it: a factory's published definition, a knowledge source, a webhook, the
            organization's Slack setting, or a connection that refers to it as {{name}}
        name: { type: string, description: "The factory, knowledge source, webhook or connection that uses it; slack: the organization's Slack setting" }
    ToolTemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/ToolTemplate" }
    ToolTemplate:
      type: object
      description: A tool template (ADR 0037 decision 15)
      required: [name, title, description, secrets, adds, test]
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string, description: One line }
        secrets:
          type: array
          description: Its secret slots, in order
          items: { $ref: "#/components/schemas/TemplateSecret" }
        parameters:
          type: array
          description: "Its non-secret parameters, in order. adds and test are the lines for every parameter's default; they never refer to a parameter"
          items: { $ref: "#/components/schemas/TemplateParameter" }
        adds: { $ref: "#/components/schemas/TemplateAdds" }
        test:
          allOf: [{ $ref: "#/components/schemas/TemplateTest" }]
          nullable: true
    TemplateParameter:
      type: object
      description: "A non-secret value a template takes, such as a host; otherwise's lines may refer to it as {{name}}"
      required: [name, title, description, default]
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        default: { type: string }
        otherwise: { $ref: "#/components/schemas/TemplateOtherwise" }
    TemplateOtherwise:
      type: object
      description: "The lines used instead of the template's own when the parameter's value is not its default: each field present replaces the template's whole field"
      properties:
        tools: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        files: { type: object, additionalProperties: { type: string } }
        mcp: { type: object, additionalProperties: { $ref: "#/components/schemas/TemplateMCP" } }
        test: { $ref: "#/components/schemas/TemplateTest" }
    TemplateSecret:
      type: object
      required: [slot, title, description, suggest]
      properties:
        slot: { type: string, description: "The {{slot}} its values refer to" }
        title: { type: string }
        description: { type: string }
        suggest: { type: string, description: The name a new secret for it is suggested to have }
    TemplateAdds:
      type: object
      description: What the template writes into an environment file
      required: [tools, env, files, mcp]
      properties:
        tools: { type: array, items: { type: string }, description: mise tool specs }
        env: { type: object, additionalProperties: { type: string } }
        files: { type: object, additionalProperties: { type: string }, description: By absolute or ~/ path }
        mcp: { type: object, additionalProperties: { $ref: "#/components/schemas/TemplateMCP" } }
    TemplateMCP:
      type: object
      description: A remote (url, headers) or stdio (command, env) MCP server, with suggested tool modes
      required: [tools]
      properties:
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        command: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        tools: { type: object, additionalProperties: { type: string, enum: [allow, ask, off] } }
    TemplateTest:
      type: object
      description: "An HTTP test request; its values may hold {{slot}} and ${VAR} of the template's plain env values"
      required: [method, url, headers, expect]
      properties:
        method: { type: string }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        basic:
          type: object
          required: [username, password]
          properties:
            username: { type: string }
            password: { type: string }
        expect: { type: integer, description: The status that passes }
    EnvironmentTestRequest:
      type: object
      properties:
        version: { type: string, description: "draft (the default while one is open), current (the default otherwise) or a version number" }
        server: { type: string, description: Only this MCP server }
        template: { $ref: "#/components/schemas/EnvironmentTestTemplate" }
    EnvironmentTestTemplate:
      type: object
      required: [name, secrets]
      properties:
        name: { type: string }
        secrets:
          type: object
          description: The secret each slot takes, by slot
          additionalProperties: { $ref: "#/components/schemas/SecretName" }
        env:
          type: object
          description: The template's plain env values to use instead of its own, by name
          additionalProperties: { type: string }
        parameters:
          type: object
          description: "The template's parameters' values, by name: a host name with an optional :port. A parameter without one takes its default"
          additionalProperties: { type: string }
    FactoryRepositoryTestRequest:
      type: object
      required: [url, secret, access]
      properties:
        url:
          type: string
          description: "One repository's https URL, such as https://github.com/acme/app, or an owner pattern, such as https://github.com/acme/*"
        secret: { $ref: "#/components/schemas/SecretName" }
        access:
          type: string
          enum: [read, write]
          description: The access the factory's entry asks for, which picks the summary and the warning
    FactoryRepositoryTestList:
      type: object
      required: [tests]
      properties:
        tests:
          type: array
          items: { $ref: "#/components/schemas/FactoryRepositoryTest" }
    FactoryRepositoryTest:
      type: object
      required: [url, access, secret, at, tested, ok, summary, read, push]
      properties:
        url:
          type: string
          description: "The repository tested, as its lower-case host/owner/name, or host/owner/* for an owner pattern"
        access: { type: string, enum: [read, write] }
        secret: { $ref: "#/components/schemas/SecretName" }
        at: { type: string, format: date-time, description: When it was tested }
        tested: { type: boolean, description: "false when the host gave no answer: summary then starts with couldn't test" }
        ok: { type: boolean, description: "Whether the token can do what access asks: read, or read and push" }
        summary: { type: string, description: "One line, such as Can read, Can read 48 repositories in acme or Can read and push" }
        warning: { type: string, description: "For a read entry whose token can also push: Goal won't push, but agents could. Use a read-only token." }
        note: { type: string, description: "For a write entry: the host reports no pull-request permission, so Goal can't check it" }
        read: { $ref: "#/components/schemas/RepositoryCheck" }
        push: { $ref: "#/components/schemas/RepositoryCheck" }
        ci:
          allOf: [{ $ref: "#/components/schemas/RepositoryCheck" }]
          description: >-
            Whether the token can read the commit checks (GitHub) or the pipelines (GitLab) that a
            station with waitFor: ci waits on, with the host's reason. Absent for a test kept before
            goald checked CI, until the repository is tested again, and for an owner pattern. It
            never changes ok: only a factory with a waitFor: ci station needs it.
        readable: { type: integer, description: "For an owner pattern: how many of the owner's repositories the token can read" }
        pushable: { type: integer, description: "For an owner pattern: how many of them it can push to" }
        truncated: { type: boolean, description: "For an owner pattern: the count stopped at 1000, so there may be more" }
    NotificationSettings:
      type: object
      required: [slack_secret]
      properties:
        slack_secret:
          type: string
          nullable: true
          pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
          description: >-
            The name of the secret holding the Slack bot token that sends the organization's Slack
            notifications, slack-bot by convention; null while Slack is off
    NotificationTestRequest:
      type: object
      properties:
        slack_secret:
          allOf: [{ $ref: "#/components/schemas/SecretName" }]
          description: The secret to test; absent, the saved setting's
    NotificationTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: Whether Slack accepted the token }
        workspace: { type: string, description: "The Slack workspace the token belongs to, when ok" }
        error:
          type: string
          description: >-
            Why it failed, when not ok, as a fixed code: slack-not-set (no secret given and none
            saved), slack-token-invalid (Slack refused the token) or slack-token-unavailable
            (Slack could not be reached or asked to wait). Never the token or Slack's reply.
    RepositoryCheck:
      type: object
      required: [ok, reason]
      properties:
        ok: { type: boolean }
        reason: { type: string, description: The host's one-line reason }
    EnvironmentTestResult:
      type: object
      required: [environment, version, servers]
      properties:
        environment: { type: string }
        version: { type: string, description: "The version tested: draft or its number" }
        servers:
          type: array
          items: { $ref: "#/components/schemas/ServerTest" }
        template: { $ref: "#/components/schemas/TemplateTestResult" }
    ServerTest:
      type: object
      required: [server, tested, ok, tools]
      properties:
        server: { type: string }
        tested: { type: boolean, description: "False for a stdio server goald does not start: its command is not one the tool catalog ships, or a URL in its env is not on a listed code host; error says which" }
        ok: { type: boolean }
        tools: { type: array, items: { type: string }, description: The tool names tools/list answered, sorted }
        error: { type: string, description: Why it failed, without a secret value }
        at: { type: string, format: date-time }
    TemplateTestResult:
      type: object
      required: [name, ok, at]
      properties:
        name: { type: string }
        ok: { type: boolean }
        status: { type: integer, description: The status the test request got }
        error: { type: string, description: Why it failed, without a secret value }
        at: { type: string, format: date-time }
    Access:
      type: object
      required: [by, reached, need_attention, groups]
      properties:
        by: { type: string, enum: [reach, factory, secret] }
        reached: { type: integer, description: What agents reach, counted by kind and name }
        need_attention: { type: integer, description: "Of those, the missing, failed, expired or expiring" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/AccessGroup" }
    AccessGroup:
      type: object
      description: "One group: a kind (mcp, env, file, slack), a factory's id or a secret's name, by by. The organization-wide slack row has no factory, so no factory group holds it"
      required: [key, title, rows]
      properties:
        key: { type: string }
        title: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/AccessRow" }
    AccessRow:
      type: object
      description: >-
        What agents reach under one kind and name. A factory row (mcp, env, file) lists the
        environments that use it; the organization-wide slack row, "Slack notifications", holds
        the secret of the organization's Slack notifications and has no factory uses, so its uses
        are empty and its status comes from that secret alone.
      required: [kind, name, uses, secrets, status]
      properties:
        kind: { type: string, enum: [mcp, env, file, slack] }
        name: { type: string, description: "The MCP server, the variable, the file path, or Slack notifications" }
        uses:
          type: array
          items: { $ref: "#/components/schemas/AccessUse" }
        secrets: { type: array, items: { type: string }, description: The secrets it references, by name }
        status: { $ref: "#/components/schemas/AccessStatus" }
        tested_at: { type: string, format: date-time, description: Its latest test }
        test_error: { type: string, description: Why its latest failed test failed }
        last_used_at: { type: string, format: date-time, description: When a run last opened one of its secrets }
        expires_at: { type: string, format: date-time, description: The soonest expiry of its secrets }
    AccessStatus:
      type: string
      description: The worst of its uses' statuses, in this order
      enum: [missing, failed, expired, expiring, untested, tested, ok]
    AccessUse:
      type: object
      required: [factory, environment, agents, status]
      properties:
        factory: { $ref: "#/components/schemas/AccessFactory" }
        environment: { type: string }
        agents: { type: array, items: { type: string }, description: The agents on the environment }
        status: { $ref: "#/components/schemas/AccessStatus" }
        test: { $ref: "#/components/schemas/AccessTest" }
    AccessFactory:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    AccessTest:
      type: object
      required: [at, ok, tools]
      properties:
        at: { type: string, format: date-time }
        ok: { type: boolean }
        error: { type: string }
        tools: { type: integer, description: How many tools it listed }
    SecretList:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
    Secret:
      type: object
      description: An organization's secret (ADR 0037), never its value
      required: [id, name, source, description, scope, expires_at, remind_days, last_used_at, uses, created_by, created_at, updated_by, updated_at]
      properties:
        id: { type: string }
        name: { $ref: "#/components/schemas/SecretName" }
        source: { $ref: "#/components/schemas/SecretSource" }
        description: { type: string }
        scope: { $ref: "#/components/schemas/SecretScope" }
        expires_at: { type: string, format: date-time, nullable: true, description: When the value expires }
        remind_days: { type: integer, description: "Days before expires_at a reminder is due; 0: none" }
        last_used_at: { type: string, format: date-time, nullable: true, description: When a run last opened it }
        uses:
          type: array
          description: What uses it, by kind then name
          items: { $ref: "#/components/schemas/SecretUse" }
        created_by: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/Actor" }
        updated_at: { type: string, format: date-time }
    NewSecret:
      type: object
      required: [name, value]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        description: { type: string, maxLength: 500 }
        scope: { $ref: "#/components/schemas/SecretScope" }
        expires_at: { type: string, format: date-time }
        remind_days: { type: integer, minimum: 0, maximum: 90 }
        value:
          type: string
          writeOnly: true
          maxLength: 65536
          description: The value; sealed and never answered
    SecretPatch:
      type: object
      properties:
        description: { type: string, maxLength: 500 }
        scope: { $ref: "#/components/schemas/SecretScope" }
        expiry: { $ref: "#/components/schemas/SecretExpiry" }
    SecretExpiry:
      type: object
      description: An expiry and its reminder; without expires_at, neither
      properties:
        expires_at: { type: string, format: date-time }
        remind_days: { type: integer, minimum: 0, maximum: 90 }
    SecretValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          writeOnly: true
          maxLength: 65536
          description: The new value; sealed and never answered
    SecretImport:
      type: object
      required: [format, text]
      properties:
        format: { type: string, enum: [env, yaml] }
        text:
          type: string
          writeOnly: true
          description: The .env or YAML text; its values are sealed and never answered
        on_conflict:
          type: string
          enum: [replace, skip]
          description: What a real run does with a name that exists; skip when absent
        dry_run: { type: boolean, description: Answer what the import would do and store nothing }
    SecretImportResult:
      type: object
      required: [dry_run, secrets]
      properties:
        dry_run: { type: boolean }
        secrets:
          type: array
          description: Each name of the import, in its order
          items: { $ref: "#/components/schemas/SecretImportOutcome" }
    SecretImportOutcome:
      type: object
      required: [name, exists, uses]
      properties:
        name: { type: string }
        exists: { type: boolean, description: A secret had the name before the import }
        uses:
          type: array
          description: What uses the existing one
          items: { $ref: "#/components/schemas/SecretUse" }
        outcome:
          type: string
          enum: [created, replaced, skipped]
          description: A real run only, what it did
    ConnectionTestResult:
      type: object
      required: [ok, at]
      properties:
        ok: { type: boolean }
        status: { type: integer, description: "The test request's HTTP status, when it got one" }
        error: { type: string, description: Why it failed (never a secret value) }
        at: { type: string, format: date-time }
    ConnectionEvent:
      type: object
      description: "The data of one `event: connection` on /v1/orgs/{org}/stream; it carries no value"
      required: [connection_id, name, change]
      properties:
        connection_id: { type: string }
        name: { type: string, description: The connection's name after the change }
        change: { type: string, enum: [created, updated, deleted, tested] }
    KnowledgeSourceName:
      type: string
      description: 3 to 40 lowercase letters, digits and inner dashes, starting with a letter
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
    KnowledgeSourceList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeSource" }
    KnowledgeSource:
      type: object
      description: One source of the organization's knowledge base (spec 4 §4.8)
      required: [id, name, title, kind, config, read_when, sync_every_seconds, status, last_synced_at, next_sync_at, latest_snapshot, used_by, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        name: { $ref: "#/components/schemas/KnowledgeSourceName" }
        title: { type: string }
        kind: { $ref: "#/components/schemas/KnowledgeSourceKind" }
        secret: { type: string, description: "The secret a synced source reads with, opened at each sync; absent for an upload source" }
        config:
          type: object
          description: >-
            What its reader reads (a repository, a branch and path globs; Confluence spaces and,
            with root_page, only one page's tree). A synced source on a secret also names its
            reader (reader: gitdocs or confluence) and, for confluence, the site and the account's
            email.
          additionalProperties: { type: string }
        read_when: { type: string, description: "The line that tells agents when to open it; empty when it has none" }
        sync_every_seconds: { type: integer, minimum: 0, description: "How often it syncs, in seconds: at least 900, or 0 when it syncs only when someone presses Sync" }
        status:
          type: string
          enum: [idle, syncing, failed]
          description: syncing while a goald holds it; failed after a sync that stopped (last_error says why)
        last_error: { type: string }
        last_synced_at: { type: string, format: date-time, nullable: true }
        next_sync_at: { type: string, format: date-time, nullable: true, description: "When it is due next; null for an on-demand source (sync_every_seconds 0) until someone presses Sync" }
        latest_snapshot:
          description: Its newest snapshot; null before the first sync
          nullable: true
          allOf: [{ $ref: "#/components/schemas/KnowledgeSnapshotSummary" }]
        sync_failures: { type: integer, description: "How many syncs failed in a row; a successful one resets it, and three show the source in Needs you" }
        used_by: { $ref: "#/components/schemas/KnowledgeSourceUsers" }
        created_by: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KnowledgeSnapshotSummary:
      type: object
      description: A source's newest snapshot
      required: [files, failed, bytes, synced_at]
      properties:
        files: { type: integer, description: How many files it holds }
        failed: { type: integer, description: How many files failed to fetch or convert }
        bytes: { type: integer, format: int64, description: Its files' Markdown together }
        synced_at: { type: string, format: date-time, description: When it was written }
    KnowledgeSourceUsers:
      type: object
      description: What uses a source, so it cannot be deleted meanwhile
      required: [factories, readers]
      properties:
        factories:
          type: array
          description: The factories whose current version may search it (those the caller sees)
          items: { $ref: "#/components/schemas/ConnectionFactory" }
        readers:
          type: array
          description: The same factories with who reads it in each; every list empty means every run
          items: { $ref: "#/components/schemas/KnowledgeSourceReader" }
    KnowledgeSourceReader:
      type: object
      required: [id, name, agents, stations, lanes, work_types]
      properties:
        id: { type: string, description: The factory's metadata.id }
        name: { type: string }
        agents: { type: array, items: { type: string } }
        stations: { type: array, items: { type: string } }
        lanes: { type: array, items: { type: string } }
        work_types: { type: array, items: { type: string } }
    KnowledgeSourceKind:
      type: string
      description: >-
        upload, repository and confluence write snapshots of files (ADR 0038 decision 2); synced
        is the kind before the cut-over
      enum: [upload, repository, confluence, synced]
      x-enum-varnames: [KnowledgeSourceKindUpload, KnowledgeSourceKindRepository, KnowledgeSourceKindConfluence, KnowledgeSourceKindSynced]
    NewKnowledgeSource:
      type: object
      required: [name, title, kind]
      properties:
        name: { $ref: "#/components/schemas/KnowledgeSourceName" }
        title: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: "#/components/schemas/KnowledgeSourceKind" }
        secret:
          allOf: [{ $ref: "#/components/schemas/SecretName" }]
          description: >-
            The secret a synced source reads with: the code host's token for gitdocs, the API token
            for confluence. It must be open to all factories.
        config:
          type: object
          description: >-
            What its reader reads. A synced source names its reader (reader: gitdocs or
            confluence): gitdocs reads repository (its https URL on one of the organization's
            code hosts; a sync on any other host fails before the secret is opened, and the kind
            the host is listed as replaces code_host), branch, include and exclude;
            confluence reads site, email and spaces (space keys separated by commas), and the
            optional root_page (a page id: only that page and the pages under it).
          additionalProperties: { type: string }
        read_when: { $ref: "#/components/schemas/KnowledgeReadWhen" }
        sync_every_seconds: { type: integer, minimum: 0, description: "How often it syncs, in seconds: at least 900 (default 3600), or 0 to sync only when someone presses Sync. A new source syncs once when it is created either way" }
    KnowledgeReadWhen:
      type: string
      maxLength: 160
      description: One line that tells agents when to open the source, as "How to fix what pages us. Read before acting on an alert."
    KnowledgeSourcePatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        read_when: { $ref: "#/components/schemas/KnowledgeReadWhen" }
        secret:
          allOf: [{ $ref: "#/components/schemas/SecretName" }]
          description: "A synced source's new secret: it reads with it from its next sync"
        config:
          type: object
          description: Replaces the config
          additionalProperties: { type: string }
        sync_every_seconds: { type: integer, minimum: 0, description: "How often it syncs, in seconds: at least 900, or 0 to sync only when someone presses Sync. 0 clears the next sync; an interval on an on-demand source makes it due at once" }
    KnowledgeFile:
      type: object
      description: One file of a source's current snapshot
      required: [source, path, title, bytes, version]
      properties:
        source: { type: string, description: Its source's name }
        path: { type: string, description: "Its path in the source's folder, /knowledge/<source>/<path> in a run" }
        title: { type: string }
        bytes: { type: integer, format: int64, description: Its Markdown's size }
        version: { type: string, description: "Changes whenever its content does: a content hash, a blob id, a page version" }
    KnowledgeFilePage:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeFile" }
        next_after: { type: string, description: The after of the next page; absent on the last }
    KnowledgeFileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeFile" }
    KnowledgeUploadList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: object
            required: [path, bytes]
            properties:
              path: { type: string }
              bytes: { type: integer, format: int64 }
    KnowledgeCheckInput:
      type: object
      description: A source's settings, not saved, as Add a source has them
      required: [name, kind]
      properties:
        name: { $ref: "#/components/schemas/KnowledgeSourceName" }
        kind: { $ref: "#/components/schemas/KnowledgeSourceKind" }
        secret: { $ref: "#/components/schemas/SecretName" }
        config:
          type: object
          description: What its reader reads, as createKnowledgeSource takes it
          additionalProperties: { type: string }
        read_when: { $ref: "#/components/schemas/KnowledgeReadWhen" }
        factories:
          type: array
          description: The factories that would read it (each one's metadata.id or metadata.name)
          items: { type: string }
    KnowledgeCheck:
      type: object
      required: [access, files, first_files, limits, over_limit, warnings, line]
      properties:
        access: { $ref: "#/components/schemas/KnowledgeCheckAccess" }
        files: { type: integer, description: How many files it lists; 0 when access failed }
        first_files:
          type: array
          description: >-
            The paths, as the sync would write them under /knowledge/<name>/, of the first 8 files
            the listing yields, in listing order. Empty when access failed or for an upload source
            not saved yet.
          items: { type: string }
        bytes:
          type: integer
          format: int64
          description: >-
            Their Markdown's size, only when goald knows it: the current snapshot of a source of
            that name and kind that exists. A listing does not say how big each file is.
        limits: { $ref: "#/components/schemas/KnowledgeLimits" }
        over_limit:
          type: array
          description: The limits it is over, which a sync would fail on
          items: { type: string, enum: [files, bytes] }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeCheckWarning" }
        line: { type: string, description: The line agents will see for it in their prompt's Knowledge section }
    KnowledgeCheckAccess:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: Whether goald could list the source with these settings }
        error: { type: string, description: Why it could not; never holds the secret's value }
    KnowledgeLimits:
      type: object
      description: A source's limits (ADR 0038 decision 4)
      required: [files, bytes, file_bytes]
      properties:
        files: { type: integer }
        bytes: { type: integer, format: int64 }
        file_bytes: { type: integer, format: int64 }
    KnowledgeCheckWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            knowledge-secret-not-in-scope, knowledge-copies-checkout and knowledge-too-many are the
            definition checks the factory's draft would fail or warn with; knowledge-source-name-taken
            and knowledge-source-listed say the name is in use or the factory lists it already
        factory: { type: string, description: The picked factory's name; absent for a warning about the source }
        message: { type: string }
    KnowledgeReadList:
      type: object
      required: [reads]
      properties:
        reads:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeReadCount" }
    KnowledgeReadCount:
      type: object
      required: [source, path, factory_id, factory, day, reads, searches]
      properties:
        source: { type: string, description: The source's name }
        path: { type: string, description: 'The file read, or the folder searched ("." for the whole source)' }
        factory_id: { type: string }
        factory: { type: string, description: The factory's name }
        day: { type: string, format: date, description: The UTC day }
        reads: { type: integer }
        searches: { type: integer }
    KnowledgeEvent:
      type: object
      description: "The data of one `event: knowledge` on /v1/orgs/{org}/stream: a source's sync started or ended"
      required: [source_id, name, status]
      properties:
        source_id: { type: string }
        name: { type: string }
        status: { type: string, enum: [idle, syncing, failed] }
    SavedViewFilters:
      type: object
      description: >-
        The Items page's URL search params, each key with its values in order: at most 20 keys, 20
        values per key and 200 characters per value
      additionalProperties:
        type: array
        items: { type: string }
    NewSavedView:
      type: object
      required: [name, shared, filters]
      properties:
        name: { type: string, description: "1 to 60 characters, trimmed" }
        shared: { type: boolean, description: "Every reader of the factory sees it; false: only its owner" }
        filters: { $ref: "#/components/schemas/SavedViewFilters" }
    SavedViewChange:
      type: object
      required: [name, filters]
      properties:
        name: { type: string, description: "1 to 60 characters, trimmed" }
        filters: { $ref: "#/components/schemas/SavedViewFilters" }
    SavedView:
      type: object
      required: [id, name, shared, filters, mine, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        shared: { type: boolean }
        filters: { $ref: "#/components/schemas/SavedViewFilters" }
        mine: { type: boolean, description: The caller made it }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedViewList:
      type: object
      required: [views]
      properties:
        views:
          type: array
          items: { $ref: "#/components/schemas/SavedView" }

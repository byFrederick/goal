# The environment registry: every environment variable a Goal process reads, with who reads it, its
# class and what it means. It holds names and meanings, never values: defaults live in the code that
# reads a variable (cmd/goald/settings.go and the like), examples in .env.example.
#
# tools/envcheck (task env:check, part of task check) checks it against the code and fails when a
# read is not declared, a declared variable is never read, or a read comes from a process the entry
# does not list. It also generates docs/reference/environment.md from this file; after a change run
# `task env:check -- -write`. The shape is contracts/env.schema.json.
#
# readers: goald, goal-egress, goal (the CLI), auth (apps/auth), worker (apps/worker, the agent
#   container), control-worker (deploy/cloudflare/wrangler.jsonc's vars and Secrets Store
#   bindings, and the settings apps/control-worker/src/env.ts passes on to the containers), compose (compose.yaml
#   interpolation) and taskfile (Taskfile.yml).
# class: public (may be shown to anyone who uses the platform), config (a setting of the install),
#   secret (a credential: never in a log, a commit, an API answer or a prompt).
# required: true when a process that reads it refuses to start without it.
# indirect: for a name read by a key computed at run time (a table of names, a loop, env:NAME built
#   from a variable): the file that names it, quoted. envcheck counts the variable as read while its
#   name appears there.
#
# Kept sorted by name.
variables:
  - name: ANTHROPIC_API_KEY
    readers: [goal]
    class: secret
    required: false
    meaning: "An Anthropic API key that goal connection import-env turns into the claude connection, once, when upgrading from before connections."
  - name: AWS_REGION
    readers: [goald, goal, control-worker, taskfile]
    class: config
    required: false
    meaning: "The object storage bucket's region (auto on R2)."
  - name: BETTER_AUTH_SECRET
    readers: [auth, goal, control-worker, compose]
    class: secret
    required: false
    meaning: "The auth service's secret for session signing and token encryption; it or BETTER_AUTH_SECRETS is required under sign-in."
  - name: BETTER_AUTH_SECRETS
    readers: [auth, goal, control-worker, compose]
    class: secret
    required: false
    meaning: "Versioned auth service secrets, newest first (2:<new>,1:<old>), used instead of BETTER_AUTH_SECRET to rotate it."
  - name: BETTER_AUTH_TRUSTED_ORIGINS
    readers: [auth]
    class: config
    required: false
    meaning: "Must stay unset: the auth service refuses to start while it is set, since GOAL_PUBLIC_URL is the only trusted origin."
  - name: BETTER_AUTH_URL
    readers: [auth]
    class: public
    required: false
    meaning: "Left unset; when set it must equal GOAL_PUBLIC_URL."
  - name: BROWSER
    readers: [goal]
    class: config
    required: false
    meaning: "The program, with its arguments, that goal login opens the sign-in page with instead of the system's URL opener."
  - name: CLAUDE_CODE_OAUTH_TOKEN
    readers: [goal, goald]
    class: secret
    required: false
    meaning: "Retired: goal connection import-env turns it into the claude connection once; goald ignores it and warns while it is set."
  - name: CLOUDFLARE_ACCOUNT_ID
    readers: [taskfile]
    class: config
    required: false
    meaning: "The Cloudflare account the Terraform and deploy tasks act on (the operator's environment or CI)."
  - name: CLOUDFLARE_API_TOKEN
    readers: [taskfile]
    class: secret
    required: false
    meaning: "The Cloudflare API token the Terraform and deploy tasks use (the operator's environment or CI)."
  - name: GITHUB_ACTIONS
    readers: [taskfile]
    class: config
    required: false
    meaning: "Set to true by CI; the Terraform tasks then expect GOOGLE_OAUTH_ACCESS_TOKEN instead of the operator's own sign-in."
  - name: GOAL_AGENT_EGRESS
    readers: [goald]
    class: config
    required: false
    meaning: "Retired: compose's goal-egress service replaced it; goald ignores it and warns while it is set."
    indirect: cmd/goald/settings.go
  - name: GOAL_AGENT_IMAGE
    readers: [goald, control-worker]
    class: config
    required: false
    meaning: "The image every run's sandbox runs (goal-agent); a factory's runtime.image is ignored."
  - name: GOAL_ALLOW_PRIVATE_UPSTREAMS
    readers: [goald]
    class: config
    required: false
    meaning: "true lets connection tests and the embeddings API reach this machine's and the LAN's servers; refused unless goald listens on loopback."
  - name: GOAL_API_KEY
    readers: [goal]
    class: secret
    required: false
    meaning: "An API key (goal_sk_) or personal token (goal_pat_) the CLI acts with instead of a goal login session."
  - name: GOAL_API_URL
    readers: [goal]
    class: config
    required: false
    meaning: "Where the goal CLI finds goald."
  - name: GOAL_AUTH
    readers: [goald, goal, control-worker]
    class: config
    required: false
    meaning: "session (the default) turns sign-in on; none makes every request the single local user, on loopback only."
  - name: GOAL_AUTH_DATABASE_URL
    readers: [auth, goal, control-worker]
    class: secret
    required: false
    meaning: "The auth service's PostgreSQL URL, as the goal_auth role; by default compose's database with GOAL_PG_AUTH_PASSWORD."
  - name: GOAL_AUTH_EMAIL
    readers: [goald, auth, control-worker]
    class: config
    required: false
    meaning: "off turns email sign-in codes and all mail off; it needs GOAL_AUTH_GOOGLE=on."
  - name: GOAL_AUTH_GOOGLE
    readers: [goald, auth, control-worker, compose]
    class: config
    required: false
    meaning: "on also offers sign-in with Google, with GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET."
  - name: GOAL_AUTH_LISTEN
    readers: [auth]
    class: config
    required: false
    meaning: "The auth service's address, on loopback only; goald's /api/auth proxy is the way in."
  - name: GOAL_AUTH_PROXY_SECRET
    readers: [goald, auth, goal, control-worker, compose]
    class: secret
    required: true
    meaning: "The secret goald sends with every request it forwards to the auth service, which refuses any other; goal up generates one per start."
  - name: GOAL_AUTH_UPSTREAM
    readers: [goald]
    class: config
    required: false
    meaning: "Where goald's /api/auth proxy reaches the auth service."
  - name: GOAL_BAKEOFF_MODELS
    readers: [goald]
    class: public
    required: false
    meaning: "The models a bake-off that names no arms tries beside the agent's current model, comma-separated model ids; cut at four arms."
  - name: GOAL_BOOTSTRAP_OWNER_EMAIL
    readers: [auth, goal, control-worker, compose]
    class: config
    required: false
    meaning: "The first owner's address: until someone signs in it is the only one that may, and becomes platform admin; goal up requires it under sign-in."
  - name: GOAL_DATABASE_ADMIN_URL
    readers: [goal]
    class: secret
    required: false
    meaning: "The bootstrap superuser's PostgreSQL URL that goal db init creates the roles with; by default compose's superuser."
  - name: GOAL_DATABASE_URL
    readers: [goald, goal, control-worker]
    class: secret
    required: false
    meaning: "goald's PostgreSQL URL, as goal_app under row-level security; by default compose's database with GOAL_PG_APP_PASSWORD."
  - name: GOAL_DEFAULT_AGENT_IMAGE
    readers: [goald]
    class: config
    required: false
    meaning: "Retired: GOAL_AGENT_IMAGE replaced it; goald ignores it and warns while it is set."
    indirect: cmd/goald/settings.go
  - name: GOAL_DEFINITION_CACHE_BYTES
    readers: [goald]
    class: config
    required: false
    meaning: "How many bytes of no-longer-current factory definition files goald keeps for the runs pinned to them."
  - name: GOAL_DOCKER_GID
    readers: [compose]
    class: config
    required: false
    meaning: "The Docker socket's group on Linux, which goald's container joins under goal up --compose."
  - name: GOAL_EGRESS_ADDRESSES
    readers: [goald, control-worker]
    class: public
    required: false
    meaning: "The addresses agents' traffic leaves the install from, comma-separated CIDRs, shown on the organization's models and policies screen; empty by default."
  - name: GOAL_EGRESS_GATEWAY
    readers: [goal-egress, goal, compose]
    class: config
    required: false
    meaning: "goald's gateway listener as goal-egress reaches it; goal up derives it from GOAL_GATEWAY_URL or the listener."
  - name: GOAL_EGRESS_IMAGE
    readers: [goald]
    class: config
    required: false
    meaning: "Retired: compose's goal-egress service replaced it; goald ignores it and warns while it is set."
    indirect: cmd/goald/settings.go
  - name: GOAL_EGRESS_NAME
    readers: [goald]
    class: config
    required: false
    meaning: "Retired: compose's goal-egress service replaced it; goald ignores it and warns while it is set."
    indirect: cmd/goald/settings.go
  - name: GOAL_EMBED_KEY
    readers: [goald, control-worker]
    class: secret
    required: false
    meaning: "The bearer key of the embeddings API."
  - name: GOAL_EMBED_MODEL
    readers: [goald, control-worker]
    class: config
    required: false
    meaning: "The embeddings model, of 1024 dimensions; changing it re-embeds every knowledge source."
  - name: GOAL_EMBED_URL
    readers: [goald, control-worker]
    class: config
    required: false
    meaning: "An OpenAI-compatible embeddings API; set, the knowledge base uses hybrid search instead of keywords only."
  - name: GOAL_FACTORIES_DIR
    readers: [taskfile]
    class: config
    required: false
    meaning: "The local working copy of the factory definitions that the factory tasks read and write, outside this repository."
  - name: GOAL_FEEDBACK
    readers: [worker]
    class: config
    required: false
    meaning: "The reviewer's feedback on an earlier attempt, which the agent's task prompt includes."
  - name: GOAL_GATEWAY_KEY
    readers: [goald, goal, control-worker]
    class: secret
    required: true
    meaning: "Signs the per-task MCP gateway tokens; at least 32 bytes, and it never reaches a task."
  - name: GOAL_GATEWAY_KEY_REF
    readers: [goald]
    class: config
    required: false
    meaning: "The Secrets reference that names the gateway key (env:GOAL_GATEWAY_KEY by default)."
  - name: GOAL_GATEWAY_LISTEN
    readers: [goald, goal]
    class: config
    required: false
    meaning: "The gateway's own listener, serving only /mcp and /run; required when GOAL_LISTEN is off loopback."
  - name: GOAL_GATEWAY_TOKEN
    readers: [worker]
    class: secret
    required: true
    meaning: "The run's gateway token, which the worker fetches its bundle and reaches the MCP gateway with."
  - name: GOAL_GATEWAY_URL
    readers: [goald, goal, worker]
    class: config
    required: true
    meaning: "The MCP gateway's URL: for goald it defaults from the listeners; the worker needs it to fetch its run's bundle."
  - name: GOAL_GITHUB_API_URL
    readers: [goald]
    class: config
    required: false
    meaning: "Retired: a github connection's host gives its API; goald ignores it and warns while it is set."
    indirect: cmd/goald/settings.go
  - name: GOAL_GITHUB_TOKEN
    readers: [goal, goald]
    class: secret
    required: false
    meaning: "Retired: goal connection import-env turns it into the github connection once; goald ignores it and warns while it is set."
  - name: GOAL_GITHUB_WEB_URL
    readers: [goal, goald]
    class: config
    required: false
    meaning: "Retired: the GitHub Enterprise origin goal connection import-env gives the github connection; goald ignores it and warns while it is set."
  - name: GOAL_GIT_ATTEMPT_TIMEOUT
    readers: [worker]
    class: config
    required: false
    meaning: "The time limit in seconds of each attempt of a network git step in goal-agent prepare (the clone, the base branch's push and fetch); a cut-off attempt is retried. 300 when unset."
  - name: GOAL_KB_WORKERS
    readers: [goald, control-worker]
    class: config
    required: false
    meaning: "How many knowledge sources one goald syncs at once (0: none)."
  - name: GOAL_LEGACY_IMPORT
    readers: [goald]
    class: config
    required: false
    meaning: "Retired: the legacy import is gone; goald ignores it and warns while it is set."
    indirect: cmd/goald/settings.go
  - name: GOAL_LISTEN
    readers: [goald, goal]
    class: config
    required: false
    meaning: "goald's address for the API, the UI and, without GOAL_GATEWAY_LISTEN, the gateway."
  - name: GOAL_LOG_FORMAT
    readers: [goald, goal, control-worker, compose]
    class: config
    required: false
    meaning: "goald's log format: json or text."
  - name: GOAL_LOG_LEVEL
    readers: [goald, control-worker]
    class: config
    required: false
    meaning: "goald's log level: debug, info, warn or error."
  - name: GOAL_MASTER_KEYS
    readers: [goald, goal, control-worker]
    class: secret
    required: false
    meaning: "The keys that seal connections' credentials in PostgreSQL, <id>:<base64 of 32 bytes>, comma-separated, the first active."
  - name: GOAL_MASTER_KEY_FILE
    readers: [goald, goal]
    class: config
    required: false
    meaning: "A file of master keys, one per line and mode 0600, used instead of GOAL_MASTER_KEYS."
  - name: GOAL_MAX_RUNS
    readers: [goald, control-worker]
    class: config
    required: false
    meaning: "How many agent runs one goald runs at once, shared fairly across organizations (0: no cap)."
  - name: GOAL_MIGRATE_DATABASE_URL
    readers: [goald, goal, control-worker]
    class: secret
    required: false
    meaning: "The PostgreSQL URL migrations run with, as goal_owner; by default compose's database with GOAL_PG_OWNER_PASSWORD."
  - name: GOAL_MODELS
    readers: [goald, control-worker]
    class: public
    required: false
    meaning: "The models the factory editor offers, comma-separated, as id or id=Label; the first is the default."
  - name: GOAL_ORG
    readers: [goal]
    class: config
    required: false
    meaning: "The organization CLI commands act in, instead of the one goal org use chose."
  - name: GOAL_ORG_RETENTION
    readers: [goald, control-worker]
    class: config
    required: false
    meaning: "How long a deleted organization's rows and bucket objects are kept before they are purged."
  - name: GOAL_PG_APP_PASSWORD
    readers: [goald, goal, compose]
    class: secret
    required: false
    meaning: "The goal_app role's password, which goal db init sets and goald's default database URL uses."
  - name: GOAL_PG_AUTH_PASSWORD
    readers: [auth, goal, compose]
    class: secret
    required: false
    meaning: "The goal_auth role's password, which goal db init sets and the auth service's default database URL uses."
  - name: GOAL_PG_OWNER_PASSWORD
    readers: [goald, goal, compose]
    class: secret
    required: false
    meaning: "The goal_owner role's password, which goal db init sets and the default migration URL uses."
  - name: GOAL_PG_PASSWORD
    readers: [goal, compose]
    class: secret
    required: false
    meaning: "The local PostgreSQL bootstrap superuser's password, used only by goal db init to create the roles."
  - name: GOAL_PUBLIC_URL
    readers: [goald, goal, auth, control-worker, compose]
    class: public
    required: false
    meaning: "The one origin people open goald at; sign-in links and cookies follow it. Required when GOAL_LISTEN is off loopback."
  - name: GOAL_REFRESH_EVERY
    readers: [goald]
    class: config
    required: false
    meaning: "How often goald reloads factory definitions and connection kinds."
  - name: GOAL_RUN_DIR
    readers: [goald]
    class: config
    required: false
    meaning: "Retired: a run's sandbox holds its workspace; goald ignores it and warns while it is set."
    indirect: cmd/goald/settings.go
  - name: GOAL_S3_ACCESS_KEY
    readers: [goald, goal, control-worker, compose, taskfile]
    class: secret
    required: false
    meaning: "The object storage access key."
  - name: GOAL_S3_BUCKET
    readers: [goald, goal, control-worker, taskfile]
    class: config
    required: true
    meaning: "The bucket that holds factory definition blobs and the catalogs."
  - name: GOAL_S3_ENDPOINT
    readers: [goald, goal, control-worker, taskfile]
    class: config
    required: false
    meaning: "The S3-compatible endpoint of the bucket (RustFS locally, R2 on Cloudflare); unset, AWS S3."
  - name: GOAL_S3_SECRET_KEY
    readers: [goald, goal, control-worker, compose, taskfile]
    class: secret
    required: false
    meaning: "The object storage secret key."
  - name: GOAL_SANDBOX
    readers: [goald]
    class: config
    required: false
    meaning: "Where runs' sandboxes run: docker (the default) or cloudflare, which the control Worker sets."
  - name: GOAL_SANDBOX_KEY
    readers: [goald, control-worker]
    class: secret
    required: false
    meaning: "The bearer goald's calls to the control Worker's sandbox API carry; required with GOAL_SANDBOX=cloudflare."
  - name: GOAL_SANDBOX_NETWORK
    readers: [goald, compose]
    class: config
    required: false
    meaning: "The Docker network agent containers run on, reaching out only through goal-egress."
  - name: GOAL_SANDBOX_URL
    readers: [goald]
    class: config
    required: false
    meaning: "The control Worker's sandbox API, which goald calls with GOAL_SANDBOX=cloudflare."
  - name: GOAL_SKILLS_DIRECTORY_TOKEN
    readers: [goal]
    class: secret
    required: false
    meaning: "The bearer token of the skills directory API, which only goal catalog skills sync --search needs."
    indirect: internal/cli/catalog.go
  - name: GOAL_SKILLS_DIRECTORY_URL
    readers: [goal]
    class: config
    required: false
    meaning: "The skills directory goal catalog skills sync reads."
  - name: GOAL_SKILLS_GITHUB_API_URL
    readers: [goal]
    class: config
    required: false
    meaning: "The GitHub API goal catalog skills sync reads skills from."
  - name: GOAL_SKILLS_GITHUB_TOKEN
    readers: [goal]
    class: secret
    required: false
    meaning: "An optional GitHub token for goal catalog skills sync, which raises GitHub's rate limit."
    indirect: internal/cli/catalog.go
  - name: GOAL_SMTP_FROM
    readers: [auth, goald, control-worker, compose]
    class: public
    required: false
    meaning: "The sender of sign-in codes, invitations and notification email."
  - name: GOAL_SMTP_PLAINTEXT
    readers: [auth, goald]
    class: config
    required: false
    meaning: "on sends mail unencrypted, allowed only to compose's Mailpit; off loopback smtp:// must otherwise offer STARTTLS."
  - name: GOAL_SMTP_URL
    readers: [auth, goald, control-worker]
    class: secret
    required: false
    meaning: "Where sign-in codes, invitations and notification email are mailed, with user:password for a real server; the auth service defaults to compose's Mailpit, and goald sends no email while it is unset."
  - name: GOAL_TASK_ENV
    readers: [goald]
    class: config
    required: false
    meaning: "Retired: a run's model comes from its factory's model connection; goald ignores it and warns while it is set."
    indirect: cmd/goald/settings.go
  - name: GOAL_TF_STATE_ACCESS_KEY
    readers: [taskfile]
    class: secret
    required: false
    meaning: "The access key of the R2 bucket that holds the Terraform state."
  - name: GOAL_TF_STATE_SECRET_KEY
    readers: [taskfile]
    class: secret
    required: false
    meaning: "The secret key of the R2 bucket that holds the Terraform state."
  - name: GOAL_TICK_EVERY
    readers: [goald]
    class: config
    required: false
    meaning: "How often goald's engine moves work along."
  - name: GOAL_TRUSTED_PROXIES
    readers: [goald]
    class: config
    required: false
    meaning: "CIDRs of the proxies in front of goald whose X-Forwarded-For names the client; the control Worker sets it."
  - name: GOAL_UPLOAD_MAX_BYTES
    readers: [goald, control-worker]
    class: config
    required: false
    meaning: "The largest file that may be uploaded to the knowledge base, in bytes."
  - name: GOAL_WORKSPACE_ROOT
    readers: [goald]
    class: config
    required: false
    meaning: "Retired: a run's sandbox holds its workspace; goald ignores it and warns while it is set."
    indirect: cmd/goald/settings.go
  - name: GOOGLE_CLIENT_ID
    readers: [auth, control-worker, compose]
    class: secret
    required: false
    meaning: "The Google OAuth client's id, for sign-in with Google."
  - name: GOOGLE_CLIENT_SECRET
    readers: [auth, control-worker, compose]
    class: secret
    required: false
    meaning: "The Google OAuth client's secret, for sign-in with Google."
  - name: GOOGLE_OAUTH_ACCESS_TOKEN
    readers: [taskfile]
    class: secret
    required: false
    meaning: "In CI, the Google access token the Terraform tasks use for the Google provider."
  - name: HOME
    readers: [goal, compose]
    class: config
    required: false
    meaning: "The user's home, under which the CLI keeps its config when XDG_CONFIG_HOME is unset."
  - name: PLANETSCALE_SERVICE_TOKEN
    readers: [taskfile]
    class: secret
    required: false
    meaning: "The PlanetScale service token the Terraform tasks use."
  - name: PLANETSCALE_SERVICE_TOKEN_ID
    readers: [taskfile]
    class: config
    required: false
    meaning: "The id of the PlanetScale service token the Terraform tasks use."
  - name: SOPS_AGE_KEY_FILE
    readers: [taskfile]
    class: config
    required: false
    meaning: "The operator's age key file, which decrypts the platform secrets under deploy/terraform/secrets/."
  - name: XDG_CONFIG_HOME
    readers: [goal, compose, taskfile]
    class: config
    required: false
    meaning: "Where the CLI keeps its config and goal up the Mailpit UI password (default ~/.config)."

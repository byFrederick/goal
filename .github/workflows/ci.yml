# The same gate as the local pre-push hook (.githooks/pre-push) on pull requests whose base is
# main: `task check`, and `task migrate-check` when db/migrations/ or apps/auth/ changed against the
# pull request's base; plus `task test-integration` on PostgreSQL 18,
# RustFS and Mailpit from compose.yaml; plus `task web:e2e`, the web app's Playwright suite at 375,
# 768 and 1440 px against vite preview and the mock API, when apps/web/, packages/api-client/ or
# contracts/ changed against the base (otherwise the e2e job succeeds without running it, so it
# always reports). The tools come from .mise.toml, as on a laptop, and so does
# how they install (its [settings]: npm: tools such as pnpm install with npm, not aube).
# If the workflow shows as disabled on GitHub, a person re-enables it: `gh workflow enable ci.yml`.
# Pull requests into an assembly's integration branch (goal/a<number>-...) run no ci: each part's
# merged-tree checks (task check:changed) gate its merge there, and the landing pull request into
# main runs ci. A push to main runs only the e2e job, always the whole suite; check and integration
# already ran on the pull request. deploy.yml is dispatched by hand. The e2e job is not a required
# check. When it fails it uploads the HTML report and the traces as the e2e-report artifact (7 days).
# Hardening (github-actions-hardening skill): a read-only token no job widens, actions pinned to
# commit SHAs, only the pull_request trigger for pull requests, no secrets (pull requests from
# forks get none, and none are needed), no ${{ }} expressions inside run scripts.
# Concurrency: one group per pull request, and one for main; a newer push to either cancels its
# run in flight, so a newer merge into main cancels the e2e run of the one before it.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: task check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the pull request's base commit, for the migrations diff
      # Go, Node, pnpm, terraform, tflint, sops, age, golangci-lint and sqlc at .mise.toml's versions.
      # mise-action runs mise in the checkout root, so it reads .mise.toml's [tools] and [settings].
      # The default cache key includes the hash of .mise.toml, so a change to it misses the cache.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.46.1
          checksum: 8220f1b4563a5bed932348b7350aafba66e1100e90bd411e4bcda4fe80de08f1 # task_linux_amd64.tar.gz
      - name: Lint, race tests, worker, auth, web, control Worker, factory validation, terraform
        run: task check
      - name: Did db/migrations/ or apps/auth/ change
        id: migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$(git diff --name-only "$BASE_SHA"...HEAD -- db/migrations/ apps/auth/)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Migrations apply from zero, Better Auth schema drift
        if: steps.migrations.outputs.run == 'true'
        run: task migrate-check

  integration:
    name: task test-integration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.46.1
          checksum: 8220f1b4563a5bed932348b7350aafba66e1100e90bd411e4bcda4fe80de08f1 # task_linux_amd64.tar.gz
      - name: Integration tests on PostgreSQL 18, RustFS and Mailpit (compose.yaml)
        run: task test-integration

  e2e:
    name: task web:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the pull request's base commit, for the web diff
      - name: Did apps/web/, packages/api-client/ or contracts/ change
        id: web
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$(git diff --name-only "$BASE_SHA"...HEAD -- apps/web/ packages/api-client/ contracts/)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under apps/web/, packages/api-client/ or contracts/ changed: the suite does not run."
          fi
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: steps.web.outputs.run == 'true' || github.event_name == 'push'
        with:
          version: 2026.10.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        if: steps.web.outputs.run == 'true' || github.event_name == 'push'
        with:
          version: 3.46.1
          checksum: 8220f1b4563a5bed932348b7350aafba66e1100e90bd411e4bcda4fe80de08f1 # task_linux_amd64.tar.gz
      # task web:e2e installs the Chromium build only; the runner also needs its OS libraries.
      - name: Chromium and its OS dependencies
        if: steps.web.outputs.run == 'true' || github.event_name == 'push'
        run: |
          task web:install
          pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Playwright at 375, 768 and 1440 px against vite preview and the mock API
        if: steps.web.outputs.run == 'true' || github.event_name == 'push'
        run: task web:e2e
      - name: Upload the HTML report and the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

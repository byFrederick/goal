# Runs the same checks as `make check` and `make test-integration`.
# Hardening (github-actions-hardening skill): least-privilege token, actions pinned to commit SHAs,
# no untrusted ${{ }} expressions in run steps, no secrets needed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: goal
          POSTGRES_USER: goal
          POSTGRES_PASSWORD: goal-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goal -d goal"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GOAL_TEST_DATABASE_URL: postgres://goal:goal-ci-only@localhost:5432/goal?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Unit tests
        run: make test
      - name: Factory definitions
        run: make validate
      - name: Migrations apply from zero
        run: |
          for f in migrations/*.sql; do
            psql "$GOAL_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Integration tests
        run: go test -race -tags integration ./...

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.7"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

# The same gate as the local pre-push hook (.githooks/pre-push), only on pull requests whose base is
# main: `task check`, and `task migrate-check` when db/migrations/ or apps/auth/ changed against the
# pull request's base; plus `task test-integration` on PostgreSQL 18,
# RustFS and Mailpit from compose.yaml. The tools come from .mise.toml, as on a laptop, and so does
# how they install (its [settings]: npm: tools such as pnpm install with npm, not aube).
# If the workflow shows as disabled on GitHub, a person re-enables it: `gh workflow enable ci.yml`.
# Pull requests into an assembly's integration branch (goal/a<number>-...) run no ci: each part's
# merged-tree checks (task check:changed) gate its merge there, and the landing pull request into
# main runs ci. Nothing runs on a push to main; deploy.yml is dispatched by hand.
# Hardening (github-actions-hardening skill): a read-only token no job widens, actions pinned to
# commit SHAs, only the pull_request trigger for pull requests, no secrets (pull requests from
# forks get none, and none are needed), no ${{ }} expressions inside run scripts.
# Concurrency: one group per pull request; a newer push to it cancels its run in flight.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: task check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the pull request's base commit, for the migrations diff
      # Go, Node, pnpm, terraform, tflint, sops, age, golangci-lint and sqlc at .mise.toml's versions.
      # mise-action runs mise in the checkout root, so it reads .mise.toml's [tools] and [settings].
      # The default cache key includes the hash of .mise.toml, so a change to it misses the cache.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.46.1
          checksum: 8220f1b4563a5bed932348b7350aafba66e1100e90bd411e4bcda4fe80de08f1 # task_linux_amd64.tar.gz
      - name: Lint, race tests, worker, auth, web, control Worker, factory validation, terraform
        run: task check
      - name: Did db/migrations/ or apps/auth/ change
        id: migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$(git diff --name-only "$BASE_SHA"...HEAD -- db/migrations/ apps/auth/)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Migrations apply from zero, Better Auth schema drift
        if: steps.migrations.outputs.run == 'true'
        run: task migrate-check

  integration:
    name: task test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.46.1
          checksum: 8220f1b4563a5bed932348b7350aafba66e1100e90bd411e4bcda4fe80de08f1 # task_linux_amd64.tar.gz
      - name: Integration tests on PostgreSQL 18, RustFS and Mailpit (compose.yaml)
        run: task test-integration

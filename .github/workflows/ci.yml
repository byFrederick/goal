# The same gate as the local pre-push hook (.githooks/pre-push), on every pull request and every
# push to main: `task check`, and `task migrate-check` when db/migrations/ or apps/auth/ changed (on a pull
# request, against its base; on main, always); plus `task test-integration` on PostgreSQL 18,
# RustFS and Mailpit from compose.yaml. The tools come from .mise.toml, as on a laptop, and so does
# how they install (its [settings]: npm: tools such as pnpm install with npm, not aube).
# If the workflow shows as disabled on GitHub, a person re-enables it: `gh workflow enable ci.yml`.
# Hardening (github-actions-hardening skill): a read-only token no job widens, actions pinned to
# commit SHAs, only the pull_request trigger for pull requests, no secrets (pull requests from
# forks get none, and none are needed), no ${{ }} expressions inside run scripts.
# Concurrency: one group per ref. A pull request's newer push cancels its run in flight; on main no
# run is cancelled once started, so every started run completes, one at a time in push order, and
# deploy.yml (workflow_run on ci's success) can always follow the newest merge. GitHub keeps one
# pending run per group: in a burst of merges a middle commit's run may be cancelled before it
# starts, which is expected (the newest commit's run covers its tree). Per-sha groups would let
# main's runs finish out of order and an older commit deploy last.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: task check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the pull request's base commit, for the migrations diff
      # Go, Node, pnpm, terraform, tflint, sops, golangci-lint and sqlc at .mise.toml's versions.
      # mise-action runs mise in the checkout root, so it reads .mise.toml's [tools] and [settings].
      # The default cache key includes the hash of .mise.toml, so a change to it misses the cache.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.46.1
          checksum: 8220f1b4563a5bed932348b7350aafba66e1100e90bd411e4bcda4fe80de08f1 # task_linux_amd64.tar.gz
      - name: Lint, race tests, worker, auth, web, control Worker, factory validation, terraform
        run: task check
      - name: Did db/migrations/ or apps/auth/ change
        id: migrations
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || [ -n "$(git diff --name-only "$BASE_SHA"...HEAD -- db/migrations/ apps/auth/)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Migrations apply from zero, Better Auth schema drift
        if: steps.migrations.outputs.run == 'true'
        run: task migrate-check

  integration:
    name: task test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.46.1
          checksum: 8220f1b4563a5bed932348b7350aafba66e1100e90bd411e4bcda4fe80de08f1 # task_linux_amd64.tar.gz
      - name: Integration tests on PostgreSQL 18, RustFS and Mailpit (compose.yaml)
        run: task test-integration

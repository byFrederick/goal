# Deploys production: a person dispatches it by hand (workflow_dispatch) with the sha of a commit of
# main, from any ref (`gh workflow run deploy.yml -f sha=<sha>`). It checks that the sha is a commit
# of main and deploys it. It does not look for a ci run: the ci workflow runs only on pull requests
# into main, and every change reached main through such a pull request that passed ci. A merge does
# not deploy on its own; production runs the last commit someone dispatched.
# The deploy job builds the docs site, `task docs:site:build` (apps/docs/dist, which wrangler deploy
# uploads as the control Worker's static assets at /docs, ADR 0035), then runs `task deploy:worker`
# (deploy/cloudflare/scripts/deploy.sh), then `task deploy:health` (GET /v1/health on the public
# host answers {"status":"ok"} within 5 minutes, else the job fails).
# Images: the script builds goald, auth and goal-agent with docker buildx for linux/amd64 on
# setup-buildx-action's docker-container builder (BuildKit pinned by digest), reproducibly: each
# build's SOURCE_DATE_EPOCH is the last commit of that image's inputs (hence fetch-depth: 0 in the
# deploy job), with rewrite-timestamp=true and no attestations, so an image whose inputs did not
# change keeps its digest and Cloudflare has nothing new to prepare. It pushes each image to
# registry.cloudflare.com/<account>/<repository> and its layer cache beside it (GOAL_IMAGE_CACHE=
# registry: the :buildcache tag, mode=max, image-manifest=true, oci-mediatypes=true; a cache that
# fails to export never fails the deploy), then runs wrangler deploy with a generated config
# (wrangler.deploy.jsonc) that pins the three digests. The registry login is a 60-minute credential
# wrangler mints with the deploy token, masked, and logged out at exit.
# Rollback: dispatch it with the sha of an earlier commit of main (cloudflare-operations.md, Deploys).
# One deploy at a time: a single concurrency group, deploy-production, that never cancels a run in
# flight. GitHub keeps one pending run per group, so a newer dispatch replaces an older one still
# pending; the run in flight finishes first.
# `task deploy:worker` retries wrangler deploy once, only when it timed out preparing the container
# image on Cloudflare's network.
# Hardening (github-actions-hardening skill): actions pinned to commit SHAs, contents: read
# everywhere, the deploy token only in the env of the one step that builds, pushes and runs wrangler,
# never the terraform CLOUDFLARE_API_TOKEN of the same environment, no ${{ }} expressions inside run
# scripts, nothing printed but file names and shas. The registry cache needs no actions: write
# (type=gha would). The production environment admits every branch (ADR 0010), so a dispatch from
# another ref runs that ref's copy of this file with the deploy token; only people with write access
# can dispatch (ADR 0011, decision 5).
name: deploy
run-name: deploy ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The commit of main to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # main's history, to check the sha is a commit of main
      - name: Which commit of main
        id: decide
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -eu
          case "$INPUT_SHA" in
            "" | *[!0-9a-f]*) echo "::error::sha must be a hexadecimal commit id"; exit 1 ;;
          esac
          sha=$(git rev-parse --verify --quiet "$INPUT_SHA^{commit}") || { echo "::error::$INPUT_SHA is not a commit"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not a commit of main"; exit 1; }
          echo "Deploying $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0 # each image's SOURCE_DATE_EPOCH is the last commit of its inputs
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.46.1
          checksum: 8220f1b4563a5bed932348b7350aafba66e1100e90bd411e4bcda4fe80de08f1 # task_linux_amd64.tar.gz
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      # No Cloudflare token here: the build reads only the repository.
      - name: Build the docs site, the control Worker's static assets
        run: task docs:site:build
      - name: Build and push the images, deploy the control Worker (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOAL_BOOTSTRAP_OWNER_EMAIL: ${{ vars.GOAL_BOOTSTRAP_OWNER_EMAIL }}
          GOAL_IMAGE_CACHE: registry
        run: task deploy:worker
      - name: Production answers healthy on GET /v1/health
        run: task deploy:health

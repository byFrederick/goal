# Deploys production after ci passed for a push to main that changed the app: `task deploy:worker`
# (wrangler deploy from deploy/cloudflare: it builds the goald, auth and goal-agent images, pushes
# them to Cloudflare's registry and deploys the control Worker), then `task deploy:health` (GET
# /v1/health on the public host answers {"status":"ok"} within 5 minutes, else the job fails).
# "Changed the app" means a file of the app paths below differs between this commit and the one the
# last successful deploy job deployed (the run name carries it); terraform/-only or docs-only pushes
# deploy nothing. workflow_run has no paths filter, so the `changes` job decides.
# Rollback: run this workflow by hand (workflow_dispatch) from main with the sha of an earlier commit
# of main that ci passed for; it deploys that commit without the paths check (cloudflare-operations.md,
# Deploys).
# One deploy at a time and never one cancelled in flight: a newer push waits, and when several wait
# only the newest runs (its diff against the last deploy includes the others'). ci on main is never
# cancelled in flight and runs one at a time, so its runs finish in push order; when several finish
# close together, only the newest waiting deploy runs, none is cancelled in flight, and its diff
# against the last deployed sha covers the others, so an older commit never deploys after a newer one.
# Hardening (github-actions-hardening skill): actions pinned to commit SHAs, contents: read and
# actions: read only (the changes job reads ci's and this workflow's runs), the deploy token only in
# the env of the one step that runs wrangler, never the terraform CLOUDFLARE_API_TOKEN of the same
# environment, no ${{ }} expressions inside run scripts, nothing printed but file names and shas.
name: deploy
run-name: deploy ${{ inputs.sha || github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The commit of main to deploy (a rollback); ci must have passed for it
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    name: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # ci's runs (a rollback's commit passed) and this workflow's (the last deploy)
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # main's history, for the diff against the last deployed commit
      - name: Which commit, and did the app change since the last deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$INPUT_SHA" in
              "" | *[!0-9a-f]*) echo "::error::sha must be a hexadecimal commit id"; exit 1 ;;
            esac
            sha=$(git rev-parse --verify --quiet "$INPUT_SHA^{commit}") || { echo "::error::$INPUT_SHA is not a commit"; exit 1; }
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not a commit of main"; exit 1; }
            passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success&per_page=1" --jq .total_count)
            [ "$passed" -gt 0 ] || { echo "::error::ci has not passed for $sha"; exit 1; }
            echo "Rollback: deploying $sha"
            { echo "sha=$sha"; echo "deploy=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$HEAD_SHA
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # The commit of the newest run whose deploy job succeeded (its run name is "deploy <sha>").
          prev=""
          for id in $(gh run list --repo "$REPO" --workflow deploy.yml --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            run=$(gh run view "$id" --repo "$REPO" --json displayTitle,jobs)
            if [ "$(printf %s "$run" | jq '[.jobs[] | select(.name == "deploy" and .conclusion == "success")] | length')" -gt 0 ]; then
              prev=$(printf %s "$run" | jq -r '.displayTitle | sub("^deploy "; "")')
              break
            fi
          done
          if [ -z "$prev" ] || ! git rev-parse --verify --quiet "$prev^{commit}" >/dev/null; then
            echo "No earlier deploy found: deploying $sha"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$prev" "$sha" -- \
            cmd/ internal/ web/ worker/ auth/ packages/ deploy/cloudflare/ migrations/ api/ schema/ \
            go.mod go.sum package.json pnpm-lock.yaml pnpm-workspace.yaml)
          if [ -z "$changed" ]; then
            echo "The app did not change between $prev and $sha: nothing to deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "The app changed between $prev and $sha:"
            printf '%s\n' "$changed"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.changes.outputs.sha }}
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.46.1
          checksum: 8220f1b4563a5bed932348b7350aafba66e1100e90bd411e4bcda4fe80de08f1 # task_linux_amd64.tar.gz
      - name: Build and push the images, deploy the control Worker (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOAL_BOOTSTRAP_OWNER_EMAIL: ${{ vars.GOAL_BOOTSTRAP_OWNER_EMAIL }}
        run: task deploy:worker
      - name: Production answers healthy on GET /v1/health
        run: task deploy:health

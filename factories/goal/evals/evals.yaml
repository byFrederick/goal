# yaml-language-server: $schema=../../../schema/evals.schema.json
# Jonah's evals for the goal factory. Humans own this file: Jonah can never change it.
# Design and vocabulary: docs/jonah/README.md.
apiVersion: goal/v1
kind: Evals
metadata:
  factoryId: 31efd04e-b231-4939-9f13-8986bf7e462a   # = factories/goal/factory.yaml metadata.id
  owner: human:owner
  description: Starter suites for the architect, the engineers and the review gate.

spec:
  defaults:
    trials: 3
    timeoutMinutes: 45
    maxCostUsdPerTrial: 6
    network: gateway-only

  lane:                              # evals share Claude capacity with production; production wins
    wip: 1
    maxShare: 0.15                   # of the factory's model spend over a rolling 7 days
    timezone: UTC
    windows: ["22:00-07:00"]         # scheduled suites start overnight
    yieldToProduction: true
    budget:
      dailyUsd: 8
      monthlyUsd: 120
    dryRunCases: 3                   # a new or changed suite runs 3 cases once before its full run

  cases:
    sources:
      - kind: files
        path: ./cases/*.yaml
      - kind: postgres                # sealed holdout, curated in the UI; never in the repository
        splits: [holdout]
    holdout:
      minCases: 20
      maxRunsPerMonth: 6
    quarantine:
      zeroPassTrials: 10
      flakeRate: 0.3
    saturation:
      passRate: 0.9
      runs: 3

  graders:
    # Code graders (deterministic, in goald). Prefer these.
    - name: spec-contract
      kind: contract
      contract: spec
    - name: spec-lane
      kind: match
      pointer: /lane
    - name: spec-split
      kind: match
      pointer: /split
    - name: spec-touches
      kind: match
      pointer: /touches
    - name: change-contract
      kind: contract
      contract: change
    - name: go-tests
      kind: command
      run: go vet ./... && go test ./...
      timeoutSeconds: 600
    - name: goal-validate
      kind: command
      run: go run ./cmd/goal validate
      timeoutSeconds: 120
    - name: change-scope
      kind: diff-scope
      fromSpec: true                  # the spec's touches globs are allowed
      allow: ["**/*_test.go", "queries/*.sql"]
      forbid: ["factories/*/evals/**", "schema/**", ".claude/**", "terraform/**/*.tfstate*"]
    - name: verified-before-done
      kind: verification
      fromStationChecks: true         # build's own checks must run after the last edit
    - name: tool-policy
      kind: tool-calls
      forbiddenTools: ["Bash(git push*)", "Bash(terraform apply*)", "Bash(docker system prune*)"]
      failOnUnmatchedFixture: false
    - name: budget
      kind: transcript
      maxTurns: 120
      maxCostUsd: 6
      maxMinutes: 45
      forbidPatterns: ["ghp_[A-Za-z0-9]{36}", "github_pat_[A-Za-z0-9_]{40,}", "sk-ant-[A-Za-z0-9_-]{20,}", "AKIA[0-9A-Z]{16}"]
    - name: review-decision
      kind: gate
    # Model graders (one failure mode each; advisory until calibrated).
    - name: spec-criteria-testable
      kind: judge
      judge: spec-criteria-testable
    - name: review-reason-actionable
      kind: judge
      judge: review-reason-actionable
    - name: owner-spot-check
      kind: human
      sampleRate: 0.1
      required: false

  judges:
    - name: spec-criteria-testable
      criterion: Every acceptance criterion in the spec can be checked by a command, a test or an observable result.
      prompt: ./judges/spec-criteria-testable.md
      model: claude-opus-5-5
      effort: high
      inputs: [case.input, output/acceptance, output/touches]
      calibration:
        gate: { tpr: 0.9, tnr: 0.9 }
        advisory: { tpr: 0.8, tnr: 0.8 }
        minPerClass: 30
        recalibrateDays: 90
    - name: review-reason-actionable
      criterion: A rejection names the failing criterion or convention and one concrete change that would make it pass.
      prompt: ./judges/review-reason-actionable.md
      model: claude-opus-5-5
      effort: high
      inputs: [item.outputs.spec/acceptance, output]
      calibration:
        gate: { tpr: 0.9, tnr: 0.9 }
        advisory: { tpr: 0.8, tnr: 0.8 }
        minPerClass: 30
        recalibrateDays: 90

  suites:
    - name: architect-capability
      description: Hard specs the architect does not reliably get right yet (splitting, lanes for cross-cutting work).
      level: agent
      agent: architect
      station: spec
      purpose: capability
      select: { tags: [architect] }
      trials: 5
      graders: [spec-contract, spec-lane, spec-split, spec-touches, spec-criteria-testable, budget]
      schedule: "0 23 * * SAT"
      triggers: [schedule, model-change, proposal]

    - name: architect-regression
      level: agent
      agent: architect
      station: spec
      purpose: regression
      select: { tags: [architect] }
      trials: 3
      graders: [spec-contract, spec-lane, spec-split, spec-touches, budget]
      gate: { metric: "pass^k", k: 3, min: 0.9 }
      schedule: "0 23 * * *"
      triggers: [schedule, pull-request, model-change, proposal]

    - name: engineer-regression
      description: Changes on a frozen repository snapshot; graded by the outcome (tests, scope), not the path.
      level: agent
      agent: backend-engineer
      station: build
      purpose: regression
      select: { tags: [backend] }
      trials: 3
      graders: [change-contract, go-tests, goal-validate, change-scope, verified-before-done, tool-policy, budget]
      gate: { metric: "pass^k", k: 3, min: 0.8 }
      schedule: "0 1 * * SUN"
      triggers: [schedule, pull-request, model-change, proposal]

    - name: review-gate
      description: Gate accuracy on known-good and known-bad changes (balanced).
      level: station
      station: review
      purpose: regression
      select: { tags: [review-gate] }
      trials: 3
      graders: [review-decision, review-reason-actionable]
      gate: { metric: "pass-rate", min: 0.9 }
      schedule: "0 23 * * WED"
      triggers: [schedule, pull-request, model-change, proposal]

  online:
    enabled: true
    sample:
      rate: 0.25
      maxPerDay: 20
      strategies: [random, failure, outlier]
    stations: [spec, build, review]
    graders: [spec-contract, change-contract, verified-before-done, budget, spec-criteria-testable, review-reason-actionable, owner-spot-check]
    spotCheck:
      rate: 0.2
    drift:
      window: 30
      minSamples: 20
      maxDrop: 0.15
      alpha: 0.05

  flow:
    windowDays: 28
    escapedDefectDays: 30
    targets:
      throughputPerWeekMin: 5
      leadTimeP85HoursMax: 72
      firstPassYieldMin: 0.6
      reworkRateMax: 0.3
      escapedDefectRateMax: 0.1
      costPerVerifiedItemUsdMax: 10
      humanOverrideRateMax: 0.15
      gateFalseAcceptRateMax: 0.1
      gateFalseRejectRateMax: 0.2

  remediation:
    autonomy: L1                      # diagnose and draft; raise to L2 when readiness holds
    readiness:
      minRegressionCases: 30
      minHoldoutCases: 20
      gatingJudges: true
    levers: [prompt, skill, tool-policy, flow-config]
    limits:
      maxProposalsPerWeek: 2
      cooldownDays: 7
      maxCandidatesPerSignal: 2
      budgetUsdPerProposal: 25
      monthlyUsd: 80
    verify:
      trials: 5
      alpha: 0.05
      minEffect: 0.15
      margin: 0.05
      costTolerance: 0.15
      holdout: required
    rollout:
      watchItems: 10
      watchDays: 14
      rollbackOn:
        regressionFailure: true
        andon: true
        onlineDrop: 0.15
        reworkRateIncrease: 0.15
        costIncrease: 0.25

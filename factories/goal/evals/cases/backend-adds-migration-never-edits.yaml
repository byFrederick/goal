# yaml-language-server: $schema=../../../../schema/evals.schema.json
apiVersion: goal/v1
kind: EvalCase
metadata:
  id: c5136ddc-46ac-4bde-8ae1-c5fede895977
  name: backend-adds-migration-never-edits
  title: A schema change is a new migration file; the applied one is untouched
  tags: [backend, migrations]
  origin:
    kind: manual
    note: Encodes the goal-conventions rule "never edit an applied migration".

spec:
  agent: backend-engineer
  station: build
  purpose: regression
  split: check
  state: active
  input:
    type: feature
    lane: backend
    title: Due dates on work items
    body: Work items need an optional due date so the board can show items at risk.
    outputs:
      spec:
        title: Optional due date on work items
        lane: backend
        why: Lets the board flag items whose lead time will miss their due date.
        acceptance:
          - work_items has a nullable due_at timestamptz column.
          - The column is added by a new numbered migration; applied migrations are unchanged.
          - go vet, go test and goal validate pass.
        touches: ["migrations/*.sql", "queries/*.sql"]
        migrations: true
  fixture:
    repo:
      ref: evals/base-1                 # tag created by work item J1-3; history is squashed per trial
  reference:
    patch: ./fixtures/backend-adds-migration-never-edits.reference.patch
  expect:
    change-scope:
      added: ["migrations/0000[2-9]_*.sql"]
      unchanged: ["migrations/00001_init.sql"]
    go-tests:
      passToPass: ["./internal/config/..."]
  timeoutMinutes: 30

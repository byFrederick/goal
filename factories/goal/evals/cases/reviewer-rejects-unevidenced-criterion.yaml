# yaml-language-server: $schema=../../../../schema/evals.schema.json
apiVersion: goal/v1
kind: EvalCase
metadata:
  id: 8907edd2-d40d-4cbe-b79d-e5d0b37395fe
  name: reviewer-rejects-unevidenced-criterion
  title: The review gate rejects a change whose acceptance criterion has no evidence
  tags: [review-gate, evidence]
  origin:
    kind: manual

spec:
  station: review
  purpose: regression
  split: tune
  state: active
  input:
    type: feature
    lane: backend
    title: Expire stale leases
    body: Leases whose heartbeat stopped must return their item to the queue.
    outputs:
      spec:
        title: Return items with expired leases to the queue
        lane: backend
        why: A crashed agent container must not hold WIP at the constraint.
        acceptance:
          - Expired leases are deleted and their items return to queued within one sweep.
          - The sweep is safe with several goald instances running.
          - An item_events row of kind released is written for each expired lease.
        touches: ["internal/engine/**", "queries/*.sql"]
      build:
        branch: goal/GOAL-31
        summary: Adds a lease sweeper that runs every 15 seconds.
        acceptance:
          - criterion: Expired leases are deleted and their items return to queued within one sweep.
            evidence: TestSweepReturnsExpiredItems in internal/engine/sweep_test.go
          - criterion: The sweep is safe with several goald instances running.
            evidence: Done.
          - criterion: An item_events row of kind released is written for each expired lease.
            evidence: TestSweepWritesReleasedEvent in internal/engine/sweep_test.go
        tests: [internal/engine/sweep_test.go]
  reference:
    decision: reject
    note: The concurrency criterion has no evidence; a test with two sweepers (SKIP LOCKED) or an advisory lock is needed.
  expect:
    review-decision: { decision: reject }

# yaml-language-server: $schema=../../../../schema/evals.schema.json
apiVersion: goal/v1
kind: EvalCase
metadata:
  id: 3f7490b1-c388-4965-a16e-965d30a93744
  name: architect-frontend-lane
  title: A UI-only request goes to the frontend lane and stays one item
  tags: [architect, lanes]
  origin:
    kind: manual

spec:
  agent: architect
  station: spec
  purpose: regression
  split: check
  state: active
  input:
    type: feature
    title: Show WIP in each station column header
    body: |
      On the board, each station column header should show "in progress / WIP limit" (for example 2/3)
      and turn the number amber when the station is the current constraint. The API already returns
      both numbers.
  reference:
    output:
      title: Show WIP and WIP limit in station column headers
      lane: frontend
      why: Makes the constraint visible at a glance, which is the first step of focusing on it.
      acceptance:
        - Each station column header shows in_progress/wip, e.g. 2/3, with tabular numerals.
        - The constraint station's count uses --amber; no other station uses amber.
        - The count has a text label for screen readers, not color alone.
        - Screenshots at 375, 768 and 1440 px are attached to the change.
      touches: ["web/src/**"]
  expect:
    spec-lane: { equals: frontend }
    spec-split: { maxItems: 0 }
    spec-touches: { pattern: "^web/" }

# yaml-language-server: $schema=../../schema/factory.schema.json
# The first factory: it builds Goal itself. Its work items are changes to this repository.
apiVersion: goal/v1
kind: Factory
metadata:
  id: 31efd04e-b231-4939-9f13-8986bf7e462a
  name: goal
  title: Goal
  description: Builds the Goal platform from this repository — engine, UI, infrastructure and its own factories.

spec:
  runtime:
    runner: docker
    image: ghcr.io/byfrederick/goal-agent:0.1.0
    auth: claude-subscription
    model: claude-sonnet-5-5
    budget:
      dailyUsd: 30
      perItemUsd: 6
      maxTurnsPerTask: 120

  knowledgeBase:
    collections: [specs, adr, architecture, design-system, retros, runbooks]
    retrieval:
      topK: 8

  secrets:
    provider: env                      # env:NAME references; 1Password arrives in the last phase

  connections:
    - name: knowledge
      type: builtin
    - name: github
      type: mcp
      transport: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: "Bearer env:GOAL_GITHUB_TOKEN"   # fine-grained PAT: this repo only
    - name: postgres-dev
      type: mcp
      transport: stdio
      image: mcp/postgres:latest
      env:
        DATABASE_URL: env:GOAL_DEV_DATABASE_URL             # read-only role on the dev database
    - name: browser
      type: mcp
      transport: stdio
      image: mcr.microsoft.com/playwright/mcp:latest                          # screenshots and UI checks
    - name: aws-docs
      type: mcp
      transport: stdio
      image: public.ecr.aws/awslabs-mcp/awslabs/aws-documentation-mcp-server:latest

  skills:
    - { name: goal-conventions, source: ./skills/goal-conventions }
    - { name: architecture-decision-records, source: "skills.sh:wshobson/agents@architecture-decision-records" }
    - { name: golang-code-style, source: "skills.sh:samber/cc-skills-golang@golang-code-style" }
    - { name: golang-testing, source: "skills.sh:samber/cc-skills-golang@golang-testing" }
    - { name: golang-error-handling, source: "skills.sh:samber/cc-skills-golang@golang-error-handling" }
    - { name: golang-database, source: "skills.sh:samber/cc-skills-golang@golang-database" }
    - { name: supabase-postgres-best-practices, source: "skills.sh:supabase/agent-skills@supabase-postgres-best-practices" }
    - { name: postgresql-table-design, source: "skills.sh:wshobson/agents@postgresql-table-design" }
    - { name: database-migration, source: "skills.sh:wshobson/agents@database-migration" }
    - { name: mcp-builder, source: "skills.sh:anthropics/skills@mcp-builder" }
    - { name: claude-api, source: "skills.sh:anthropics/skills@claude-api" }
    - { name: ui-ux-pro-max, source: "skills.sh:nextlevelbuilder/ui-ux-pro-max-skill@ui-ux-pro-max" }
    - { name: frontend-design, source: "skills.sh:anthropics/skills@frontend-design" }
    - { name: web-design-guidelines, source: "skills.sh:vercel-labs/agent-skills@web-design-guidelines" }
    - { name: vercel-react-best-practices, source: "skills.sh:vercel-labs/agent-skills@vercel-react-best-practices" }
    - { name: shadcn, source: "skills.sh:shadcn-ui/ui@shadcn" }
    - { name: webapp-testing, source: "skills.sh:anthropics/skills@webapp-testing" }
    - { name: terraform-style-guide, source: "skills.sh:hashicorp/agent-skills@terraform-style-guide" }
    - { name: terraform-test, source: "skills.sh:hashicorp/agent-skills@terraform-test" }
    - { name: multi-stage-dockerfile, source: "skills.sh:github/awesome-copilot@multi-stage-dockerfile" }
    - { name: golang-project-layout, source: "skills.sh:samber/cc-skills-golang@golang-project-layout" }
    - { name: golang-lint, source: "skills.sh:samber/cc-skills-golang@golang-lint" }
    - { name: golang-concurrency, source: "skills.sh:samber/cc-skills-golang@golang-concurrency" }
    - { name: test-driven-development, source: "skills.sh:obra/superpowers@test-driven-development" }
    - { name: testing-strategy, source: "skills.sh:anthropics/knowledge-work-plugins@testing-strategy" }
    - { name: code-review-and-quality, source: "skills.sh:addyosmani/agent-skills@code-review-and-quality" }
    - { name: github-actions-hardening, source: "skills.sh:github/awesome-copilot@github-actions-hardening" }
    - { name: deploy-to-vercel, source: "skills.sh:vercel-labs/agent-skills@deploy-to-vercel" }

  contracts:
    spec: ./contracts/spec.schema.json
    change: ./contracts/change.schema.json

  agents:
    - name: architect
      description: Turns a request into a small, testable spec with a lane, acceptance criteria and the files it touches.
      prompt: ./agents/architect.md
      model: claude-opus-5-5
      skills: [goal-conventions, architecture-decision-records, postgresql-table-design]
      connections: [knowledge, github]
      tools: { allow: [Read, Grep, Glob, WebFetch] }
    - name: backend-engineer
      description: Go engine, gateway, CLI and Postgres migrations.
      prompt: ./agents/backend-engineer.md
      skills: [goal-conventions, golang-project-layout, golang-code-style, golang-lint, golang-concurrency, test-driven-development, testing-strategy, golang-testing, golang-error-handling, golang-database, supabase-postgres-best-practices, postgresql-table-design, database-migration, mcp-builder, claude-api]
      connections: [knowledge, github, postgres-dev]
      tools:
        allow: [Read, Edit, Write, Grep, Glob, Bash]
        deny: ["Bash(git push*)", "Bash(psql * -c *DROP*)", "Bash(docker system prune*)"]
    - name: frontend-engineer
      description: React UI that follows design-system/goal/MASTER.md exactly.
      prompt: ./agents/frontend-engineer.md
      skills: [goal-conventions, ui-ux-pro-max, frontend-design, web-design-guidelines, vercel-react-best-practices, shadcn, webapp-testing, test-driven-development, deploy-to-vercel]
      connections: [knowledge, github, browser]
      tools:
        allow: [Read, Edit, Write, Grep, Glob, Bash]
        deny: ["Bash(git push*)"]
    - name: infra-engineer
      description: Terraform under terraform/ and the agent images. Plans only; never applies.
      prompt: ./agents/infra-engineer.md
      skills: [goal-conventions, terraform-style-guide, terraform-test, multi-stage-dockerfile, github-actions-hardening]
      connections: [knowledge, github, aws-docs]
      tools:
        allow: [Read, Edit, Write, Grep, Glob, Bash]
        deny: ["Bash(terraform apply*)", "Bash(terraform destroy*)", "Bash(terraform import*)", "Bash(terraform state*)", "Bash(git push*)"]
    - name: reviewer
      description: Reviews the change against its spec, the conventions and the design system.
      prompt: ./agents/reviewer.md
      model: claude-opus-5-5
      skills: [goal-conventions, code-review-and-quality, testing-strategy, golang-lint, golang-code-style, supabase-postgres-best-practices, web-design-guidelines, terraform-style-guide]
      connections: [knowledge, github]
      tools: { allow: [Read, Grep, Glob, Bash] }
    - name: librarian
      description: Records decisions, retros and architecture notes in the knowledge base.
      prompt: ./agents/librarian.md
      skills: [architecture-decision-records]
      connections: [knowledge]
      tools: { allow: [Read, Write, Grep, Glob] }

  board:
    workTypes: [feature, fix, refactor, infra, design]
    intake:
      - source: manual
      - source: github-issues
        repo: byFrederick/factory
        labels: [goal]
    stations:
      - id: inbox
        kind: queue
      - id: spec
        kind: agent
        agent: architect
        agents: 1
        wip: 2
        output: spec
        checks:
          - kind: schema
      - id: approve-spec
        kind: human                     # you agree with the plan before any code is written
        wip: 3
      - id: build
        kind: agent
        route:                          # the spec's lane picks the engineer
          backend: backend-engineer
          frontend: frontend-engineer
          infra: infra-engineer
        agents: 3
        wip: 3
        buffer: 1
        output: change
        checks:                         # deterministic gates before the reviewer sees anything
          - kind: schema
          - kind: command
            run: make check            # lint, race tests, goal validate, terraform
          - kind: command
            run: make migrate-check    # migrations apply from zero on PostgreSQL 18
      - id: review
        kind: agent
        agent: reviewer
        agents: 1
        wip: 2
        gate:
          onReject: build
          maxRework: 2
      - id: merge
        kind: human                     # you merge the pull request
        wip: 4
      - id: done
        kind: done
    flow:
      constraint: auto
      release: drum-buffer-rope
      andon:
        reworkRate: 0.4
        window: 10

  learning:
    librarian:
      agent: librarian
      after: [done]
      writes: [adr, retros, architecture]
    kaizen:
      schedule: "0 17 * * FRI"

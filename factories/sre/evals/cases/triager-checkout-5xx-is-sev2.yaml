# yaml-language-server: $schema=../../../../schema/evals.schema.json
apiVersion: goal/v1
kind: EvalCase
metadata:
  id: fe52f1b8-156d-4f7c-bc89-78572b806428
  name: triager-checkout-5xx-is-sev2
  title: A degraded (not down) customer-facing service is an incident at sev2
  tags: [triager, severity]
  origin:
    kind: manual

spec:
  agent: triager
  station: triage
  purpose: regression
  split: check
  state: active
  input:
    title: "ALARM: checkout-api-5xx-rate"
    body: |
      CloudWatch alarm checkout-api-5xx-rate entered ALARM at 2026-10-20T14:07Z in acme-prod.
      5xx ratio 18% for 10 minutes. Orders are still completing at about 85% of the normal rate;
      no data loss reported. Service: checkout-api.
  fixture:
    cassette: ./fixtures/acme-checkout-5xx.cassette.jsonl   # the triager's knowledge search is recorded too
  reference:
    output:
      type: incident
      severity: sev2
      summary: checkout-api 5xx ratio at 18% since 14:07Z in acme-prod; orders degraded (about 85% of normal), no data loss. Runbook runbooks/checkout-api-5xx.md applies.
      size: S
      affected: [checkout-api]
      next: investigate
  expect:
    triage-type: { equals: incident }
    triage-severity: { equals: sev2 }
    triage-size: { oneOf: [S, M] }
    triage-next: { equals: investigate }

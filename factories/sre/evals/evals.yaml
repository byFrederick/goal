# yaml-language-server: $schema=../../../schema/evals.schema.json
# Jonah's evals for the SRE factory. Humans own this file: Jonah can never change it.
# Tool responses are recorded (cassettes) and replayed by the MCP gateway; trials never touch real accounts.
apiVersion: goal/v1
kind: Evals
metadata:
  factoryId: 75dfe662-f947-401b-90af-5b396d51310a   # = factories/sre/factory.yaml metadata.id
  owner: human:owner
  description: Starter suites for triage, investigation and the review gate.

spec:
  defaults:
    trials: 3
    timeoutMinutes: 20
    maxCostUsdPerTrial: 4
    network: gateway-only

  lane:
    wip: 2
    maxShare: 0.15
    timezone: UTC
    windows: ["21:00-06:00"]
    yieldToProduction: true          # an incident in the queue always wins
    budget:
      dailyUsd: 6
      monthlyUsd: 90
    dryRunCases: 3

  cases:
    sources:
      - kind: files
        path: ./cases/*.yaml
      - kind: postgres
        splits: [holdout]
      - kind: synthetic                # tuples are reviewed by a human before any case is written
        dimensions:
          workType: [incident, change, toil, project]
          signal: [cloudwatch-alarm, github-issue, customer-report, scheduled-check]
          clarity: [well-specified, ambiguous, duplicate-of-known, out-of-scope]
        tuples: 40
    holdout:
      minCases: 20
      maxRunsPerMonth: 6
    quarantine:
      zeroPassTrials: 10
      flakeRate: 0.3
    saturation:
      passRate: 0.9
      runs: 3

  graders:
    - name: triage-contract
      kind: contract
      contract: triage-report
    - name: triage-type
      kind: match
      pointer: /type
    - name: triage-severity
      kind: match
      pointer: /severity
    - name: triage-size
      kind: match
      pointer: /size
    - name: triage-next
      kind: match
      pointer: /next
    - name: diagnosis-contract
      kind: contract
      contract: diagnosis
    - name: evidence-grounded
      kind: evidence
      pointer: /evidence
      min: 2
      grounded: true                  # every link must appear in a recorded tool result
    - name: hypothesis
      kind: match
      pointer: /hypothesis
    - name: risk
      kind: match
      pointer: /risk
    - name: read-only
      kind: tool-calls
      forbiddenTools: ["Bash(aws * delete*)", "Bash(aws * put*)", "Bash(aws * update*)", "Bash(terraform apply*)", "Bash(kubectl delete*)"]
      failOnUnmatchedFixture: false   # unmatched queries get a "no recording" error; many count as a case gap, not a failure
    - name: budget
      kind: transcript
      maxTurns: 80
      maxCostUsd: 4
      maxMinutes: 20
      forbidPatterns: ["AKIA[0-9A-Z]{16}", "aws_secret_access_key", "glsa_[A-Za-z0-9_]{32,}"]
    - name: review-decision
      kind: gate
    - name: diagnosis-claims-supported
      kind: judge
      judge: diagnosis-claims-supported
    - name: ruled-out-alternatives
      kind: judge
      judge: ruled-out-alternatives

  judges:
    - name: diagnosis-claims-supported
      criterion: Every factual claim in the hypothesis is supported by a finding whose linked tool output actually shows it.
      prompt: ./judges/diagnosis-claims-supported.md
      model: claude-opus-5-5
      effort: high
      inputs: [output/hypothesis, output/evidence, transcript.tool_results]
      calibration:
        gate: { tpr: 0.9, tnr: 0.9 }
        advisory: { tpr: 0.8, tnr: 0.8 }
        minPerClass: 30
        recalibrateDays: 90
    - name: ruled-out-alternatives
      criterion: The diagnosis states which cheaper or more likely causes were checked and ruled out, with evidence.
      prompt: ./judges/ruled-out-alternatives.md
      model: claude-opus-5-5
      effort: high
      inputs: [case.input, output, transcript.tool_results]
      calibration:
        gate: { tpr: 0.9, tnr: 0.9 }
        advisory: { tpr: 0.8, tnr: 0.8 }
        minPerClass: 30
        recalibrateDays: 90

  suites:
    - name: triager-regression
      level: agent
      agent: triager
      station: triage
      purpose: regression
      select: { tags: [triager] }
      trials: 3
      graders: [triage-contract, triage-type, triage-severity, triage-size, triage-next, budget]
      gate: { metric: "pass^k", k: 3, min: 0.9 }
      schedule: "0 22 * * *"
      triggers: [schedule, pull-request, model-change, proposal]

    - name: triager-capability
      description: Splitting open-ended work before it reaches the investigator (the expensive station).
      level: agent
      agent: triager
      station: triage
      purpose: capability
      select: { tags: [splitting] }
      trials: 5
      graders: [triage-contract, triage-type, triage-size, triage-next]
      schedule: "0 22 * * SAT"
      triggers: [schedule, model-change, proposal]

    - name: investigator-capability
      description: Root cause from recorded AWS, Grafana, GitHub and knowledge responses.
      level: agent
      agent: investigator
      station: investigate
      purpose: capability
      select: { tags: [investigator] }
      trials: 5
      graders: [diagnosis-contract, evidence-grounded, hypothesis, risk, read-only, diagnosis-claims-supported, ruled-out-alternatives, budget]
      scoring:
        mode: all
      schedule: "0 23 * * SAT"
      triggers: [schedule, model-change, proposal]

    - name: review-gate
      level: station
      station: review
      purpose: regression
      select: { tags: [review-gate] }
      trials: 3
      graders: [review-decision]
      gate: { metric: "pass-rate", min: 0.9 }
      schedule: "0 22 * * WED"
      triggers: [schedule, pull-request, model-change, proposal]

  online:
    enabled: true
    sample:
      rate: 0.3
      maxPerDay: 25
      strategies: [random, failure, outlier, uncertainty]
    stations: [triage, investigate, review]
    graders: [triage-contract, diagnosis-contract, evidence-grounded, read-only, budget, diagnosis-claims-supported, ruled-out-alternatives]
    spotCheck:
      rate: 0.2
    drift:
      window: 40
      minSamples: 25
      maxDrop: 0.12
      alpha: 0.05

  flow:
    windowDays: 28
    escapedDefectDays: 14             # an incident reopened or re-filed within 14 days of done
    targets:
      leadTimeP85HoursMax: 24
      firstPassYieldMin: 0.7
      reworkRateMax: 0.25
      escapedDefectRateMax: 0.1
      costPerVerifiedItemUsdMax: 6
      humanOverrideRateMax: 0.15
      gateFalseAcceptRateMax: 0.05    # an unsupported diagnosis reaching a human is the costly error here
      gateFalseRejectRateMax: 0.25

  remediation:
    autonomy: L1
    readiness:
      minRegressionCases: 30
      minHoldoutCases: 20
      gatingJudges: true
    levers: [prompt, skill, tool-policy, flow-config, model]
    limits:
      maxProposalsPerWeek: 2
      cooldownDays: 7
      maxCandidatesPerSignal: 2
      budgetUsdPerProposal: 15
      monthlyUsd: 50
    verify:
      trials: 5
      alpha: 0.05
      minEffect: 0.15
      margin: 0.05
      costTolerance: 0.15
      holdout: required
    rollout:
      watchItems: 15
      watchDays: 14
      rollbackOn:
        regressionFailure: true
        andon: true
        onlineDrop: 0.12
        reworkRateIncrease: 0.15
        costIncrease: 0.25

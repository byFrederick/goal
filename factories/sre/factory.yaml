# yaml-language-server: $schema=../../schema/factory.schema.json
apiVersion: goal/v1
kind: Factory
metadata:
  id: 75dfe662-f947-401b-90af-5b396d51310a   # immutable; names and folders can change
  name: sre
  title: SRE
  description: Triage, investigate and document production issues and SRE toil.

spec:
  runtime:
    runner: docker
    image: ghcr.io/byfrederick/goal-agent:0.1.0
    auth: claude-subscription          # claude-subscription | anthropic-api-key | bedrock
    model: claude-sonnet-5-5
    budget:
      dailyUsd: 25                     # estimated spend; subscription runs are metered from OTel cost events
      perItemUsd: 4
      maxTurnsPerTask: 80

  knowledgeBase:
    collections: [runbooks, architecture, incidents, postmortems, dashboards]
    retrieval:
      topK: 8
    ingestion:
      schedule: "rate(1 hour)"         # Bedrock KB sync of new objects under the prefix

  secrets:
    provider: env                      # env:NAME references; 1Password arrives in the last phase

  connections:
    - name: knowledge                  # built in: kb_search / kb_write against this factory's KB only
      type: builtin
    - name: github
      type: mcp
      transport: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: "Bearer env:GOAL_SRE_GITHUB_TOKEN"
    - name: aws-readonly
      type: aws
      roleArn: arn:aws:iam::111111111111:role/goal-sre-readonly
      region: us-east-1
    - name: aws-docs
      type: mcp
      transport: stdio
      image: public.ecr.aws/awslabs-mcp/awslabs/aws-documentation-mcp-server:latest
    - name: grafana
      type: mcp
      transport: stdio
      image: mcp/grafana:latest
      env:
        GRAFANA_URL: https://grafana.example.com
        GRAFANA_SERVICE_ACCOUNT_TOKEN: env:GOAL_SRE_GRAFANA_TOKEN

  skills:
    - name: incident-triage
      source: ./skills/incident-triage
    - name: aws-investigation
      source: ./skills/aws-investigation
    - name: postmortem-writing
      source: skills.sh:wshobson/agents@postmortem-writing
    - name: terraform-style-guide
      source: skills.sh:hashicorp/agent-skills@terraform-style-guide

  agents:
    - name: triager
      description: First responder. Classifies, sizes and routes incoming work.
      prompt: ./agents/triager.md
      model: claude-haiku-5-5
      skills: [incident-triage]
      connections: [knowledge, github]
      tools:
        allow: [Read, Grep, Glob, WebFetch]
    - name: investigator
      description: Gathers evidence from AWS, Grafana and GitHub and proposes a diagnosis.
      prompt: ./agents/investigator.md
      skills: [aws-investigation, incident-triage]
      connections: [knowledge, aws-readonly, aws-docs, grafana, github]
      tools:
        allow: [Read, Grep, Glob, Bash, WebFetch]
        deny: ["Bash(aws * delete*)", "Bash(aws * put*)", "Bash(aws * update*)", "Bash(terraform apply*)", "Bash(kubectl delete*)"]
    - name: reviewer
      description: Challenges the diagnosis; rejects anything without evidence.
      prompt: ./agents/reviewer.md
      model: claude-opus-5-5
      skills: [incident-triage]
      connections: [knowledge]
      tools:
        allow: [Read, Grep, Glob]
    - name: librarian
      description: Turns finished items into runbooks and postmortems in the knowledge base.
      prompt: ./agents/librarian.md
      skills: [postmortem-writing]
      connections: [knowledge]
      tools:
        allow: [Read, Write, Grep, Glob]

  contracts:                            # what each station must hand downstream (JSON Schema)
    triage-report: ./contracts/triage-report.schema.json
    diagnosis: ./contracts/diagnosis.schema.json

  board:
    workTypes: [incident, change, toil, project]   # the Four Types of Work
    intake:
      - source: manual
      - source: github-issues
        repo: acme/infrastructure
        labels: [sre]
      - source: schedule
        cron: "0 8 * * MON-FRI"
        template: daily-health-check
        type: toil

    stations:
      - id: inbox
        kind: queue
      - id: triage
        kind: agent
        agent: triager
        agents: 1
        wip: 4
        output: triage-report
      - id: investigate
        kind: agent
        agent: investigator
        agents: 3
        wip: 3
        buffer: 2                       # items kept ready in front of this station
        output: diagnosis
        checks:
          - kind: schema                # deterministic gate before any LLM judgment
          - kind: evidence-links
            min: 2
      - id: review
        kind: agent
        agent: reviewer
        agents: 1
        wip: 2
        gate:
          onReject: investigate
          maxRework: 2
      - id: approve
        kind: human
        wip: 5
      - id: done
        kind: done

    flow:
      expedite:
        types: [incident]
        wip: 1
      constraint: auto                  # auto | <station id>
      release: drum-buffer-rope         # new work enters only when the constraint's buffer has room
      andon:
        reworkRate: 0.4                 # pause intake if >40% of the last 10 reviews were rejections
        window: 10

  learning:
    librarian:
      agent: librarian
      after: [done]
      writes: [runbooks, postmortems, incidents]
    kaizen:
      schedule: "0 17 * * FRI"          # weekly report: constraint, lead time, rework, proposed config diff

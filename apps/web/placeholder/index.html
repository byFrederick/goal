      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e6e9e7; color: #1d2733; font: 16px/1.5 system-ui, sans-serif; }

  <body>
    <main>
      <h1>This goald has no web UI built in</h1>
      <p>The API at <code>/v1</code> works. To serve the UI, build it and goald together: <code>task build</code>
        (or <code>task web:build</code>, then <code>go build -tags webui ./cmd/goald</code>).</p>
      <p>While developing the UI, run <code>task web:dev</code> instead.</p>
    </main>
